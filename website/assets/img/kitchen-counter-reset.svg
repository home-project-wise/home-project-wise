<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630"><rect width="1200" height="630" rx="28" fill="#f4efe6"/><text x="70" y="78" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#263238">A two-minute reset</text><g font-family="Arial,sans-serif"><circle cx="190" cy="260" r="80" fill="#e8e0d4"/><text x="140" y="250" font-size="23" font-weight="700" fill="#263238">1</text><text x="225" y="255" font-size="22" font-weight="700" fill="#263238">Clear</text><text x="225" y="288" font-size="18" fill="#455a64">dishes + packaging</text><circle cx="470" cy="260" r="80" fill="#e8e0d4"/><text x="420" y="250" font-size="23" font-weight="700" fill="#263238">2</text><text x="505" y="255" font-size="22" font-weight="700" fill="#263238">Return</text><text x="505" y="288" font-size="18" fill="#455a64">daily items home</text><circle cx="750" cy="260" r="80" fill="#e8e0d4"/><text x="700" y="250" font-size="23" font-weight="700" fill="#263238">3</text><text x="785" y="255" font-size="22" font-weight="700" fill="#263238">Wipe</text><text x="785" y="288" font-size="18" fill="#455a64">the work surface</text><circle cx="1030" cy="260" r="80" fill="#e8e0d4"/><text x="980" y="250" font-size="23" font-weight="700" fill="#263238">4</text><text x="1065" y="255" font-size="22" font-weight="700" fill="#263238">Leave</text><text x="1065" y="288" font-size="18" fill="#455a64">the center ready</text><path d="M270 260h110M550 260h110M830 260h110" stroke="#c96f3d" stroke-width="6"/><rect x="180" y="405" width="840" height="85" rx="16" fill="#fff" stroke="#d9d4c8" stroke-width="3"/><text x="225" y="457" font-size="22" font-weight="700" fill="#263238">If the reset takes longer, the system is probably asking the counter to store too much.</text></g></svg>