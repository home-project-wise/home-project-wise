<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d">
  <title id="t">Is a macerating toilet right for you?</title>
  <desc id="d">Two columns: situations where a macerating toilet fits well, and situations where you should think twice.</desc>
  <rect width="1000" height="560" fill="#F7F5F0"/>
  <text x="500" y="62" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="800" fill="#243238">Is a macerating toilet right for you?</text>
  <rect x="440" y="90" width="120" height="6" rx="3" fill="#D97745"/>
  <rect x="40" y="110" width="440" height="400" rx="22" fill="#fff" stroke="#6F8F82" stroke-width="4"/>
  <rect x="40" y="110" width="440" height="64" rx="22" fill="#6F8F82"/><rect x="40" y="150" width="440" height="24" fill="#6F8F82"/>
  <text x="70" y="153" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="800" fill="#fff">Good fit if...</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#243238"><circle cx="74" cy="222" r="14" fill="#6F8F82"/><path d="M67 222 l5 6 l9 -12" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="102" y="229">The drain is above your new room</text><circle cx="74" cy="284" r="14" fill="#6F8F82"/><path d="M67 284 l5 6 l9 -12" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="102" y="291">Cutting the slab is not realistic</text><circle cx="74" cy="346" r="14" fill="#6F8F82"/><path d="M67 346 l5 6 l9 -12" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="102" y="353">There is an outlet close by</text><circle cx="74" cy="408" r="14" fill="#6F8F82"/><path d="M67 408 l5 6 l9 -12" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="102" y="415">You can live with some pump noise</text><circle cx="74" cy="470" r="14" fill="#6F8F82"/><path d="M67 470 l5 6 l9 -12" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="102" y="477">You will only flush toilet paper</text></g>
  <rect x="520" y="110" width="440" height="400" rx="22" fill="#fff" stroke="#D97745" stroke-width="4"/>
  <rect x="520" y="110" width="440" height="64" rx="22" fill="#D97745"/><rect x="520" y="150" width="440" height="24" fill="#D97745"/>
  <text x="550" y="153" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="800" fill="#fff">Think twice if...</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#243238"><circle cx="554" cy="222" r="14" fill="#D97745"/><path d="M547 215 l14 14 M561 215 l-14 14" stroke="#fff" stroke-width="4" stroke-linecap="round"/><text x="582" y="229">A gravity drain is easy to reach</text><circle cx="554" cy="284" r="14" fill="#D97745"/><path d="M547 277 l14 14 M561 277 l-14 14" stroke="#fff" stroke-width="4" stroke-linecap="round"/><text x="582" y="291">You cannot keep wipes out of it</text><circle cx="554" cy="346" r="14" fill="#D97745"/><path d="M547 339 l14 14 M561 339 l-14 14" stroke="#fff" stroke-width="4" stroke-linecap="round"/><text x="582" y="353">Local code limits its use</text><circle cx="554" cy="408" r="14" fill="#D97745"/><path d="M547 401 l14 14 M561 401 l-14 14" stroke="#fff" stroke-width="4" stroke-linecap="round"/><text x="582" y="415">You want zero maintenance</text><circle cx="554" cy="470" r="14" fill="#D97745"/><path d="M547 463 l14 14 M561 463 l-14 14" stroke="#fff" stroke-width="4" stroke-linecap="round"/><text x="582" y="477">You have not checked permits</text></g>
  <text x="500" y="545" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#243238" opacity=".7">HomeProjectWise · General guidance, check your local rules</text>
</svg>
