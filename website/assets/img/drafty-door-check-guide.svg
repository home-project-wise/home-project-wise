<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630"><rect width="1200" height="630" rx="28" fill="#f4efe6"/><text x="70" y="82" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#263238">Find the leak before buying weatherstripping</text><rect x="150" y="145" width="390" height="390" fill="#e7e1d7" stroke="#6d6255" stroke-width="6"/><rect x="215" y="195" width="260" height="340" rx="8" fill="#fff" stroke="#37474f" stroke-width="7"/><circle cx="445" cy="365" r="12" fill="#c96f3d"/><path d="M485 230h90M485 365h90M485 500h90" stroke="#c96f3d" stroke-width="5" stroke-dasharray="10 9"/><text x="600" y="225" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#263238">1. Check the frame</text><text x="600" y="262" font-family="Arial,sans-serif" font-size="20" fill="#455a64">Look for daylight or a visible gap.</text><text x="600" y="320" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#263238">2. Test the moving air</text><text x="600" y="357" font-family="Arial,sans-serif" font-size="20" fill="#455a64">On a windy day, feel around the seal.</text><text x="600" y="415" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#263238">3. Fix the actual gap</text><text x="600" y="452" font-family="Arial,sans-serif" font-size="20" fill="#455a64">Use the right seal or sweep for its location.</text><text x="600" y="505" font-family="Arial,sans-serif" font-size="19" fill="#607d8b">If the door is misaligned, sealing alone may not solve it.</text></svg>