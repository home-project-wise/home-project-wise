<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630"><rect width="1200" height="630" rx="28" fill="#f4efe6"/><text x="70" y="82" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#263238">Make the sink the easiest surface to wipe</text><rect x="110" y="150" width="610" height="350" rx="20" fill="#fff" stroke="#d9d4c8" stroke-width="4"/><rect x="170" y="225" width="490" height="35" rx="12" fill="#c9c5bc"/><path d="M405 225v-70q0-45 45-45h55" fill="none" stroke="#607d8b" stroke-width="18" stroke-linecap="round"/><ellipse cx="415" cy="325" rx="135" ry="55" fill="#dfe4e2" stroke="#607d8b" stroke-width="5"/><path d="M360 330q55 45 110 0" fill="none" stroke="#90a4ae" stroke-width="8"/><rect x="225" y="395" width="90" height="55" rx="10" fill="#d8b47b"/><rect x="525" y="395" width="90" height="55" rx="10" fill="#d8b47b"/><text x="790" y="215" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#263238">Keep the daily zone clear</text><text x="790" y="255" font-family="Arial,sans-serif" font-size="20" fill="#455a64">soap + one useful item</text><text x="790" y="320" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#263238">Wipe water immediately</text><text x="790" y="360" font-family="Arial,sans-serif" font-size="20" fill="#455a64">Fewer bottles means fewer edges</text><text x="790" y="400" font-family="Arial,sans-serif" font-size="20" fill="#455a64">where soap and water collect.</text><text x="790" y="465" font-family="Arial,sans-serif" font-size="20" fill="#607d8b">A small clear zone makes the next clean</text><text x="790" y="495" font-family="Arial,sans-serif" font-size="20" fill="#607d8b">take seconds instead of a full reset.</text></svg>