<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-label="Two towels: one bunched on a hook, one spread over a bar">
<rect width="1000" height="560" fill="#F7F5F0"/>
<text x="250" y="52" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#243238">Bunched on a hook</text>
<text x="750" y="52" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#243238">Spread over a bar</text>
