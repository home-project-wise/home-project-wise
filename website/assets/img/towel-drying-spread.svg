<rect x="230" y="110" width="40" height="14" rx="7" fill="#243238"/>
<path d="M250 124 C215 170 205 230 222 300 C232 345 232 390 238 420 L270 420 C275 385 282 345 285 300 C298 230 285 170 250 124Z" fill="#6F8F82"/>
<path d="M236 190 C246 230 240 300 250 410" stroke="#243238" stroke-opacity=".35" stroke-width="3" fill="none"/>
<path d="M268 200 C262 250 270 320 262 400" stroke="#243238" stroke-opacity=".35" stroke-width="3" fill="none"/>
<text x="250" y="465" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#243238">Thick folds stay wet in the middle</text>
<text x="250" y="498" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#D97745" font-weight="700">Damp for hours</text>
<rect x="580" y="120" width="340" height="14" rx="7" fill="#243238"/>
<rect x="600" y="134" width="300" height="270" rx="6" fill="#6F8F82"/>
