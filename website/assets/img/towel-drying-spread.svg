<text x="750" y="465" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#243238">Air reaches both sides of the fabric</text>
<text x="750" y="498" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#6F8F82" font-weight="700">Dries much faster</text>
