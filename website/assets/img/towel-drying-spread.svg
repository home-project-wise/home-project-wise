<path d="M560 200 h28 m-10 -10 l10 10 l-10 10"/><path d="M560 270 h28 m-10 -10 l10 10 l-10 10"/><path d="M560 340 h28 m-10 -10 l10 10 l-10 10"/>
<path d="M940 200 h-28 m10 -10 l-10 10 l10 10"/><path d="M940 270 h-28 m10 -10 l-10 10 l10 10"/><path d="M940 340 h-28 m10 -10 l-10 10 l10 10"/>
