<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630"><rect width="1200" height="630" rx="28" fill="#f4efe6"/><text x="70" y="82" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#263238">Route cables once — then stop fighting them</text><rect x="95" y="150" width="1010" height="330" rx="20" fill="#fff" stroke="#d9d4c8" stroke-width="4"/><rect x="145" y="205" width="360" height="160" rx="14" fill="#ece7de"/><rect x="190" y="245" width="270" height="70" rx="8" fill="#37474f"/><path d="M325 365v48" stroke="#37474f" stroke-width="9"/><path d="M325 413c0 30-120 5-120 50" fill="none" stroke="#c96f3d" stroke-width="8"/><path d="M325 413c0 45 170 15 170 55" fill="none" stroke="#607d8b" stroke-width="8"/><circle cx="205" cy="463" r="10" fill="#c96f3d"/><circle cx="495" cy="468" r="10" fill="#607d8b"/><text x="585" y="220" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#263238">1. Unplug and sort</text><text x="585" y="258" font-family="Arial,sans-serif" font-size="20" fill="#455a64">Keep only cables you actually use.</text><text x="585" y="315" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#263238">2. Route the power</text><text x="585" y="353" font-family="Arial,sans-serif" font-size="20" fill="#455a64">Keep the strip and excess length under the desk.</text><text x="585" y="410" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#263238">3. Bundle visible runs</text><text x="585" y="448" font-family="Arial,sans-serif" font-size="20" fill="#455a64">One clean path is easier to clean and maintain.</text></svg>