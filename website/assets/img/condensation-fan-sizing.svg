<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d">
  <title id="t">Bathroom fan sizing at a glance</title>
  <desc id="d">Three minimum fan sizes: 1 CFM per square foot for bathrooms up to 100 square feet, 50 CFM per fixture for larger bathrooms, and 15 litres per second in England.</desc>
  <rect width="1000" height="560" fill="#F7F5F0"/>
  <text x="500" y="56" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="800" fill="#243238">Bathroom fan sizing at a glance</text>
  <rect x="440" y="72" width="120" height="6" rx="3" fill="#D97745"/>
  <rect x="40" y="100" width="920" height="106" rx="18" fill="#fff" stroke="#6F8F82" stroke-width="4"/>
  <rect x="40" y="100" width="14" height="106" fill="#6F8F82"/>
  <text x="80" y="138" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#4F7466">US, up to 100 sq ft</text>
  <text x="80" y="186" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="800" fill="#243238">1 CFM per sq ft</text>
  <text x="560" y="160" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#243238">Example: 5 x 8 ft room = 40 sq ft</text>
  <text x="560" y="190" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#243238">so a 40 CFM fan is the baseline.</text>
  <rect x="40" y="224" width="920" height="106" rx="18" fill="#fff" stroke="#6F8F82" stroke-width="4"/>
  <rect x="40" y="224" width="14" height="106" fill="#6F8F82"/>
  <text x="80" y="262" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#4F7466">US, over 100 sq ft</text>
  <text x="80" y="310" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="800" fill="#243238">50 CFM per fixture</text>
  <text x="560" y="284" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#243238">Toilet, shower and tub: 50 each.</text>
  <text x="560" y="314" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#243238">Jetted tub: 100.</text>
  <rect x="40" y="348" width="920" height="106" rx="18" fill="#fff" stroke="#D97745" stroke-width="4"/>
  <rect x="40" y="348" width="14" height="106" fill="#D97745"/>
  <text x="80" y="386" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#B85A2A">England, Approved Document F</text>
  <text x="80" y="434" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="800" fill="#243238">15 l/s minimum</text>
  <text x="560" y="408" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#243238">For an intermittent bathroom fan.</text>
  <text x="560" y="438" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#243238">That is about 32 CFM.</text>
  <rect x="40" y="476" width="920" height="56" rx="14" fill="#243238"/>
  <text x="500" y="512" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#fff">Run the fan 20 min after use (HVI). No window: at least 15 min (England).</text>
</svg>
