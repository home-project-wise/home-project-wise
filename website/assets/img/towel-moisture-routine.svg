<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-label="Three steps to remove moisture from the room: spread the towel, run the fan for 20 minutes, leave a gap under the door">
<rect width="1000" height="560" fill="#F7F5F0"/>
<text x="500" y="52" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#243238">Get the moisture out of the room after each shower</text>
<rect x="40" y="85" width="280" height="385" rx="14" fill="#FFFFFF" stroke="#243238" stroke-opacity=".2" stroke-width="2"/>
<rect x="95" y="130" width="170" height="12" rx="6" fill="#243238"/>
<rect x="110" y="142" width="140" height="140" rx="6" fill="#6F8F82" stroke="#243238" stroke-opacity=".35" stroke-width="3"/>
<g stroke="#243238" stroke-opacity=".5" stroke-width="3" fill="none" stroke-linecap="round"><path d="M60 190 h26 m-9 -9 l9 9 l-9 9"/><path d="M60 240 h26 m-9 -9 l9 9 l-9 9"/><path d="M300 190 h-26 m9 -9 l-9 9 l9 9"/><path d="M300 240 h-26 m9 -9 l-9 9 l9 9"/></g>
<text x="180" y="335" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#243238">Spread the towel</text>
<text x="180" y="372" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#243238">Both sides in moving air,</text>
<text x="180" y="400" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#243238">not bunched on a hook</text>
<text x="180" y="442" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#6F8F82">Dries faster</text>
<rect x="360" y="85" width="280" height="385" rx="14" fill="#FFFFFF" stroke="#243238" stroke-opacity=".2" stroke-width="2"/>
<circle cx="500" cy="212" r="66" fill="#F7F5F0" stroke="#243238" stroke-width="4"/><g transform="translate(500 212)"><ellipse cx="0" cy="-30" rx="15" ry="32" fill="#6F8F82" transform="rotate(0)"/><ellipse cx="0" cy="-30" rx="15" ry="32" fill="#6F8F82" transform="rotate(90)"/><ellipse cx="0" cy="-30" rx="15" ry="32" fill="#6F8F82" transform="rotate(180)"/><ellipse cx="0" cy="-30" rx="15" ry="32" fill="#6F8F82" transform="rotate(270)"/><circle r="11" fill="#243238"/></g>
<text x="500" y="335" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#243238">Fan for 20 minutes</text>
<text x="500" y="372" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#243238">Keep it running after the</text>
<text x="500" y="400" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#243238">shower, as HVI recommends</text>
<text x="500" y="442" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#D97745">A timer switch does it</text>
<rect x="680" y="85" width="280" height="385" rx="14" fill="#FFFFFF" stroke="#243238" stroke-opacity=".2" stroke-width="2"/>
<rect x="772" y="125" width="96" height="147" rx="4" fill="#6F8F82" stroke="#243238" stroke-opacity=".35" stroke-width="3"/>
<circle cx="850" cy="205" r="6" fill="#243238"/>
<line x1="730" y1="290" x2="910" y2="290" stroke="#243238" stroke-width="4" stroke-linecap="round"/>
<path d="M760 281 h120 m-12 -9 l12 9 l-12 9" stroke="#D97745" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="820" y="335" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#243238">Leave a door gap</text>
<text x="820" y="372" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#243238">A closed door with no gap</text>
<text x="820" y="400" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#243238">starves the fan</text>
<text x="820" y="442" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#D97745">Replacement air in</text>
<text x="500" y="520" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#243238">Target: indoor humidity below 60%, ideally 30% to 50% (US EPA)</text>
</svg>
