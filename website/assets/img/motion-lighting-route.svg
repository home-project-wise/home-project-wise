<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Plan a motion-lighting route through the home</title><desc id="desc">Floor plan showing a motion sensor near a hallway entrance and low-level lights along the route to the bathroom, avoiding direct glare into bedrooms.</desc><rect width="1200" height="630" rx="28" fill="#F7F5F0"/><text x="600" y="65" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#243238" text-anchor="middle">LIGHT THE ROUTE PEOPLE ACTUALLY WALK</text><rect x="120" y="110" width="960" height="410" rx="14" fill="#FDFCF8" stroke="#8B9B96" stroke-width="8"/><rect x="150" y="145" width="235" height="150" rx="10" fill="#E7E0D4" stroke="#C6A98B" stroke-width="3"/><text x="267" y="220" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#243238" text-anchor="middle">BEDROOM</text><rect x="810" y="145" width="235" height="150" rx="10" fill="#DCE9E4" stroke="#6F9187" stroke-width="3"/><text x="927" y="220" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#243238" text-anchor="middle">BATHROOM</text><path d="M270 350H930" stroke="#D97745" stroke-width="15" stroke-linecap="round" stroke-dasharray="22 18"/><path d="M895 320l40 30-40 30" fill="none" stroke="#D97745" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><circle cx="270" cy="350" r="35" fill="#F5D9A8" stroke="#B78D66" stroke-width="5"/><path d="M250 350q20-30 40 0q-20 30-40 0" fill="none" stroke="#8B6B50" stroke-width="5"/><circle cx="520" cy="350" r="22" fill="#F5D9A8" stroke="#B78D66" stroke-width="4"/><circle cx="720" cy="350" r="22" fill="#F5D9A8" stroke="#B78D66" stroke-width="4"/><text x="270" y="415" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#243238" text-anchor="middle">SENSOR</text><text x="600" y="465" font-family="Arial,sans-serif" font-size="22" fill="#9B4E2B" font-weight="700" text-anchor="middle">LOW-LEVEL LIGHT ALONG THE PATH</text><text x="600" y="570" font-family="Arial,sans-serif" font-size="22" fill="#243238" text-anchor="middle">Aim at movement zones, not just the middle of a room.</text></svg>