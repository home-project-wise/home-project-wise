<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">A small entryway landing zone for keys</title><desc id="desc">A narrow shelf with a small tray for keys and sunglasses, with mail kept in a separate container.</desc><rect width="1200" height="630" rx="28" fill="#F7F5F0"/><text x="600" y="70" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#243238" text-anchor="middle">A SMALL LANDING ZONE, NOT A JUNK DRAWER</text><rect x="180" y="150" width="840" height="24" rx="10" fill="#C6A98B"/><path d="M230 174v250M970 174v250" stroke="#8C735D" stroke-width="12"/><rect x="290" y="205" width="290" height="140" rx="18" fill="#DCE9E4" stroke="#6F9187" stroke-width="4"/><rect x="340" y="240" width="190" height="72" rx="14" fill="#FDFCF8" stroke="#55756F" stroke-width="4"/><circle cx="380" cy="276" r="11" fill="#D97745"/><circle cx="410" cy="276" r="11" fill="#55756F"/><path d="M440 265q20-18 40 0q-20 18-40 0" fill="none" stroke="#55756F" stroke-width="5"/><text x="435" y="385" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#243238" text-anchor="middle">KEYS + SUNGLASSES</text><rect x="650" y="205" width="260" height="140" rx="18" fill="#E9E6E0" stroke="#AAA49A" stroke-width="4"/><rect x="700" y="230" width="160" height="85" rx="8" fill="#FDFCF8" stroke="#7B8581" stroke-width="3"/><path d="M715 250h130M715 270h100M715 290h115" stroke="#AAA49A" stroke-width="4"/><text x="780" y="385" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#243238" text-anchor="middle">MAIL: SEPARATE</text><rect x="350" y="455" width="500" height="54" rx="14" fill="#D97745"/><text x="600" y="490" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#fff" text-anchor="middle">If the tray fills, process it — do not expand it.</text><text x="600" y="565" font-family="Arial,sans-serif" font-size="22" fill="#243238" text-anchor="middle">Only items used when leaving or arriving belong here.</text></svg>