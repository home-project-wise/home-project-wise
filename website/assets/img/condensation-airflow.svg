<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d">
  <title id="t">Where the shower moisture goes</title>
  <desc id="d">Cross-section of a bathroom. Warm humid air from the shower travels to a cold window, where droplets form, and to a ceiling fan that exhausts it outside. Replacement air enters through a gap under the door.</desc>
  <defs>
    <marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#D97745"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4F7466"/></marker>
  </defs>
  <rect width="1000" height="560" fill="#F7F5F0"/>
  <text x="500" y="46" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" fill="#243238">Where the shower moisture goes</text>
  <rect x="440" y="58" width="120" height="6" rx="3" fill="#D97745"/>
  <rect x="40" y="130" width="920" height="380" rx="18" fill="#fff" stroke="#243238" stroke-width="4"/>
  <rect x="40" y="466" width="920" height="8" fill="#243238"/>
  <rect x="70" y="200" width="190" height="266" rx="10" fill="#E4ECE8" stroke="#6F8F82" stroke-width="3"/>
  <rect x="90" y="214" width="70" height="12" rx="6" fill="#6F8F82"/>
  <g stroke="#7FA6C2" stroke-width="4" stroke-linecap="round"><path d="M100 240 v26"/><path d="M122 240 v34"/><path d="M144 240 v26"/></g>
  <text x="165" y="400" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#243238">Hot shower</text>
  <rect x="470" y="134" width="90" height="32" rx="8" fill="#6F8F82"/>
  <text x="515" y="157" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#fff">Fan</text>
  <rect x="505" y="96" width="20" height="40" fill="#6F8F82"/>
  <path d="M525 106 H640" stroke="#4F7466" stroke-width="5" fill="none" marker-end="url(#ag)"/>
  <text x="656" y="113" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#243238">Humid air goes outside</text>
  <rect x="900" y="190" width="40" height="170" fill="#DCEBF3" stroke="#243238" stroke-width="3"/>
  <g fill="#5B8DB0"><circle cx="893" cy="212" r="6"/><circle cx="895" cy="250" r="7"/><circle cx="892" cy="290" r="6"/><circle cx="895" cy="328" r="7"/></g>
  <text x="930" y="172" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#243238">Cold window: droplets form</text>
  <path d="M200 196 C260 168 380 160 462 156" stroke="#D97745" stroke-width="5" fill="none" stroke-linecap="round" marker-end="url(#ao)"/>
  <path d="M270 290 C470 262 700 250 880 262" stroke="#D97745" stroke-width="5" fill="none" stroke-linecap="round" stroke-dasharray="2 12" marker-end="url(#ao)"/>
  <text x="300" y="258" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#D97745">Warm, humid air</text>
  <rect x="660" y="330" width="120" height="128" rx="6" fill="#fff" stroke="#243238" stroke-width="3"/>
  <circle cx="762" cy="400" r="5" fill="#243238"/>
  <text x="720" y="398" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#243238">Door</text>
  <path d="M720 520 V474" stroke="#4F7466" stroke-width="5" fill="none" marker-end="url(#ag)"/>
  <path d="M652 458 C600 390 548 280 520 176" stroke="#4F7466" stroke-width="5" fill="none" stroke-linecap="round" marker-end="url(#ag)"/>
  <text x="708" y="500" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#243238">Replacement air enters under the door</text>
</svg>
