<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Use different motion-lighting behavior by time of day</title><desc id="desc">Daytime settings use brighter task lighting only when needed; nighttime settings use dim, warm low-level lights with short automatic shutoff.</desc><rect width="1200" height="630" rx="28" fill="#F7F5F0"/><text x="600" y="68" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#243238" text-anchor="middle">ONE SENSOR, TWO USEFUL SETTINGS</text><g transform="translate(75 120)"><rect width="500" height="390" rx="22" fill="#E8F0EF" stroke="#9EB7B1" stroke-width="4"/><circle cx="95" cy="80" r="34" fill="#E8C76A"/><path d="M95 30v-18M95 148v-18M45 80H27M163 80h-18M60 45L47 32M130 115l13 13M130 45l13-13M60 115l-13 13" stroke="#B78D66" stroke-width="5" stroke-linecap="round"/><text x="285" y="80" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#243238" text-anchor="middle">DAYTIME</text><text x="250" y="170" font-family="Arial,sans-serif" font-size="23" fill="#243238" text-anchor="middle">Bright enough for the task</text><rect x="100" y="210" width="300" height="38" rx="19" fill="#C6D8D2"/><rect x="100" y="210" width="235" height="38" rx="19" fill="#6F9187"/><text x="250" y="295" font-family="Arial,sans-serif" font-size="21" fill="#243238" text-anchor="middle">Ignore motion when daylight is enough</text><text x="250" y="340" font-family="Arial,sans-serif" font-size="21" fill="#243238" text-anchor="middle">Avoid needless switching</text></g><g transform="translate(625 120)"><rect width="500" height="390" rx="22" fill="#263640" stroke="#526773" stroke-width="4"/><path d="M88 45a38 38 0 1 0 45 56a44 44 0 0 1-45-56" fill="#F5D9A8"/><circle cx="158" cy="52" r="4" fill="#F5D9A8"/><circle cx="190" cy="83" r="5" fill="#F5D9A8"/><circle cx="150" cy="110" r="3" fill="#F5D9A8"/><text x="305" y="80" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#fff" text-anchor="middle">NIGHTTIME</text><text x="250" y="170" font-family="Arial,sans-serif" font-size="23" fill="#fff" text-anchor="middle">Warm, low-level guidance</text><rect x="100" y="210" width="300" height="38" rx="19" fill="#526773"/><rect x="100" y="210" width="105" height="38" rx="19" fill="#E6B66D"/><text x="250" y="295" font-family="Arial,sans-serif" font-size="21" fill="#fff" text-anchor="middle">Lower brightness and glare</text><text x="250" y="340" font-family="Arial,sans-serif" font-size="21" fill="#fff" text-anchor="middle">Use a short shutoff delay</text></g><text x="600" y="570" font-family="Arial,sans-serif" font-size="22" fill="#243238" text-anchor="middle">Test both settings at the times you actually use the route.</text></svg>