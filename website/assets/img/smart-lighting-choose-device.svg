<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d"><title id="t">Choose the smart lighting device by the light you are fixing</title><desc id="d">Plug-in lamp leads to smart plug or bulb. Ceiling fixture with several bulbs leads to smart switch. Hands-busy hallway leads to motion sensor.</desc>
<rect width="1000" height="560" fill="#F7F5F0"/>
