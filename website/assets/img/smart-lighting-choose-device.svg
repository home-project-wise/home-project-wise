<text x="235" y="290" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="#243238">Ceiling fixture, several bulbs</text>
<path d="M440 280 H540" stroke="#243238" stroke-width="6" stroke-linecap="round"/><path d="M525 265 L545 280 L525 295 Z" fill="#243238"/>
<rect x="560" y="225" width="390" height="110" rx="16" fill="#D97745" opacity=".2" stroke="#D97745" stroke-width="3"/>
<text x="755" y="290" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#243238">Smart switch</text>
<rect x="50" y="380" width="370" height="110" rx="16" fill="#6F8F82" opacity=".25" stroke="#6F8F82" stroke-width="3"/>
<text x="235" y="445" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="#243238">Hallway at night, hands busy</text>
