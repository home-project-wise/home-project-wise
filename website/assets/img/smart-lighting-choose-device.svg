<text x="235" y="135" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="#243238">Plug-in lamp</text>
<path d="M440 125 H540" stroke="#243238" stroke-width="6" stroke-linecap="round"/><path d="M525 110 L545 125 L525 140 Z" fill="#243238"/>
<rect x="560" y="70" width="390" height="110" rx="16" fill="#D97745" opacity=".2" stroke="#D97745" stroke-width="3"/>
<text x="755" y="135" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#243238">Smart plug or bulb</text>
