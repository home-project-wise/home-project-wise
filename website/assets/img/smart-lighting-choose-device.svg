<rect x="560" y="380" width="390" height="110" rx="16" fill="#D97745" opacity=".2" stroke="#D97745" stroke-width="3"/>
<text x="755" y="445" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#243238">Motion sensor</text>
