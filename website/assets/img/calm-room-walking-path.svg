<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d"><title id="t">Clear walking lane in a living room</title><desc id="d">Top-down plan: a 90 cm lane runs from the door past the sofa and coffee table to the window.</desc>
<rect width="1000" height="560" fill="#F7F5F0"/>
<rect x="60" y="50" width="880" height="460" rx="14" fill="#fff" stroke="#243238" stroke-width="6"/>
<rect x="56" y="230" width="14" height="110" fill="#F7F5F0"/><text x="80" y="224" font-family="Arial,sans-serif" font-size="22" fill="#243238">Door</text>
<rect x="400" y="44" width="200" height="14" fill="#6F8F82"/><text x="440" y="36" font-family="Arial,sans-serif" font-size="22" fill="#243238">Window</text>
<rect x="150" y="90" width="330" height="90" rx="14" fill="#6F8F82" opacity=".35" stroke="#6F8F82" stroke-width="3"/><text x="260" y="143" font-family="Arial,sans-serif" font-size="24" fill="#243238">Sofa</text>
<rect x="210" y="365" width="170" height="90" rx="10" fill="#6F8F82" opacity=".35" stroke="#6F8F82" stroke-width="3"/><text x="248" y="417" font-family="Arial,sans-serif" font-size="22" fill="#243238">Table</text>
<rect x="700" y="330" width="110" height="110" rx="14" fill="#D97745" opacity=".25" stroke="#D97745" stroke-width="3" stroke-dasharray="10 8"/><text x="690" y="465" font-family="Arial,sans-serif" font-size="20" fill="#243238">Chair: move out of lane</text>
<rect x="70" y="215" width="570" height="130" fill="#D97745" opacity=".12"/>
<path d="M75 280 H520 Q560 280 560 240 V70" fill="none" stroke="#D97745" stroke-width="8" stroke-dasharray="14 10" stroke-linecap="round"/>
<path d="M550 90 L560 62 L570 90 Z" fill="#D97745"/>
<line x1="500" y1="215" x2="500" y2="345" stroke="#243238" stroke-width="3"/><line x1="490" y1="215" x2="510" y2="215" stroke="#243238" stroke-width="3"/><line x1="490" y1="345" x2="510" y2="345" stroke="#243238" stroke-width="3"/>
<text x="520" y="285" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#243238">90 cm / 36 in</text>
</svg>