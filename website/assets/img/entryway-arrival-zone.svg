<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Plan the first 30 seconds after arriving home</title><desc id="desc">An entryway plan with coat hooks, a shoe bench, a small key tray and a clear walking path.</desc><rect width="1200" height="630" rx="28" fill="#F7F5F0"/><text x="600" y="65" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#243238" text-anchor="middle">GIVE EACH ARRIVAL ITEM A FIRST STOP</text><rect x="100" y="110" width="1000" height="420" rx="18" fill="#E7E0D4" stroke="#C6A98B" stroke-width="4"/><rect x="150" y="160" width="310" height="190" rx="12" fill="#FDFCF8" stroke="#8B9B96" stroke-width="4"/><path d="M210 195v40m-12-28h24M305 195v40m-12-28h24M400 195v40m-12-28h24" stroke="#55756F" stroke-width="8" stroke-linecap="round"/><text x="305" y="285" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#243238" text-anchor="middle">COAT HOOKS</text><text x="305" y="320" font-family="Arial,sans-serif" font-size="20" fill="#243238" text-anchor="middle">Daily coats and bags</text><rect x="610" y="160" width="390" height="190" rx="12" fill="#D9C7B4" stroke="#8C735D" stroke-width="4"/><rect x="650" y="195" width="310" height="80" rx="10" fill="#F1E8DC"/><path d="M670 295h270M690 295v30M920 295v30" stroke="#8C735D" stroke-width="8" stroke-linecap="round"/><text x="805" y="235" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#243238" text-anchor="middle">SHOE BENCH</text><text x="805" y="265" font-family="Arial,sans-serif" font-size="20" fill="#243238" text-anchor="middle">Everyday pairs only</text><rect x="170" y="385" width="210" height="85" rx="12" fill="#DCE9E4" stroke="#6F9187" stroke-width="4"/><rect x="220" y="405" width="110" height="38" rx="8" fill="#FDFCF8" stroke="#55756F" stroke-width="3"/><circle cx="242" cy="424" r="7" fill="#D97745"/><circle cx="260" cy="424" r="7" fill="#55756F"/><text x="275" y="500" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#243238" text-anchor="middle">KEY TRAY</text><path d="M430 420H960" stroke="#D97745" stroke-width="10" stroke-linecap="round" stroke-dasharray="18 16"/><path d="M930 395l35 25-35 25" fill="none" stroke="#D97745" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><text x="690" y="465" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#9B4E2B" text-anchor="middle">KEEP WALKING SPACE CLEAR</text><text x="600" y="580" font-family="Arial,sans-serif" font-size="22" fill="#243238" text-anchor="middle">Watch the real routine before buying storage.</text></svg>