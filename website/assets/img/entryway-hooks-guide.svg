<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630"><rect width="1200" height="630" rx="28" fill="#f4efe6"/><text x="70" y="82" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#263238">A useful entryway landing zone</text><rect x="110" y="145" width="980" height="360" rx="18" fill="#fff" stroke="#d9d4c8" stroke-width="4"/><rect x="165" y="205" width="600" height="28" rx="14" fill="#8b765e"/><circle cx="260" cy="250" r="16" fill="#37474f"/><circle cx="460" cy="250" r="16" fill="#37474f"/><circle cx="660" cy="250" r="16" fill="#37474f"/><path d="M260 266v72M460 266v72M660 266v72" stroke="#37474f" stroke-width="7"/><path d="M220 350h80v92h-80zM420 350h80v92h-80zM620 350h80v92h-80z" fill="#e8e0d4"/><text x="805" y="225" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#263238">One hook = one daily item</text><text x="805" y="270" font-family="Arial,sans-serif" font-size="22" fill="#455a64">coat · bag · outgoing item</text><text x="805" y="330" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#263238">Keep the landing zone small</text><text x="805" y="375" font-family="Arial,sans-serif" font-size="22" fill="#455a64">keys + wallet + mail</text><text x="805" y="450" font-family="Arial,sans-serif" font-size="21" fill="#607d8b">The system works because each item</text><text x="805" y="480" font-family="Arial,sans-serif" font-size="21" fill="#607d8b">has a home where you naturally drop it.</text></svg>