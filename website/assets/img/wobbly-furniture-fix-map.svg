<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630"><rect width="1200" height="630" rx="28" fill="#f4efe6"/><text x="70" y="78" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#263238">Match the fix to the proven cause</text><rect x="90" y="130" width="1020" height="410" rx="20" fill="#fff" stroke="#d9d4c8" stroke-width="4"/><g font-family="Arial,sans-serif" fill="#263238"><text x="140" y="185" font-size="22" font-weight="700">Cause</text><text x="470" y="185" font-size="22" font-weight="700">First correction</text><text x="825" y="185" font-size="22" font-weight="700">Do not do this</text><line x1="120" y1="210" x2="1080" y2="210" stroke="#d9d4c8" stroke-width="3"/><text x="140" y="255" font-size="21">Uneven floor</text><text x="470" y="255" font-size="20">Stable pad, shim or adjustable foot</text><text x="825" y="255" font-size="19">Cut a good leg</text><line x1="120" y1="285" x2="1080" y2="285" stroke="#e4dfd6"/><text x="140" y="330" font-size="21">Loose fastener</text><text x="470" y="330" font-size="20">Correct tool + inspect material</text><text x="825" y="330" font-size="19">Overtighten it</text><line x1="120" y1="360" x2="1080" y2="360" stroke="#e4dfd6"/><text x="140" y="405" font-size="21">Loose joint</text><text x="470" y="405" font-size="20">Prepare joint + follow adhesive instructions</text><text x="825" y="405" font-size="19">Inject glue blindly</text><line x1="120" y1="435" x2="1080" y2="435" stroke="#e4dfd6"/><text x="140" y="480" font-size="21">Cracked structure</text><text x="470" y="480" font-size="20">Stop use + assess repair or replacement</text><text x="825" y="480" font-size="19">Keep using it</text></g></svg>