<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630"><rect width="1200" height="630" rx="28" fill="#f4efe6"/><text x="70" y="78" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#263238">Diagnose the wobble before you repair it</text><rect x="70" y="125" width="1060" height="430" rx="22" fill="#fff" stroke="#d9d4c8" stroke-width="4"/><text x="120" y="185" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#263238">Does it wobble?</text><path d="M300 178h105" stroke="#c96f3d" stroke-width="5"/><rect x="420" y="145" width="240" height="70" rx="16" fill="#e8e0d4"/><text x="460" y="188" font-family="Arial,sans-serif" font-size="21" fill="#263238">Move it elsewhere</text><path d="M660 180h105" stroke="#c96f3d" stroke-width="5"/><rect x="780" y="145" width="285" height="70" rx="16" fill="#e8e0d4"/><text x="815" y="188" font-family="Arial,sans-serif" font-size="20" fill="#263238">Wobble follows furniture?</text><path d="M540 215v65M925 215v65" stroke="#607d8b" stroke-width="5"/><rect x="180" y="300" width="280" height="130" rx="16" fill="#eef3ef"/><text x="215" y="335" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#263238">Changes / disappears</text><text x="215" y="370" font-family="Arial,sans-serif" font-size="20" fill="#455a64">Investigate the floor</text><text x="215" y="400" font-family="Arial,sans-serif" font-size="18" fill="#607d8b">before cutting or shimming a leg.</text><rect x="520" y="300" width="280" height="130" rx="16" fill="#f7ece6"/><text x="555" y="335" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#263238">Follows furniture</text><text x="555" y="370" font-family="Arial,sans-serif" font-size="20" fill="#455a64">Inspect feet and fasteners</text><text x="555" y="400" font-family="Arial,sans-serif" font-size="18" fill="#607d8b">then check the joints.</text><rect x="840" y="300" width="220" height="130" rx="16" fill="#eef3ef"/><text x="875" y="335" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#263238">Crack?</text><text x="875" y="370" font-family="Arial,sans-serif" font-size="20" fill="#455a64">Stop using it.</text><text x="875" y="400" font-family="Arial,sans-serif" font-size="18" fill="#607d8b">Repair safely first.</text><text x="120" y="500" font-family="Arial,sans-serif" font-size="20" fill="#607d8b">One test at a time keeps the cause visible.</text></svg>