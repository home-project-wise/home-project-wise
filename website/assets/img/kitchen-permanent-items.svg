<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Choose which items stay on the kitchen counter</title><desc id="desc">Three groups show daily-use tools that can stay, occasional items to store away, and unrelated items to relocate.</desc><rect width="1200" height="630" rx="28" fill="#F7F5F0"/><text x="600" y="78" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#243238" text-anchor="middle">GIVE EVERY COUNTER ITEM A REASON</text><g transform="translate(65 125)"><rect width="335" height="390" rx="20" fill="#DCE9E4" stroke="#7D9C91" stroke-width="3"/><circle cx="167" cy="74" r="38" fill="#55756F"/><path d="M147 74l14 14 28-32" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="167" y="145" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#243238" text-anchor="middle">KEEP NEARBY</text><text x="167" y="195" font-family="Arial,sans-serif" font-size="22" fill="#243238" text-anchor="middle">Used most days</text><rect x="70" y="230" width="195" height="18" rx="9" fill="#C6A98B"/><path d="M93 230v-46h34v46M205 230v-36h35v36" fill="none" stroke="#55756F" stroke-width="7"/><text x="167" y="305" font-family="Arial,sans-serif" font-size="20" fill="#243238" text-anchor="middle">Cutting board</text><text x="167" y="335" font-family="Arial,sans-serif" font-size="20" fill="#243238" text-anchor="middle">Everyday tools</text></g><g transform="translate(432 125)"><rect width="335" height="390" rx="20" fill="#F0E4D4" stroke="#C6A98B" stroke-width="3"/><circle cx="167" cy="74" r="38" fill="#B78D66"/><path d="M146 74h42M167 53v42" stroke="#fff" stroke-width="7" stroke-linecap="round"/><text x="167" y="145" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#243238" text-anchor="middle">STORE AWAY</text><text x="167" y="195" font-family="Arial,sans-serif" font-size="22" fill="#243238" text-anchor="middle">Used occasionally</text><rect x="78" y="225" width="179" height="75" rx="10" fill="#C6A98B"/><path d="M70 225h195M95 225v-20h145v20" fill="none" stroke="#8B6B50" stroke-width="6"/><text x="167" y="335" font-family="Arial,sans-serif" font-size="20" fill="#243238" text-anchor="middle">Specialty appliances</text><text x="167" y="365" font-family="Arial,sans-serif" font-size="20" fill="#243238" text-anchor="middle">Spare equipment</text></g><g transform="translate(799 125)"><rect width="335" height="390" rx="20" fill="#E9E6E0" stroke="#AAA49A" stroke-width="3"/><circle cx="167" cy="74" r="38" fill="#7B8581"/><path d="M150 57l34 34M184 57l-34 34" stroke="#fff" stroke-width="7" stroke-linecap="round"/><text x="167" y="145" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#243238" text-anchor="middle">MOVE ELSEWHERE</text><text x="167" y="195" font-family="Arial,sans-serif" font-size="22" fill="#243238" text-anchor="middle">Does not support cooking</text><rect x="90" y="230" width="155" height="60" rx="8" fill="#fff" stroke="#7B8581" stroke-width="3"/><path d="M103 245h129M103 260h90M103 275h110" stroke="#AAA49A" stroke-width="4"/><text x="167" y="335" font-family="Arial,sans-serif" font-size="20" fill="#243238" text-anchor="middle">Mail and chargers</text><text x="167" y="365" font-family="Arial,sans-serif" font-size="20" fill="#243238" text-anchor="middle">Unrelated clutter</text></g><text x="600" y="575" font-family="Arial,sans-serif" font-size="23" fill="#243238" text-anchor="middle">Keep only what saves a real step in your daily routine.</text></svg>