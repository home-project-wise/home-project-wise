<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d">
  <title id="t">How a French cleat holds heavy wall art</title>
  <desc id="d">Side view: one angled board is screwed into the wall, a matching angled board is screwed to the back of the artwork, and the weight of the art locks the two together.</desc>
  <rect width="1000" height="560" fill="#F7F5F0"/>
  <text x="40" y="52" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" fill="#243238">How a French cleat holds heavy art</text>
  <rect x="40" y="64" width="80" height="6" rx="3" fill="#D97745"/>
  <rect x="40" y="100" width="470" height="420" rx="22" fill="#fff" stroke="#243238" stroke-width="3"/>
  <text x="64" y="134" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#6F8F82">SIDE VIEW</text>
  <rect x="96" y="150" width="44" height="350" fill="#E4ECE8"/>
  <path d="M96 150 V500 M140 150 V500" stroke="#243238" stroke-width="4"/>
  <text x="118" y="486" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#243238">WALL</text>
  <polygon points="140,310 220,230 220,390 140,390" fill="#6F8F82" stroke="#243238" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="140,310 220,230 220,170 140,170" fill="#D97745" stroke="#243238" stroke-width="3" stroke-linejoin="round"/>
  <rect x="220" y="170" width="60" height="320" rx="4" fill="#fff" stroke="#243238" stroke-width="4"/>
  <path d="M120 350 H196 M196 342 V358 M262 200 H196 M262 192 V208" stroke="#243238" stroke-width="5" stroke-linecap="round"/>
  <path d="M250 400 V462" stroke="#D97745" stroke-width="5" stroke-linecap="round"/>
  <path d="M240 450 L250 466 L260 450" fill="none" stroke="#D97745" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M300 340 H336" stroke="#6F8F82" stroke-width="3"/><circle cx="300" cy="340" r="5" fill="#6F8F82"/>
  <text x="344" y="336" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#243238">Wall cleat</text>
  <text x="344" y="358" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#243238">screwed into studs</text>
  <path d="M300 200 H336" stroke="#D97745" stroke-width="3"/><circle cx="300" cy="200" r="5" fill="#D97745"/>
  <text x="344" y="196" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#243238">Art cleat</text>
  <text x="344" y="218" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#243238">screwed to the frame</text>
  <text x="300" y="470" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#D97745">Weight</text>
  <text x="300" y="492" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#243238">locks it in</text>
  <g font-family="Arial, Helvetica, sans-serif" fill="#243238">
    <circle cx="566" cy="140" r="20" fill="#D97745"/><text x="566" y="147" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">1</text>
    <text x="600" y="136" font-size="20" font-weight="800">Cut at 45 degrees</text>
    <text x="600" y="162" font-size="17">Rip a board lengthwise at 45°,</text><text x="600" y="184" font-size="17">or buy a ready-made cleat set.</text>
    <circle cx="566" cy="244" r="20" fill="#D97745"/><text x="566" y="251" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">2</text>
    <text x="600" y="240" font-size="20" font-weight="800">Fix one half to the wall</text>
    <text x="600" y="266" font-size="17">Screw it into studs, angled face</text><text x="600" y="288" font-size="17">up and toward the wall. Check level.</text>
    <circle cx="566" cy="348" r="20" fill="#D97745"/><text x="566" y="355" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">3</text>
    <text x="600" y="344" font-size="20" font-weight="800">Fix the other half to the art</text>
    <text x="600" y="370" font-size="17">Near the top of the back, angled</text><text x="600" y="392" font-size="17">face down toward the wall.</text>
    <circle cx="566" cy="452" r="20" fill="#D97745"/><text x="566" y="459" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">4</text>
    <text x="600" y="448" font-size="20" font-weight="800">Lower it into place</text>
    <text x="600" y="474" font-size="17">The weight pulls the art toward</text><text x="600" y="496" font-size="17">the wall, not away from it.</text>
  </g>
</svg>
