<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630"><rect width="1200" height="630" rx="28" fill="#f4efe6"/><text x="70" y="78" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#263238">Build the counter around the task</text><rect x="90" y="125" width="1020" height="410" rx="20" fill="#fff" stroke="#d9d4c8" stroke-width="4"/><rect x="150" y="205" width="850" height="85" rx="14" fill="#ddd6ca"/><rect x="220" y="155" width="180" height="45" rx="8" fill="#e8e0d4"/><text x="235" y="184" font-family="Arial,sans-serif" font-size="18" fill="#263238">daily-use appliance</text><rect x="455" y="155" width="230" height="45" rx="8" fill="#e8e0d4"/><text x="485" y="184" font-family="Arial,sans-serif" font-size="18" fill="#263238">prep zone</text><rect x="735" y="155" width="220" height="45" rx="8" fill="#e8e0d4"/><text x="765" y="184" font-family="Arial,sans-serif" font-size="18" fill="#263238">temporary landing</text><path d="M275 290v80M570 290v80M845 290v80" stroke="#c96f3d" stroke-width="6" stroke-dasharray="12 10"/><text x="180" y="420" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#263238">Keep</text><text x="180" y="455" font-family="Arial,sans-serif" font-size="19" fill="#455a64">items used most days</text><text x="500" y="420" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#263238">Protect</text><text x="500" y="455" font-family="Arial,sans-serif" font-size="19" fill="#455a64">the main preparation surface</text><text x="815" y="420" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#263238">Contain</text><text x="815" y="455" font-family="Arial,sans-serif" font-size="19" fill="#455a64">items that arrive temporarily</text><text x="150" y="505" font-family="Arial,sans-serif" font-size="18" fill="#607d8b">The goal is not an empty counter. It is an uninterrupted path from storage → prep → cleanup.</text></svg>