<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Kitchen counter with one clear working zone between the sink and the stove"><rect width="960" height="540" fill="#F7F5F0"/><text x="480" y="52" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700" fill="#243238" text-anchor="middle">One clear working zone</text><rect x="60" y="130" width="840" height="140" rx="14" fill="#E4ECE8" stroke="#243238" stroke-width="2"/><rect x="90" y="150" width="150" height="100" rx="14" fill="#fff" stroke="#243238" stroke-width="2"/><text x="165" y="208" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#243238" text-anchor="middle">Sink</text><rect x="720" y="150" width="150" height="100" rx="14" fill="#fff" stroke="#243238" stroke-width="2"/><circle cx="765" cy="180" r="16" fill="none" stroke="#243238" stroke-width="3"/><circle cx="825" cy="180" r="16" fill="none" stroke="#243238" stroke-width="3"/><circle cx="765" cy="225" r="16" fill="none" stroke="#243238" stroke-width="3"/><circle cx="825" cy="225" r="16" fill="none" stroke="#243238" stroke-width="3"/><text x="795" y="268" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="400" fill="#243238" text-anchor="middle">Stove</text><rect x="280" y="145" width="400" height="110" rx="14" fill="#D97745" stroke="#a8481d" stroke-width="2"/><text x="480" y="192" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#fff" text-anchor="middle">Working zone</text><text x="480" y="226" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="400" fill="#fff" text-anchor="middle">board, knife, ingredients</text><text x="480" y="308" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="400" fill="#243238" text-anchor="middle">The part of the counter where food is prepared most often</text><rect x="60" y="335" width="260" height="150" rx="14" fill="#fff" stroke="#243238" stroke-width="2"/><text x="190" y="375" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#243238" text-anchor="middle">Reach test</text><text x="190" y="415" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="400" fill="#243238" text-anchor="middle">Everything you need</text><text x="190" y="445" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="400" fill="#243238" text-anchor="middle">is within easy reach</text><rect x="350" y="335" width="260" height="150" rx="14" fill="#fff" stroke="#243238" stroke-width="2"/><text x="480" y="375" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#243238" text-anchor="middle">Keep it clear</text><text x="480" y="415" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="400" fill="#243238" text-anchor="middle">Mail, chargers and</text><text x="480" y="445" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="400" fill="#243238" text-anchor="middle">rarely used items</text><rect x="640" y="335" width="260" height="150" rx="14" fill="#fff" stroke="#243238" stroke-width="2"/><text x="770" y="375" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#243238" text-anchor="middle">Measure speed</text><text x="770" y="415" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="400" fill="#243238" text-anchor="middle">Success is how fast</text><text x="770" y="445" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="400" fill="#243238" text-anchor="middle">you can start cooking</text></svg>