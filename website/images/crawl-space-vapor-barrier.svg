<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="t d"><title id="t">Vapor barrier covering exposed crawl-space soil</title><desc id="d">Cross-section showing a continuous ground vapor barrier, overlapped seams, and sealed edges around foundation piers.</desc><rect width="960" height="420" rx="24" fill="#f4f7f4"/><text x="48" y="56" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#243c32">A continuous ground cover matters</text><rect x="55" y="115" width="850" height="235" rx="14" fill="#e6d6b8"/><path d="M55 175 H905" stroke="#b6a07a" stroke-width="6"/><path d="M65 235 Q170 225 275 235 T485 235 T695 235 T895 235" fill="none" stroke="#7fa8b3" stroke-width="13"/><path d="M65 235 Q170 225 275 235 T485 235 T695 235 T895 235" fill="none" stroke="#eaf5f8" stroke-width="5"/><rect x="255" y="165" width="70" height="165" rx="5" fill="#d2d8d4" stroke="#536c5c" stroke-width="4"/><rect x="635" y="165" width="70" height="165" rx="5" fill="#d2d8d4" stroke="#536c5c" stroke-width="4"/><path d="M255 235 L325 235 M635 235 L705 235" stroke="#4e8798" stroke-width="14"/><path d="M290 120 L290 155 M670 120 L670 155" stroke="#4e8798" stroke-width="4"/><g font-family="Arial,sans-serif" fill="#243c32"><text x="215" y="105" font-size="20" font-weight="700">Overlap and seal seams</text><text x="550" y="105" font-size="20" font-weight="700">Fit neatly around piers</text><text x="75" y="390" font-size="18">Use durable crawl-space-rated material and follow local code and manufacturer instructions.</text></g></svg>