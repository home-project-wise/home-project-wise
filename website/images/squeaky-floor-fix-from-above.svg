<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d"><title id="t">Fix from above with a break-away screw</title><desc id="d">Three panels: a break-away screw driven through a depth-control fixture, the head snapping off, and the small hole filled with wax filler.</desc><rect width="960" height="540" rx="16" fill="#f7f4ee"/><text x="40" y="50" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="26" font-weight="bold" fill="#20312f" text-anchor="start">Fix from above: three steps with a break-away screw</text><rect x="40" y="100" width="280" height="290" rx="12" fill="#ffffff" stroke="#b9b2a5"/><circle cx="70" cy="130" r="16" fill="#1f6f6b"/><text x="70" y="136" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text><text x="96" y="137" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="19" font-weight="bold" fill="#20312f" text-anchor="start">Drive the screw</text><rect x="70" y="270" width="220" height="30" fill="#e3c9a0" stroke="#8a6d3b"/><rect x="70" y="300" width="220" height="30" fill="#d1b283" stroke="#8a6d3b"/><text x="180" y="360" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="15" font-weight="normal" fill="#4b5b58" text-anchor="middle">through the depth-control fixture </text><text x="180" y="380" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="15" font-weight="normal" fill="#4b5b58" text-anchor="middle">into the subfloor</text><rect x="340" y="100" width="280" height="290" rx="12" fill="#ffffff" stroke="#b9b2a5"/><circle cx="370" cy="130" r="16" fill="#1f6f6b"/><text x="370" y="136" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text><text x="396" y="137" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="19" font-weight="bold" fill="#20312f" text-anchor="start">The head snaps off</text><rect x="370" y="270" width="220" height="30" fill="#e3c9a0" stroke="#8a6d3b"/><rect x="370" y="300" width="220" height="30" fill="#d1b283" stroke="#8a6d3b"/><text x="480" y="360" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="15" font-weight="normal" fill="#4b5b58" text-anchor="middle">at the fixture, leaving a small ho</text><text x="480" y="380" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="15" font-weight="normal" fill="#4b5b58" text-anchor="middle">le</text><rect x="640" y="100" width="280" height="290" rx="12" fill="#ffffff" stroke="#b9b2a5"/><circle cx="670" cy="130" r="16" fill="#1f6f6b"/><text x="670" y="136" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text><text x="696" y="137" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="19" font-weight="bold" fill="#20312f" text-anchor="start">Fill the hole</text><rect x="670" y="270" width="220" height="30" fill="#e3c9a0" stroke="#8a6d3b"/><rect x="670" y="300" width="220" height="30" fill="#d1b283" stroke="#8a6d3b"/><text x="780" y="360" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="15" font-weight="normal" fill="#4b5b58" text-anchor="middle">with a wax filler stick in a match</text><text x="780" y="380" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="15" font-weight="normal" fill="#4b5b58" text-anchor="middle">ing color</text><rect x="140" y="215" width="80" height="55" fill="#8d979c" stroke="#5d6b70"/><line x1="180" y1="170" x2="180" y2="320" stroke="#20312f" stroke-width="5"/><rect x="168" y="160" width="24" height="12" fill="#20312f"/><line x1="480" y1="272" x2="480" y2="320" stroke="#20312f" stroke-width="5"/><rect x="466" y="190" width="24" height="12" fill="#20312f" transform="rotate(20 478 196)"/><path d="M510 190 l30 -20" stroke="#c0392b" stroke-width="3"/><rect x="766" y="268" width="28" height="5" fill="#c9a26a"/><line x1="780" y1="274" x2="780" y2="320" stroke="#20312f" stroke-width="5"/><text x="480" y="436" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#1f6f6b" text-anchor="middle">One screw at each squeaky spot. Follow your kit’s own instructions for screw length.</text><text x="480" y="466" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" font-weight="bold" fill="#c0392b" text-anchor="middle">Before you drill, consider pipes, wiring or radiant heat that may be below the floor.</text><text x="480" y="508" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="normal" fill="#4b5b58" text-anchor="middle">Source: This Old House, “How To Repair Squeaky Wood Floors”. The pipes-and-heat warning is our own precaution.</text></svg>