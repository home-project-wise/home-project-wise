<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Four doors into a smart home: account, device, network and data, each with three things to check" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif"><rect width="960" height="540" fill="#F7F5F0"/><text x="480" y="52" font-size="32" font-weight="700" fill="#243238" text-anchor="middle">Four doors into a smart home</text><rect x="40" y="100" width="190" height="300" rx="14" fill="#fff" stroke="#D8D2C4" stroke-width="3"/><circle cx="135" cy="150" r="30" fill="#D97745"/><text x="135" y="161" font-size="32" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="135" y="215" font-size="26" font-weight="700" fill="#243238" text-anchor="middle">Account</text><text x="135" y="265" font-size="18" font-weight="500" fill="#243238" text-anchor="middle">Unique password</text><text x="135" y="305" font-size="18" font-weight="500" fill="#243238" text-anchor="middle">Two-step login</text><text x="135" y="345" font-size="18" font-weight="500" fill="#243238" text-anchor="middle">Who has access</text><rect x="270" y="100" width="190" height="300" rx="14" fill="#fff" stroke="#D8D2C4" stroke-width="3"/><circle cx="365" cy="150" r="30" fill="#6F8F82"/><text x="365" y="161" font-size="32" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="365" y="215" font-size="26" font-weight="700" fill="#243238" text-anchor="middle">Device</text><text x="365" y="265" font-size="18" font-weight="500" fill="#243238" text-anchor="middle">Default password</text><text x="365" y="305" font-size="18" font-weight="500" fill="#243238" text-anchor="middle">Auto updates</text><text x="365" y="345" font-size="18" font-weight="500" fill="#243238" text-anchor="middle">Remote access</text><rect x="500" y="100" width="190" height="300" rx="14" fill="#fff" stroke="#D8D2C4" stroke-width="3"/><circle cx="595" cy="150" r="30" fill="#D97745"/><text x="595" y="161" font-size="32" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="595" y="215" font-size="26" font-weight="700" fill="#243238" text-anchor="middle">Network</text><text x="595" y="265" font-size="18" font-weight="500" fill="#243238" text-anchor="middle">Router password</text><text x="595" y="305" font-size="18" font-weight="500" fill="#243238" text-anchor="middle">Guest network</text><text x="595" y="345" font-size="18" font-weight="500" fill="#243238" text-anchor="middle">Old devices out</text><rect x="730" y="100" width="190" height="300" rx="14" fill="#fff" stroke="#D8D2C4" stroke-width="3"/><circle cx="825" cy="150" r="30" fill="#6F8F82"/><text x="825" y="161" font-size="32" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="825" y="215" font-size="26" font-weight="700" fill="#243238" text-anchor="middle">Data</text><text x="825" y="265" font-size="18" font-weight="500" fill="#243238" text-anchor="middle">Location sharing</text><text x="825" y="305" font-size="18" font-weight="500" fill="#243238" text-anchor="middle">Voice and video</text><text x="825" y="345" font-size="18" font-weight="500" fill="#243238" text-anchor="middle">Unused features</text><rect x="40" y="430" width="880" height="80" rx="14" fill="#243238"/><text x="480" y="478" font-size="21" font-weight="600" fill="#fff" text-anchor="middle">Check each door once. Most of the work is settings you already have.</text></svg>