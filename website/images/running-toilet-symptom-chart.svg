<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Decision chart linking symptoms to the likely cause: colour in the bowl points to the flapper, water over the overflow tube points to the water level or fill valve" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif"><rect width="960" height="540" fill="#F7F5F0"/><text x="480" y="42" font-size="30" font-weight="700" fill="#243238" text-anchor="middle">What you see, what to check</text><rect x="40" y="95" width="400" height="80" rx="12" fill="#fff" stroke="#243238" stroke-width="3"/><text x="240" y="143" font-size="20" font-weight="700" fill="#243238" text-anchor="middle">Dye shows in the bowl</text><line x1="450" y1="135" x2="540" y2="135" stroke="#243238" stroke-width="5" stroke-linecap="round"/><polygon points="556,135 538,126 538,144" fill="#243238"/><rect x="560" y="95" width="360" height="80" rx="12" fill="#E4ECE8" stroke="#6F8F82" stroke-width="4"/><text x="740" y="143" font-size="20" font-weight="700" fill="#243238" text-anchor="middle">Flapper or seat</text><rect x="40" y="200" width="400" height="80" rx="12" fill="#fff" stroke="#243238" stroke-width="3"/><text x="240" y="248" font-size="20" font-weight="700" fill="#243238" text-anchor="middle">Water runs into the overflow tube</text><line x1="450" y1="240" x2="540" y2="240" stroke="#243238" stroke-width="5" stroke-linecap="round"/><polygon points="556,240 538,231 538,249" fill="#243238"/><rect x="560" y="200" width="360" height="80" rx="12" fill="#E4ECE8" stroke="#6F8F82" stroke-width="4"/><text x="740" y="248" font-size="20" font-weight="700" fill="#243238" text-anchor="middle">Water level or fill valve</text><rect x="40" y="305" width="400" height="80" rx="12" fill="#fff" stroke="#243238" stroke-width="3"/><text x="240" y="353" font-size="20" font-weight="700" fill="#243238" text-anchor="middle">Handle needs jiggling</text><line x1="450" y1="345" x2="540" y2="345" stroke="#243238" stroke-width="5" stroke-linecap="round"/><polygon points="556,345 538,336 538,354" fill="#243238"/><rect x="560" y="305" width="360" height="80" rx="12" fill="#E4ECE8" stroke="#6F8F82" stroke-width="4"/><text x="740" y="353" font-size="20" font-weight="700" fill="#243238" text-anchor="middle">Chain slack or flapper alignment</text><rect x="40" y="410" width="400" height="80" rx="12" fill="#fff" stroke="#243238" stroke-width="3"/><text x="240" y="458" font-size="20" font-weight="700" fill="#243238" text-anchor="middle">Refills every 15 to 30 minutes, no dye</text><line x1="450" y1="450" x2="540" y2="450" stroke="#243238" stroke-width="5" stroke-linecap="round"/><polygon points="556,450 538,441 538,459" fill="#243238"/><rect x="560" y="410" width="360" height="80" rx="12" fill="#E4ECE8" stroke="#6F8F82" stroke-width="4"/><text x="740" y="458" font-size="20" font-weight="700" fill="#243238" text-anchor="middle">Refill hose below the waterline</text>
</svg>
