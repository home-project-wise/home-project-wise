<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Three columns sorting devices into green, amber and red for smart plug use" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif"><rect width="960" height="540" fill="#F7F5F0"/><text x="480" y="46" font-size="28" font-weight="700" fill="#243238" text-anchor="middle">Green, amber, red: where devices belong</text><rect x="40" y="80" width="280" height="420" rx="16" fill="#fff" stroke="#6F8F82" stroke-width="4"/><rect x="40" y="80" width="280" height="86" rx="16" fill="#6F8F82"/><text x="180" y="122" font-size="32" font-weight="800" fill="#fff" text-anchor="middle">GREEN</text><text x="180" y="152" font-size="19" font-weight="500" fill="#fff" text-anchor="middle">Fine on a smart plug</text><circle cx="70" cy="213" r="7" fill="#6F8F82"/><text x="88" y="220" font-size="18" font-weight="500" fill="#243238" text-anchor="start">LED and table lamps</text><circle cx="70" cy="261" r="7" fill="#6F8F82"/><text x="88" y="268" font-size="18" font-weight="500" fill="#243238" text-anchor="start">Phone/laptop chargers</text><circle cx="70" cy="309" r="7" fill="#6F8F82"/><text x="88" y="316" font-size="18" font-weight="500" fill="#243238" text-anchor="start">Router reboot timer</text><circle cx="70" cy="357" r="7" fill="#6F8F82"/><text x="88" y="364" font-size="18" font-weight="500" fill="#243238" text-anchor="start">Bedside or desk fan</text><circle cx="70" cy="405" r="7" fill="#6F8F82"/><text x="88" y="412" font-size="18" font-weight="500" fill="#243238" text-anchor="start">TV and game console</text><circle cx="70" cy="453" r="7" fill="#6F8F82"/><text x="88" y="460" font-size="18" font-weight="500" fill="#243238" text-anchor="start">Indoor holiday lights</text><rect x="340" y="80" width="280" height="420" rx="16" fill="#fff" stroke="#E0A43A" stroke-width="4"/><rect x="340" y="80" width="280" height="86" rx="16" fill="#E0A43A"/><text x="480" y="122" font-size="32" font-weight="800" fill="#fff" text-anchor="middle">AMBER</text><text x="480" y="152" font-size="19" font-weight="500" fill="#fff" text-anchor="middle">Only after the watt check</text><circle cx="370" cy="213" r="7" fill="#E0A43A"/><text x="388" y="220" font-size="18" font-weight="500" fill="#243238" text-anchor="start">Window air conditioner</text><circle cx="370" cy="261" r="7" fill="#E0A43A"/><text x="388" y="268" font-size="18" font-weight="500" fill="#243238" text-anchor="start">Dehumidifier</text><circle cx="370" cy="309" r="7" fill="#E0A43A"/><text x="388" y="316" font-size="18" font-weight="500" fill="#243238" text-anchor="start">Slow cooker</text><circle cx="370" cy="357" r="7" fill="#E0A43A"/><text x="388" y="364" font-size="18" font-weight="500" fill="#243238" text-anchor="start">Coffee maker</text><circle cx="370" cy="405" r="7" fill="#E0A43A"/><text x="388" y="412" font-size="18" font-weight="500" fill="#243238" text-anchor="start">TV + soundbar group</text><circle cx="370" cy="453" r="7" fill="#E0A43A"/><text x="388" y="460" font-size="18" font-weight="500" fill="#243238" text-anchor="start">Anything with a motor</text><rect x="640" y="80" width="280" height="420" rx="16" fill="#fff" stroke="#B5482F" stroke-width="4"/><rect x="640" y="80" width="280" height="86" rx="16" fill="#B5482F"/><text x="780" y="122" font-size="32" font-weight="800" fill="#fff" text-anchor="middle">RED</text><text x="780" y="152" font-size="19" font-weight="500" fill="#fff" text-anchor="middle">Do not use a smart plug</text><circle cx="670" cy="213" r="7" fill="#B5482F"/><text x="688" y="220" font-size="18" font-weight="500" fill="#243238" text-anchor="start">Space heaters</text><circle cx="670" cy="261" r="7" fill="#B5482F"/><text x="688" y="268" font-size="18" font-weight="500" fill="#243238" text-anchor="start">Kettles, toasters, irons</text><circle cx="670" cy="309" r="7" fill="#B5482F"/><text x="688" y="316" font-size="18" font-weight="500" fill="#243238" text-anchor="start">Hair dryers</text><circle cx="670" cy="357" r="7" fill="#B5482F"/><text x="688" y="364" font-size="18" font-weight="500" fill="#243238" text-anchor="start">Fridges and freezers</text><circle cx="670" cy="405" r="7" fill="#B5482F"/><text x="688" y="412" font-size="18" font-weight="500" fill="#243238" text-anchor="start">Medical equipment</text><circle cx="670" cy="453" r="7" fill="#B5482F"/><text x="688" y="460" font-size="18" font-weight="500" fill="#243238" text-anchor="start">Washers and dryers</text></svg>