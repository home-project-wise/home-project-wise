<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d"><title id="t">Five checks before you cut a drywall hole</title><desc id="d">A wall with a hole and five numbered checks: paint age, old compound or texture, wires and pipes, wet board, and board thickness or fire rating.</desc><rect width="960" height="540" rx="16" fill="#f7f4ee"/><text x="40" y="52" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="26" font-weight="bold" fill="#20312f" text-anchor="start">Five checks before you cut</text><rect x="40" y="80" width="360" height="410" rx="6" fill="#ffffff" stroke="#b9b2a5" stroke-width="2"/><ellipse cx="250" cy="440" rx="75" ry="28" fill="#c9b79a" opacity=".6" stroke="#8a7a5c" stroke-dasharray="6 4"/><rect x="120" y="190" width="200" height="170" fill="#e8e1d4" stroke="#20312f" stroke-width="3"/><path d="M130 235 C170 215 210 258 250 240 S300 250 312 232" stroke="#c0392b" stroke-width="4" fill="none"/><rect x="138" y="305" width="172" height="14" rx="7" fill="#6b8fa3"/><path d="M360 150 L240 250" stroke="#d9a21b" stroke-width="3" stroke-dasharray="8 6"/><circle cx="366" cy="144" r="9" fill="#d9a21b"/><circle cx="72" cy="112" r="16" fill="#1f6f6b"/><text x="72" y="118" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text><circle cx="336" cy="176" r="16" fill="#1f6f6b"/><text x="336" y="182" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text><circle cx="215" cy="282" r="16" fill="#1f6f6b"/><text x="215" y="288" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text><circle cx="250" cy="440" r="16" fill="#1f6f6b"/><text x="250" y="446" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text><circle cx="100" cy="376" r="16" fill="#1f6f6b"/><text x="100" y="382" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text><circle cx="450" cy="110" r="16" fill="#1f6f6b"/><text x="450" y="116" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text><text x="482" y="108" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="21" font-weight="bold" fill="#20312f" text-anchor="start">Year built</text><text x="482" y="132" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="16" font-weight="normal" fill="#4b5b58" text-anchor="start">Before 1978? Assume lead paint; follow EPA steps.</text><circle cx="450" cy="190" r="16" fill="#1f6f6b"/><text x="450" y="196" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text><text x="482" y="188" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="21" font-weight="bold" fill="#20312f" text-anchor="start">Old compound or texture</text><text x="482" y="212" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="16" font-weight="normal" fill="#4b5b58" text-anchor="start">May contain asbestos. Do not sand or scrape it.</text><circle cx="450" cy="270" r="16" fill="#1f6f6b"/><text x="450" y="276" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text><text x="482" y="268" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="21" font-weight="bold" fill="#20312f" text-anchor="start">Wires and pipes</text><text x="482" y="292" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="16" font-weight="normal" fill="#4b5b58" text-anchor="start">Flashlight first. Breaker off. Cut shallow.</text><circle cx="450" cy="350" r="16" fill="#1f6f6b"/><text x="450" y="356" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text><text x="482" y="348" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="21" font-weight="bold" fill="#20312f" text-anchor="start">Wet, soft or stained board</text><text x="482" y="372" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="16" font-weight="normal" fill="#4b5b58" text-anchor="start">Fix the leak first. A patch only hides it.</text><circle cx="450" cy="430" r="16" fill="#1f6f6b"/><text x="450" y="436" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text><text x="482" y="428" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="21" font-weight="bold" fill="#20312f" text-anchor="start">Thickness and fire rating</text><text x="482" y="452" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="16" font-weight="normal" fill="#4b5b58" text-anchor="start">Match the board. Garage wall? Ask a pro first.</text></svg>