<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d"><title id="t">T-molding gap drawn to scale</title><desc id="d">Cross-section of two floating floors with a one and one-eighth inch gap, a track screwed to the subfloor and a T-molding pressed into the track.</desc><rect width="960" height="540" rx="16" fill="#f7f4ee"/><text x="40" y="50" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="26" font-weight="bold" fill="#20312f" text-anchor="start">T-molding on a floating floor: the gap, to scale</text><rect x="60" y="220" width="300" height="40" fill="#e9e4da" stroke="#8a8272" stroke-width="2"/><rect x="600" y="220" width="300" height="40" fill="#e9e4da" stroke="#8a8272" stroke-width="2"/><rect x="40" y="260" width="880" height="40" fill="#cfc3b0" stroke="#8a8272" stroke-width="2"/><rect x="427" y="248" width="106" height="12" fill="#6b8fa3" stroke="#3c5a6a"/><rect x="340" y="210" width="280" height="10" rx="3" fill="#d9a86c" stroke="#9c7440"/><rect x="470" y="220" width="20" height="28" fill="#d9a86c" stroke="#9c7440"/><line x1="480" y1="236" x2="480" y2="292" stroke="#20312f" stroke-width="3"/><rect x="474" y="232" width="12" height="5" fill="#20312f"/><text x="210" y="206" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#20312f" text-anchor="middle">Floor A (floating)</text><text x="750" y="206" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#20312f" text-anchor="middle">Floor B</text><text x="480" y="330" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#4b5b58" text-anchor="middle">Subfloor</text><line x1="360" y1="360" x2="600" y2="360" stroke="#20312f" stroke-width="2"/><path d="M360 360 l10 -6 v12z M600 360 l-10 -6 v12z" fill="#20312f"/><text x="480" y="388" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="19" font-weight="bold" fill="#20312f" text-anchor="middle">Gap between floors: 1 1/8 in (example)</text><text x="393" y="424" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="16" font-weight="normal" fill="#20312f" text-anchor="middle">5/16 in</text><text x="567" y="424" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="16" font-weight="normal" fill="#20312f" text-anchor="middle">5/16 in</text><text x="480" y="424" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="16" font-weight="normal" fill="#20312f" text-anchor="middle">track 1/2 in</text><text x="480" y="462" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="19" font-weight="bold" fill="#1f6f6b" text-anchor="middle">Screw the track to the subfloor. Press the molding into the track.</text><text x="480" y="490" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" font-weight="normal" fill="#4b5b58" text-anchor="middle">The floors keep their own expansion space beside the track.</text><text x="480" y="516" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="normal" fill="#4b5b58" text-anchor="middle">Example numbers: Mannington Commercial guide, T-molding for 2.5 to 4.5 mm floors. Your maker’s numbers decide.</text></svg>