<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Cutaway of a house marking the pipes most at risk of freezing: hose spigot, exterior walls, attic, garage, crawl space and under-sink cabinet" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif"><rect width="960" height="540" fill="#F7F5F0"/><text x="480" y="40" font-size="30" font-weight="700" fill="#243238" text-anchor="middle">Where pipes freeze first</text><polygon points="140,190 400,95 660,190" fill="#ECE8DD" stroke="#B9B4A6" stroke-width="3"/><rect x="160" y="190" width="480" height="260" fill="#fff" stroke="#B9B4A6" stroke-width="3"/><line x1="400" y1="190" x2="400" y2="450" stroke="#D8D3C5" stroke-width="3"/><line x1="160" y1="320" x2="640" y2="320" stroke="#D8D3C5" stroke-width="3"/><rect x="160" y="450" width="480" height="28" fill="#ECE8DD" stroke="#B9B4A6" stroke-width="3"/><text x="280" y="255" font-size="17" font-weight="600" fill="#5b6b70" text-anchor="middle">Attic / loft</text><text x="520" y="255" font-size="17" font-weight="600" fill="#5b6b70" text-anchor="middle">Bedroom</text><text x="280" y="390" font-size="17" font-weight="600" fill="#5b6b70" text-anchor="middle">Garage</text><text x="520" y="390" font-size="17" font-weight="600" fill="#5b6b70" text-anchor="middle">Kitchen</text><text x="400" y="470" font-size="15" font-weight="600" fill="#5b6b70" text-anchor="middle">Crawl space / basement</text><rect x="640" y="380" width="26" height="12" fill="#243238"/><rect x="660" y="360" width="10" height="32" fill="#243238"/><circle cx="655" cy="370" r="17" fill="#B5482F"/><text x="655" y="377" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">1</text><circle cx="640" cy="260" r="17" fill="#B5482F"/><text x="640" y="267" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">2</text><circle cx="400" cy="150" r="17" fill="#B5482F"/><text x="400" y="157" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">3</text><circle cx="280" cy="350" r="17" fill="#B5482F"/><text x="280" y="357" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">4</text><circle cx="400" cy="466" r="17" fill="#B5482F"/><text x="400" y="473" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">5</text><circle cx="560" cy="425" r="17" fill="#B5482F"/><text x="560" y="432" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">6</text><rect x="690" y="110" width="250" height="350" rx="12" fill="#fff" stroke="#D8D3C5" stroke-width="2"/><circle cx="715" cy="144" r="13" fill="#B5482F"/><text x="715" y="150" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="738" y="150" font-size="16" font-weight="600" fill="#243238" text-anchor="start">Outdoor hose spigot</text><circle cx="715" cy="196" r="13" fill="#B5482F"/><text x="715" y="202" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="738" y="202" font-size="16" font-weight="600" fill="#243238" text-anchor="start">Pipes in exterior walls</text><circle cx="715" cy="248" r="13" fill="#B5482F"/><text x="715" y="254" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="738" y="254" font-size="16" font-weight="600" fill="#243238" text-anchor="start">Attic or loft</text><circle cx="715" cy="300" r="13" fill="#B5482F"/><text x="715" y="306" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="738" y="306" font-size="16" font-weight="600" fill="#243238" text-anchor="start">Garage supply lines</text><circle cx="715" cy="352" r="13" fill="#B5482F"/><text x="715" y="358" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="738" y="358" font-size="16" font-weight="600" fill="#243238" text-anchor="start">Crawl space, basement</text><circle cx="715" cy="404" r="13" fill="#B5482F"/><text x="715" y="410" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">6</text><text x="738" y="410" font-size="16" font-weight="600" fill="#243238" text-anchor="start">Under-sink cabinet</text><text x="480" y="515" font-size="18" font-weight="500" fill="#5b6b70" text-anchor="middle">Any pipe on an outside wall or in an unheated space is a candidate.</text></svg>