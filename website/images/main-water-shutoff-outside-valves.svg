<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Diagram of the property boundary: outside valves and the meter belong to the water supplier, while the main shutoff inside the home is yours" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif">
<rect width="960" height="540" fill="#F7F5F0"/>
<text x="480" y="40" font-size="30" font-weight="700" fill="#243238" text-anchor="middle">Whose valve is it?</text>
<rect x="40" y="80" width="400" height="400" rx="14" fill="#fbeae5" stroke="#B5482F" stroke-width="3"/>
<rect x="520" y="80" width="400" height="400" rx="14" fill="#E4ECE8" stroke="#6F8F82" stroke-width="3"/>
<line x1="480" y1="70" x2="480" y2="490" stroke="#243238" stroke-width="4" stroke-dasharray="14 10"/>
<text x="480" y="512" font-size="18" font-weight="700" fill="#243238" text-anchor="middle">Property boundary</text>
<text x="240" y="125" font-size="26" font-weight="700" fill="#B5482F" text-anchor="middle">Outside: the supplier's</text>
<polygon points="240,160 285,235 195,235" fill="#fff" stroke="#B5482F" stroke-width="4" stroke-linejoin="round"/>
<text x="240" y="222" font-size="38" font-weight="700" fill="#B5482F" text-anchor="middle">!</text>
<rect x="95" y="290" width="130" height="64" rx="10" fill="#fff" stroke="#243238" stroke-width="3"/>
<text x="160" y="329" font-size="18" font-weight="700" fill="#243238" text-anchor="middle">Meter</text>
<rect x="255" y="290" width="130" height="64" rx="10" fill="#fff" stroke="#243238" stroke-width="3"/>
<text x="320" y="329" font-size="18" font-weight="700" fill="#243238" text-anchor="middle">Curb stop</text>
<text x="240" y="410" font-size="22" font-weight="700" fill="#243238" text-anchor="middle">Ask the utility first</text>
<text x="720" y="125" font-size="26" font-weight="700" fill="#6F8F82" text-anchor="middle">Inside: yours</text>
<line x1="520" y1="322" x2="640" y2="322" stroke="#243238" stroke-width="10"/>
<line x1="800" y1="322" x2="900" y2="322" stroke="#243238" stroke-width="10"/>
<polygon points="650,300 650,344 720,322" fill="#6F8F82"/>
<polygon points="790,300 790,344 720,322" fill="#6F8F82"/>
<line x1="720" y1="322" x2="720" y2="262" stroke="#6F8F82" stroke-width="6" stroke-linecap="round"/>
<line x1="696" y1="262" x2="744" y2="262" stroke="#6F8F82" stroke-width="8" stroke-linecap="round"/>
<text x="720" y="410" font-size="22" font-weight="700" fill="#243238" text-anchor="middle">Main shutoff</text>
<text x="720" y="438" font-size="17" font-weight="500" fill="#5b6b70" text-anchor="middle">yours to test and tag</text>
</svg>
