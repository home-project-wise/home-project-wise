<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d"><title id="t">The six sides of a door to seal</title><desc id="d">A door slab with six numbered surfaces to seal: both faces, top edge, bottom edge, hinge edge and latch edge, plus any bare cut-outs.</desc><rect width="960" height="540" rx="16" fill="#f7f4ee"/><text x="40" y="50" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="26" font-weight="bold" fill="#20312f" text-anchor="start">Seal all six sides after trimming</text><rect x="80" y="110" width="300" height="320" fill="#f9f6ef" stroke="#8a8272" stroke-width="3"/><rect x="380" y="110" width="30" height="320" fill="#e8c27a" stroke="#8a8272" stroke-width="2"/><rect x="80" y="90" width="330" height="20" fill="#e8c27a" stroke="#8a8272" stroke-width="2"/><rect x="80" y="430" width="330" height="20" fill="#e8c27a" stroke="#8a8272" stroke-width="2"/><text x="230" y="280" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="22" font-weight="bold" fill="#20312f" text-anchor="middle">Door slab</text><rect x="520" y="90" width="400" height="54" rx="10" fill="#ffffff" stroke="#b9b2a5"/><circle cx="550" cy="117" r="16" fill="#1f6f6b"/><text x="550" y="123" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text><text x="578" y="114" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" font-weight="bold" fill="#20312f" text-anchor="start">Both faces</text><text x="578" y="134" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="normal" fill="#4b5b58" text-anchor="start">The two large sides</text><rect x="520" y="156" width="400" height="54" rx="10" fill="#ffffff" stroke="#b9b2a5"/><circle cx="550" cy="183" r="16" fill="#1f6f6b"/><text x="550" y="189" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text><text x="578" y="180" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" font-weight="bold" fill="#20312f" text-anchor="start">Top edge</text><text x="578" y="200" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="normal" fill="#4b5b58" text-anchor="start">Often left unfinished</text><rect x="520" y="222" width="400" height="54" rx="10" fill="#ffffff" stroke="#b9b2a5"/><circle cx="550" cy="249" r="16" fill="#1f6f6b"/><text x="550" y="255" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text><text x="578" y="246" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" font-weight="bold" fill="#20312f" text-anchor="start">Bottom edge</text><text x="578" y="266" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="normal" fill="#4b5b58" text-anchor="start">Most likely to absorb moisture</text><rect x="520" y="288" width="400" height="54" rx="10" fill="#ffffff" stroke="#b9b2a5"/><circle cx="550" cy="315" r="16" fill="#1f6f6b"/><text x="550" y="321" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text><text x="578" y="312" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" font-weight="bold" fill="#20312f" text-anchor="start">Hinge edge</text><text x="578" y="332" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="normal" fill="#4b5b58" text-anchor="start">Do not remove hinges to finish</text><rect x="520" y="354" width="400" height="54" rx="10" fill="#ffffff" stroke="#b9b2a5"/><circle cx="550" cy="381" r="16" fill="#1f6f6b"/><text x="550" y="387" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text><text x="578" y="378" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" font-weight="bold" fill="#20312f" text-anchor="start">Latch edge</text><text x="578" y="398" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="normal" fill="#4b5b58" text-anchor="start">Planed edges are bare wood</text><rect x="520" y="420" width="400" height="54" rx="10" fill="#ffffff" stroke="#b9b2a5"/><circle cx="550" cy="447" r="16" fill="#1f6f6b"/><text x="550" y="453" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text><text x="578" y="444" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" font-weight="bold" fill="#20312f" text-anchor="start">Cut-outs</text><text x="578" y="464" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="normal" fill="#4b5b58" text-anchor="start">Bored holes, if bare</text><text x="480" y="494" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" font-weight="bold" fill="#1f6f6b" text-anchor="middle">Use an equal number of coats on all sides. Primer is not a sealer, says one maker.</text><text x="480" y="518" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="normal" fill="#4b5b58" text-anchor="middle">Sources: JELD-WEN JII110 (six sides, equal coats); Trimlite warranty note (search excerpt).</text></svg>