<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="t d"><title id="t">When a crawl-space professional should inspect</title><desc id="d">Safety checklist highlighting structural damage, persistent standing water, suspected mold, and electrical hazards as reasons to get professional help.</desc><rect width="960" height="420" rx="24" fill="#f4f7f4"/><text x="48" y="55" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#243c32">Know when to call a professional</text><g font-family="Arial,sans-serif" fill="#243c32"><g transform="translate(65 100)"><rect width="390" height="105" rx="16" fill="#fff" stroke="#d5b9a7" stroke-width="2"/><path d="M28 70 L55 25 L82 70 Z" fill="#f5d7c8" stroke="#a95e40" stroke-width="4"/><text x="100" y="45" font-size="21" font-weight="700">Structural damage</text><text x="100" y="73" font-size="17">Sagging, rot, or unsafe supports</text></g><g transform="translate(500 100)"><rect width="390" height="105" rx="16" fill="#fff" stroke="#d5b9a7" stroke-width="2"/><path d="M55 25 C30 60 32 78 55 78 C78 78 80 60 55 25Z" fill="#8ebdca" stroke="#3d8293" stroke-width="3"/><text x="100" y="45" font-size="21" font-weight="700">Persistent water</text><text x="100" y="73" font-size="17">Repeated flooding or seepage</text></g><g transform="translate(65 230)"><rect width="390" height="105" rx="16" fill="#fff" stroke="#d5b9a7" stroke-width="2"/><circle cx="55" cy="53" r="27" fill="#dcebe0" stroke="#47775a" stroke-width="3"/><circle cx="45" cy="48" r="5" fill="#47775a"/><circle cx="62" cy="61" r="6" fill="#47775a"/><text x="100" y="45" font-size="21" font-weight="700">Suspected mold</text><text x="100" y="73" font-size="17">Large or recurring growth</text></g><g transform="translate(500 230)"><rect width="390" height="105" rx="16" fill="#fff" stroke="#d5b9a7" stroke-width="2"/><path d="M55 25 L55 53 M40 40 L70 40 M44 29 L66 51 M66 29 L44 51" stroke="#a95e40" stroke-width="5"/><text x="100" y="45" font-size="21" font-weight="700">Electrical hazards</text><text x="100" y="73" font-size="17">Water near wiring or outlets</text></g></g></svg>