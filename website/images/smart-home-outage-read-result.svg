<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d"><title id="t">How to read your result</title><desc id="d">Start by opening the app with the internet off. If it works the device is local. If it fails, try the wall switch: if the light works set power-on behaviour to on, if it stays dark change the power-on setting.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#243238"/></marker></defs><rect width="960" height="540" fill="#F7F5F0"/><rect x="220" y="24" width="520" height="64" rx="12" fill="#FFFFFF" stroke="#243238" stroke-width="2"/><text x="480" y="52" font-size="20" fill="#243238" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Internet unplugged. Open the app</text><text x="480" y="76" font-size="17" fill="#4A5B61" font-weight="normal" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">(mobile data off)</text><line x1="400" y1="88" x2="250" y2="148" stroke="#243238" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><line x1="560" y1="88" x2="710" y2="148" stroke="#243238" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><rect x="60" y="150" width="380" height="92" rx="12" fill="#E6EEEA" stroke="#6F8F82" stroke-width="3"/><text x="250" y="184" font-size="21" fill="#4F6F62" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">App WORKS</text><text x="250" y="212" font-size="18" fill="#243238" font-weight="normal" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Local control. Keep it that way.</text><rect x="520" y="150" width="380" height="92" rx="12" fill="#FBEBE2" stroke="#D97745" stroke-width="3"/><text x="710" y="184" font-size="21" fill="#B04F1F" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">App FAILS</text><text x="710" y="212" font-size="18" fill="#243238" font-weight="normal" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Try the wall switch: off, wait, on</text><line x1="640" y1="242" x2="560" y2="312" stroke="#243238" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><line x1="780" y1="242" x2="830" y2="312" stroke="#243238" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><rect x="420" y="314" width="280" height="130" rx="12" fill="#FFFFFF" stroke="#243238" stroke-width="2"/><text x="560" y="342" font-size="19" fill="#243238" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Light comes on</text><text x="560" y="370" font-size="16" fill="#243238" font-weight="normal" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Normal cloud Wi-Fi bulb.</text><text x="560" y="394" font-size="16" fill="#243238" font-weight="normal" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Set power-on to ON for</text><text x="560" y="418" font-size="16" fill="#243238" font-weight="normal" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">hallway and stairs bulbs.</text><rect x="720" y="314" width="200" height="130" rx="12" fill="#FFFFFF" stroke="#243238" stroke-width="2"/><text x="820" y="342" font-size="19" fill="#243238" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Stays dark</text><text x="820" y="370" font-size="16" fill="#243238" font-weight="normal" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Power-on is set to</text><text x="820" y="394" font-size="16" fill="#243238" font-weight="normal" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">last state or off.</text><text x="820" y="418" font-size="16" fill="#243238" font-weight="normal" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Change it in the app.</text><rect x="40" y="314" width="340" height="130" rx="12" fill="#FFFFFF" stroke="#6F8F82" stroke-width="2"/><text x="210" y="342" font-size="18" fill="#243238" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">App works, voice does not?</text><text x="210" y="370" font-size="16" fill="#243238" font-weight="normal" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Voice assistants need the</text><text x="210" y="394" font-size="16" fill="#243238" font-weight="normal" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">internet to understand you.</text><text x="210" y="418" font-size="16" fill="#243238" font-weight="normal" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Use the app or the switch.</text><text x="40" y="500" font-size="18" fill="#4A5B61" font-weight="normal" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Test one device at a time and write the result on your test sheet.</text></svg>