<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d"><title id="t">Cut the internet, not the power</title><desc id="d">Unplug the cable between the wall socket or fibre box and the router, keep the router powered, then confirm the internet is off on your phone.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#243238"/></marker></defs><rect width="960" height="540" fill="#F7F5F0"/><text x="40" y="60" font-size="32" fill="#243238" font-weight="bold" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Cut the internet, not the power</text><text x="40" y="92" font-size="18" fill="#4A5B61" font-weight="normal" text-anchor="start" font-family="Arial, Helvetica, sans-serif">This copies a real outage: your provider fails, but your home still has electricity.</text><rect x="40" y="160" width="190" height="110" rx="12" fill="#FFFFFF" stroke="#243238" stroke-width="2"/><text x="135" y="208" font-size="20" fill="#243238" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Wall socket</text><text x="135" y="236" font-size="18" fill="#4A5B61" font-weight="normal" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">or fibre box</text><line x1="230" y1="215" x2="330" y2="215" stroke="#243238" stroke-width="6" stroke-linecap="round"/><line x1="352" y1="215" x2="450" y2="215" stroke="#243238" stroke-width="6" stroke-linecap="round"/><line x1="327" y1="201" x2="355" y2="229" stroke="#D97745" stroke-width="6" stroke-linecap="round"/><line x1="327" y1="229" x2="355" y2="201" stroke="#D97745" stroke-width="6" stroke-linecap="round"/><text x="340" y="178" font-size="19" fill="#B04F1F" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">1. Unplug this cable</text><text x="340" y="262" font-size="16" fill="#4A5B61" font-weight="normal" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">(the WAN / internet cable)</text><rect x="450" y="160" width="170" height="110" rx="12" fill="#FFFFFF" stroke="#6F8F82" stroke-width="3"/><text x="535" y="208" font-size="20" fill="#243238" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Router</text><text x="535" y="236" font-size="18" fill="#4F6F62" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">stays ON</text><rect x="700" y="140" width="220" height="52" rx="12" fill="#FFFFFF" stroke="#6F8F82" stroke-width="2"/><text x="810" y="173" font-size="18" fill="#243238" font-weight="normal" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Smart bulbs</text><line x1="620" y1="215" x2="698" y2="166" stroke="#6F8F82" stroke-width="3" stroke-linecap="round"/><rect x="700" y="205" width="220" height="52" rx="12" fill="#FFFFFF" stroke="#6F8F82" stroke-width="2"/><text x="810" y="238" font-size="18" fill="#243238" font-weight="normal" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Hub or smart plugs</text><line x1="620" y1="215" x2="698" y2="231" stroke="#6F8F82" stroke-width="3" stroke-linecap="round"/><rect x="700" y="270" width="220" height="52" rx="12" fill="#FFFFFF" stroke="#6F8F82" stroke-width="2"/><text x="810" y="303" font-size="18" fill="#243238" font-weight="normal" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Your phone on Wi-Fi</text><line x1="620" y1="215" x2="698" y2="296" stroke="#6F8F82" stroke-width="3" stroke-linecap="round"/><rect x="40" y="330" width="880" height="52" rx="12" fill="#E6EEEA" stroke="#6F8F82" stroke-width="2"/><text x="60" y="363" font-size="19" fill="#243238" font-weight="bold" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Still working: electricity, router, home Wi-Fi, your local network</text><rect x="40" y="392" width="880" height="52" rx="12" fill="#FBEBE2" stroke="#D97745" stroke-width="2"/><text x="60" y="425" font-size="19" fill="#243238" font-weight="bold" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Gone: the internet (cloud apps, voice assistants, cloud-based routines)</text><text x="40" y="490" font-size="18" fill="#4A5B61" font-weight="normal" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Check it worked: phone on home Wi-Fi, mobile data OFF, open any web page. It should fail.</text></svg>