<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="A gate valve handwheel that turns clockwise to close, beside a ball valve lever that sits in line with the pipe when open and across it when closed" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif">
<rect width="960" height="540" fill="#F7F5F0"/>
<text x="480" y="40" font-size="30" font-weight="700" fill="#243238" text-anchor="middle">Two handles, two ways to close</text>
<rect x="40" y="70" width="420" height="420" rx="14" fill="#fff" stroke="#243238" stroke-width="2.5"/>
<rect x="500" y="70" width="420" height="420" rx="14" fill="#fff" stroke="#243238" stroke-width="2.5"/>
<text x="250" y="112" font-size="24" font-weight="700" fill="#243238" text-anchor="middle">Gate valve or stop tap</text>
<text x="250" y="138" font-size="17" font-weight="500" fill="#5b6b70" text-anchor="middle">round handwheel</text>
<circle cx="250" cy="230" r="62" fill="none" stroke="#243238" stroke-width="10"/>
<line x1="188" y1="230" x2="312" y2="230" stroke="#243238" stroke-width="8"/>
<line x1="250" y1="168" x2="250" y2="292" stroke="#243238" stroke-width="8"/>
<circle cx="250" cy="230" r="12" fill="#243238"/>
<line x1="250" y1="292" x2="250" y2="330" stroke="#243238" stroke-width="10"/>
<rect x="205" y="330" width="90" height="56" rx="8" fill="#E4ECE8" stroke="#243238" stroke-width="3"/>
<rect x="90" y="344" width="115" height="28" fill="#CBD8D2" stroke="#243238" stroke-width="3"/>
<rect x="295" y="344" width="115" height="28" fill="#CBD8D2" stroke="#243238" stroke-width="3"/>
<path d="M 330 175 A 100 100 0 0 1 330 285" fill="none" stroke="#6F8F82" stroke-width="7" stroke-linecap="round"/>
<polygon points="330,297 316,276 344,276" fill="#6F8F82"/>
<text x="250" y="436" font-size="22" font-weight="700" fill="#6F8F82" text-anchor="middle">Clockwise to close</text>
<text x="250" y="464" font-size="17" font-weight="500" fill="#5b6b70" text-anchor="middle">several turns, never force</text>
<text x="710" y="112" font-size="24" font-weight="700" fill="#243238" text-anchor="middle">Ball valve</text>
<text x="710" y="138" font-size="17" font-weight="500" fill="#5b6b70" text-anchor="middle">lever handle, a quarter turn</text>
<rect x="530" y="190" width="360" height="30" fill="#CBD8D2" stroke="#243238" stroke-width="3"/>
<rect x="665" y="170" width="90" height="70" rx="12" fill="#E4ECE8" stroke="#243238" stroke-width="3"/>
<line x1="710" y1="205" x2="840" y2="205" stroke="#6F8F82" stroke-width="14" stroke-linecap="round"/>
<text x="710" y="268" font-size="22" font-weight="700" fill="#6F8F82" text-anchor="middle">Open: lever in line</text>
<rect x="530" y="340" width="360" height="30" fill="#CBD8D2" stroke="#243238" stroke-width="3"/>
<rect x="665" y="320" width="90" height="70" rx="12" fill="#E4ECE8" stroke="#243238" stroke-width="3"/>
<line x1="710" y1="355" x2="710" y2="300" stroke="#B5482F" stroke-width="14" stroke-linecap="round"/>
<text x="710" y="432" font-size="22" font-weight="700" fill="#B5482F" text-anchor="middle">Closed: lever across</text>
</svg>
