<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Wall diagram showing a magnet moved in growing circles until it grips a screw in the drywall, marking the stud behind" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif"><rect width="960" height="540" fill="#F7F5F0"/><text x="480" y="42" font-size="30" font-weight="700" fill="#243238" text-anchor="middle">A magnet finds the screws</text>
<rect x="60" y="80" width="840" height="400" rx="6" fill="#fff" stroke="#243238" stroke-width="3"/>
<rect x="426" y="80" width="48" height="400" fill="#E4D9C3" stroke="#B9A98A" stroke-width="2" stroke-dasharray="8 6"/>
<circle cx="450" cy="150" r="6" fill="#243238"/><circle cx="450" cy="230" r="6" fill="#243238"/><circle cx="450" cy="310" r="6" fill="#243238"/><circle cx="450" cy="390" r="6" fill="#243238"/>
<circle cx="250" cy="300" r="26" fill="none" stroke="#6F8F82" stroke-width="3"/><circle cx="250" cy="300" r="56" fill="none" stroke="#6F8F82" stroke-width="3" stroke-dasharray="8 6"/><circle cx="250" cy="300" r="90" fill="none" stroke="#6F8F82" stroke-width="3" stroke-dasharray="8 6"/>
<path d="M238 286 v22 a12 12 0 0 0 24 0 v-22" fill="none" stroke="#B5482F" stroke-width="8"/>
<line x1="270" y1="290" x2="438" y2="312" stroke="#B5482F" stroke-width="3" stroke-dasharray="6 5"/>
<text x="250" y="425" font-size="20" font-weight="700" fill="#6F8F82" text-anchor="middle">Magnet, growing circles</text>
<text x="660" y="190" font-size="20" font-weight="700" fill="#243238">Screws in a line</text>
<text x="660" y="216" font-size="17" font-weight="500" fill="#5b6b70">= a stud behind the drywall</text>
<line x1="650" y1="196" x2="462" y2="230" stroke="#243238" stroke-width="3"/>
<text x="660" y="350" font-size="20" font-weight="700" fill="#B5482F">The magnet grips a screw</text>
<text x="660" y="376" font-size="17" font-weight="500" fill="#5b6b70">mark it, then check above and below</text>
