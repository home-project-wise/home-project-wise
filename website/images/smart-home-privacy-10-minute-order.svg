<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Timeline of the 10-minute order: list devices, fix passwords, turn on updates, switch off unused features, set up a guest network" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif"><rect width="960" height="540" fill="#F7F5F0"/><text x="480" y="52" font-size="32" font-weight="700" fill="#243238" text-anchor="middle">The 10-minute order</text><rect x="40" y="215" width="880" height="8" rx="4" fill="#D8D2C4"/><circle cx="123" cy="219" r="16" fill="#D97745"/><rect x="40" y="260" width="166" height="170" rx="14" fill="#fff" stroke="#D8D2C4" stroke-width="3"/><text x="123" y="100" font-size="20" font-weight="700" fill="#D97745" text-anchor="middle">Min 0-2</text><text x="123" y="150" font-size="20" font-weight="500" fill="#243238" text-anchor="middle">Step 1</text><text x="123" y="320" font-size="26" font-weight="700" fill="#243238" text-anchor="middle">List</text><text x="123" y="365" font-size="17" font-weight="500" fill="#243238" text-anchor="middle">Write it all down</text><circle cx="299" cy="219" r="16" fill="#6F8F82"/><rect x="216" y="260" width="166" height="170" rx="14" fill="#fff" stroke="#D8D2C4" stroke-width="3"/><text x="299" y="100" font-size="20" font-weight="700" fill="#6F8F82" text-anchor="middle">Min 2-4</text><text x="299" y="150" font-size="20" font-weight="500" fill="#243238" text-anchor="middle">Step 2</text><text x="299" y="320" font-size="26" font-weight="700" fill="#243238" text-anchor="middle">Passwords</text><text x="299" y="365" font-size="17" font-weight="500" fill="#243238" text-anchor="middle">Unique + 2-step</text><circle cx="475" cy="219" r="16" fill="#D97745"/><rect x="392" y="260" width="166" height="170" rx="14" fill="#fff" stroke="#D8D2C4" stroke-width="3"/><text x="475" y="100" font-size="20" font-weight="700" fill="#D97745" text-anchor="middle">Min 4-6</text><text x="475" y="150" font-size="20" font-weight="500" fill="#243238" text-anchor="middle">Step 3</text><text x="475" y="320" font-size="26" font-weight="700" fill="#243238" text-anchor="middle">Updates</text><text x="475" y="365" font-size="17" font-weight="500" fill="#243238" text-anchor="middle">Turn on auto</text><circle cx="651" cy="219" r="16" fill="#6F8F82"/><rect x="568" y="260" width="166" height="170" rx="14" fill="#fff" stroke="#D8D2C4" stroke-width="3"/><text x="651" y="100" font-size="20" font-weight="700" fill="#6F8F82" text-anchor="middle">Min 6-8</text><text x="651" y="150" font-size="20" font-weight="500" fill="#243238" text-anchor="middle">Step 4</text><text x="651" y="320" font-size="26" font-weight="700" fill="#243238" text-anchor="middle">Switch off</text><text x="651" y="365" font-size="17" font-weight="500" fill="#243238" text-anchor="middle">Remote and data</text><circle cx="827" cy="219" r="16" fill="#D97745"/><rect x="744" y="260" width="166" height="170" rx="14" fill="#fff" stroke="#D8D2C4" stroke-width="3"/><text x="827" y="100" font-size="20" font-weight="700" fill="#D97745" text-anchor="middle">Min 8-10</text><text x="827" y="150" font-size="20" font-weight="500" fill="#243238" text-anchor="middle">Step 5</text><text x="827" y="320" font-size="26" font-weight="700" fill="#243238" text-anchor="middle">Network</text><text x="827" y="365" font-size="17" font-weight="500" fill="#243238" text-anchor="middle">Guest Wi-Fi</text><rect x="40" y="455" width="880" height="55" rx="14" fill="#243238"/><text x="480" y="490" font-size="20" font-weight="600" fill="#fff" text-anchor="middle">Start with the camera, doorbell or speaker if you are short on time.</text></svg>