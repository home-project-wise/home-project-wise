<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Paper tray with three labeled slots for action papers: act this week, waiting and to file"><rect width="960" height="540" fill="#F7F5F0"/><text x="480" y="55" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#243238" text-anchor="middle">One tray, three slots</text><rect x="50" y="110" width="260" height="300" rx="14" fill="#fff" stroke="#243238" stroke-width="2"/><rect x="50" y="110" width="260" height="60" rx="14" fill="#D97745"/><text x="180" y="148" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">ACT THIS WEEK</text><text x="180" y="230" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="400" fill="#243238" text-anchor="middle">Bills due, forms,</text><text x="180" y="262" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="400" fill="#243238" text-anchor="middle">invitations to answer</text><rect x="350" y="110" width="260" height="300" rx="14" fill="#fff" stroke="#243238" stroke-width="2"/><rect x="350" y="110" width="260" height="60" rx="14" fill="#243238"/><text x="480" y="148" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">WAITING</text><text x="480" y="230" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="400" fill="#243238" text-anchor="middle">Waiting for a reply,</text><text x="480" y="262" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="400" fill="#243238" text-anchor="middle">refund or delivery</text><rect x="650" y="110" width="260" height="300" rx="14" fill="#fff" stroke="#243238" stroke-width="2"/><rect x="650" y="110" width="260" height="60" rx="14" fill="#243238"/><text x="780" y="148" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">TO FILE</text><text x="780" y="230" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="400" fill="#243238" text-anchor="middle">Keep papers, filed</text><text x="780" y="262" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="400" fill="#243238" text-anchor="middle">after the action is</text><text x="780" y="294" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="400" fill="#243238" text-anchor="middle">done</text><text x="480" y="470" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#243238" text-anchor="middle">When a slot is full, process it. Do not buy a bigger tray.</text></svg>