<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Side view of a washing machine with a leak sensor lying flat on the floor beside the supply hose where water collects, and a second sensor wrongly placed on a shelf" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif"><rect width="960" height="540" fill="#F7F5F0"/><text x="480" y="50" font-size="32" font-weight="700" fill="#243238" text-anchor="middle">Lay the sensor flat where water collects</text><rect x="40" y="420" width="880" height="14" fill="#243238"/><rect x="90" y="190" width="300" height="230" rx="12" fill="#fff" stroke="#D8D2C4" stroke-width="3"/><text x="240" y="310" font-size="24" font-weight="700" fill="#243238" text-anchor="middle">Washing machine</text><rect x="390" y="230" width="30" height="190" fill="#D8D2C4"/><text x="405" y="218" font-size="18" font-weight="600" fill="#243238" text-anchor="middle">Supply hose</text><ellipse cx="470" cy="418" rx="90" ry="8" fill="#9FC3D8"/><rect x="430" y="400" width="80" height="16" rx="6" fill="#6F8F82"/><circle cx="470" cy="360" r="24" fill="#6F8F82"/><text x="470" y="367.0" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">OK</text><text x="470" y="468" font-size="20" font-weight="700" fill="#6F8F82" text-anchor="middle">Sensor flat on the floor</text><text x="470" y="494" font-size="18" font-weight="500" fill="#243238" text-anchor="middle">water reaches it first</text><rect x="640" y="250" width="240" height="14" rx="4" fill="#D8D2C4"/><rect x="700" y="232" width="80" height="18" rx="6" fill="#D97745"/><line x1="740" y1="264" x2="740" y2="418" stroke="#9FC3D8" stroke-width="4" stroke-dasharray="8 8"/><ellipse cx="740" cy="418" rx="60" ry="8" fill="#9FC3D8"/><circle cx="740" cy="190" r="22" fill="#D97745"/><text x="740" y="199.1" font-size="26" font-weight="700" fill="#fff" text-anchor="middle">X</text><text x="740" y="468" font-size="20" font-weight="700" fill="#D97745" text-anchor="middle">Sensor on a shelf</text><text x="740" y="494" font-size="18" font-weight="500" fill="#243238" text-anchor="middle">never feels the floor</text></svg>