<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Decision diagram: if you use a feature, keep it and protect it; if not, switch it off. Examples are remote access, location sharing, voice or video sharing and unused features" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif"><rect width="960" height="540" fill="#F7F5F0"/><text x="480" y="52" font-size="32" font-weight="700" fill="#243238" text-anchor="middle">Switch off or keep?</text><rect x="280" y="90" width="400" height="90" rx="14" fill="#fff" stroke="#243238" stroke-width="3"/><text x="480" y="128" font-size="24" font-weight="700" fill="#243238" text-anchor="middle">Do I actually use</text><text x="480" y="160" font-size="24" font-weight="700" fill="#243238" text-anchor="middle">this feature?</text><path d="M400 180 L220 250 M560 180 L740 250" stroke="#243238" stroke-width="4" fill="none"/><text x="290" y="225" font-size="22" font-weight="700" fill="#D97745" text-anchor="middle">No</text><text x="670" y="225" font-size="22" font-weight="700" fill="#6F8F82" text-anchor="middle">Yes</text><rect x="50" y="250" width="340" height="110" rx="14" fill="#FFF1E8" stroke="#D97745" stroke-width="3"/><text x="220" y="295" font-size="28" font-weight="700" fill="#D97745" text-anchor="middle">Switch it off</text><text x="220" y="330" font-size="19" font-weight="500" fill="#243238" text-anchor="middle">Less exposed, less shared</text><rect x="570" y="250" width="340" height="110" rx="14" fill="#EEF4F1" stroke="#6F8F82" stroke-width="3"/><text x="740" y="295" font-size="28" font-weight="700" fill="#6F8F82" text-anchor="middle">Keep it, and protect it</text><text x="740" y="330" font-size="19" font-weight="500" fill="#243238" text-anchor="middle">Strong password + 2-step login</text><rect x="40" y="400" width="200" height="60" rx="30" fill="#fff" stroke="#D8D2C4" stroke-width="3"/><text x="140" y="437" font-size="17" font-weight="600" fill="#243238" text-anchor="middle">Remote access</text><rect x="260" y="400" width="200" height="60" rx="30" fill="#fff" stroke="#D8D2C4" stroke-width="3"/><text x="360" y="437" font-size="17" font-weight="600" fill="#243238" text-anchor="middle">Location sharing</text><rect x="480" y="400" width="200" height="60" rx="30" fill="#fff" stroke="#D8D2C4" stroke-width="3"/><text x="580" y="437" font-size="17" font-weight="600" fill="#243238" text-anchor="middle">Voice or video sharing</text><rect x="700" y="400" width="200" height="60" rx="30" fill="#fff" stroke="#D8D2C4" stroke-width="3"/><text x="800" y="437" font-size="17" font-weight="600" fill="#243238" text-anchor="middle">Features never opened</text><text x="480" y="500" font-size="19" font-weight="500" fill="#243238" text-anchor="middle">Typical settings to test against the question above</text></svg>