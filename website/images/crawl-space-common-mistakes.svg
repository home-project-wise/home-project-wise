<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="t d"><title id="t">Common crawl-space moisture mistakes to avoid</title><desc id="d">Three warnings: do not ignore drainage, do not cover an active leak with plastic, and do not buy a dehumidifier before checking the water source.</desc><rect width="960" height="420" rx="24" fill="#f4f7f4"/><text x="48" y="55" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#243c32">Avoid these common mistakes</text><g font-family="Arial,sans-serif" fill="#243c32"><rect x="42" y="95" width="280" height="245" rx="18" fill="#fff" stroke="#d5b9a7" stroke-width="2"/><circle cx="182" cy="160" r="42" fill="#f8e6dc"/><path d="M150 160 H214 M182 128 V192" stroke="#a95e40" stroke-width="7"/><text x="65" y="235" font-size="20" font-weight="700">Ignoring drainage</text><text x="65" y="268" font-size="17">Water keeps returning</text><text x="65" y="292" font-size="17">if the source remains.</text><rect x="340" y="95" width="280" height="245" rx="18" fill="#fff" stroke="#d5b9a7" stroke-width="2"/><circle cx="480" cy="160" r="42" fill="#f8e6dc"/><path d="M448 160 Q480 130 512 160 Q480 190 448 160Z" fill="none" stroke="#a95e40" stroke-width="6"/><path d="M452 132 L508 188" stroke="#a95e40" stroke-width="7"/><text x="363" y="235" font-size="20" font-weight="700">Hiding active leaks</text><text x="363" y="268" font-size="17">Plastic does not repair</text><text x="363" y="292" font-size="17">plumbing or seepage.</text><rect x="638" y="95" width="280" height="245" rx="18" fill="#fff" stroke="#d5b9a7" stroke-width="2"/><circle cx="778" cy="160" r="42" fill="#f8e6dc"/><rect x="754" y="138" width="48" height="48" rx="6" fill="none" stroke="#a95e40" stroke-width="5"/><path d="M748 130 L808 190" stroke="#a95e40" stroke-width="7"/><text x="661" y="235" font-size="20" font-weight="700">Buying too early</text><text x="661" y="268" font-size="17">Measure and fix water</text><text x="661" y="292" font-size="17">sources first.</text></g></svg>