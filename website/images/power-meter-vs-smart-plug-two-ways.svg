<rect x="300" y="80" width="220" height="100" rx="12" fill="#E4ECE8" stroke="#243238" stroke-width="3"/>
<rect x="320" y="94" width="180" height="42" rx="6" fill="#fff" stroke="#243238" stroke-width="2"/>
<text x="410" y="123" font-size="19" font-weight="600" fill="#5b6b70" text-anchor="middle">W · kWh · cost</text>
<text x="410" y="164" font-size="19" font-weight="700" fill="#243238" text-anchor="middle">Plug-in power meter</text>
