<rect x="620" y="280" width="180" height="80" rx="10" fill="#fff" stroke="#243238" stroke-width="3"/>
<text x="710" y="328" font-size="20" font-weight="700" fill="#243238" text-anchor="middle">Appliance</text>
<line x1="410" y1="364" x2="410" y2="408" stroke="#6F8F82" stroke-width="4" stroke-dasharray="7 6"/>
<path d="M392 392 q18 -14 36 0" fill="none" stroke="#6F8F82" stroke-width="4" stroke-linecap="round"/>
