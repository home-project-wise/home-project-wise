<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Two ways to measure the same appliance: a plug-in power meter with its own screen, and a smart plug that reports to a phone app" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif">
<rect width="960" height="540" fill="#F7F5F0"/>
<text x="480" y="42" font-size="30" font-weight="700" fill="#243238" text-anchor="middle">Same spot, different place to read it</text>
<rect x="60" y="90" width="140" height="80" rx="10" fill="#fff" stroke="#243238" stroke-width="3"/>
