<rect x="620" y="90" width="180" height="80" rx="10" fill="#fff" stroke="#243238" stroke-width="3"/>
<text x="710" y="138" font-size="20" font-weight="700" fill="#243238" text-anchor="middle">Appliance</text>
<text x="410" y="214" font-size="19" font-weight="700" fill="#6F8F82" text-anchor="middle">Reads on its own screen</text>
<line x1="60" y1="250" x2="900" y2="250" stroke="#CBD8D2" stroke-width="2" stroke-dasharray="8 8"/>
<rect x="60" y="280" width="140" height="80" rx="10" fill="#fff" stroke="#243238" stroke-width="3"/>
