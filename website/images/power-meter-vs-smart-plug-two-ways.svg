<line x1="205" y1="320" x2="283" y2="320" stroke="#243238" stroke-width="5" stroke-linecap="round"/><polygon points="295,320 279,311 279,329" fill="#243238"/>
<rect x="300" y="280" width="220" height="80" rx="12" fill="#E4ECE8" stroke="#243238" stroke-width="3"/>
<circle cx="330" cy="300" r="6" fill="#6F8F82"/>
<text x="410" y="329" font-size="22" font-weight="700" fill="#243238" text-anchor="middle">Smart plug</text>
