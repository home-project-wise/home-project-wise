<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="t d"><title id="t">Monitoring crawl-space humidity over time</title><desc id="d">Illustrative humidity trend chart showing why repeated readings at the same location are more useful than a single reading.</desc><rect width="960" height="420" rx="24" fill="#f4f7f4"/><text x="48" y="55" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#243c32">Track a trend, not one number</text><g stroke="#d4ded7" stroke-width="2"><path d="M120 110 V330 H865"/><path d="M120 165 H865 M120 220 H865 M120 275 H865"/></g><g font-family="Arial,sans-serif" font-size="18" fill="#52665a"><text x="62" y="116">80%</text><text x="62" y="171">70%</text><text x="62" y="226">60%</text><text x="62" y="281">50%</text><text x="120" y="365">Day 1</text><text x="350" y="365">Day 3</text><text x="590" y="365">Day 5</text><text x="805" y="365">Day 7</text></g><path d="M130 145 L245 180 L360 190 L475 225 L590 235 L705 265 L825 270" fill="none" stroke="#3d8293" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><g fill="#3d8293"><circle cx="130" cy="145" r="8"/><circle cx="245" cy="180" r="8"/><circle cx="360" cy="190" r="8"/><circle cx="475" cy="225" r="8"/><circle cx="590" cy="235" r="8"/><circle cx="705" cy="265" r="8"/><circle cx="825" cy="270" r="8"/></g><text x="145" y="400" font-family="Arial,sans-serif" font-size="17" fill="#52665a">Illustrative only — your readings may rise or fall with weather.</text></svg>