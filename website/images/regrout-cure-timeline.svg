<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d"><title id="t">Grout cure timeline</title><desc id="d">Cure timeline for one fast-setting grout: foot traffic after 3 to 4 hours, regular cleaning after 24 hours, three days of protection without immersion, and longer in cold or humid rooms.</desc><rect width="960" height="540" rx="16" fill="#f7f4ee"/><text x="40" y="50" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="26" font-weight="bold" fill="#20312f" text-anchor="start">Let the grout cure: one fast-setting product</text><line x1="80" y1="210" x2="880" y2="210" stroke="#20312f" stroke-width="4"/><circle cx="120" cy="210" r="14" fill="#1f6f6b"/><text x="120" y="170" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="20" font-weight="bold" fill="#1f6f6b" text-anchor="middle">3–4 hours</text><text x="120" y="250" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#20312f" text-anchor="middle">Foot traffic OK</text><text x="120" y="278" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="normal" fill="#4b5b58" text-anchor="middle">Floors. Keep off for at le</text><text x="120" y="296" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="normal" fill="#4b5b58" text-anchor="middle">ast 3 hours.</text><circle cx="360" cy="210" r="14" fill="#1f6f6b"/><text x="360" y="170" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="20" font-weight="bold" fill="#1f6f6b" text-anchor="middle">24 hours</text><text x="360" y="250" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#20312f" text-anchor="middle">Regular cleaning</text><text x="360" y="278" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="normal" fill="#4b5b58" text-anchor="middle">Grout must be cured at lea</text><text x="360" y="296" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="normal" fill="#4b5b58" text-anchor="middle">st 24 hours.</text><circle cx="600" cy="210" r="14" fill="#1f6f6b"/><text x="600" y="170" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="20" font-weight="bold" fill="#1f6f6b" text-anchor="middle">3 days</text><text x="600" y="250" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#20312f" text-anchor="middle">Keep it dry</text><text x="600" y="278" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="normal" fill="#4b5b58" text-anchor="middle">Protect from rain and free</text><text x="600" y="296" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="normal" fill="#4b5b58" text-anchor="middle">zing. Do not immerse.</text><circle cx="840" cy="210" r="14" fill="#1f6f6b"/><text x="840" y="170" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="20" font-weight="bold" fill="#1f6f6b" text-anchor="middle">Longer</text><text x="840" y="250" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#20312f" text-anchor="middle">Cold or humid rooms</text><text x="840" y="278" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="normal" fill="#4b5b58" text-anchor="middle">Below 60°F or above 70% hu</text><text x="840" y="296" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="normal" fill="#4b5b58" text-anchor="middle">midity.</text><text x="480" y="392" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" font-weight="bold" fill="#c0392b" text-anchor="middle">Other grouts differ: one guide says 48 hours before sealing and 72 hours before routine cleaning.</text><text x="480" y="424" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" font-weight="normal" fill="#20312f" text-anchor="middle">No showering time is stated for this product. Read your label or ask the maker.</text><text x="480" y="512" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="normal" fill="#4b5b58" text-anchor="middle">Sources: Mapei Ultracolor Plus FA data sheet (full); Mapei grout troubleshooting guide (search excerpt).</text></svg>