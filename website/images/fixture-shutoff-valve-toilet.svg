<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Diagram of a toilet with the small supply valve on the thin pipe at the bottom left of the cistern" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif"><rect width="960" height="540" fill="#F7F5F0"/><text x="480" y="42" font-size="30" font-weight="700" fill="#243238" text-anchor="middle">The toilet valve</text>
<rect x="60" y="100" width="130" height="400" fill="#EDE8DC" stroke="#243238" stroke-width="3"/><text x="125" y="310" font-size="20" font-weight="700" fill="#243238" text-anchor="middle" transform="rotate(-90 125 310)">Wall</text>
<rect x="380" y="110" width="320" height="120" rx="14" fill="#fff" stroke="#243238" stroke-width="4"/><text x="540" y="180" font-size="26" font-weight="700" fill="#243238" text-anchor="middle">Cistern</text>
<path d="M410 250 Q400 400 540 410 Q690 400 680 250 Z" fill="#fff" stroke="#243238" stroke-width="4"/><text x="545" y="350" font-size="26" font-weight="700" fill="#243238" text-anchor="middle">Bowl</text>
