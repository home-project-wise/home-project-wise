<text x="328" y="470" font-size="21" font-weight="700" fill="#B5482F" text-anchor="middle">Supply valve</text>
<text x="328" y="496" font-size="17" font-weight="500" fill="#5b6b70" text-anchor="middle">on the thin pipe, low on the left</text>
<text x="780" y="170" font-size="19" font-weight="700" fill="#6F8F82">Close it, flush once:</text><text x="780" y="196" font-size="19" font-weight="700" fill="#6F8F82">no refill = it worked</text>
