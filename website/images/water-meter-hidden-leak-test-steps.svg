<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Timeline of the meter test: all water off, wait for tanks to fill, note the reading, wait, then read the meter again" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif">
<rect width="960" height="540" fill="#F7F5F0"/>
<text x="480" y="42" font-size="30" font-weight="700" fill="#243238" text-anchor="middle">The meter test in five steps</text>
<rect x="40" y="200" width="150" height="150" rx="14" fill="#fff" stroke="#243238" stroke-width="3"/><circle cx="115" cy="240" r="22" fill="#6F8F82"/><text x="115" y="249" font-size="24" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="115" y="298" font-size="18" font-weight="700" fill="#243238" text-anchor="middle">All water</text><text x="115" y="322" font-size="18" font-weight="700" fill="#243238" text-anchor="middle">off</text><line x1="194" y1="275" x2="212" y2="275" stroke="#243238" stroke-width="5" stroke-linecap="round"/><polygon points="224,275 208,266 208,284" fill="#243238"/><rect x="224" y="200" width="150" height="150" rx="14" fill="#fff" stroke="#243238" stroke-width="3"/><circle cx="299" cy="240" r="22" fill="#6F8F82"/><text x="299" y="249" font-size="24" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="299" y="298" font-size="18" font-weight="700" fill="#243238" text-anchor="middle">Wait for tanks</text><text x="299" y="322" font-size="18" font-weight="700" fill="#243238" text-anchor="middle">to refill</text><line x1="378" y1="275" x2="396" y2="275" stroke="#243238" stroke-width="5" stroke-linecap="round"/><polygon points="408,275 392,266 392,284" fill="#243238"/><rect x="408" y="200" width="150" height="150" rx="14" fill="#fff" stroke="#243238" stroke-width="3"/><circle cx="483" cy="240" r="22" fill="#6F8F82"/><text x="483" y="249" font-size="24" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="483" y="298" font-size="18" font-weight="700" fill="#243238" text-anchor="middle">Note the</text><text x="483" y="322" font-size="18" font-weight="700" fill="#243238" text-anchor="middle">reading</text><line x1="562" y1="275" x2="580" y2="275" stroke="#243238" stroke-width="5" stroke-linecap="round"/><polygon points="592,275 576,266 576,284" fill="#243238"/><rect x="592" y="200" width="150" height="150" rx="14" fill="#fff" stroke="#243238" stroke-width="3"/><circle cx="667" cy="240" r="22" fill="#6F8F82"/><text x="667" y="249" font-size="24" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="667" y="298" font-size="18" font-weight="700" fill="#243238" text-anchor="middle">Wait: minutes</text><text x="667" y="322" font-size="18" font-weight="700" fill="#243238" text-anchor="middle">to hours</text><line x1="746" y1="275" x2="764" y2="275" stroke="#243238" stroke-width="5" stroke-linecap="round"/><polygon points="776,275 760,266 760,284" fill="#243238"/><rect x="776" y="200" width="150" height="150" rx="14" fill="#fff" stroke="#243238" stroke-width="3"/><circle cx="851" cy="240" r="22" fill="#6F8F82"/><text x="851" y="249" font-size="24" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="851" y="298" font-size="18" font-weight="700" fill="#243238" text-anchor="middle">Read the</text><text x="851" y="322" font-size="18" font-weight="700" fill="#243238" text-anchor="middle">meter again</text>
<text x="480" y="440" font-size="20" font-weight="700" fill="#B5482F" text-anchor="middle">Reading changed with no water used? You have a leak.</text>
<text x="480" y="472" font-size="17" font-weight="500" fill="#5b6b70" text-anchor="middle">Wait times differ by utility: about 10 minutes to 6 hours</text>
</svg>
