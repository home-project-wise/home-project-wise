<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d"><title id="t">Outage test sheet</title><desc id="d">A printable table with five devices and four columns: wall switch, app, voice and routine. Mark OK or X in each box.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#243238"/></marker></defs><rect width="960" height="540" fill="#F7F5F0"/><text x="40" y="56" font-size="32" fill="#243238" font-weight="bold" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Outage test sheet</text><text x="40" y="84" font-size="18" fill="#4A5B61" font-weight="normal" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Print it or copy it by hand. Test one device at a time.</text><rect x="40" y="104" width="880" height="48" rx="10" fill="#243238"/><text x="56" y="136" font-size="19" fill="#FFFFFF" font-weight="bold" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Device</text><text x="395" y="136" font-size="19" fill="#FFFFFF" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Wall switch</text><text x="535" y="136" font-size="19" fill="#FFFFFF" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">App *</text><text x="665" y="136" font-size="19" fill="#FFFFFF" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Voice</text><text x="825" y="136" font-size="19" fill="#FFFFFF" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Routine</text><rect x="40" y="152" width="880" height="58" fill="#FFFFFF"/><text x="56" y="188" font-size="19" fill="#243238" font-weight="normal" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Hallway or stairs light</text><rect x="380" y="166" width="30" height="30" rx="6" fill="#FFFFFF" stroke="#4A5B61" stroke-width="2"/><rect x="520" y="166" width="30" height="30" rx="6" fill="#FFFFFF" stroke="#4A5B61" stroke-width="2"/><rect x="650" y="166" width="30" height="30" rx="6" fill="#FFFFFF" stroke="#4A5B61" stroke-width="2"/><rect x="810" y="166" width="30" height="30" rx="6" fill="#FFFFFF" stroke="#4A5B61" stroke-width="2"/><rect x="40" y="210" width="880" height="58" fill="#EFEBE3"/><text x="56" y="246" font-size="19" fill="#243238" font-weight="normal" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Bathroom light</text><rect x="380" y="224" width="30" height="30" rx="6" fill="#FFFFFF" stroke="#4A5B61" stroke-width="2"/><rect x="520" y="224" width="30" height="30" rx="6" fill="#FFFFFF" stroke="#4A5B61" stroke-width="2"/><rect x="650" y="224" width="30" height="30" rx="6" fill="#FFFFFF" stroke="#4A5B61" stroke-width="2"/><rect x="810" y="224" width="30" height="30" rx="6" fill="#FFFFFF" stroke="#4A5B61" stroke-width="2"/><rect x="40" y="268" width="880" height="58" fill="#FFFFFF"/><text x="56" y="304" font-size="19" fill="#243238" font-weight="normal" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Bedside lamp</text><rect x="380" y="282" width="30" height="30" rx="6" fill="#FFFFFF" stroke="#4A5B61" stroke-width="2"/><rect x="520" y="282" width="30" height="30" rx="6" fill="#FFFFFF" stroke="#4A5B61" stroke-width="2"/><rect x="650" y="282" width="30" height="30" rx="6" fill="#FFFFFF" stroke="#4A5B61" stroke-width="2"/><rect x="810" y="282" width="30" height="30" rx="6" fill="#FFFFFF" stroke="#4A5B61" stroke-width="2"/><rect x="40" y="326" width="880" height="58" fill="#EFEBE3"/><text x="56" y="362" font-size="19" fill="#243238" font-weight="normal" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Front-door light</text><rect x="380" y="340" width="30" height="30" rx="6" fill="#FFFFFF" stroke="#4A5B61" stroke-width="2"/><rect x="520" y="340" width="30" height="30" rx="6" fill="#FFFFFF" stroke="#4A5B61" stroke-width="2"/><rect x="650" y="340" width="30" height="30" rx="6" fill="#FFFFFF" stroke="#4A5B61" stroke-width="2"/><rect x="810" y="340" width="30" height="30" rx="6" fill="#FFFFFF" stroke="#4A5B61" stroke-width="2"/><rect x="40" y="384" width="880" height="58" fill="#FFFFFF"/><text x="56" y="420" font-size="19" fill="#243238" font-weight="normal" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Smart plug (lamp or fan)</text><rect x="380" y="398" width="30" height="30" rx="6" fill="#FFFFFF" stroke="#4A5B61" stroke-width="2"/><rect x="520" y="398" width="30" height="30" rx="6" fill="#FFFFFF" stroke="#4A5B61" stroke-width="2"/><rect x="650" y="398" width="30" height="30" rx="6" fill="#FFFFFF" stroke="#4A5B61" stroke-width="2"/><rect x="810" y="398" width="30" height="30" rx="6" fill="#FFFFFF" stroke="#4A5B61" stroke-width="2"/><rect x="40" y="152" width="880" height="290" fill="none" stroke="#243238" stroke-width="2" rx="4"/><text x="40" y="478" font-size="18" fill="#4A5B61" font-weight="normal" text-anchor="start" font-family="Arial, Helvetica, sans-serif">* Test the app with mobile data OFF. Write OK or X in each box.</text><text x="40" y="508" font-size="18" fill="#4A5B61" font-weight="normal" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Wall switch: turn it off, wait three seconds, turn it on.</text></svg>