<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d"><title id="t">Three jobs in a Matter and Thread setup</title><desc id="d">A Wi-Fi router carries your internet and Wi-Fi traffic. A Thread border router links Thread devices to your home network. A Matter controller runs automations and remote access. One box can do several of these jobs.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#243238"/></marker></defs><rect width="960" height="540" fill="#F7F5F0"/><rect x="40" y="100" width="280" height="260" rx="10" fill="#BFD0C8" stroke="#243238" stroke-width="2"/><text x="180" y="160" font-size="30" fill="#243238" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Wi-Fi</text><text x="180" y="196" font-size="30" fill="#243238" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">router</text><text x="180" y="262" font-size="23" fill="#243238" font-weight="normal" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Carries your internet</text><text x="180" y="294" font-size="23" fill="#243238" font-weight="normal" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">and Wi-Fi devices</text><rect x="340" y="100" width="280" height="260" rx="10" fill="#E8935F" stroke="#243238" stroke-width="2"/><text x="480" y="160" font-size="30" fill="#243238" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Thread</text><text x="480" y="196" font-size="30" fill="#243238" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">border router</text><text x="480" y="262" font-size="23" fill="#243238" font-weight="normal" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Links Thread devices</text><text x="480" y="294" font-size="23" fill="#243238" font-weight="normal" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">to your home network</text><rect x="640" y="100" width="280" height="260" rx="10" fill="#8AA89B" stroke="#243238" stroke-width="2"/><text x="780" y="160" font-size="30" fill="#243238" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Matter</text><text x="780" y="196" font-size="30" fill="#243238" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">controller</text><text x="780" y="262" font-size="23" fill="#243238" font-weight="normal" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Runs automations and</text><text x="780" y="294" font-size="23" fill="#243238" font-weight="normal" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">remote access</text><text x="480" y="58" font-size="32" fill="#243238" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Three jobs, not always three boxes</text><rect x="40" y="396" width="880" height="110" rx="10" fill="#F7F5F0" stroke="#243238" stroke-width="2" stroke-dasharray="8 6"/><text x="480" y="446" font-size="30" fill="#243238" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">One box can do several jobs</text><text x="480" y="484" font-size="23" fill="#243238" font-weight="normal" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Check the exact model, not just the brand.</text></svg>