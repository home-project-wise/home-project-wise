<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Flowchart: weigh the frame, check for a stud, otherwise compare the frame weight with one quarter of the anchor's pull-out and shear figures" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif"><rect width="960" height="540" fill="#F7F5F0"/><text x="480" y="40" font-size="28" font-weight="700" fill="#243238" text-anchor="middle">Choosing a fixing for your frame</text><rect x="220" y="60" width="520" height="56" rx="12" fill="#fff" stroke="#243238" stroke-width="2.5"/><text x="480.0" y="95.0" font-size="20" font-weight="600" fill="#243238" text-anchor="middle">1. Weigh the frame (glass and backing too)</text><line x1="480" y1="116" x2="480" y2="132" stroke="#243238" stroke-width="8" stroke-linecap="round"/><polygon points="480,150 466,126 494,126" fill="#243238"/><rect x="220" y="154" width="520" height="56" rx="12" fill="#ECE8DD" stroke="#243238" stroke-width="2.5"/><text x="480.0" y="189.0" font-size="20" font-weight="600" fill="#243238" text-anchor="middle">2. Can a hanging point land on a stud?</text><line x1="380" y1="210" x2="230" y2="262" stroke="#243238" stroke-width="3"/><line x1="580" y1="210" x2="730" y2="262" stroke="#243238" stroke-width="3"/><text x="270" y="244" font-size="18" font-weight="700" fill="#6F8F82" text-anchor="middle">Yes</text><text x="700" y="244" font-size="18" font-weight="700" fill="#B5482F" text-anchor="middle">No</text><rect x="60" y="266" width="340" height="86" rx="12" fill="#E8F0EC" stroke="#6F8F82" stroke-width="2.5"/><text x="230.0" y="290.0" font-size="20" font-weight="600" fill="#243238" text-anchor="middle">Use a proper screw</text><text x="230.0" y="316.0" font-size="20" font-weight="600" fill="#243238" text-anchor="middle">into the stud, then</text><text x="230.0" y="342.0" font-size="20" font-weight="600" fill="#243238" text-anchor="middle">stop here</text><rect x="560" y="266" width="340" height="86" rx="12" fill="#fff" stroke="#243238" stroke-width="2.5"/><text x="730.0" y="290.0" font-size="20" font-weight="600" fill="#243238" text-anchor="middle">Find your drywall thickness</text><text x="730.0" y="316.0" font-size="20" font-weight="600" fill="#243238" text-anchor="middle">and the anchor's</text><text x="730.0" y="342.0" font-size="20" font-weight="600" fill="#243238" text-anchor="middle">pull-out and shear figures</text><line x1="730" y1="352" x2="730" y2="374" stroke="#243238" stroke-width="8" stroke-linecap="round"/><polygon points="730,392 716,368 744,368" fill="#243238"/><rect x="520" y="396" width="420" height="64" rx="12" fill="#ECE8DD" stroke="#243238" stroke-width="2.5"/><text x="730.0" y="422.0" font-size="20" font-weight="600" fill="18" text-anchor="middle">Frame weight well below one quarter</text><text x="730.0" y="448.0" font-size="20" font-weight="600" fill="18" text-anchor="middle">of the smaller figure?</text><text x="730" y="490" font-size="17" font-weight="600" fill="#243238" text-anchor="middle">Yes: go ahead.  No or unsure: stronger anchor, studs, or a pro.</text></svg>