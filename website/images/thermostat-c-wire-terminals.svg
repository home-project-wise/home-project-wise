<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Thermostat wiring terminals: R brings 24-volt power, W calls for heat, Y calls for cooling, G runs the fan, and the C-wire gives the thermostat constant power" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif"><rect width="960" height="540" fill="#F7F5F0"/><text x="480" y="56" font-size="32" font-weight="700" fill="#243238" text-anchor="middle">What each thermostat wire does</text><rect x="40" y="110" width="168" height="270" rx="14" fill="#fff" stroke="#D8D2C4" stroke-width="3"/><circle cx="124" cy="170" r="36" fill="#6F8F82"/><text x="124" y="184" font-size="40" font-weight="700" fill="#fff" text-anchor="middle">R</text><text x="124" y="250" font-size="24" font-weight="700" fill="#243238" text-anchor="middle">Power</text><text x="124" y="284" font-size="18" font-weight="500" fill="#243238" text-anchor="middle">24-volt supply</text><rect x="118" y="318" width="12" height="46" rx="4" fill="#6F8F82"/><rect x="218" y="110" width="168" height="270" rx="14" fill="#fff" stroke="#D8D2C4" stroke-width="3"/><circle cx="302" cy="170" r="36" fill="#6F8F82"/><text x="302" y="184" font-size="40" font-weight="700" fill="#fff" text-anchor="middle">W</text><text x="302" y="250" font-size="24" font-weight="700" fill="#243238" text-anchor="middle">Heat</text><text x="302" y="284" font-size="18" font-weight="500" fill="#243238" text-anchor="middle">calls for heat</text><rect x="296" y="318" width="12" height="46" rx="4" fill="#6F8F82"/><rect x="396" y="110" width="168" height="270" rx="14" fill="#fff" stroke="#D8D2C4" stroke-width="3"/><circle cx="480" cy="170" r="36" fill="#6F8F82"/><text x="480" y="184" font-size="40" font-weight="700" fill="#fff" text-anchor="middle">Y</text><text x="480" y="250" font-size="24" font-weight="700" fill="#243238" text-anchor="middle">Cooling</text><text x="480" y="284" font-size="18" font-weight="500" fill="#243238" text-anchor="middle">calls for cooling</text><rect x="474" y="318" width="12" height="46" rx="4" fill="#6F8F82"/><rect x="574" y="110" width="168" height="270" rx="14" fill="#fff" stroke="#D8D2C4" stroke-width="3"/><circle cx="658" cy="170" r="36" fill="#6F8F82"/><text x="658" y="184" font-size="40" font-weight="700" fill="#fff" text-anchor="middle">G</text><text x="658" y="250" font-size="24" font-weight="700" fill="#243238" text-anchor="middle">Fan</text><text x="658" y="284" font-size="18" font-weight="500" fill="#243238" text-anchor="middle">runs the fan</text><rect x="652" y="318" width="12" height="46" rx="4" fill="#6F8F82"/><rect x="752" y="110" width="168" height="270" rx="14" fill="#fff" stroke="#D97745" stroke-width="5"/><circle cx="836" cy="170" r="36" fill="#D97745"/><text x="836" y="184" font-size="40" font-weight="700" fill="#fff" text-anchor="middle">C</text><text x="836" y="250" font-size="24" font-weight="700" fill="#243238" text-anchor="middle">Common</text><text x="836" y="284" font-size="18" font-weight="500" fill="#243238" text-anchor="middle">constant power</text><rect x="830" y="318" width="12" height="46" rx="4" fill="#D97745"/><rect x="40" y="410" width="880" height="100" rx="14" fill="#243238"/><text x="480" y="452" font-size="23" font-weight="600" fill="#fff" text-anchor="middle">Only the C-wire is there just to keep the thermostat powered.</text><text x="480" y="486" font-size="19" font-weight="500" fill="#E4ECE8" text-anchor="middle">Terminal letters can differ on heat pumps. Go by letters, not colours.</text></svg>