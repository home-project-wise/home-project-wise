<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d"><title id="t">Decision path before you buy a Thread border router</title><desc id="d">Start by asking whether the accessory uses Thread. If not, no Thread border router is needed. If yes, check whether a hub you own lists Thread support for its exact model. If it does, use it. If not, add one your platform supports.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#243238"/></marker></defs><rect width="960" height="540" fill="#F7F5F0"/><text x="480" y="48" font-size="30" fill="#243238" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Decide before you buy</text><rect x="230" y="70" width="500" height="76" rx="10" fill="#F7F5F0" stroke="#243238" stroke-width="2"/><text x="480" y="118" font-size="26" fill="#243238" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Does the accessory use Thread?</text><line x1="400" y1="146" x2="230" y2="216" stroke="#243238" stroke-width="3" marker-end="url(#ar)"/><text x="285" y="170" font-size="24" fill="#243238" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">No</text><line x1="560" y1="146" x2="730" y2="216" stroke="#243238" stroke-width="3" marker-end="url(#ar)"/><text x="690" y="170" font-size="24" fill="#243238" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Yes</text><rect x="40" y="220" width="380" height="120" rx="10" fill="#BFD0C8" stroke="#243238" stroke-width="2"/><text x="230" y="268" font-size="26" fill="#243238" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Wi-Fi or Ethernet Matter</text><text x="230" y="304" font-size="23" fill="#243238" font-weight="normal" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">No Thread border router</text><text x="230" y="330" font-size="23" fill="#243238" font-weight="normal" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">needed</text><rect x="540" y="220" width="380" height="120" rx="10" fill="#F7F5F0" stroke="#243238" stroke-width="2"/><text x="730" y="258" font-size="24" fill="#243238" font-weight="normal" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Do you own a hub or speaker</text><text x="730" y="288" font-size="24" fill="#243238" font-weight="normal" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">that lists Thread support</text><text x="730" y="318" font-size="24" fill="#243238" font-weight="normal" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">for its exact model?</text><line x1="660" y1="340" x2="500" y2="400" stroke="#243238" stroke-width="3" marker-end="url(#ar)"/><text x="545" y="366" font-size="24" fill="#243238" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Yes</text><line x1="800" y1="340" x2="795" y2="400" stroke="#243238" stroke-width="3" marker-end="url(#ar)"/><text x="822" y="372" font-size="24" fill="#243238" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">No</text><rect x="330" y="404" width="290" height="106" rx="10" fill="#6F8F82" stroke="#243238" stroke-width="2"/><text x="475" y="444" font-size="26" fill="#243238" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Use it</text><text x="475" y="474" font-size="22" fill="#243238" font-weight="normal" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Update it and keep</text><text x="475" y="498" font-size="22" fill="#243238" font-weight="normal" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">it plugged in</text><rect x="650" y="404" width="290" height="106" rx="10" fill="#D97745" stroke="#243238" stroke-width="2"/><text x="795" y="444" font-size="26" fill="#243238" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Add one</text><text x="795" y="474" font-size="22" fill="#243238" font-weight="normal" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">that your platform</text><text x="795" y="498" font-size="22" fill="#243238" font-weight="normal" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">lists as supported</text></svg>