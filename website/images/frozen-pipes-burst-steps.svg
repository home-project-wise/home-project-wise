<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Five-step sequence for a burst pipe: shut off the water, make the area electrically safe, contain the water, call a plumber, photograph the damage" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif"><rect width="960" height="540" fill="#F7F5F0"/><text x="480" y="38" font-size="28" font-weight="700" fill="#243238" text-anchor="middle">A burst pipe: first five steps</text><rect x="120" y="66" width="720" height="66" rx="12" fill="#fff" stroke="#243238" stroke-width="2.5"/><circle cx="162" cy="99" r="20" fill="#6F8F82"/><text x="162" y="106" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="200" y="95" font-size="22" font-weight="700" fill="#243238" text-anchor="start">Shut off the water</text><text x="200" y="119" font-size="16" font-weight="500" fill="#5b6b70" text-anchor="start">Main shut-off valve (US) or stop tap (UK)</text><line x1="480" y1="132" x2="480" y2="144" stroke="#243238" stroke-width="5" stroke-linecap="round"/><polygon points="480,156 470,140 490,140" fill="#243238"/><rect x="120" y="156" width="720" height="66" rx="12" fill="#fff" stroke="#243238" stroke-width="2.5"/><circle cx="162" cy="189" r="20" fill="#6F8F82"/><text x="162" y="196" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="200" y="185" font-size="22" font-weight="700" fill="#243238" text-anchor="start">Check the electrics</text><text x="200" y="209" font-size="16" font-weight="500" fill="#5b6b70" text-anchor="start">Switch off at the panel only if you can reach it dry. Otherwise stay out and call.</text><line x1="480" y1="222" x2="480" y2="234" stroke="#243238" stroke-width="5" stroke-linecap="round"/><polygon points="480,246 470,230 490,230" fill="#243238"/><rect x="120" y="246" width="720" height="66" rx="12" fill="#fff" stroke="#243238" stroke-width="2.5"/><circle cx="162" cy="279" r="20" fill="#6F8F82"/><text x="162" y="286" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="200" y="275" font-size="22" font-weight="700" fill="#243238" text-anchor="start">Contain the water</text><text x="200" y="299" font-size="16" font-weight="500" fill="#5b6b70" text-anchor="start">Towels and buckets, only if the room is safe to enter</text><line x1="480" y1="312" x2="480" y2="324" stroke="#243238" stroke-width="5" stroke-linecap="round"/><polygon points="480,336 470,320 490,320" fill="#243238"/><rect x="120" y="336" width="720" height="66" rx="12" fill="#fff" stroke="#243238" stroke-width="2.5"/><circle cx="162" cy="369" r="20" fill="#6F8F82"/><text x="162" y="376" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="200" y="365" font-size="22" font-weight="700" fill="#243238" text-anchor="start">Call a plumber</text><text x="200" y="389" font-size="16" font-weight="500" fill="#5b6b70" text-anchor="start">Licensed (US) or WaterSafe-approved (UK)</text><line x1="480" y1="402" x2="480" y2="414" stroke="#243238" stroke-width="5" stroke-linecap="round"/><polygon points="480,426 470,410 490,410" fill="#243238"/><rect x="120" y="426" width="720" height="66" rx="12" fill="#fff" stroke="#243238" stroke-width="2.5"/><circle cx="162" cy="459" r="20" fill="#6F8F82"/><text x="162" y="466" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="200" y="455" font-size="22" font-weight="700" fill="#243238" text-anchor="start">Document it</text><text x="200" y="479" font-size="16" font-weight="500" fill="#5b6b70" text-anchor="start">Photograph the damage, then check your policy</text></svg>