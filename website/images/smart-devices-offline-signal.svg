<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d"><title id="t">Read the signal where the device sits</title><desc id="d">A scale of Wi-Fi signal strength. Below minus 70 dBm is poor and the device may disconnect. Minus 70 to minus 50 dBm is good to average. Above minus 50 dBm is strong.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#243238"/></marker></defs><rect width="960" height="540" fill="#F7F5F0"/><text x="480" y="62" font-size="32" fill="#243238" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Read the signal where the device sits</text><rect x="60" y="190" width="280" height="90" fill="#D97745" stroke="#243238" stroke-width="2"/><text x="200" y="170" font-size="22" fill="#243238" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Poor</text><text x="200" y="242" font-size="22" fill="#243238" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">below -70 dBm</text><text x="200" y="314" font-size="18" fill="#243238" font-weight="normal" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Device may disconnect</text><rect x="340" y="190" width="280" height="90" fill="#BFD0C8" stroke="#243238" stroke-width="2"/><text x="480" y="170" font-size="22" fill="#243238" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Good to average</text><text x="480" y="242" font-size="22" fill="#243238" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">-70 to -50 dBm</text><text x="480" y="314" font-size="18" fill="#243238" font-weight="normal" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Usually fine</text><rect x="620" y="190" width="280" height="90" fill="#6F8F82" stroke="#243238" stroke-width="2"/><text x="760" y="170" font-size="22" fill="#243238" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Strong</text><text x="760" y="242" font-size="22" fill="#243238" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">above -50 dBm</text><text x="760" y="314" font-size="18" fill="#243238" font-weight="normal" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Best case</text><line x1="120" y1="360" x2="840" y2="360" stroke="#243238" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><text x="60" y="396" font-size="18" fill="#243238" font-weight="normal" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Weaker</text><text x="900" y="396" font-size="18" fill="#243238" font-weight="normal" text-anchor="end" font-family="Arial, Helvetica, sans-serif">Stronger</text><text x="60" y="446" font-size="19" fill="#243238" font-weight="normal" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Find the number in the device app. In the Kasa app: Device Settings, Device</text><text x="60" y="472" font-size="19" fill="#243238" font-weight="normal" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Info, tap the Wi-Fi icon.</text><text x="60" y="510" font-size="16" fill="#4F6F62" font-weight="normal" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Ratings from the TP-Link Kasa support page. Other brands show signal differently.</text></svg>