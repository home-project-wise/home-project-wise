<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Three hanging methods for a heavy mirror: D-rings on two hooks, picture wire on two hooks, and a French cleat" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif">
<rect width="960" height="540" fill="#F7F5F0"/>
<text x="480" y="46" font-size="28" font-weight="700" fill="#243238" text-anchor="middle">Three ways to hang a heavy mirror</text>
<rect x="30" y="90" width="280" height="400" rx="14" fill="#fff" stroke="#243238" stroke-width="2.5"/><text x="170" y="130" font-size="24" font-weight="700" fill="#243238" text-anchor="middle">D-rings</text><text x="170" y="158" font-size="16" font-weight="500" fill="#5b6b70" text-anchor="middle">two rings, two hooks</text><rect x="90" y="250" width="160" height="150" rx="6" fill="#E4ECE8" stroke="#243238" stroke-width="3"/>
<circle cx="120" cy="272" r="9" fill="none" stroke="#B5482F" stroke-width="5"/><circle cx="220" cy="272" r="9" fill="none" stroke="#B5482F" stroke-width="5"/>
<line x1="120" y1="262" x2="120" y2="215" stroke="#243238" stroke-width="4"/><line x1="220" y1="262" x2="220" y2="215" stroke="#243238" stroke-width="4"/>
<circle cx="120" cy="210" r="7" fill="#243238"/><circle cx="220" cy="210" r="7" fill="#243238"/>
<text x="170" y="440" font-size="17" font-weight="700" fill="#6F8F82" text-anchor="middle">Rings level, same depth</text>
<text x="170" y="466" font-size="16" font-weight="500" fill="#5b6b70" text-anchor="middle">measure from the top edge</text>
<rect x="340" y="90" width="280" height="400" rx="14" fill="#fff" stroke="#243238" stroke-width="2.5"/><text x="480" y="130" font-size="24" font-weight="700" fill="#243238" text-anchor="middle">Picture wire</text><text x="480" y="158" font-size="16" font-weight="500" fill="#5b6b70" text-anchor="middle">two hooks, strong gauge</text><rect x="400" y="250" width="160" height="150" rx="6" fill="#E4ECE8" stroke="#243238" stroke-width="3"/>
<polyline points="430,272 480,235 530,272" fill="none" stroke="#B5482F" stroke-width="4"/>
<circle cx="430" cy="208" r="7" fill="#243238"/><circle cx="530" cy="208" r="7" fill="#243238"/>
<line x1="430" y1="215" x2="480" y2="235" stroke="#243238" stroke-width="3" stroke-dasharray="5 4"/><line x1="530" y1="215" x2="480" y2="235" stroke="#243238" stroke-width="3" stroke-dasharray="5 4"/>
<text x="480" y="440" font-size="17" font-weight="700" fill="#6F8F82" text-anchor="middle">Spread across two hooks</text>
<text x="480" y="466" font-size="16" font-weight="500" fill="#5b6b70" text-anchor="middle">wire can stretch: check it</text>
<rect x="650" y="90" width="280" height="400" rx="14" fill="#fff" stroke="#243238" stroke-width="2.5"/><text x="790" y="130" font-size="24" font-weight="700" fill="#243238" text-anchor="middle">French cleat</text><text x="790" y="158" font-size="16" font-weight="500" fill="#5b6b70" text-anchor="middle">two interlocking strips</text><rect x="710" y="250" width="160" height="150" rx="6" fill="#E4ECE8" stroke="#243238" stroke-width="3"/>
<polygon points="725,255 855,255 855,270 725,270" fill="#B5482F"/>
<polygon points="725,228 855,228 855,252 725,252" fill="#243238"/>
<text x="790" y="440" font-size="17" font-weight="700" fill="#6F8F82" text-anchor="middle">Wall half into studs</text>
<text x="790" y="466" font-size="16" font-weight="500" fill="#5b6b70" text-anchor="middle">pick a size rated for the mirror</text>
</svg>
