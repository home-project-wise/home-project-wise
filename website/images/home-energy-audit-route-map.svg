<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d"><title id="t">Room-by-room route for a DIY home energy audit</title><desc id="d">A simple house cross-section with seven numbered stops in walking order: outside and entry doors, windows and living spaces, kitchen and bathrooms, bedrooms with lights and plug-in devices, the attic hatch, the basement or crawl space or garage, and heating, cooling and hot water equipment. The rule on every stop: look, note and photograph, but do not open, move or probe anything.</desc><rect width="960" height="540" fill="#F7F5F0"/><text x="480" y="46" font-size="30" fill="#243238" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Walk the house in this order</text><line x1="30" y1="400" x2="440" y2="400" stroke="#8AA89B" stroke-width="3"/><rect x="105" y="400" width="260" height="72" fill="#E7E2D6" stroke="#243238" stroke-width="2"/><polygon points="65,190 235,105 405,190" fill="#BFD0C8" stroke="#243238" stroke-width="2"/><rect x="85" y="190" width="300" height="210" fill="#F7F5F0" stroke="#243238" stroke-width="2"/><line x1="85" y1="295" x2="385" y2="295" stroke="#243238" stroke-width="2"/><rect x="215" y="186" width="40" height="8" fill="#243238"/><rect x="110" y="212" width="46" height="34" fill="#DCE6E8" stroke="#243238" stroke-width="2"/><rect x="300" y="212" width="46" height="34" fill="#DCE6E8" stroke="#243238" stroke-width="2"/><rect x="195" y="312" width="46" height="34" fill="#DCE6E8" stroke="#243238" stroke-width="2"/><rect x="300" y="312" width="46" height="34" fill="#DCE6E8" stroke="#243238" stroke-width="2"/><rect x="96" y="335" width="30" height="65" fill="#8AA89B" stroke="#243238" stroke-width="2"/><polyline points="52,375 175,375 320,375 150,272 235,160 235,404 160,436 310,436" fill="none" stroke="#B98B45" stroke-width="4" stroke-dasharray="3 9" stroke-linecap="round"/><circle cx="52" cy="375" r="20" fill="#243238"/><text x="52" y="383" font-size="24" fill="#F7F5F0" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">1</text><circle cx="175" cy="375" r="20" fill="#243238"/><text x="175" y="383" font-size="24" fill="#F7F5F0" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">2</text><circle cx="320" cy="375" r="20" fill="#243238"/><text x="320" y="383" font-size="24" fill="#F7F5F0" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">3</text><circle cx="150" cy="272" r="20" fill="#243238"/><text x="150" y="280" font-size="24" fill="#F7F5F0" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">4</text><circle cx="235" cy="160" r="20" fill="#243238"/><text x="235" y="168" font-size="24" fill="#F7F5F0" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">5</text><circle cx="160" cy="436" r="20" fill="#243238"/><text x="160" y="444" font-size="24" fill="#F7F5F0" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">6</text><circle cx="310" cy="436" r="20" fill="#243238"/><text x="310" y="444" font-size="24" fill="#F7F5F0" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">7</text><circle cx="492" cy="102" r="20" fill="#243238"/><text x="492" y="110" font-size="24" fill="#F7F5F0" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">1</text><text x="526" y="110" font-size="24" fill="#243238" font-weight="normal" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Outside and entry doors</text><circle cx="492" cy="156" r="20" fill="#243238"/><text x="492" y="164" font-size="24" fill="#F7F5F0" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">2</text><text x="526" y="164" font-size="24" fill="#243238" font-weight="normal" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Windows and living spaces</text><circle cx="492" cy="210" r="20" fill="#243238"/><text x="492" y="218" font-size="24" fill="#F7F5F0" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">3</text><text x="526" y="218" font-size="24" fill="#243238" font-weight="normal" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Kitchen and bathrooms</text><circle cx="492" cy="264" r="20" fill="#243238"/><text x="492" y="272" font-size="24" fill="#F7F5F0" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">4</text><text x="526" y="272" font-size="24" fill="#243238" font-weight="normal" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Bedrooms, lights, plug-ins</text><circle cx="492" cy="318" r="20" fill="#243238"/><text x="492" y="326" font-size="24" fill="#F7F5F0" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">5</text><text x="526" y="326" font-size="24" fill="#243238" font-weight="normal" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Attic hatch (look only)</text><circle cx="492" cy="372" r="20" fill="#243238"/><text x="492" y="380" font-size="24" fill="#F7F5F0" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">6</text><text x="526" y="380" font-size="24" fill="#243238" font-weight="normal" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Basement, crawl space, garage</text><circle cx="492" cy="426" r="20" fill="#243238"/><text x="492" y="434" font-size="24" fill="#F7F5F0" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">7</text><text x="526" y="434" font-size="24" fill="#243238" font-weight="normal" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Heating, cooling, hot water</text><rect x="30" y="486" width="900" height="40" rx="10" fill="#BFD0C8" stroke="#243238" stroke-width="2"/><text x="480" y="514" font-size="24" fill="#243238" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Look, note, photograph. Do not open, move or probe.</text></svg>