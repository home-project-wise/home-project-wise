<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Checklist for choosing oversized art: size, hanging hardware, finish, care and returns"><rect width="960" height="540" fill="#F7F5F0"/><text x="480" y="50" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700" fill="#243238" text-anchor="middle">Before you order oversized art</text><rect x="60" y="90" width="840" height="74" rx="14" fill="#fff" stroke="#243238" stroke-width="2"/><circle cx="105" cy="127" r="22" fill="#D97745"/><text x="105" y="136" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="150" y="122" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" fill="#243238" text-anchor="start">Size</text><text x="150" y="150" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="400" fill="#566266" text-anchor="start">Measure the wall and the box it ships in</text><rect x="60" y="178" width="840" height="74" rx="14" fill="#fff" stroke="#243238" stroke-width="2"/><circle cx="105" cy="215" r="22" fill="#D97745"/><text x="105" y="224" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="150" y="210" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" fill="#243238" text-anchor="start">Hanging hardware</text><text x="150" y="238" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="400" fill="#566266" text-anchor="start">What is included, and is it enough?</text><rect x="60" y="266" width="840" height="74" rx="14" fill="#fff" stroke="#243238" stroke-width="2"/><circle cx="105" cy="303" r="22" fill="#D97745"/><text x="105" y="312" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="150" y="298" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" fill="#243238" text-anchor="start">Finish and material</text><text x="150" y="326" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="400" fill="#566266" text-anchor="start">How the piece is made and finished</text><rect x="60" y="354" width="840" height="74" rx="14" fill="#fff" stroke="#243238" stroke-width="2"/><circle cx="105" cy="391" r="22" fill="#D97745"/><text x="105" y="400" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="150" y="386" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" fill="#243238" text-anchor="start">Care</text><text x="150" y="414" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="400" fill="#566266" text-anchor="start">How it should be cleaned</text><rect x="60" y="442" width="840" height="74" rx="14" fill="#fff" stroke="#243238" stroke-width="2"/><circle cx="105" cy="479" r="22" fill="#D97745"/><text x="105" y="488" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="150" y="474" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" fill="#243238" text-anchor="start">Returns and damage</text><text x="150" y="502" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="400" fill="#566266" text-anchor="start">Check the policy before you order</text></svg>