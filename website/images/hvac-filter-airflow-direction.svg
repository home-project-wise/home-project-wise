<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d"><title id="t">Filter airflow arrow and bypass</title><desc id="d">Side view of a filter in its slot between the return duct and the furnace or air handler. In the correct case the arrow on the frame points the way the air moves, toward the unit, and the filter fits snugly. In the wrong case a gap around a too small or crooked filter lets air bypass it. Do not force or tape a filter to fit.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#243238"/></marker></defs><rect width="960" height="540" fill="#F7F5F0"/><text x="480" y="40" font-size="28" fill="#243238" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Arrow toward the unit, snug on every side</text><text x="40" y="76" font-size="26" fill="#243238" font-weight="bold" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Correct</text><rect x="40" y="88" width="210" height="130" fill="#E7E2D6" stroke="#243238" stroke-width="2"/><rect x="250" y="84" width="20" height="138" fill="#B98B45" stroke="#243238" stroke-width="2"/><rect x="270" y="80" width="250" height="146" fill="#BFD0C8" stroke="#243238" stroke-width="2"/><line x1="70" y1="153" x2="238" y2="153" stroke="#243238" stroke-width="4" marker-end="url(#ar)"/><text x="150" y="134" font-size="24" fill="#243238" font-weight="normal" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Return air</text><text x="395" y="146" font-size="24" fill="#243238" font-weight="normal" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Furnace or</text><text x="395" y="176" font-size="24" fill="#243238" font-weight="normal" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">air handler</text><text x="560" y="112" font-size="24" fill="#243238" font-weight="normal" text-anchor="start" font-family="Arial, Helvetica, sans-serif">The frame arrow points</text><text x="560" y="142" font-size="24" fill="#243238" font-weight="normal" text-anchor="start" font-family="Arial, Helvetica, sans-serif">the way air moves: into</text><text x="560" y="172" font-size="24" fill="#243238" font-weight="normal" text-anchor="start" font-family="Arial, Helvetica, sans-serif">the duct, toward the</text><text x="560" y="202" font-size="24" fill="#243238" font-weight="normal" text-anchor="start" font-family="Arial, Helvetica, sans-serif">furnace or air handler.</text><text x="40" y="276" font-size="26" fill="#243238" font-weight="bold" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Wrong: a gap lets air bypass</text><rect x="40" y="290" width="210" height="150" fill="#E7E2D6" stroke="#243238" stroke-width="2"/><rect x="250" y="318" width="20" height="94" fill="#B98B45" stroke="#243238" stroke-width="2"/><rect x="270" y="286" width="250" height="158" fill="#BFD0C8" stroke="#243238" stroke-width="2"/><path d="M 70 330 C 150 330 190 296 260 304 S 330 330 400 330" fill="none" stroke="#243238" stroke-width="4" stroke-dasharray="3 8" marker-end="url(#ar)"/><path d="M 70 400 C 150 400 190 432 260 424 S 330 400 400 400" fill="none" stroke="#243238" stroke-width="4" stroke-dasharray="3 8" marker-end="url(#ar)"/><text x="560" y="320" font-size="24" fill="#243238" font-weight="normal" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Too small, or crooked in</text><text x="560" y="350" font-size="24" fill="#243238" font-weight="normal" text-anchor="start" font-family="Arial, Helvetica, sans-serif">the slot: air skips the</text><text x="560" y="380" font-size="24" fill="#243238" font-weight="normal" text-anchor="start" font-family="Arial, Helvetica, sans-serif">filter. Do not force or</text><text x="560" y="410" font-size="24" fill="#243238" font-weight="normal" text-anchor="start" font-family="Arial, Helvetica, sans-serif">tape a filter to fit.</text></svg>