<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Arrival routine diagram: coat, bag, keys and shoes each have a place in the first 30 seconds"><rect width="960" height="540" fill="#F7F5F0"/><text x="480" y="50" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700" fill="#243238" text-anchor="middle">The first 30 seconds at the door</text><rect x="40" y="150" width="120" height="200" rx="14" fill="#243238" stroke="#243238" stroke-width="2"/><text x="100" y="258" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" fill="#fff" text-anchor="middle">Door</text><path d="M165 250 L212 250" stroke="#243238" stroke-width="3" fill="none"/><polygon points="212,250 200,242 200,258" fill="#243238"/><rect x="215" y="150" width="160" height="95" rx="14" fill="#fff" stroke="#243238" stroke-width="2"/><text x="295" y="205" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" fill="#243238" text-anchor="middle">Coat</text><path d="M295 247 L295 268" stroke="#243238" stroke-width="3"/><polygon points="295,283 285,266 305,266" fill="#243238"/><rect x="215" y="290" width="160" height="70" rx="14" fill="#D97745" stroke="#a8481d" stroke-width="2"/><text x="295" y="332" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">Hook</text><rect x="395" y="150" width="160" height="95" rx="14" fill="#fff" stroke="#243238" stroke-width="2"/><text x="475" y="205" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" fill="#243238" text-anchor="middle">Bag</text><path d="M475 247 L475 268" stroke="#243238" stroke-width="3"/><polygon points="475,283 465,266 485,266" fill="#243238"/><rect x="395" y="290" width="160" height="70" rx="14" fill="#D97745" stroke="#a8481d" stroke-width="2"/><text x="475" y="332" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">Hook, bench</text><rect x="575" y="150" width="160" height="95" rx="14" fill="#fff" stroke="#243238" stroke-width="2"/><text x="655" y="205" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" fill="#243238" text-anchor="middle">Keys</text><path d="M655 247 L655 268" stroke="#243238" stroke-width="3"/><polygon points="655,283 645,266 665,266" fill="#243238"/><rect x="575" y="290" width="160" height="70" rx="14" fill="#D97745" stroke="#a8481d" stroke-width="2"/><text x="655" y="332" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">Tray or hook</text><rect x="755" y="150" width="160" height="95" rx="14" fill="#fff" stroke="#243238" stroke-width="2"/><text x="835" y="205" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" fill="#243238" text-anchor="middle">Shoes</text><path d="M835 247 L835 268" stroke="#243238" stroke-width="3"/><polygon points="835,283 825,266 845,266" fill="#243238"/><rect x="755" y="290" width="160" height="70" rx="14" fill="#D97745" stroke="#a8481d" stroke-width="2"/><text x="835" y="332" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">Mat or tray</text><rect x="60" y="395" width="840" height="115" rx="14" fill="#E4ECE8" stroke="#243238" stroke-width="2"/><text x="480" y="432" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#243238" text-anchor="middle">Each item has a place the moment you arrive.</text><text x="480" y="465" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="400" fill="#243238" text-anchor="middle">If the answer is “wherever there is space”,</text><text x="480" y="492" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="400" fill="#243238" text-anchor="middle">the entryway becomes a pile.</text></svg>