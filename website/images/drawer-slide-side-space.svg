<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d"><title id="t">Side space on each side of a drawer</title><desc id="d">A drawer box between two cabinet sides with 0.50 inch of side space on each side for a ball-bearing slide.</desc><rect width="960" height="540" rx="16" fill="#f7f4ee"/><text x="40" y="50" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="26" font-weight="bold" fill="#20312f" text-anchor="start">Side space: room on each side of the drawer</text><rect x="80" y="130" width="40" height="270" fill="#ece3d2" stroke="#8a8272" stroke-width="2"/><rect x="840" y="130" width="40" height="270" fill="#ece3d2" stroke="#8a8272" stroke-width="2"/><rect x="190" y="170" width="580" height="200" fill="#f9f6ef" stroke="#8a8272" stroke-width="3"/><rect x="170" y="230" width="20" height="30" fill="#8d979c" stroke="#5d6b70"/><rect x="770" y="230" width="20" height="30" fill="#8d979c" stroke="#5d6b70"/><path d="M120 296 h50 m-50 0 l8 -6 m-8 6 l8 6 m42 -6 l-8 -6 m8 6 l-8 6" stroke="#c0392b" stroke-width="3" fill="none"/><path d="M790 296 h50 m-50 0 l8 -6 m-8 6 l8 6 m42 -6 l-8 -6 m8 6 l-8 6" stroke="#c0392b" stroke-width="3" fill="none"/><text x="145" y="330" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" font-weight="bold" fill="#c0392b" text-anchor="middle">0.50 in</text><text x="815" y="330" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" font-weight="bold" fill="#c0392b" text-anchor="middle">0.50 in</text><text x="480" y="270" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="22" font-weight="bold" fill="#20312f" text-anchor="middle">Drawer box</text><text x="480" y="300" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" font-weight="normal" fill="#4b5b58" text-anchor="middle">width A</text><text x="480" y="424" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#1f6f6b" text-anchor="middle">Opening width = drawer width A + 2 × 0.50 in. Example: A = 16 in gives 17 in (up to 17.06 in).</text><text x="480" y="452" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="16" font-weight="normal" fill="#4b5b58" text-anchor="middle">Illustrative: 0.50 in (+0.030/−0.000) is the side space of the Accuride 2601 sheet. Your slide may differ.</text><text x="480" y="482" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="16" font-weight="normal" fill="#4b5b58" text-anchor="middle">Accuride advises 0.2 to 0.5 mm over the slide thickness. Some slides need more, as their sheets state.</text><text x="480" y="512" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="normal" fill="#4b5b58" text-anchor="middle">Sources: Accuride help center (2026); Accuride 2601 sheet (search excerpt).</text></svg>