<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Side view of a drywall anchor showing a pull-out load pulling straight out of the wall and a shear load pulling down along the wall" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif"><rect width="960" height="540" fill="#F7F5F0"/><text x="480" y="46" font-size="30" font-weight="700" fill="#243238" text-anchor="middle">Two ways a drywall anchor can fail</text><rect x="210" y="110" width="60" height="320" rx="6" fill="#ECE8DD" stroke="#B9B4A6" stroke-width="2"/><rect x="270" y="170" width="16" height="200" rx="4" fill="#243238"/><line x1="286" y1="270" x2="220" y2="270" stroke="#6F8F82" stroke-width="7" stroke-linecap="round"/><rect x="214" y="256" width="14" height="28" rx="4" fill="#6F8F82"/><line x1="290" y1="270" x2="402" y2="270" stroke="#B5482F" stroke-width="8" stroke-linecap="round"/><polygon points="420,270 396,256 396,284" fill="#B5482F"/><text x="240" y="100" font-size="16" font-weight="500" fill="#5b6b70" text-anchor="middle">Drywall (side view)</text><text x="240" y="470" font-size="24" font-weight="700" fill="#243238" text-anchor="middle">Pull-out (tension)</text><text x="240" y="498" font-size="18" font-weight="500" fill="#5b6b70" text-anchor="middle">The anchor is pulled straight out of the wall</text><rect x="690" y="110" width="60" height="320" rx="6" fill="#ECE8DD" stroke="#B9B4A6" stroke-width="2"/><rect x="750" y="170" width="16" height="200" rx="4" fill="#243238"/><line x1="766" y1="270" x2="700" y2="270" stroke="#6F8F82" stroke-width="7" stroke-linecap="round"/><rect x="694" y="256" width="14" height="28" rx="4" fill="#6F8F82"/><line x1="790" y1="190" x2="790" y2="312" stroke="#B5482F" stroke-width="8" stroke-linecap="round"/><polygon points="790,330 776,306 804,306" fill="#B5482F"/><text x="720" y="100" font-size="16" font-weight="500" fill="#5b6b70" text-anchor="middle">Drywall (side view)</text><text x="790" y="360" font-size="16" font-weight="500" fill="#5b6b70" text-anchor="middle">weight of the frame</text><text x="720" y="470" font-size="24" font-weight="700" fill="#243238" text-anchor="middle">Shear</text><text x="720" y="498" font-size="18" font-weight="500" fill="#5b6b70" text-anchor="middle">The load pulls down along the wall</text><line x1="480" y1="110" x2="480" y2="500" stroke="#D8D3C5" stroke-width="2" stroke-dasharray="6 8"/></svg>