<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Bar chart comparing one fan’s airflow at 0.1 in. w.g. static pressure, 90 CFM, with its airflow at 0.25 in. w.g., 70.9 CFM, against a 50 CFM minimum line" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif"><rect width="960" height="540" fill="#F7F5F0"/><text x="480" y="52" font-size="32" font-weight="700" fill="#243238" text-anchor="middle">Rated airflow drops as the duct pushes back</text><text x="60" y="130" font-size="22" font-weight="700" fill="#243238" text-anchor="start">Light load</text><text x="60" y="158" font-size="20" font-weight="500" fill="#243238" text-anchor="start">0.1 in. w.g.</text><rect x="200" y="110" width="630.0" height="64" rx="10" fill="#6F8F82"/><text x="816.0" y="152" font-size="30" font-weight="700" fill="#fff" text-anchor="end">90 CFM</text><text x="60" y="250" font-size="22" font-weight="700" fill="#243238" text-anchor="start">Closer to a duct</text><text x="60" y="278" font-size="20" font-weight="500" fill="#243238" text-anchor="start">0.25 in. w.g.</text><rect x="200" y="230" width="496.30000000000007" height="64" rx="10" fill="#D97745"/><text x="682.3000000000001" y="272" font-size="30" font-weight="700" fill="#fff" text-anchor="end">70.9 CFM</text><line x1="550.0" y1="95" x2="550.0" y2="330" stroke="#243238" stroke-width="3" stroke-dasharray="8 6"/><text x="550.0" y="360" font-size="22" font-weight="700" fill="#243238" text-anchor="middle">50 CFM: minimum for an on-demand fan</text><text x="550.0" y="388" font-size="20" font-weight="500" fill="#243238" text-anchor="middle">(ASHRAE 62.2 and US residential code)</text><text x="480" y="450" font-size="26" font-weight="700" fill="#D97745" text-anchor="middle">About 21% less air at the higher pressure</text><text x="480" y="490" font-size="20" font-weight="500" fill="#243238" text-anchor="middle">Example: one ENERGY STAR listed 90 CFM fan. Your duct decides the real figure.</text></svg>