<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d"><title id="t">Reading door gaps to choose a hinge adjustment</title><desc id="d">Four door problems matched to side, depth or height adjustment on a concealed Blum hinge.</desc><rect width="960" height="540" rx="16" fill="#f7f4ee"/><text x="40" y="50" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="26" font-weight="bold" fill="#20312f" text-anchor="start">Read the gaps, then pick the adjustment</text><rect x="40" y="90" width="480" height="70" rx="10" fill="#ffffff" stroke="#b9b2a5"/><circle cx="70" cy="125" r="16" fill="#1f6f6b"/><text x="70" y="131" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text><text x="98" y="132" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#20312f" text-anchor="start">Gap wider on one side than the other</text><path d="M530 125 h24 l-8 -7 m8 7 l-8 7" stroke="#1f6f6b" stroke-width="3" fill="none"/><rect x="566" y="90" width="354" height="70" rx="10" fill="#e8f1ef" stroke="#a9c9c4"/><text x="580" y="132" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" font-weight="bold" fill="#1f6f6b" text-anchor="start">Side adjustment (front cam screw)</text><rect x="40" y="182" width="480" height="70" rx="10" fill="#ffffff" stroke="#b9b2a5"/><circle cx="70" cy="217" r="16" fill="#1f6f6b"/><text x="70" y="223" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text><text x="98" y="224" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#20312f" text-anchor="start">Door sits ahead of or behind its neighbors</text><path d="M530 217 h24 l-8 -7 m8 7 l-8 7" stroke="#1f6f6b" stroke-width="3" fill="none"/><rect x="566" y="182" width="354" height="70" rx="10" fill="#e8f1ef" stroke="#a9c9c4"/><text x="580" y="224" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" font-weight="bold" fill="#1f6f6b" text-anchor="start">Depth adjustment (rear cam screw)</text><rect x="40" y="274" width="480" height="70" rx="10" fill="#ffffff" stroke="#b9b2a5"/><circle cx="70" cy="309" r="16" fill="#1f6f6b"/><text x="70" y="315" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text><text x="98" y="316" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#20312f" text-anchor="start">Door is higher or lower than its neighbor</text><path d="M530 309 h24 l-8 -7 m8 7 l-8 7" stroke="#1f6f6b" stroke-width="3" fill="none"/><rect x="566" y="274" width="354" height="70" rx="10" fill="#e8f1ef" stroke="#a9c9c4"/><text x="580" y="316" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" font-weight="bold" fill="#1f6f6b" text-anchor="start">Height adjustment (mounting-plate cam)</text><rect x="40" y="366" width="480" height="70" rx="10" fill="#ffffff" stroke="#b9b2a5"/><circle cx="70" cy="401" r="16" fill="#1f6f6b"/><text x="70" y="407" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text><text x="98" y="408" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#20312f" text-anchor="start">Door rubs a neighbor along its edge</text><path d="M530 401 h24 l-8 -7 m8 7 l-8 7" stroke="#1f6f6b" stroke-width="3" fill="none"/><rect x="566" y="366" width="354" height="70" rx="10" fill="#e8f1ef" stroke="#a9c9c4"/><text x="580" y="408" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" font-weight="bold" fill="#1f6f6b" text-anchor="start">Side first, then check height</text><text x="480" y="482" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#c0392b" text-anchor="middle">Names follow one Blum hinge. Your hinge may differ, so use its own sheet.</text><text x="480" y="510" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="normal" fill="#4b5b58" text-anchor="middle">Source: Blum CLIP top BLUMOTION 110° kit instructions (2025).</text></svg>