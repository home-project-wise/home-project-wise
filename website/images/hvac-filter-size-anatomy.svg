<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d"><title id="t">Parts of an HVAC filter size: length, width, depth, nominal and actual</title><desc id="d">A pleated filter shown from the front with length and width arrows and from the edge with a depth arrow. Beside it, one illustrative example: a printed nominal size of 16 by 25 by 1 inches, and a measured actual size of about 15.5 by 24.5 by 0.75 inches. The example is illustrative only and sizes vary by brand. Match the printed size on a filter that fit; measure the slot when it did not.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#243238"/></marker></defs><rect width="960" height="540" fill="#F7F5F0"/><text x="480" y="46" font-size="30" fill="#243238" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Read the size, then check the fit</text><rect x="60" y="120" width="260" height="170" fill="#EFEBE1" stroke="#243238" stroke-width="3"/><line x1="82" y1="132" x2="82" y2="278" stroke="#8AA89B" stroke-width="2"/><line x1="103" y1="132" x2="103" y2="278" stroke="#8AA89B" stroke-width="2"/><line x1="125" y1="132" x2="125" y2="278" stroke="#8AA89B" stroke-width="2"/><line x1="147" y1="132" x2="147" y2="278" stroke="#8AA89B" stroke-width="2"/><line x1="168" y1="132" x2="168" y2="278" stroke="#8AA89B" stroke-width="2"/><line x1="190" y1="132" x2="190" y2="278" stroke="#8AA89B" stroke-width="2"/><line x1="212" y1="132" x2="212" y2="278" stroke="#8AA89B" stroke-width="2"/><line x1="233" y1="132" x2="233" y2="278" stroke="#8AA89B" stroke-width="2"/><line x1="255" y1="132" x2="255" y2="278" stroke="#8AA89B" stroke-width="2"/><line x1="277" y1="132" x2="277" y2="278" stroke="#8AA89B" stroke-width="2"/><line x1="298" y1="132" x2="298" y2="278" stroke="#8AA89B" stroke-width="2"/><rect x="72" y="132" width="236" height="146" fill="none" stroke="#243238" stroke-width="1.5"/><line x1="60" y1="318" x2="320" y2="318" stroke="#243238" stroke-width="3" marker-end="url(#ar)"/><line x1="320" y1="318" x2="60" y2="318" stroke="#243238" stroke-width="3" marker-end="url(#ar)"/><text x="190" y="356" font-size="26" fill="#243238" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Length</text><line x1="342" y1="120" x2="342" y2="290" stroke="#243238" stroke-width="3" marker-end="url(#ar)"/><line x1="342" y1="290" x2="342" y2="120" stroke="#243238" stroke-width="3" marker-end="url(#ar)"/><text x="351" y="212" font-size="24" fill="#243238" font-weight="bold" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Width</text><rect x="438" y="120" width="30" height="170" fill="#EFEBE1" stroke="#243238" stroke-width="3"/><text x="453" y="106" font-size="24" fill="#243238" font-weight="normal" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Edge</text><line x1="420" y1="318" x2="438" y2="318" stroke="#243238" stroke-width="3" marker-end="url(#ar)"/><line x1="486" y1="318" x2="468" y2="318" stroke="#243238" stroke-width="3" marker-end="url(#ar)"/><text x="453" y="356" font-size="26" fill="#243238" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Depth</text><rect x="510" y="90" width="420" height="118" rx="10" fill="#BFD0C8" stroke="#243238" stroke-width="2"/><text x="530" y="126" font-size="26" fill="#243238" font-weight="bold" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Printed size (nominal)</text><text x="530" y="168" font-size="34" fill="#243238" font-weight="bold" text-anchor="start" font-family="Arial, Helvetica, sans-serif">16 × 25 × 1</text><text x="530" y="198" font-size="24" fill="#243238" font-weight="normal" text-anchor="start" font-family="Arial, Helvetica, sans-serif">A rounded label for shopping</text><rect x="510" y="224" width="420" height="118" rx="10" fill="#F7F5F0" stroke="#243238" stroke-width="2"/><text x="530" y="260" font-size="26" fill="#243238" font-weight="bold" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Measured size (actual)</text><text x="530" y="300" font-size="24" fill="#243238" font-weight="bold" text-anchor="start" font-family="Arial, Helvetica, sans-serif">about 15.5 × 24.5 × 0.75</text><text x="530" y="332" font-size="24" fill="#243238" font-weight="normal" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Usually a little smaller</text><text x="720" y="372" font-size="24" fill="#243238" font-weight="normal" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Example only. Sizes vary by brand.</text><rect x="30" y="420" width="900" height="100" rx="10" fill="#243238"/><text x="480" y="462" font-size="28" fill="#F7F5F0" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Match the printed size on a filter that fit.</text><text x="480" y="500" font-size="28" fill="#F7F5F0" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Measure the slot when it did not.</text></svg>