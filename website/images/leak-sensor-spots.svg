<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Floor plan marking six leak sensor spots: under the kitchen sink, beside the dishwasher, behind the washing machine, at the toilet base, under the bathroom vanity and beside the water heater" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif"><rect width="960" height="540" fill="#F7F5F0"/><text x="480" y="50" font-size="32" font-weight="700" fill="#243238" text-anchor="middle">Six spots that catch most leaks</text><rect x="40" y="80" width="430" height="200" rx="14" fill="#fff" stroke="#D8D2C4" stroke-width="3"/><text x="56" y="112" font-size="22" font-weight="700" fill="#243238" text-anchor="start">Kitchen</text><rect x="490" y="80" width="430" height="200" rx="14" fill="#fff" stroke="#D8D2C4" stroke-width="3"/><text x="506" y="112" font-size="22" font-weight="700" fill="#243238" text-anchor="start">Laundry</text><rect x="40" y="300" width="430" height="200" rx="14" fill="#fff" stroke="#D8D2C4" stroke-width="3"/><text x="56" y="332" font-size="22" font-weight="700" fill="#243238" text-anchor="start">Bathroom</text><rect x="490" y="300" width="430" height="200" rx="14" fill="#fff" stroke="#D8D2C4" stroke-width="3"/><text x="506" y="332" font-size="22" font-weight="700" fill="#243238" text-anchor="start">Water heater area</text><circle cx="110" cy="150" r="22" fill="#D97745"/><text x="110" y="159.1" font-size="26" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="145" y="150" font-size="20" font-weight="600" fill="#243238" text-anchor="start">Kitchen sink cabinet</text><text x="145" y="175" font-size="18" font-weight="500" fill="#243238" text-anchor="start">floor under supply lines</text><circle cx="110" cy="225" r="22" fill="#D97745"/><text x="110" y="234.1" font-size="26" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="145" y="225" font-size="20" font-weight="600" fill="#243238" text-anchor="start">Dishwasher</text><text x="145" y="250" font-size="18" font-weight="500" fill="#243238" text-anchor="start">floor at the front or side</text><circle cx="560" cy="150" r="22" fill="#D97745"/><text x="560" y="159.1" font-size="26" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="595" y="150" font-size="20" font-weight="600" fill="#243238" text-anchor="start">Washing machine</text><text x="595" y="175" font-size="18" font-weight="500" fill="#243238" text-anchor="start">floor by the hose connections</text><circle cx="110" cy="375" r="22" fill="#D97745"/><text x="110" y="384.1" font-size="26" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="145" y="375" font-size="20" font-weight="600" fill="#243238" text-anchor="start">Toilet base</text><text x="145" y="400" font-size="18" font-weight="500" fill="#243238" text-anchor="start">floor near the supply valve</text><circle cx="110" cy="450" r="22" fill="#6F8F82"/><text x="110" y="459.1" font-size="26" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="145" y="450" font-size="20" font-weight="600" fill="#243238" text-anchor="start">Bathroom sink cabinet</text><text x="145" y="475" font-size="18" font-weight="500" fill="#243238" text-anchor="start">floor under the vanity</text><circle cx="560" cy="375" r="22" fill="#6F8F82"/><text x="560" y="384.1" font-size="26" font-weight="700" fill="#fff" text-anchor="middle">6</text><text x="595" y="375" font-size="20" font-weight="600" fill="#243238" text-anchor="start">Water heater</text><text x="595" y="400" font-size="18" font-weight="500" fill="#243238" text-anchor="start">floor beside the base or in the pan</text><text x="595" y="450" font-size="18" font-weight="500" fill="#243238" text-anchor="start">Extras: sump pump, ice-maker line,</text><text x="595" y="474" font-size="18" font-weight="500" fill="#243238" text-anchor="start">furnace or AC condensate pan</text></svg>