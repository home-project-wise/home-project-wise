<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Chart of airflow targets by bathroom size: 40 sq ft needs 50 CFM, 80 sq ft needs 80 CFM, and a 120 sq ft bathroom with toilet, shower and tub needs 150 CFM" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif"><rect width="960" height="540" fill="#F7F5F0"/><text x="480" y="52" font-size="32" font-weight="700" fill="#243238" text-anchor="middle">Pick your airflow target</text><text x="60" y="100" font-size="20" font-weight="600" fill="#6F8F82" text-anchor="start">Bathroom</text><text x="360" y="100" font-size="20" font-weight="600" fill="#6F8F82" text-anchor="start">Airflow target</text><text x="650" y="100" font-size="20" font-weight="600" fill="#6F8F82" text-anchor="start">Shop for a rating of</text><rect x="40" y="118" width="880" height="116" rx="14" fill="#fff" stroke="#D8D2C4" stroke-width="3"/><text x="60" y="170" font-size="30" font-weight="700" fill="#243238" text-anchor="start">40 sq ft</text><text x="60" y="206" font-size="22" font-weight="500" fill="#243238" text-anchor="start">5 × 8 ft</text><text x="360" y="170" font-size="30" font-weight="700" fill="#D97745" text-anchor="start">50 CFM</text><text x="360" y="206" font-size="22" font-weight="500" fill="#243238" text-anchor="start">50 CFM floor</text><text x="650" y="170" font-size="30" font-weight="700" fill="#243238" text-anchor="start">70+ CFM</text><text x="650" y="206" font-size="22" font-weight="500" fill="#243238" text-anchor="start">extra for duct losses</text><rect x="40" y="252" width="880" height="116" rx="14" fill="#fff" stroke="#D8D2C4" stroke-width="3"/><text x="60" y="304" font-size="30" font-weight="700" fill="#243238" text-anchor="start">80 sq ft</text><text x="60" y="340" font-size="22" font-weight="500" fill="#243238" text-anchor="start">8 × 10 ft</text><text x="360" y="304" font-size="30" font-weight="700" fill="#D97745" text-anchor="start">80 CFM</text><text x="360" y="340" font-size="22" font-weight="500" fill="#243238" text-anchor="start">1 CFM per sq ft</text><text x="650" y="304" font-size="30" font-weight="700" fill="#243238" text-anchor="start">About 110 CFM</text><text x="650" y="340" font-size="22" font-weight="500" fill="#243238" text-anchor="start">extra for duct losses</text><rect x="40" y="386" width="880" height="116" rx="14" fill="#fff" stroke="#D8D2C4" stroke-width="3"/><text x="60" y="438" font-size="30" font-weight="700" fill="#243238" text-anchor="start">120 sq ft</text><text x="60" y="474" font-size="22" font-weight="500" fill="#243238" text-anchor="start">toilet, shower, tub</text><text x="360" y="438" font-size="30" font-weight="700" fill="#D97745" text-anchor="start">150 CFM</text><text x="360" y="474" font-size="22" font-weight="500" fill="#243238" text-anchor="start">50 per fixture</text><text x="650" y="438" font-size="30" font-weight="700" fill="#243238" text-anchor="start">150+ CFM</text><text x="650" y="474" font-size="22" font-weight="500" fill="#243238" text-anchor="start">or two smaller fans</text><text x="480" y="528" font-size="18" font-weight="500" fill="#243238" text-anchor="middle">Starting points, not guarantees. Check your local rules.</text></svg>