<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d"><title id="t">Matter over Wi-Fi compared with Matter over Thread</title><desc id="d">A Matter accessory can reach your home over Wi-Fi, which joins the router directly, or over Thread, which needs a Thread border router to reach the home network. Look for the Wi-Fi or Thread symbol on the box or product page.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#243238"/></marker></defs><rect width="960" height="540" fill="#F7F5F0"/><text x="480" y="52" font-size="30" fill="#243238" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Matter is the language, Wi-Fi and Thread are the roads</text><rect x="280" y="80" width="400" height="96" rx="10" fill="#F7F5F0" stroke="#243238" stroke-width="2"/><text x="480" y="122" font-size="28" fill="#243238" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Matter accessory</text><text x="480" y="156" font-size="23" fill="#243238" font-weight="normal" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Same Matter logo on the box</text><line x1="400" y1="176" x2="240" y2="246" stroke="#243238" stroke-width="3" marker-end="url(#ar)"/><line x1="560" y1="176" x2="720" y2="246" stroke="#243238" stroke-width="3" marker-end="url(#ar)"/><rect x="40" y="250" width="400" height="160" rx="10" fill="#BFD0C8" stroke="#243238" stroke-width="2"/><text x="240" y="296" font-size="27" fill="#243238" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Matter over Wi-Fi</text><text x="240" y="338" font-size="23" fill="#243238" font-weight="normal" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Joins your router directly</text><text x="240" y="372" font-size="23" fill="#243238" font-weight="normal" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">No Thread border router</text><rect x="520" y="250" width="400" height="160" rx="10" fill="#D97745" stroke="#243238" stroke-width="2"/><text x="720" y="296" font-size="27" fill="#243238" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Matter over Thread</text><text x="720" y="338" font-size="23" fill="#243238" font-weight="normal" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Needs a border router to</text><text x="720" y="372" font-size="23" fill="#243238" font-weight="normal" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">reach your home network</text><rect x="40" y="438" width="880" height="72" rx="10" fill="#F7F5F0" stroke="#243238" stroke-width="2" stroke-dasharray="8 6"/><text x="480" y="482" font-size="25" fill="#243238" font-weight="normal" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Look for the Wi-Fi or Thread symbol on the box or product page</text></svg>