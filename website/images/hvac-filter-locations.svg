<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d"><title id="t">Where an HVAC filter can be located</title><desc id="d">Two common filter locations. Left: a filter slot between the return duct and the furnace or air handler, with air moving toward the unit. Right: a filter sitting behind a large return grille on a wall or ceiling. Some homes use one filter in each return grille, so check the size at every location.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#243238"/></marker></defs><rect width="960" height="540" fill="#F7F5F0"/><text x="480" y="44" font-size="30" fill="#243238" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Two common places to find the filter</text><rect x="30" y="68" width="430" height="360" rx="10" fill="#F7F5F0" stroke="#243238" stroke-width="2"/><text x="245" y="106" font-size="26" fill="#243238" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Slot at the unit</text><rect x="60" y="190" width="100" height="130" fill="#E7E2D6" stroke="#243238" stroke-width="2"/><text x="110" y="262" font-size="22" fill="#243238" font-weight="normal" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Return</text><text x="110" y="288" font-size="22" fill="#243238" font-weight="normal" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">duct</text><rect x="160" y="176" width="22" height="158" fill="#B98B45" stroke="#243238" stroke-width="2"/><text x="171" y="162" font-size="24" fill="#243238" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Filter slot</text><rect x="182" y="176" width="248" height="158" fill="#BFD0C8" stroke="#243238" stroke-width="2"/><text x="306" y="246" font-size="24" fill="#243238" font-weight="normal" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Furnace or</text><text x="306" y="276" font-size="24" fill="#243238" font-weight="normal" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">air handler</text><line x1="70" y1="364" x2="420" y2="364" stroke="#243238" stroke-width="3" marker-end="url(#ar)"/><text x="245" y="404" font-size="24" fill="#243238" font-weight="normal" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Air moves toward the unit</text><rect x="500" y="68" width="430" height="360" rx="10" fill="#F7F5F0" stroke="#243238" stroke-width="2"/><text x="715" y="106" font-size="26" fill="#243238" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Behind a return grille</text><rect x="580" y="130" width="270" height="250" fill="#E7E2D6" stroke="#243238" stroke-width="2"/><rect x="610" y="170" width="210" height="170" fill="none" stroke="#243238" stroke-width="3" stroke-dasharray="10 8"/><line x1="624" y1="186" x2="806" y2="186" stroke="#243238" stroke-width="5"/><line x1="624" y1="214" x2="806" y2="214" stroke="#243238" stroke-width="5"/><line x1="624" y1="242" x2="806" y2="242" stroke="#243238" stroke-width="5"/><line x1="624" y1="270" x2="806" y2="270" stroke="#243238" stroke-width="5"/><line x1="624" y1="298" x2="806" y2="298" stroke="#243238" stroke-width="5"/><line x1="624" y1="326" x2="806" y2="326" stroke="#243238" stroke-width="5"/><text x="715" y="414" font-size="24" fill="#243238" font-weight="normal" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Dashed: filter behind the grille</text><rect x="30" y="448" width="900" height="72" rx="10" fill="#BFD0C8" stroke="#243238" stroke-width="2"/><text x="480" y="478" font-size="26" fill="#243238" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Some homes use one filter in each return grille.</text><text x="480" y="508" font-size="26" fill="#243238" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Check the size at every location.</text></svg>