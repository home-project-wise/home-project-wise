<text x="530" y="475" font-size="20" font-weight="700" fill="#243238">Door</text><text x="830" y="170" font-size="20" font-weight="700" fill="#243238">Window</text>
<text x="480" y="522" font-size="22" fill="#243238" text-anchor="middle">Move one piece until the route runs straight.</text></svg>