<rect x="70" y="165" width="170" height="60" rx="10" fill="#D9C7B4" stroke="#8C735D" stroke-width="3"/><text x="155" y="203" font-size="20" font-weight="700" fill="#243238" text-anchor="middle">Sofa</text>
