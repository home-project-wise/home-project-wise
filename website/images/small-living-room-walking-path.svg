<text x="70" y="475" font-size="20" font-weight="700" fill="#243238">Door</text><text x="370" y="170" font-size="20" font-weight="700" fill="#243238">Window</text>
<rect x="500" y="90" width="420" height="400" rx="14" fill="#fff" stroke="#D8D2C4" stroke-width="3"/><rect x="500" y="90" width="420" height="52" rx="14" fill="#6F8F82"/><text x="710" y="126" font-size="26" font-weight="700" fill="#fff" text-anchor="middle">After: one clear route</text>
<rect x="530" y="165" width="170" height="60" rx="10" fill="#D9C7B4" stroke="#8C735D" stroke-width="3"/><text x="615" y="203" font-size="20" font-weight="700" fill="#243238" text-anchor="middle">Sofa</text>
