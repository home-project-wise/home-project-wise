<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Two top-down room plans: on the left a walking path that weaves around a chair and a table, on the right one straight, clear walking path from the door to the window" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif"><rect width="960" height="540" fill="#F7F5F0"/><text x="480" y="52" font-size="32" font-weight="700" fill="#243238" text-anchor="middle">Clear one walking path first</text>
