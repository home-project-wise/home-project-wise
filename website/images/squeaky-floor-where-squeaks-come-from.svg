<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d"><title id="t">Where squeaks come from in a wood floor</title><desc id="d">Cutaway of a wood floor with four numbered squeak sources: a loose nail, a gap between the subfloor and a joist, finish boards rubbing at a seam, and a duct touching the floor.</desc><rect width="960" height="540" rx="16" fill="#f7f4ee"/><text x="40" y="50" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="26" font-weight="bold" fill="#20312f" text-anchor="start">Four places where parts can rub and squeak</text><rect x="60" y="170" width="260" height="30" fill="#e3c9a0" stroke="#8a6d3b"/><rect x="320" y="170" width="260" height="30" fill="#ead3ad" stroke="#8a6d3b"/><line x1="450" y1="170" x2="450" y2="200" stroke="#8a6d3b" stroke-width="3"/><rect x="60" y="200" width="520" height="36" fill="#d1b283" stroke="#8a6d3b"/><rect x="240" y="248" width="90" height="170" fill="#c9a26a" stroke="#8a6d3b"/><rect x="240" y="236" width="90" height="12" fill="#c0392b" opacity=".35"/><rect x="480" y="250" width="100" height="80" rx="6" fill="#aab4b8" stroke="#5d6b70"/><rect x="500" y="236" width="60" height="14" fill="#7d8a8f"/><line x1="140" y1="160" x2="140" y2="232" stroke="#20312f" stroke-width="3"/><rect x="132" y="154" width="16" height="6" fill="#20312f"/><circle cx="140" cy="128" r="16" fill="#1f6f6b"/><text x="140" y="134" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text><circle cx="285" cy="452" r="16" fill="#1f6f6b"/><text x="285" y="458" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text><circle cx="450" cy="128" r="16" fill="#1f6f6b"/><text x="450" y="134" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text><circle cx="530" cy="372" r="16" fill="#1f6f6b"/><text x="530" y="378" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text><line x1="285" y1="436" x2="285" y2="420" stroke="#20312f"/><line x1="530" y1="356" x2="530" y2="332" stroke="#20312f"/><line x1="450" y1="144" x2="450" y2="168" stroke="#20312f"/><line x1="140" y1="144" x2="140" y2="152" stroke="#20312f"/><circle cx="660" cy="130" r="16" fill="#1f6f6b"/><text x="660" y="136" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text><text x="690" y="128" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="21" font-weight="bold" fill="#20312f" text-anchor="start">Loose nail</text><text x="690" y="152" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="16" font-weight="normal" fill="#4b5b58" text-anchor="start">Moves in its hole as you step</text><circle cx="660" cy="214" r="16" fill="#1f6f6b"/><text x="660" y="220" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text><text x="690" y="212" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="21" font-weight="bold" fill="#20312f" text-anchor="start">Gap</text><text x="690" y="236" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="16" font-weight="normal" fill="#4b5b58" text-anchor="start">Subfloor rubs the top of the joist</text><circle cx="660" cy="298" r="16" fill="#1f6f6b"/><text x="660" y="304" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text><text x="690" y="296" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="21" font-weight="bold" fill="#20312f" text-anchor="start">Boards</text><text x="690" y="320" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="16" font-weight="normal" fill="#4b5b58" text-anchor="start">Rub at a seam</text><circle cx="660" cy="382" r="16" fill="#1f6f6b"/><text x="660" y="388" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text><text x="690" y="380" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="21" font-weight="bold" fill="#20312f" text-anchor="start">Duct or vent</text><text x="690" y="404" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="16" font-weight="normal" fill="#4b5b58" text-anchor="start">Touches the floor above it</text><text x="60" y="486" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" font-weight="normal" fill="#4b5b58" text-anchor="start">Layers, top to bottom: finish floor, subfloor, joist.</text><text x="60" y="512" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="normal" fill="#4b5b58" text-anchor="start">Sources: This Old House and AHF “10 Causes of Floor Squeaks”.</text></svg>