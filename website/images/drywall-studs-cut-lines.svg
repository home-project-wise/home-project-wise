<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d"><title id="t">Studs to scale with two hole positions</title><desc id="d">Two wall panels drawn to scale. Left: a hole between studs 16 inches on center. Right: a hole cut back to the center line of a stud.</desc><rect width="960" height="540" rx="16" fill="#f7f4ee"/><text x="30" y="38" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="24" font-weight="bold" fill="#20312f" text-anchor="start">Studs to scale: 16 in apart, 1½ in wide</text><text x="30" y="68" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#4b5b58" text-anchor="start">Hole between studs</text><text x="500" y="68" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#4b5b58" text-anchor="start">Hole at a stud</text><rect x="30" y="80" width="420" height="380" fill="#ffffff" stroke="#b9b2a5" stroke-width="2"/><rect x="60" y="80" width="21" height="380" fill="#d9a86c"/><rect x="284" y="80" width="21" height="380" fill="#d9a86c"/><rect x="120" y="190" width="120" height="150" fill="#e8e1d4" stroke="#20312f" stroke-width="3"/><line x1="70.5" y1="405" x2="294.5" y2="405" stroke="#20312f" stroke-width="2"/><path d="M70.5 405 l10 -6 v12z M294.5 405 l-10 -6 v12z" fill="#20312f"/><text x="182" y="432" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="16" font-weight="normal" fill="#20312f" text-anchor="middle">16 in on center</text><text x="182" y="452" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="normal" fill="#4b5b58" text-anchor="middle">(24 in is also common)</text><text x="240" y="486" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" font-weight="bold" fill="#1f6f6b" text-anchor="middle">Add backing strips behind the old board</text><line x1="480" y1="70" x2="480" y2="500" stroke="#b9b2a5" stroke-dasharray="6 6"/><rect x="500" y="80" width="430" height="380" fill="#ffffff" stroke="#b9b2a5" stroke-width="2"/><rect x="520" y="80" width="21" height="380" fill="#d9a86c"/><rect x="530.5" y="190" width="170" height="150" fill="#e8e1d4" stroke="#20312f" stroke-width="3"/><line x1="530.5" y1="150" x2="530.5" y2="380" stroke="#c0392b" stroke-width="2" stroke-dasharray="7 5"/><text x="550" y="150" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="16" font-weight="bold" fill="#c0392b" text-anchor="start">Cut along the stud’s center line</text><text x="550" y="378" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="15" font-weight="normal" fill="#20312f" text-anchor="start">¾ in of stud face holds the old board</text><text x="550" y="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="15" font-weight="normal" fill="#20312f" text-anchor="start">¾ in holds the patch</text><text x="715" y="486" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" font-weight="bold" fill="#1f6f6b" text-anchor="middle">Screw the patch into the stud</text></svg>