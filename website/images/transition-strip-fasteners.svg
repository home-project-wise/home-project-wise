<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d"><title id="t">Where fasteners go on a floating floor</title><desc id="d">Left: a screw through floating planks, marked wrong. Right: a screw through a track into the subfloor between the floors, marked right.</desc><rect width="960" height="540" rx="16" fill="#f7f4ee"/><text x="40" y="50" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="26" font-weight="bold" fill="#20312f" text-anchor="start">Where the fasteners go</text><text x="40" y="84" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="20" font-weight="bold" fill="#c0392b" text-anchor="start">Wrong: through the floating floor</text><text x="520" y="84" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="20" font-weight="bold" fill="#1f6f6b" text-anchor="start">Right: through the track, into the subfloor</text><rect x="40" y="200" width="400" height="44" fill="#e9e4da" stroke="#8a8272" stroke-width="2"/><rect x="40" y="244" width="400" height="44" fill="#cfc3b0" stroke="#8a8272" stroke-width="2"/><line x1="260" y1="188" x2="260" y2="276" stroke="#c0392b" stroke-width="4"/><rect x="250" y="182" width="20" height="8" fill="#c0392b"/><path d="M300 150 l60 60 M360 150 l-60 60" stroke="#c0392b" stroke-width="8"/><text x="240" y="330" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#20312f" text-anchor="middle">The screw pins the planks.</text><text x="240" y="356" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" font-weight="normal" fill="#4b5b58" text-anchor="middle">They cannot expand and may buckle.</text><rect x="520" y="200" width="150" height="44" fill="#e9e4da" stroke="#8a8272" stroke-width="2"/><rect x="790" y="200" width="150" height="44" fill="#e9e4da" stroke="#8a8272" stroke-width="2"/><rect x="520" y="244" width="420" height="44" fill="#cfc3b0" stroke="#8a8272" stroke-width="2"/><rect x="675" y="232" width="110" height="12" fill="#6b8fa3" stroke="#3c5a6a"/><line x1="730" y1="222" x2="730" y2="276" stroke="#1f6f6b" stroke-width="4"/><rect x="722" y="218" width="16" height="6" fill="#1f6f6b"/><path d="M800 160 l22 26 l44 -54" stroke="#1f6f6b" stroke-width="10" fill="none"/><text x="730" y="330" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#20312f" text-anchor="middle">The floors stay free to move.</text><text x="730" y="356" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" font-weight="normal" fill="#4b5b58" text-anchor="middle">The track holds only the molding.</text><text x="480" y="430" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#1f6f6b" text-anchor="middle">Some makers glue the track to the subfloor instead. Glue never touches the floating planks.</text><text x="480" y="470" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" font-weight="normal" fill="#4b5b58" text-anchor="middle">Follow your strip maker’s method, and your plank maker’s rule on movement.</text></svg>