<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d"><title id="t">Four-step priority ladder for audit findings</title><desc id="d">Rank what you found in four steps. One: safety first, stop and refer gas, soot, electrical or moisture concerns. Two: simple visual checks, finish the walkthrough and fill in the log. Three: right-sized fixes that are low-cost and safe for you to do. Four: professional assessment when findings are unclear, hidden or large.</desc><rect width="960" height="540" fill="#F7F5F0"/><text x="480" y="44" font-size="30" fill="#243238" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Rank findings in this order</text><rect x="40" y="68" width="880" height="102" rx="10" fill="#BFD0C8" stroke="#243238" stroke-width="2"/><circle cx="96" cy="119" r="28" fill="#243238"/><text x="96" y="130" font-size="30" fill="#F7F5F0" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">1</text><text x="150" y="112" font-size="30" fill="#243238" font-weight="bold" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Safety first</text><text x="150" y="148" font-size="26" fill="#243238" font-weight="normal" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Stop and refer: gas, soot, electrical, moisture</text><rect x="40" y="182" width="880" height="102" rx="10" fill="#F7F5F0" stroke="#243238" stroke-width="2"/><circle cx="96" cy="233" r="28" fill="#243238"/><text x="96" y="244" font-size="30" fill="#F7F5F0" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">2</text><text x="150" y="226" font-size="30" fill="#243238" font-weight="bold" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Simple visual checks</text><text x="150" y="262" font-size="26" fill="#243238" font-weight="normal" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Finish the walkthrough and fill in the log</text><rect x="40" y="296" width="880" height="102" rx="10" fill="#BFD0C8" stroke="#243238" stroke-width="2"/><circle cx="96" cy="347" r="28" fill="#243238"/><text x="96" y="358" font-size="30" fill="#F7F5F0" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">3</text><text x="150" y="340" font-size="30" fill="#243238" font-weight="bold" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Right-sized fixes</text><text x="150" y="376" font-size="26" fill="#243238" font-weight="normal" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Only what is low-cost and safe for you</text><rect x="40" y="410" width="880" height="102" rx="10" fill="#F7F5F0" stroke="#243238" stroke-width="2"/><circle cx="96" cy="461" r="28" fill="#243238"/><text x="96" y="472" font-size="30" fill="#F7F5F0" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">4</text><text x="150" y="454" font-size="30" fill="#243238" font-weight="bold" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Professional assessment</text><text x="150" y="490" font-size="26" fill="#243238" font-weight="normal" text-anchor="start" font-family="Arial, Helvetica, sans-serif">When findings are unclear, hidden or large</text></svg>