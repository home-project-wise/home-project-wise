<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Wall elevation showing which paint sheen suits each surface: flat for the ceiling, matte or eggshell for walls, semi-gloss for trim and door, and satin or semi-gloss for cabinets" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif"><rect width="960" height="540" fill="#F7F5F0"/><text x="480" y="52" font-size="32" font-weight="700" fill="#243238" text-anchor="middle">One room, several sheens</text>
<rect x="80" y="80" width="800" height="50" fill="#F1EEE6" stroke="#8B9B96" stroke-width="3"/><text x="480" y="112" font-size="22" font-weight="700" fill="#243238" text-anchor="middle">Ceiling: flat</text>
<rect x="80" y="130" width="800" height="290" fill="#E8E2D3" stroke="#8B9B96" stroke-width="3"/><text x="400" y="185" font-size="24" font-weight="700" fill="#243238" text-anchor="middle">Walls: matte or eggshell</text><text x="400" y="217" font-size="20" fill="#243238" text-anchor="middle">Busy walls: eggshell or satin/pearl</text>
<rect x="110" y="250" width="230" height="140" rx="8" fill="#C9D8D1" stroke="#6F8F82" stroke-width="3"/><line x1="225" y1="250" x2="225" y2="390" stroke="#6F8F82" stroke-width="3"/><text x="225" y="312" font-size="20" font-weight="700" fill="#243238" text-anchor="middle">Cabinets</text><text x="225" y="340" font-size="18" fill="#243238" text-anchor="middle">satin or semi-gloss</text>
<rect x="690" y="150" width="160" height="270" rx="6" fill="#FFFFFF" stroke="#243238" stroke-width="4"/><rect x="710" y="172" width="120" height="100" rx="4" fill="none" stroke="#B8C2BE" stroke-width="3"/><rect x="710" y="292" width="120" height="110" rx="4" fill="none" stroke="#B8C2BE" stroke-width="3"/><text x="770" y="232" font-size="20" font-weight="700" fill="#243238" text-anchor="middle">Door</text><text x="770" y="256" font-size="18" fill="#243238" text-anchor="middle">semi-gloss</text>
<rect x="80" y="420" width="800" height="40" fill="#FFFFFF" stroke="#243238" stroke-width="3"/><text x="370" y="448" font-size="22" font-weight="700" fill="#243238" text-anchor="middle">Trim: semi-gloss</text>
<text x="480" y="508" font-size="18" fill="#5B6B66" text-anchor="middle">Maker’s guidance, based on Benjamin Moore’s chart. Check your brand’s label.</text></svg>