<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Decision flow showing where each permanent counter item belongs, with a reason for each"><rect width="960" height="540" fill="#F7F5F0"/><text x="480" y="50" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700" fill="#243238" text-anchor="middle">Where does each counter item belong?</text><rect x="40" y="95" width="420" height="88" rx="14" fill="#fff" stroke="#243238" stroke-width="2"/><text x="60" y="133" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#243238" text-anchor="start">Used most days, saves a step</text><text x="60" y="163" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="400" fill="#566266" text-anchor="start">e.g. toaster, coffee maker</text><path d="M465 139 L540 139" stroke="#243238" stroke-width="3" fill="none"/><polygon points="540,139 528,131 528,147" fill="#243238"/><rect x="550" y="95" width="370" height="88" rx="14" fill="#D97745" stroke="#a8481d" stroke-width="2"/><text x="570" y="133" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="start">Counter, outside the</text><text x="570" y="163" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="start">main preparation path</text><rect x="40" y="203" width="420" height="88" rx="14" fill="#fff" stroke="#243238" stroke-width="2"/><text x="60" y="241" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#243238" text-anchor="start">Used a few times a week</text><path d="M465 247 L540 247" stroke="#243238" stroke-width="3" fill="none"/><polygon points="540,247 528,239 528,255" fill="#243238"/><rect x="550" y="203" width="370" height="88" rx="14" fill="#E4ECE8" stroke="#243238" stroke-width="2"/><text x="570" y="255" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#243238" text-anchor="start">Nearby cabinet or shelf</text><rect x="40" y="311" width="420" height="88" rx="14" fill="#fff" stroke="#243238" stroke-width="2"/><text x="60" y="349" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#243238" text-anchor="start">Used a few times a month</text><text x="60" y="379" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="400" fill="#566266" text-anchor="start">e.g. waffle maker</text><path d="M465 355 L540 355" stroke="#243238" stroke-width="3" fill="none"/><polygon points="540,355 528,347 528,363" fill="#243238"/><rect x="550" y="311" width="370" height="88" rx="14" fill="#E4ECE8" stroke="#243238" stroke-width="2"/><text x="570" y="349" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#243238" text-anchor="start">Storage, away from</text><text x="570" y="379" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#243238" text-anchor="start">the active zone</text><rect x="40" y="419" width="420" height="88" rx="14" fill="#fff" stroke="#243238" stroke-width="2"/><text x="60" y="457" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#243238" text-anchor="start">Mail, papers, chargers</text><path d="M465 463 L540 463" stroke="#243238" stroke-width="3" fill="none"/><polygon points="540,463 528,455 528,471" fill="#243238"/><rect x="550" y="419" width="370" height="88" rx="14" fill="#E4ECE8" stroke="#243238" stroke-width="2"/><text x="570" y="471" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#243238" text-anchor="start">A different landing zone</text></svg>