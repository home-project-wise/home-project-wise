<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d"><title id="t">Target gaps around an interior door</title><desc id="d">A door in its frame with 1/16 inch of clearance on the hinge side and 1/8 inch at the head and latch side, and a frame 3/16 inch wider than the door.</desc><rect width="960" height="540" rx="16" fill="#f7f4ee"/><text x="40" y="50" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="26" font-weight="bold" fill="#20312f" text-anchor="start">Target gaps for a door in its frame</text><rect x="150" y="90" width="300" height="360" fill="#ece3d2" stroke="#8a8272" stroke-width="3"/><rect x="172" y="112" width="256" height="338" fill="#f9f6ef" stroke="#8a8272" stroke-width="2"/><rect x="172" y="112" width="6" height="338" fill="#e8c27a"/><rect x="410" y="270" width="12" height="40" rx="6" fill="#8d979c"/><text x="300" y="82" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" font-weight="bold" fill="#1f6f6b" text-anchor="middle">Head: 1/8 in</text><text x="95" y="280" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="16" font-weight="bold" fill="#20312f" text-anchor="middle">Hinge side:</text><text x="95" y="302" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="16" font-weight="bold" fill="#1f6f6b" text-anchor="middle">1/16 in</text><text x="475" y="296" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="16" font-weight="bold" fill="#1f6f6b" text-anchor="start">Latch side: 1/8 in</text><rect x="640" y="130" width="290" height="80" rx="10" fill="#ffffff" stroke="#b9b2a5"/><circle cx="668" cy="170" r="16" fill="#1f6f6b"/><text x="668" y="176" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text><text x="694" y="166" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#20312f" text-anchor="start">Frame width</text><text x="694" y="190" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="normal" fill="#4b5b58" text-anchor="start">3/16 in wider than the door</text><rect x="640" y="230" width="290" height="80" rx="10" fill="#ffffff" stroke="#b9b2a5"/><circle cx="668" cy="270" r="16" fill="#1f6f6b"/><text x="668" y="276" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text><text x="694" y="266" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#20312f" text-anchor="start">Frame height</text><text x="694" y="290" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="normal" fill="#4b5b58" text-anchor="start">Door clears floor and head gap</text><rect x="640" y="330" width="290" height="80" rx="10" fill="#ffffff" stroke="#b9b2a5"/><circle cx="668" cy="370" r="16" fill="#1f6f6b"/><text x="668" y="376" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text><text x="694" y="366" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#20312f" text-anchor="start">Where it rubs</text><text x="694" y="390" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="normal" fill="#4b5b58" text-anchor="start">Mark it before touching a tool</text><text x="480" y="492" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" font-weight="bold" fill="#c0392b" text-anchor="middle">Gaps are from JELD-WEN’s interior slab instructions. Your door’s maker may differ.</text><text x="480" y="518" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="normal" fill="#4b5b58" text-anchor="middle">Source: JELD-WEN, Installation Instructions for Interior Door Slabs (JII110, 2014).</text></svg>