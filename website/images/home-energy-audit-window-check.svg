<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d"><title id="t">Draft check points on a double-hung window</title><desc id="d">Front view of a double-hung window with three numbered check points: the meeting rail and lock where the two sashes meet, the side edges where each sash meets the frame, and the sill and trim joints. Two simple tests: close the sash on a strip of paper and see whether it slides out freely, or shine a flashlight along the edges at night while a helper looks from outside for light showing through.</desc><rect width="960" height="540" fill="#F7F5F0"/><text x="30" y="44" font-size="28" fill="#243238" font-weight="bold" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Where to look on a double-hung window</text><rect x="90" y="80" width="260" height="370" fill="#EFEBE1" stroke="#243238" stroke-width="3"/><rect x="110" y="100" width="220" height="150" fill="#DCE6E8" stroke="#243238" stroke-width="2"/><rect x="110" y="262" width="220" height="168" fill="#DCE6E8" stroke="#243238" stroke-width="2"/><rect x="104" y="250" width="232" height="14" fill="#8AA89B" stroke="#243238" stroke-width="2"/><rect x="206" y="244" width="28" height="12" rx="4" fill="#243238"/><rect x="76" y="450" width="288" height="16" fill="#BFD0C8" stroke="#243238" stroke-width="2"/><line x1="336" y1="257" x2="392" y2="257" stroke="#243238" stroke-width="3"/><circle cx="412" cy="257" r="20" fill="#243238"/><text x="412" y="265" font-size="24" fill="#F7F5F0" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">1</text><line x1="104" y1="340" x2="52" y2="340" stroke="#243238" stroke-width="3"/><circle cx="34" cy="340" r="20" fill="#243238"/><text x="34" y="348" font-size="24" fill="#F7F5F0" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">2</text><line x1="300" y1="458" x2="392" y2="458" stroke="#243238" stroke-width="3"/><circle cx="412" cy="458" r="20" fill="#243238"/><text x="412" y="466" font-size="24" fill="#F7F5F0" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">3</text><text x="470" y="96" font-size="26" fill="#243238" font-weight="bold" text-anchor="start" font-family="Arial, Helvetica, sans-serif">1  Meeting rail and lock</text><text x="470" y="134" font-size="26" fill="#243238" font-weight="bold" text-anchor="start" font-family="Arial, Helvetica, sans-serif">2  Sash edges at the frame</text><text x="470" y="172" font-size="26" fill="#243238" font-weight="bold" text-anchor="start" font-family="Arial, Helvetica, sans-serif">3  Sill and trim joints</text><rect x="470" y="196" width="450" height="150" rx="10" fill="#BFD0C8" stroke="#243238" stroke-width="2"/><text x="490" y="232" font-size="26" fill="#243238" font-weight="bold" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Paper test</text><text x="490" y="266" font-size="24" fill="#243238" font-weight="normal" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Close the sash on a strip of paper.</text><text x="490" y="296" font-size="24" fill="#243238" font-weight="normal" text-anchor="start" font-family="Arial, Helvetica, sans-serif">If it slides out with no drag,</text><text x="490" y="326" font-size="24" fill="#243238" font-weight="normal" text-anchor="start" font-family="Arial, Helvetica, sans-serif">that edge may leak. Note it.</text><rect x="470" y="360" width="450" height="160" rx="10" fill="#F7F5F0" stroke="#243238" stroke-width="2"/><text x="490" y="396" font-size="26" fill="#243238" font-weight="bold" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Light test</text><text x="490" y="428" font-size="24" fill="#243238" font-weight="normal" text-anchor="start" font-family="Arial, Helvetica, sans-serif">At night, shine a flashlight along</text><text x="490" y="458" font-size="24" fill="#243238" font-weight="normal" text-anchor="start" font-family="Arial, Helvetica, sans-serif">the edges while a helper looks</text><text x="490" y="488" font-size="24" fill="#243238" font-weight="normal" text-anchor="start" font-family="Arial, Helvetica, sans-serif">from outside. Light showing</text><text x="490" y="518" font-size="24" fill="#243238" font-weight="normal" text-anchor="start" font-family="Arial, Helvetica, sans-serif">through is a gap. Note it.</text></svg>