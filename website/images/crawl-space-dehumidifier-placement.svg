<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="t d"><title id="t">Dehumidifier placement in a crawl space</title><desc id="d">Diagram showing a crawl-space-rated dehumidifier on a stable raised base, open airflow clearance, and a continuously sloped drain hose.</desc><rect width="960" height="420" rx="24" fill="#f4f7f4"/><text x="48" y="55" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#243c32">Install for safe airflow and drainage</text><rect x="70" y="300" width="820" height="45" rx="6" fill="#ddceb2"/><rect x="160" y="165" width="240" height="135" rx="16" fill="#dce5df" stroke="#536c5c" stroke-width="5"/><rect x="190" y="190" width="80" height="75" rx="8" fill="#a6bbb0"/><path d="M300 200 H365 M300 220 H365 M300 240 H365" stroke="#536c5c" stroke-width="6"/><rect x="140" y="285" width="280" height="15" rx="5" fill="#8b9c92"/><path d="M400 270 C500 270 510 315 615 315 H790" fill="none" stroke="#3d8293" stroke-width="8" stroke-linecap="round"/><path d="M770 300 L795 315 L770 330" fill="none" stroke="#3d8293" stroke-width="6"/><g font-family="Arial,sans-serif" font-size="19" fill="#243c32"><text x="155" y="130" font-weight="700">Crawl-space-rated unit</text><text x="480" y="190">Keep intake and exhaust clear</text><path d="M480 205 L430 225" stroke="#536c5c" stroke-width="3"/><text x="555" y="270">Continuous drain hose</text><text x="655" y="355">Approved drain point</text><text x="75" y="390" font-size="17">Follow the unit manual, electrical safety requirements, and local drainage rules.</text></g></svg>