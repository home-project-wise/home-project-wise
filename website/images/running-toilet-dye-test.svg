<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Dye test diagram: food colouring in the tank and a clear bowl after the wait means no leak, coloured bowl water means a leak" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif"><rect width="960" height="540" fill="#F7F5F0"/><text x="480" y="42" font-size="30" font-weight="700" fill="#243238" text-anchor="middle">The dye test</text>
<rect x="40" y="90" width="410" height="400" rx="14" fill="#fff" stroke="#243238" stroke-width="2.5"/>
<rect x="510" y="90" width="410" height="400" rx="14" fill="#fff" stroke="#243238" stroke-width="2.5"/>
<text x="245" y="130" font-size="24" font-weight="700" fill="#6F8F82" text-anchor="middle">No leak</text>
<rect x="125" y="160" width="240" height="90" rx="8" fill="#F3D7D2" stroke="#243238" stroke-width="3"/><text x="245" y="212" font-size="19" font-weight="700" fill="#243238" text-anchor="middle">Tank: dye added</text>
<path d="M160 290 Q155 400 245 410 Q335 400 330 290 Z" fill="#E4ECE8" stroke="#243238" stroke-width="3"/><text x="245" y="360" font-size="19" font-weight="700" fill="#243238" text-anchor="middle">Bowl stays clear</text>
<text x="245" y="460" font-size="18" font-weight="500" fill="#5b6b70" text-anchor="middle">Wait, do not flush</text>
<text x="715" y="130" font-size="24" font-weight="700" fill="#B5482F" text-anchor="middle">Leak</text>
<rect x="595" y="160" width="240" height="90" rx="8" fill="#F3D7D2" stroke="#243238" stroke-width="3"/><text x="715" y="212" font-size="19" font-weight="700" fill="#243238" text-anchor="middle">Tank: dye added</text>
<path d="M630 290 Q625 400 715 410 Q805 400 800 290 Z" fill="#F3D7D2" stroke="#B5482F" stroke-width="4"/><text x="715" y="360" font-size="19" font-weight="700" fill="#B5482F" text-anchor="middle">Dye in the bowl</text>
<text x="715" y="460" font-size="18" font-weight="500" fill="#5b6b70" text-anchor="middle">Water is leaking out of the tank</text>
</svg>
