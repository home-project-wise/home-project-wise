<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d"><title id="t">Read the pattern first</title><desc id="d">Decision chart. One device that always drops points to signal, power and firmware, Steps 2 and 3. Several devices at once point to the router, Steps 3 to 5. Everything after a change points to re-adding devices on the 2.4 GHz name, Step 4.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#243238"/></marker></defs><rect width="960" height="540" fill="#F7F5F0"/><text x="480" y="62" font-size="32" fill="#243238" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Read the pattern first</text><rect x="330" y="92" width="300" height="64" rx="12" fill="#FFFFFF" stroke="#243238" stroke-width="3"/><text x="480" y="132" font-size="22" fill="#243238" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">What keeps dropping?</text><line x1="480" y1="156" x2="170" y2="238" stroke="#243238" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><rect x="40" y="240" width="260" height="128" rx="12" fill="#FFFFFF" stroke="#6F8F82" stroke-width="3"/><text x="170" y="274" font-size="20" fill="#243238" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">One device, always</text><text x="170" y="298" font-size="20" fill="#243238" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">the same one</text><rect x="40" y="392" width="260" height="118" rx="12" fill="#FFFFFF" stroke="#6F8F82" stroke-width="3"/><text x="170" y="426" font-size="18" fill="#243238" font-weight="normal" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Check signal, power and</text><text x="170" y="448" font-size="18" fill="#243238" font-weight="normal" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">firmware</text><text x="170" y="494" font-size="18" fill="#4F6F62" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Steps 2 and 3</text><line x1="480" y1="156" x2="480" y2="238" stroke="#243238" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><rect x="350" y="240" width="260" height="128" rx="12" fill="#FFFFFF" stroke="#D97745" stroke-width="3"/><text x="480" y="274" font-size="20" fill="#243238" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Several devices, at</text><text x="480" y="298" font-size="20" fill="#243238" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">about the same time</text><rect x="350" y="392" width="260" height="118" rx="12" fill="#FFFFFF" stroke="#D97745" stroke-width="3"/><text x="480" y="426" font-size="18" fill="#243238" font-weight="normal" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Check the router:</text><text x="480" y="448" font-size="18" fill="#243238" font-weight="normal" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">restart, band, router</text><text x="480" y="470" font-size="18" fill="#243238" font-weight="normal" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">settings</text><text x="480" y="494" font-size="18" fill="#B04F1F" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Steps 3 to 5</text><line x1="480" y1="156" x2="790" y2="238" stroke="#243238" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><rect x="660" y="240" width="260" height="128" rx="12" fill="#FFFFFF" stroke="#243238" stroke-width="3"/><text x="790" y="274" font-size="20" fill="#243238" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Everything, right</text><text x="790" y="298" font-size="20" fill="#243238" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">after a change</text><rect x="660" y="392" width="260" height="118" rx="12" fill="#FFFFFF" stroke="#243238" stroke-width="3"/><text x="790" y="426" font-size="18" fill="#243238" font-weight="normal" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">New router, Wi-Fi name</text><text x="790" y="448" font-size="18" fill="#243238" font-weight="normal" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">or password: add</text><text x="790" y="470" font-size="18" fill="#243238" font-weight="normal" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">devices again on the</text><text x="790" y="492" font-size="18" fill="#243238" font-weight="normal" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">2.4 GHz name</text><text x="790" y="494" font-size="18" fill="#B04F1F" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Step 4</text></svg>