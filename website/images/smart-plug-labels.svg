<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Smart plug label showing 15 amps and 1800 watts next to an appliance label showing 12.5 amps, with the formula volts times amps equals watts" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif"><rect width="960" height="540" fill="#F7F5F0"/><text x="480" y="50" font-size="30" font-weight="700" fill="#243238" text-anchor="middle">Two labels, one multiplication</text><rect x="50" y="80" width="400" height="300" rx="14" fill="#fff" stroke="#D8D2C4" stroke-width="3"/><text x="250" y="120" font-size="24" font-weight="700" fill="#243238" text-anchor="middle">Smart plug label</text><rect x="80" y="140" width="340" height="60" rx="14" fill="#F3F0E8" stroke="#D8D2C4" stroke-width="3"/><text x="250" y="180" font-size="26" font-weight="600" fill="#243238" text-anchor="middle">120 V  ~  60 Hz</text><rect x="80" y="215" width="340" height="70" rx="14" fill="#FFF1E8" stroke="#D97745" stroke-width="3"/><text x="250" y="262" font-size="28" font-weight="700" fill="#D97745" text-anchor="middle">Max 15 A  /  1800 W</text><text x="250" y="325" font-size="21" font-weight="500" fill="#243238" text-anchor="middle">This is the limit of the plug.</text><text x="250" y="355" font-size="21" font-weight="500" fill="#243238" text-anchor="middle">Not the limit of the appliance.</text><rect x="510" y="80" width="400" height="300" rx="14" fill="#fff" stroke="#D8D2C4" stroke-width="3"/><text x="710" y="120" font-size="24" font-weight="700" fill="#243238" text-anchor="middle">Appliance label</text><rect x="540" y="140" width="340" height="60" rx="14" fill="#F3F0E8" stroke="#D8D2C4" stroke-width="3"/><text x="710" y="180" font-size="26" font-weight="600" fill="#243238" text-anchor="middle">Input: 120 V  ~  60 Hz</text><rect x="540" y="215" width="340" height="70" rx="14" fill="#EEF4F1" stroke="#6F8F82" stroke-width="3"/><text x="710" y="262" font-size="28" font-weight="700" fill="#6F8F82" text-anchor="middle">12.5 A   (or 1500 W)</text><text x="710" y="325" font-size="21" font-weight="500" fill="#243238" text-anchor="middle">Usually on the back or the plug.</text><text x="710" y="355" font-size="21" font-weight="500" fill="#243238" text-anchor="middle">If it shows amps, multiply.</text><rect x="50" y="410" width="860" height="100" rx="14" fill="#243238" stroke="#243238" stroke-width="3"/><text x="480" y="452" font-size="28" font-weight="700" fill="#fff" text-anchor="middle">Volts x Amps = Watts</text><text x="480" y="492" font-size="22" font-weight="500" fill="#F7F5F0" text-anchor="middle">US: 120 V x 15 A = 1800 W      UK/EU: 230 V x 10 A = 2300 W</text></svg>