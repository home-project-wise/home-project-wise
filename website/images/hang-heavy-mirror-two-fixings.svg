<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Wall diagram showing a mirror hung from two fixings, one screwed into a stud and one using a toggle anchor in the hollow drywall" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif">
<rect width="960" height="540" fill="#F7F5F0"/>
<text x="480" y="42" font-size="30" font-weight="700" fill="#243238" text-anchor="middle">Two fixings, each doing its own job</text>
<rect x="60" y="80" width="560" height="420" rx="6" fill="#fff" stroke="#243238" stroke-width="3"/>
<rect x="130" y="80" width="40" height="420" fill="#E4D9C3" stroke="#B9A98A" stroke-width="2" stroke-dasharray="8 6"/>
<text x="150" y="518" font-size="18" font-weight="700" fill="#243238" text-anchor="middle">Stud</text>
<rect x="210" y="230" width="300" height="230" rx="8" fill="#E4ECE8" stroke="#243238" stroke-width="4"/>
<circle cx="150" cy="190" r="10" fill="#6F8F82"/>
<line x1="150" y1="190" x2="250" y2="248" stroke="#243238" stroke-width="3"/>
<circle cx="470" cy="190" r="10" fill="#B5482F"/>
<line x1="470" y1="190" x2="470" y2="248" stroke="#243238" stroke-width="3"/>
<text x="150" y="160" font-size="19" font-weight="700" fill="#6F8F82" text-anchor="middle">Screw into stud</text>
<text x="470" y="160" font-size="19" font-weight="700" fill="#B5482F" text-anchor="middle">Rated toggle anchor</text>
<text x="360" y="355" font-size="26" font-weight="700" fill="#243238" text-anchor="middle">Mirror</text>
<text x="800" y="170" font-size="22" font-weight="700" fill="#243238" text-anchor="middle">Why two?</text>
<text x="800" y="205" font-size="18" font-weight="500" fill="#5b6b70" text-anchor="middle">More security, and</text>
<text x="800" y="230" font-size="18" font-weight="500" fill="#5b6b70" text-anchor="middle">room to adjust the</text>
<text x="800" y="255" font-size="18" font-weight="500" fill="#5b6b70" text-anchor="middle">position</text>
<text x="800" y="320" font-size="18" font-weight="700" fill="#243238" text-anchor="middle">No stud where you need</text>
<text x="800" y="345" font-size="18" font-weight="700" fill="#243238" text-anchor="middle">one? Use anchors rated</text>
<text x="800" y="370" font-size="18" font-weight="700" fill="#243238" text-anchor="middle">for the weight.</text>
</svg>
