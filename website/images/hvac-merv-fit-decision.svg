<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d"><title id="t">Decision path for fit, depth and MERV</title><desc id="d">Three checks before you buy an HVAC filter. One: does the old filter fit snugly? If yes buy the same printed size, if no measure the slot. Two: is there room for a thicker filter? If yes it can be an option, if no keep the slot depth. Three: does the manual or label give a MERV limit? If yes stay within it, if no keep your current MERV and ask an HVAC technician. Never force a filter into a slot it does not fit.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#243238"/></marker></defs><rect width="960" height="540" fill="#F7F5F0"/><text x="480" y="44" font-size="30" fill="#243238" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Before you buy: three checks</text><rect x="40" y="68" width="410" height="118" rx="10" fill="#BFD0C8" stroke="#243238" stroke-width="2"/><text x="60" y="114" font-size="25" fill="#243238" font-weight="bold" text-anchor="start" font-family="Arial, Helvetica, sans-serif">1  Does the old filter fit</text><text x="60" y="146" font-size="25" fill="#243238" font-weight="normal" text-anchor="start" font-family="Arial, Helvetica, sans-serif">snugly in the slot?</text><line x1="454" y1="127" x2="500" y2="127" stroke="#243238" stroke-width="3" marker-end="url(#ar)"/><rect x="504" y="68" width="416" height="118" rx="10" fill="#F7F5F0" stroke="#243238" stroke-width="2"/><text x="522" y="120" font-size="24" fill="#243238" font-weight="normal" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Yes: buy the same printed size.</text><text x="522" y="156" font-size="24" fill="#243238" font-weight="normal" text-anchor="start" font-family="Arial, Helvetica, sans-serif">No: measure the slot.</text><rect x="40" y="200" width="410" height="118" rx="10" fill="#F7F5F0" stroke="#243238" stroke-width="2"/><text x="60" y="246" font-size="25" fill="#243238" font-weight="bold" text-anchor="start" font-family="Arial, Helvetica, sans-serif">2  Is there room for a</text><text x="60" y="278" font-size="25" fill="#243238" font-weight="normal" text-anchor="start" font-family="Arial, Helvetica, sans-serif">thicker filter in the slot?</text><line x1="454" y1="259" x2="500" y2="259" stroke="#243238" stroke-width="3" marker-end="url(#ar)"/><rect x="504" y="200" width="416" height="118" rx="10" fill="#F7F5F0" stroke="#243238" stroke-width="2"/><text x="522" y="252" font-size="24" fill="#243238" font-weight="normal" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Yes: thicker can be an option.</text><text x="522" y="288" font-size="24" fill="#243238" font-weight="normal" text-anchor="start" font-family="Arial, Helvetica, sans-serif">No: keep the slot’s depth.</text><rect x="40" y="332" width="410" height="118" rx="10" fill="#BFD0C8" stroke="#243238" stroke-width="2"/><text x="60" y="378" font-size="25" fill="#243238" font-weight="bold" text-anchor="start" font-family="Arial, Helvetica, sans-serif">3  Does the manual or</text><text x="60" y="410" font-size="25" fill="#243238" font-weight="normal" text-anchor="start" font-family="Arial, Helvetica, sans-serif">label give a MERV limit?</text><line x1="454" y1="391" x2="500" y2="391" stroke="#243238" stroke-width="3" marker-end="url(#ar)"/><rect x="504" y="332" width="416" height="118" rx="10" fill="#F7F5F0" stroke="#243238" stroke-width="2"/><text x="522" y="372" font-size="24" fill="#243238" font-weight="normal" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Yes: stay within that limit.</text><text x="522" y="402" font-size="24" fill="#243238" font-weight="normal" text-anchor="start" font-family="Arial, Helvetica, sans-serif">No: keep your current MERV</text><text x="522" y="432" font-size="24" fill="#243238" font-weight="normal" text-anchor="start" font-family="Arial, Helvetica, sans-serif">and ask a technician.</text><rect x="40" y="464" width="880" height="58" rx="10" fill="#243238"/><text x="480" y="502" font-size="27" fill="#F7F5F0" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Never force a filter into a slot it does not fit.</text></svg>