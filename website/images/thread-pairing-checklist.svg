<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d"><title id="t">Pairing checklist for a Thread accessory that will not pair</title><desc id="d">Five checks in order: the border router is plugged in and online, its software and your app are updated, phone and hub share the same Wi-Fi, Bluetooth is on while pairing, then restart the app and the border router.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#243238"/></marker></defs><rect width="960" height="540" fill="#F7F5F0"/><text x="480" y="54" font-size="31" fill="#243238" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">If a Thread accessory will not pair</text><rect x="50" y="86" width="860" height="70" rx="10" fill="#BFD0C8" stroke="#243238" stroke-width="2"/><circle cx="100" cy="121" r="24" fill="#243238"/><text x="100" y="130" font-size="26" fill="#F7F5F0" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">1</text><text x="150" y="130" font-size="27" fill="#243238" font-weight="normal" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Border router is plugged in and online</text><rect x="50" y="172" width="860" height="70" rx="10" fill="#F7F5F0" stroke="#243238" stroke-width="2"/><circle cx="100" cy="207" r="24" fill="#243238"/><text x="100" y="216" font-size="26" fill="#F7F5F0" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">2</text><text x="150" y="216" font-size="27" fill="#243238" font-weight="normal" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Its software and your app are updated</text><rect x="50" y="258" width="860" height="70" rx="10" fill="#BFD0C8" stroke="#243238" stroke-width="2"/><circle cx="100" cy="293" r="24" fill="#243238"/><text x="100" y="302" font-size="26" fill="#F7F5F0" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">3</text><text x="150" y="302" font-size="27" fill="#243238" font-weight="normal" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Phone and hub are on the same Wi-Fi</text><rect x="50" y="344" width="860" height="70" rx="10" fill="#F7F5F0" stroke="#243238" stroke-width="2"/><circle cx="100" cy="379" r="24" fill="#243238"/><text x="100" y="388" font-size="26" fill="#F7F5F0" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">4</text><text x="150" y="388" font-size="27" fill="#243238" font-weight="normal" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Bluetooth is on while you pair</text><rect x="50" y="430" width="860" height="70" rx="10" fill="#BFD0C8" stroke="#243238" stroke-width="2"/><circle cx="100" cy="465" r="24" fill="#243238"/><text x="100" y="474" font-size="26" fill="#F7F5F0" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">5</text><text x="150" y="474" font-size="27" fill="#243238" font-weight="normal" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Restart the app and the border router</text></svg>