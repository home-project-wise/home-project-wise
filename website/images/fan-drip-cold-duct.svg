<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Side view of a bathroom fan duct crossing a cold attic: warm humid air cools, water forms on the inside of the duct wall and runs back toward the fan when the duct slopes the wrong way" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif"><rect width="960" height="540" fill="#F7F5F0"/><text x="480" y="52" font-size="32" font-weight="700" fill="#243238" text-anchor="middle">Why a cold duct drips</text><rect x="40" y="90" width="830" height="340" rx="12" fill="#E3EEF4"/><text x="60" y="122" font-size="22" font-weight="700" fill="#2F6F8F">Cold attic</text><rect x="800" y="205" width="20" height="95" fill="#D8D2C4"/><text x="880" y="196" font-size="20" font-weight="600" fill="#243238" text-anchor="middle">Outside</text><polygon points="150,290 800,222 800,264 150,332" fill="#fff" stroke="#9A9486" stroke-width="3"/><path d="M190 312 L720 256" fill="none" stroke="#D97745" stroke-width="5" stroke-dasharray="14 10"/><path d="M700 246 l26 8 l-14 16" fill="none" stroke="#D97745" stroke-width="5"/><circle cx="300" cy="305" r="7" fill="#2F6F8F"/><circle cx="420" cy="292" r="7" fill="#2F6F8F"/><circle cx="540" cy="279" r="7" fill="#2F6F8F"/><circle cx="650" cy="268" r="7" fill="#2F6F8F"/><path d="M570 360 L215 396" fill="none" stroke="#2F6F8F" stroke-width="4" stroke-dasharray="10 8"/><path d="M233 382 l-22 14 l24 8" fill="none" stroke="#2F6F8F" stroke-width="4"/><rect x="60" y="332" width="160" height="98" rx="10" fill="#fff" stroke="#9A9486" stroke-width="3"/><text x="140" y="390" font-size="24" font-weight="700" fill="#243238" text-anchor="middle">Fan</text><rect x="40" y="430" width="830" height="14" fill="#243238"/><text x="455" y="492" font-size="20" fill="#243238" text-anchor="middle">Bathroom below</text><text x="470" y="196" font-size="22" font-weight="700" fill="#B4541F" text-anchor="middle">Warm, humid shower air</text><text x="690" y="308" font-size="20" font-weight="600" fill="#243238" text-anchor="middle">Water forms on</text><text x="690" y="332" font-size="20" font-weight="600" fill="#243238" text-anchor="middle">the cold wall</text><text x="430" y="418" font-size="20" font-weight="600" fill="#2F6F8F" text-anchor="middle">Runs back toward the fan</text></svg>