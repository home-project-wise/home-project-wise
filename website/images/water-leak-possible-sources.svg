<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Cutaway of a house showing where leak water can come from: supply pipe, waste pipe, appliance hose, roof or outside" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif"><rect width="960" height="540" fill="#F7F5F0"/><text x="480" y="40" font-size="30" font-weight="700" fill="#243238" text-anchor="middle">Where leak water can come from</text><polygon points="150,200 380,100 610,200" fill="#ECE8DD" stroke="#B9B4A6" stroke-width="3"/><rect x="170" y="200" width="420" height="230" fill="#fff" stroke="#B9B4A6" stroke-width="3"/><line x1="170" y1="430" x2="590" y2="430" stroke="#B9B4A6" stroke-width="5"/><rect x="215" y="330" width="120" height="14" fill="#243238"/><rect x="225" y="344" width="100" height="86" fill="#ECE8DD" stroke="#B9B4A6" stroke-width="2"/><line x1="260" y1="344" x2="260" y2="240" stroke="#3f7fa6" stroke-width="7"/><line x1="300" y1="344" x2="300" y2="410" stroke="#8d8a80" stroke-width="7" stroke-dasharray="12 8"/><line x1="300" y1="410" x2="560" y2="410" stroke="#8d8a80" stroke-width="7" stroke-dasharray="12 8"/><rect x="440" y="340" width="100" height="90" rx="8" fill="#fff" stroke="#243238" stroke-width="3"/><circle cx="490" cy="388" r="24" fill="none" stroke="#243238" stroke-width="3"/><path d="M440 360 C400 360 390 300 340 300" fill="none" stroke="#3f7fa6" stroke-width="5"/><line x1="110" y1="440" x2="170" y2="440" stroke="#3f7fa6" stroke-width="7"/><line x1="110" y1="440" x2="110" y2="500" stroke="#3f7fa6" stroke-width="7"/><path d="M300 118 q12 22 0 34 q-12 -12 0 -34z" fill="#3f7fa6"/><circle cx="262" cy="270" r="16" fill="#B5482F"/><text x="262" y="276" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">1</text><circle cx="430" cy="395" r="16" fill="#B5482F"/><text x="430" y="401" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">2</text><circle cx="380" cy="330" r="16" fill="#B5482F"/><text x="380" y="336" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">3</text><circle cx="300" cy="95" r="16" fill="#B5482F"/><text x="300" y="101" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">4</text><circle cx="60" cy="470" r="16" fill="#B5482F"/><text x="60" y="476" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">4</text><rect x="660" y="110" width="270" height="260" rx="12" fill="#fff" stroke="#D8D3C5" stroke-width="2"/><circle cx="692" cy="164" r="14" fill="#B5482F"/><text x="692" y="170" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="718" y="170" font-size="20" font-weight="600" fill="#243238" text-anchor="start">Supply pipe</text><circle cx="692" cy="224" r="14" fill="#B5482F"/><text x="692" y="230" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="718" y="230" font-size="20" font-weight="600" fill="#243238" text-anchor="start">Waste pipe</text><circle cx="692" cy="284" r="14" fill="#B5482F"/><text x="692" y="290" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="718" y="290" font-size="20" font-weight="600" fill="#243238" text-anchor="start">Appliance hose</text><circle cx="692" cy="344" r="14" fill="#B5482F"/><text x="692" y="350" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="718" y="350" font-size="20" font-weight="600" fill="#243238" text-anchor="start">Roof or outside</text><text x="480" y="525" font-size="19" font-weight="500" fill="#5b6b70" text-anchor="middle">Where the water shows up is a clue, not proof of where it started.</text></svg>