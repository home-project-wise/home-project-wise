<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d"><title id="t">Fixes from below: shim and block</title><desc id="d">Cross-sections of a glued shim in the gap between subfloor and joist, and a glued block between two joists fixed with angled screws.</desc><rect width="960" height="540" rx="16" fill="#f7f4ee"/><text x="40" y="50" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="26" font-weight="bold" fill="#20312f" text-anchor="start">Two fixes from below</text><text x="40" y="86" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="20" font-weight="bold" fill="#1f6f6b" text-anchor="start">Glued shim in a gap</text><text x="520" y="86" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="20" font-weight="bold" fill="#1f6f6b" text-anchor="start">Glued block between joists</text><rect x="40" y="130" width="420" height="40" fill="#d1b283" stroke="#8a6d3b"/><rect x="170" y="190" width="140" height="170" fill="#c9a26a" stroke="#8a6d3b"/><polygon points="190,170 290,170 290,190 190,182" fill="#e8c27a" stroke="#9c7440" stroke-width="2"/><line x1="360" y1="200" x2="290" y2="180" stroke="#20312f"/><text x="240" y="396" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" font-weight="normal" fill="#20312f" text-anchor="middle">Thin wood shim with carpenter’s glue,</text><text x="240" y="420" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" font-weight="normal" fill="#20312f" text-anchor="middle">tapped gently until snug</text><rect x="520" y="130" width="400" height="40" fill="#d1b283" stroke="#8a6d3b"/><rect x="520" y="170" width="70" height="190" fill="#c9a26a" stroke="#8a6d3b"/><rect x="850" y="170" width="70" height="190" fill="#c9a26a" stroke="#8a6d3b"/><rect x="590" y="170" width="260" height="44" fill="#e8c27a" stroke="#9c7440" stroke-width="2"/><line x1="600" y1="218" x2="574" y2="262" stroke="#20312f" stroke-width="4"/><line x1="840" y1="218" x2="866" y2="262" stroke="#20312f" stroke-width="4"/><text x="720" y="248" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" font-weight="bold" fill="#20312f" text-anchor="middle">Glued block</text><text x="720" y="396" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" font-weight="normal" fill="#20312f" text-anchor="middle">Glue both ends. Drive screws or nails</text><text x="720" y="420" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" font-weight="normal" fill="#20312f" text-anchor="middle">at an angle through the block into the joists.</text><text x="480" y="476" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#1f6f6b" text-anchor="middle">Look from below for the gap first. If you cannot see one, use the fix from above.</text><text x="480" y="508" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="normal" fill="#4b5b58" text-anchor="middle">Source: This Old House, “How To Repair Squeaky Wood Floors”.</text></svg>