<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Chart of locations where hands-free motion light helps and rooms that need deliberate control"><rect width="960" height="540" fill="#F7F5F0"/><text x="480" y="50" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700" fill="#243238" text-anchor="middle">Where motion lighting helps</text><rect x="40" y="90" width="430" height="400" rx="14" fill="#fff" stroke="#243238" stroke-width="2"/><text x="255" y="135" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#2f7d5b" text-anchor="middle">Good fit</text><circle cx="75" cy="168" r="12" fill="#2f7d5b"/><path d="M69 168 L74 173 L82 161" stroke="#fff" stroke-width="3" fill="none"/><text x="100" y="175" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="400" fill="#243238" text-anchor="start">Hallways used after dark</text><circle cx="75" cy="218" r="12" fill="#2f7d5b"/><path d="M69 218 L74 223 L82 211" stroke="#fff" stroke-width="3" fill="none"/><text x="100" y="225" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="400" fill="#243238" text-anchor="start">Stairs</text><circle cx="75" cy="268" r="12" fill="#2f7d5b"/><path d="M69 268 L74 273 L82 261" stroke="#fff" stroke-width="3" fill="none"/><text x="100" y="275" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="400" fill="#243238" text-anchor="start">Closets</text><circle cx="75" cy="318" r="12" fill="#2f7d5b"/><path d="M69 318 L74 323 L82 311" stroke="#fff" stroke-width="3" fill="none"/><text x="100" y="325" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="400" fill="#243238" text-anchor="start">Laundry or utility areas</text><circle cx="75" cy="368" r="12" fill="#2f7d5b"/><path d="M69 368 L74 373 L82 361" stroke="#fff" stroke-width="3" fill="none"/><text x="100" y="375" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="400" fill="#243238" text-anchor="start">Entry routes</text><circle cx="75" cy="418" r="12" fill="#2f7d5b"/><path d="M69 418 L74 423 L82 411" stroke="#fff" stroke-width="3" fill="none"/><text x="100" y="425" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="400" fill="#243238" text-anchor="start">Low-level night routes</text><rect x="490" y="90" width="430" height="400" rx="14" fill="#fff" stroke="#243238" stroke-width="2"/><text x="705" y="135" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" fill="#a8481d" text-anchor="middle">Needs deliberate control</text><circle cx="525" cy="178" r="12" fill="#a8481d"/><path d="M519 172 L531 184 M531 172 L519 184" stroke="#fff" stroke-width="3" fill="none"/><text x="550" y="185" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="400" fill="#243238" text-anchor="start">Living room</text><circle cx="525" cy="228" r="12" fill="#a8481d"/><path d="M519 222 L531 234 M531 222 L519 234" stroke="#fff" stroke-width="3" fill="none"/><text x="550" y="235" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="400" fill="#243238" text-anchor="start">Bedroom</text><circle cx="525" cy="278" r="12" fill="#a8481d"/><path d="M519 272 L531 284 M531 272 L519 284" stroke="#fff" stroke-width="3" fill="none"/><text x="550" y="285" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="400" fill="#243238" text-anchor="start">Dining area</text><text x="705" y="370" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="400" fill="#243238" text-anchor="middle">A sensor cannot tell that</text><text x="705" y="400" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="400" fill="#243238" text-anchor="middle">someone sitting still</text><text x="705" y="430" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="400" fill="#243238" text-anchor="middle">still wants the light on.</text></svg>