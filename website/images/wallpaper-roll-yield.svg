<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" rx="24" fill="#f5f2eb"/><text x="600" y="65" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#263b35">Count only complete drops from the sale unit</text><rect x="170" y="210" width="860" height="180" rx="16" fill="#e9e2d2" stroke="#718a79" stroke-width="6"/><rect x="190" y="230" width="260" height="140" fill="#8ca48a"/><rect x="470" y="230" width="260" height="140" fill="#8ca48a"/><rect x="750" y="230" width="260" height="140" fill="#8ca48a"/><path d="M460 210V390M740 210V390" stroke="#f5f2eb" stroke-width="12"/><text x="320" y="290" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#fff">Drop 1</text><text x="600" y="290" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#fff">Drop 2</text><text x="880" y="290" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#fff">Drop 3</text><path d="M1010 210H1030V390H1010" fill="none" stroke="#bd7c50" stroke-width="6"/><text x="1025" y="440" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#9b5c38">2.5 ft left</text><text x="600" y="160" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="#263b35">33 ft usable length ÷ 10.167 ft per drop</text><text x="600" y="510" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#263b35">3 complete drops per sale unit</text><text x="600" y="565" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#536d5e">floor(33 ÷ 10.167) = 3 · the leftover is not a full-height strip</text></svg>