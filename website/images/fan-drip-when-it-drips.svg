<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Decision chart: water drips from a bathroom fan after showers, only in rain, or all the time, each pointing to a different cause and first action" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif"><rect width="960" height="540" fill="#F7F5F0"/><text x="480" y="52" font-size="32" font-weight="700" fill="#243238" text-anchor="middle">When does the fan drip?</text><g><rect x="40" y="90" width="280" height="410" rx="16" fill="#fff" stroke="#D8D2C4" stroke-width="3"/><rect x="40" y="90" width="280" height="86" rx="16" fill="#4E7466"/><rect x="40" y="140" width="280" height="36" fill="#4E7466"/><text x="180" y="127" font-size="24" font-weight="700" fill="#fff" text-anchor="middle">After a shower</text><text x="180" y="156" font-size="20" fill="#fff" text-anchor="middle">worse when it is cold</text><text x="180" y="226" font-size="18" font-weight="600" fill="#4E7466" text-anchor="middle">LIKELY CAUSE</text><text x="180" y="256" font-size="22" font-weight="700" fill="#243238" text-anchor="middle">Condensation</text><text x="180" y="284" font-size="22" font-weight="700" fill="#243238" text-anchor="middle">inside a cold duct</text><path d="M180 304 v34 m-10 -10 l10 10 l10 -10" fill="none" stroke="#243238" stroke-width="4"/><text x="180" y="384" font-size="18" font-weight="600" fill="#4E7466" text-anchor="middle">FIRST MOVE</text><text x="180" y="414" font-size="22" fill="#243238" text-anchor="middle">Seal and insulate</text><text x="180" y="442" font-size="22" fill="#243238" text-anchor="middle">the duct, fix the slope</text></g><g><rect x="340" y="90" width="280" height="410" rx="16" fill="#fff" stroke="#D8D2C4" stroke-width="3"/><rect x="340" y="90" width="280" height="86" rx="16" fill="#D97745"/><rect x="340" y="140" width="280" height="36" fill="#D97745"/><text x="480" y="127" font-size="24" font-weight="700" fill="#243238" text-anchor="middle">Only in rain</text><text x="480" y="156" font-size="20" fill="#243238" text-anchor="middle">or snowmelt</text><text x="480" y="226" font-size="18" font-weight="600" fill="#B4541F" text-anchor="middle">LIKELY CAUSE</text><text x="480" y="256" font-size="22" font-weight="700" fill="#243238" text-anchor="middle">Water getting in</text><text x="480" y="284" font-size="22" font-weight="700" fill="#243238" text-anchor="middle">from outside</text><path d="M480 304 v34 m-10 -10 l10 10 l10 -10" fill="none" stroke="#243238" stroke-width="4"/><text x="480" y="384" font-size="18" font-weight="600" fill="#B4541F" text-anchor="middle">FIRST MOVE</text><text x="480" y="414" font-size="22" fill="#243238" text-anchor="middle">Check the cap and</text><text x="480" y="442" font-size="22" fill="#243238" text-anchor="middle">flashing; call a roofer</text></g><g><rect x="640" y="90" width="280" height="410" rx="16" fill="#fff" stroke="#D8D2C4" stroke-width="3"/><rect x="640" y="90" width="280" height="86" rx="16" fill="#9FC3D8"/><rect x="640" y="140" width="280" height="36" fill="#9FC3D8"/><text x="780" y="127" font-size="24" font-weight="700" fill="#243238" text-anchor="middle">All the time</text><text x="780" y="156" font-size="20" fill="#243238" text-anchor="middle">even in dry weather</text><text x="780" y="226" font-size="18" font-weight="600" fill="#2F6F8F" text-anchor="middle">LIKELY CAUSE</text><text x="780" y="256" font-size="22" font-weight="700" fill="#243238" text-anchor="middle">A leak above</text><text x="780" y="284" font-size="22" font-weight="700" fill="#243238" text-anchor="middle">or another source</text><path d="M780 304 v34 m-10 -10 l10 10 l10 -10" fill="none" stroke="#243238" stroke-width="4"/><text x="780" y="384" font-size="18" font-weight="600" fill="#2F6F8F" text-anchor="middle">FIRST MOVE</text><text x="780" y="414" font-size="22" fill="#243238" text-anchor="middle">Trace the source;</text><text x="780" y="442" font-size="22" fill="#243238" text-anchor="middle">add a leak sensor</text></g></svg>