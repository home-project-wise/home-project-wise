<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d"><title id="t">Pick a transition strip by what is on each side</title><desc id="d">Four situations and the matching strip: T-molding for floors of the same height, reducer for a lower surface, end cap for carpet, hearth or sliding door, stair nose for stair edges.</desc><rect width="960" height="540" rx="16" fill="#f7f4ee"/><text x="40" y="50" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="26" font-weight="bold" fill="#20312f" text-anchor="start">Pick the strip by what is on each side</text><rect x="40" y="90" width="480" height="70" rx="10" fill="#ffffff" stroke="#b9b2a5"/><circle cx="70" cy="125" r="16" fill="#1f6f6b"/><text x="70" y="131" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text><text x="98" y="132" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#20312f" text-anchor="start">Same height (difference 8 mm or less)</text><path d="M530 125 h24 l-8 -7 m8 7 l-8 7" stroke="#1f6f6b" stroke-width="3" fill="none"/><rect x="566" y="90" width="354" height="70" rx="10" fill="#e8f1ef" stroke="#a9c9c4"/><text x="586" y="132" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="20" font-weight="bold" fill="#1f6f6b" text-anchor="start">T-molding on a clip track</text><rect x="40" y="182" width="480" height="70" rx="10" fill="#ffffff" stroke="#b9b2a5"/><circle cx="70" cy="217" r="16" fill="#1f6f6b"/><text x="70" y="223" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text><text x="98" y="224" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#20312f" text-anchor="start">Floor meets a lower surface</text><path d="M530 217 h24 l-8 -7 m8 7 l-8 7" stroke="#1f6f6b" stroke-width="3" fill="none"/><rect x="566" y="182" width="354" height="70" rx="10" fill="#e8f1ef" stroke="#a9c9c4"/><text x="586" y="224" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="20" font-weight="bold" fill="#1f6f6b" text-anchor="start">Reducer</text><rect x="40" y="274" width="480" height="70" rx="10" fill="#ffffff" stroke="#b9b2a5"/><circle cx="70" cy="309" r="16" fill="#1f6f6b"/><text x="70" y="315" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text><text x="98" y="316" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#20312f" text-anchor="start">Floor meets carpet, hearth or sliding door</text><path d="M530 309 h24 l-8 -7 m8 7 l-8 7" stroke="#1f6f6b" stroke-width="3" fill="none"/><rect x="566" y="274" width="354" height="70" rx="10" fill="#e8f1ef" stroke="#a9c9c4"/><text x="586" y="316" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="20" font-weight="bold" fill="#1f6f6b" text-anchor="start">End cap</text><rect x="40" y="366" width="480" height="70" rx="10" fill="#ffffff" stroke="#b9b2a5"/><circle cx="70" cy="401" r="16" fill="#1f6f6b"/><text x="70" y="407" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text><text x="98" y="408" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#20312f" text-anchor="start">Edge of a stair or a raised floor</text><path d="M530 401 h24 l-8 -7 m8 7 l-8 7" stroke="#1f6f6b" stroke-width="3" fill="none"/><rect x="566" y="366" width="354" height="70" rx="10" fill="#e8f1ef" stroke="#a9c9c4"/><text x="586" y="408" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="20" font-weight="bold" fill="#1f6f6b" text-anchor="start">Stair nose</text><text x="480" y="486" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#c0392b" text-anchor="middle">Quarter round covers the gap at a wall. It is not a transition.</text><text x="480" y="512" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="normal" fill="#4b5b58" text-anchor="middle">Sources: Mannington Commercial guide (06/25); T-molding guide with the 8 mm limit; Bruce trim guide.</text></svg>