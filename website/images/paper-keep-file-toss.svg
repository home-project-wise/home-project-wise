<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Keep or toss chart for household paper: keep long term, keep for a set period, recycle or shred now"><rect width="960" height="540" fill="#F7F5F0"/><text x="480" y="55" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#243238" text-anchor="middle">What to keep, file or toss</text><rect x="50" y="100" width="860" height="110" rx="14" fill="#243238" stroke="#243238" stroke-width="2"/><text x="80" y="145" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#fff" text-anchor="start">Keep long term</text><text x="80" y="182" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="400" fill="#fff" text-anchor="start">ID papers, property and vehicle records, final tax records</text><rect x="50" y="235" width="860" height="110" rx="14" fill="#E4ECE8" stroke="#243238" stroke-width="2"/><text x="80" y="280" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#243238" text-anchor="start">Keep for a set period</text><text x="80" y="317" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="400" fill="#243238" text-anchor="start">Bills, bank statements, pay slips: check your tax office and lenders</text><rect x="50" y="370" width="860" height="110" rx="14" fill="#fff" stroke="#243238" stroke-width="2"/><text x="80" y="415" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#243238" text-anchor="start">Recycle or shred now</text><text x="80" y="452" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="400" fill="#243238" text-anchor="start">Flyers, expired offers, duplicates, envelopes, old receipts you do not need</text><text x="480" y="515" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="400" fill="#243238" text-anchor="middle">Retention periods differ by country and situation. Check official guidance.</text></svg>