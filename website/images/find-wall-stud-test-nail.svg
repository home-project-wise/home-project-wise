<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Top view of a test nail pushed through drywall: it meets resistance when it hits a stud and passes through into the hollow space between studs" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif"><rect width="960" height="540" fill="#F7F5F0"/><text x="480" y="42" font-size="30" font-weight="700" fill="#243238" text-anchor="middle">A test nail tells you what is behind</text>
<rect x="60" y="230" width="840" height="26" fill="#EDE8DC" stroke="#243238" stroke-width="3"/>
<text x="480" y="222" font-size="17" font-weight="700" fill="#5b6b70" text-anchor="middle">Drywall</text>
<rect x="180" y="256" width="100" height="160" fill="#E4D9C3" stroke="#B9A98A" stroke-width="3"/>
<rect x="640" y="256" width="100" height="160" fill="#E4D9C3" stroke="#B9A98A" stroke-width="3"/>
<text x="230" y="446" font-size="20" font-weight="700" fill="#6F8F82" text-anchor="middle">Stud</text>
<text x="690" y="446" font-size="20" font-weight="700" fill="#6F8F82" text-anchor="middle">Stud</text>
<line x1="230" y1="120" x2="230" y2="262" stroke="#243238" stroke-width="6" stroke-linecap="round"/><rect x="214" y="112" width="32" height="10" rx="3" fill="#243238"/>
<text x="230" y="92" font-size="20" font-weight="700" fill="#6F8F82" text-anchor="middle">Meets resistance: a stud</text>
<line x1="460" y1="120" x2="460" y2="372" stroke="#243238" stroke-width="6" stroke-linecap="round"/><rect x="444" y="112" width="32" height="10" rx="3" fill="#243238"/>
<text x="460" y="92" font-size="20" font-weight="700" fill="#B5482F" text-anchor="middle">Passes through: not a stud</text>
<text x="460" y="330" font-size="18" font-weight="700" fill="#5b6b70" text-anchor="middle">hollow</text>
<text x="480" y="486" font-size="19" font-weight="700" fill="#243238" text-anchor="middle">Pull it out, move over, fill each hole</text>
</svg>
