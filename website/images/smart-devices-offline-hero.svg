<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d"><title id="t">Why one plug drops while the others stay online</title><desc id="d">A router with a bulb in the same room shows a strong signal and stays online. A plug on the far side of a thick wall gets a weak signal over a dashed line and goes offline.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#243238"/></marker></defs><rect width="960" height="540" fill="#F7F5F0"/><text x="480" y="70" font-size="28" fill="#243238" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Why one plug drops while the others stay online</text><rect x="215" y="300" width="150" height="76" rx="12" fill="#FFFFFF" stroke="#243238" stroke-width="2"/><text x="290" y="346" font-size="22" fill="#243238" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Router</text><line x1="240" y1="300" x2="240" y2="270" stroke="#243238" stroke-width="4" stroke-linecap="round"/><line x1="340" y1="300" x2="340" y2="270" stroke="#243238" stroke-width="4" stroke-linecap="round"/><rect x="450" y="150" width="34" height="300" rx="6" fill="#D9D3C7" stroke="#8A8272" stroke-width="2"/><text x="467" y="482" font-size="18" fill="#243238" font-weight="normal" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Thick wall</text><rect x="275" y="150" width="110" height="70" rx="12" fill="#FFFFFF" stroke="#6F8F82" stroke-width="3"/><text x="330" y="194" font-size="20" fill="#243238" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Bulb</text><line x1="300" y1="296" x2="318" y2="226" stroke="#6F8F82" stroke-width="5" stroke-linecap="round"/><path d="M317 250 L327 261 L345 238" fill="none" stroke="#4F6F62" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="330" y="118" font-size="17" fill="#4F6F62" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Strong signal, stays online</text><rect x="600" y="300" width="130" height="76" rx="12" fill="#FFFFFF" stroke="#D97745" stroke-width="3"/><text x="665" y="346" font-size="22" fill="#243238" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Plug</text><line x1="366" y1="336" x2="598" y2="336" stroke="#D97745" stroke-width="5" stroke-linecap="round" stroke-dasharray="12 10"/><line x1="652" y1="249" x2="678" y2="275" stroke="#D97745" stroke-width="6" stroke-linecap="round"/><line x1="652" y1="275" x2="678" y2="249" stroke="#D97745" stroke-width="6" stroke-linecap="round"/><text x="620" y="118" font-size="17" fill="#B04F1F" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Weak signal, drops offline</text><text x="700" y="420" font-size="17" fill="#243238" font-weight="normal" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Check the dBm reading at the plug itself</text></svg>