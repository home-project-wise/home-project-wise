<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Top view of a bed with a rug under its lower two-thirds extending 18 to 24 inches past the sides and foot" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif"><rect width="960" height="540" fill="#F7F5F0"/><rect x="60" y="30" width="840" height="480" rx="18" fill="#EFEBE2" stroke="#D8D2C4" stroke-width="3"/><rect x="355" y="145" width="250" height="185" rx="8" fill="#DCE6E0" stroke="#6F8F82" stroke-width="3"/><rect x="405" y="70" width="150" height="200" rx="10" fill="#243238"/><rect x="415" y="88" width="130" height="170" rx="8" fill="#3B4C53"/><rect x="419" y="96" width="54" height="34" rx="8" fill="#fff"/><rect x="487" y="96" width="54" height="34" rx="8" fill="#fff"/><rect x="285" y="70" width="60" height="60" rx="8" fill="#D97745"/><rect x="615" y="70" width="60" height="60" rx="8" fill="#D97745"/><line x1="355" y1="230" x2="405" y2="230" stroke="#D97745" stroke-width="4"/><polygon points="355,230 367,223 367,237" fill="#D97745"/><polygon points="405,230 393,223 393,237" fill="#D97745"/><text x="341" y="218" font-size="20" font-weight="700" fill="#D97745" text-anchor="end">18-24 in</text><text x="341" y="240" font-size="20" font-weight="700" fill="#D97745" text-anchor="end">(45-60 cm)</text><text x="480" y="484" font-size="21" font-weight="700" fill="#243238" text-anchor="middle">Rug under the lower two-thirds of the bed, with room to step onto it</text><text x="480" y="62" font-size="24" font-weight="700" fill="#243238" text-anchor="middle">Bedroom: let the rug reach past the sides and foot of the bed</text></svg>