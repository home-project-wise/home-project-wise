<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Safe and unsafe ways to limit damage after a leak: dry access, a bucket and photographs versus wet electrics, a sagging ceiling and sewage" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif"><rect width="960" height="540" fill="#F7F5F0"/><text x="480" y="40" font-size="30" font-weight="700" fill="#243238" text-anchor="middle">Safe and unsafe ways to limit damage</text><rect x="50" y="80" width="420" height="400" rx="16" fill="#E8F0EC" stroke="#6F8F82" stroke-width="3"/><rect x="490" y="80" width="420" height="400" rx="16" fill="#fbeae5" stroke="#B5482F" stroke-width="3"/><text x="260" y="130" font-size="28" font-weight="700" fill="#6F8F82" text-anchor="middle">Fine to do</text><text x="700" y="130" font-size="28" font-weight="700" fill="#B5482F" text-anchor="middle">Keep clear</text><circle cx="90" cy="192" r="16" fill="#6F8F82"/><text x="90" y="199" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">✓</text><text x="122" y="200" font-size="22" font-weight="600" fill="#243238" text-anchor="start">Dry access only</text><circle cx="90" cy="260" r="16" fill="#6F8F82"/><text x="90" y="267" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">✓</text><text x="122" y="268" font-size="22" font-weight="600" fill="#243238" text-anchor="start">Bucket under a small drip</text><circle cx="90" cy="328" r="16" fill="#6F8F82"/><text x="90" y="335" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">✓</text><text x="122" y="336" font-size="22" font-weight="600" fill="#243238" text-anchor="start">Towel for a small clean spill</text><circle cx="90" cy="396" r="16" fill="#6F8F82"/><text x="90" y="403" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">✓</text><text x="122" y="404" font-size="22" font-weight="600" fill="#243238" text-anchor="start">Photograph the damage</text><circle cx="530" cy="192" r="16" fill="#B5482F"/><text x="530" y="199" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">✕</text><text x="562" y="200" font-size="22" font-weight="600" fill="#243238" text-anchor="start">Wet sockets, plugs, panel</text><circle cx="530" cy="260" r="16" fill="#B5482F"/><text x="530" y="267" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">✕</text><text x="562" y="268" font-size="22" font-weight="600" fill="#243238" text-anchor="start">A bulging or sagging ceiling</text><circle cx="530" cy="328" r="16" fill="#B5482F"/><text x="530" y="335" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">✕</text><text x="562" y="336" font-size="22" font-weight="600" fill="#243238" text-anchor="start">Sewage or dirty water</text><circle cx="530" cy="396" r="16" fill="#B5482F"/><text x="530" y="403" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">✕</text><text x="562" y="404" font-size="22" font-weight="600" fill="#243238" text-anchor="start">Standing in water near power</text></svg>