<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d"><title id="t">Tape and three thin coats in cross-section</title><desc id="d">Cross-section of a seam: joint tape in compound, then three thin coats of joint compound, each wider than the previous one.</desc><rect width="960" height="540" rx="16" fill="#f7f4ee"/><text x="40" y="50" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="24" font-weight="bold" fill="#20312f" text-anchor="start">Tape and three thin coats, each wider than the last</text><rect x="60" y="260" width="410" height="40" fill="#e9e4da" stroke="#8a8272" stroke-width="2"/><rect x="490" y="260" width="410" height="40" fill="#e9e4da" stroke="#8a8272" stroke-width="2"/><rect x="375" y="250" width="210" height="10" fill="#f9f7f1" stroke="#8a8272"/><path d="M395 250 Q480 238 565 250z" fill="#cfd8d4" stroke="#6b7c77"/><path d="M335 244 Q480 224 625 244z" fill="#dde5e1" stroke="#6b7c77" opacity=".9"/><path d="M265 238 Q480 206 695 238z" fill="#eaf0ed" stroke="#6b7c77" opacity=".9"/><text x="480" y="200" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="15" font-weight="normal" fill="#4b5b58" text-anchor="middle">Not to scale</text><circle cx="76" cy="360" r="16" fill="#1f6f6b"/><text x="76" y="366" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text><text x="102" y="366" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" font-weight="normal" fill="#20312f" text-anchor="start">Tape bedded in a thin layer of compound</text><circle cx="516" cy="360" r="16" fill="#1f6f6b"/><text x="516" y="366" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text><text x="542" y="366" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" font-weight="normal" fill="#20312f" text-anchor="start">First thin coat, just wider than the tape</text><circle cx="76" cy="418" r="16" fill="#1f6f6b"/><text x="76" y="424" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text><text x="102" y="424" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" font-weight="normal" fill="#20312f" text-anchor="start">Second coat, wider again, edges feathered</text><circle cx="516" cy="418" r="16" fill="#1f6f6b"/><text x="516" y="424" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text><text x="542" y="424" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" font-weight="normal" fill="#20312f" text-anchor="start">Third coat, wider again; sand lightly between coats</text><text x="480" y="500" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#1f6f6b" text-anchor="middle">Dry fully, sand lightly, check with a low-angle light, prime, then paint.</text></svg>