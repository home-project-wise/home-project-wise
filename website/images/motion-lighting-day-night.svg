<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Daytime and nighttime motion light behavior: off or no activation by day, low output at night"><rect width="960" height="540" fill="#F7F5F0"/><text x="480" y="50" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700" fill="#243238" text-anchor="middle">Separate daytime and nighttime behavior</text><rect x="40" y="100" width="430" height="300" rx="14" fill="#fff" stroke="#243238" stroke-width="2"/><circle cx="255" cy="175" r="34" fill="#E8B04A"/><text x="255" y="260" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#243238" text-anchor="middle">Daytime</text><text x="255" y="305" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="400" fill="#243238" text-anchor="middle">Light may not need to</text><text x="255" y="337" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="400" fill="#243238" text-anchor="middle">activate at all</text><rect x="490" y="100" width="430" height="300" rx="14" fill="#243238" stroke="#243238" stroke-width="2"/><path d="M705 140 A34 34 0 1 0 735 195 A28 28 0 1 1 705 140 Z" fill="#F7F5F0"/><text x="705" y="260" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#fff" text-anchor="middle">Night</text><text x="705" y="305" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="400" fill="#fff" text-anchor="middle">Low output guides the way</text><text x="705" y="337" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="400" fill="#fff" text-anchor="middle">without a harsh bright room</text><rect x="40" y="425" width="880" height="80" rx="14" fill="#E4ECE8" stroke="#243238" stroke-width="2"/><text x="480" y="462" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#243238" text-anchor="middle">Use a day/night rule if your system supports schedules.</text><text x="480" y="492" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="400" fill="#243238" text-anchor="middle">If not, a low-level night light can beat a bright ceiling fixture.</text></svg>