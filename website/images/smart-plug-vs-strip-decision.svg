<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Decision chart to choose between a smart plug and a smart power strip: one device points to a plug, several nearby devices point to a strip" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif"><rect width="960" height="540" fill="#F7F5F0"/><text x="480" y="42" font-size="30" font-weight="700" fill="#243238" text-anchor="middle">Plug or strip?</text>
<rect x="300" y="75" width="360" height="75" rx="12" fill="#fff" stroke="#243238" stroke-width="3"/><text x="480" y="122" font-size="22" font-weight="700" fill="#243238" text-anchor="middle">How many devices to switch?</text>
<line x1="400" y1="152" x2="240" y2="228" stroke="#243238" stroke-width="4" stroke-linecap="round"/><line x1="560" y1="152" x2="720" y2="228" stroke="#243238" stroke-width="4" stroke-linecap="round"/>
<rect x="60" y="230" width="360" height="80" rx="12" fill="#fff" stroke="#243238" stroke-width="3"/><text x="240" y="278" font-size="22" font-weight="700" fill="#243238" text-anchor="middle">One device</text>
<rect x="540" y="230" width="360" height="80" rx="12" fill="#fff" stroke="#243238" stroke-width="3"/><text x="720" y="268" font-size="22" font-weight="700" fill="#243238" text-anchor="middle">Several, close together</text><text x="720" y="296" font-size="17" font-weight="500" fill="#5b6b70" text-anchor="middle">each needing its own switch</text>
<line x1="240" y1="312" x2="240" y2="366" stroke="#243238" stroke-width="5" stroke-linecap="round"/><polygon points="240,382 231,366 249,366" fill="#243238"/>
<line x1="720" y1="312" x2="720" y2="366" stroke="#243238" stroke-width="5" stroke-linecap="round"/><polygon points="720,382 711,366 729,366" fill="#243238"/>
<rect x="60" y="386" width="360" height="90" rx="12" fill="#E4ECE8" stroke="#6F8F82" stroke-width="4"/><text x="240" y="440" font-size="26" font-weight="700" fill="#243238" text-anchor="middle">Smart plug</text>
<rect x="540" y="386" width="360" height="90" rx="12" fill="#E4ECE8" stroke="#6F8F82" stroke-width="4"/><text x="720" y="440" font-size="26" font-weight="700" fill="#243238" text-anchor="middle">Smart power strip</text>
<text x="480" y="515" font-size="17" font-weight="500" fill="#5b6b70" text-anchor="middle">Then check: total rating, surge claim, plug shape, setup</text>
</svg>
