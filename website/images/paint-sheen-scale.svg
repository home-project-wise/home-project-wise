<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Scale of paint sheen from flat to high gloss, with flat forgiving of wall flaws and high gloss more durable and easier to clean" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif"><rect width="960" height="540" fill="#F7F5F0"/><text x="480" y="62" font-size="32" font-weight="700" fill="#243238" text-anchor="middle">Paint sheen: from flat to high gloss</text><text x="480" y="108" font-size="22" fill="#243238" text-anchor="middle">More shine means more light bounces back at you</text><rect x="60" y="160" width="130" height="170" rx="14" fill="#E9E4D8" stroke="#8B9B96" stroke-width="3"/><text x="125" y="362" font-size="20" font-weight="700" fill="#243238" text-anchor="middle">Flat</text><rect x="202" y="160" width="130" height="170" rx="14" fill="#E4DECF" stroke="#8B9B96" stroke-width="3"/><ellipse cx="244" cy="205" rx="26" ry="14" fill="#fff" fill-opacity="0.1" transform="rotate(-20 244 205)"/><text x="267" y="362" font-size="20" font-weight="700" fill="#243238" text-anchor="middle">Matte</text><rect x="344" y="160" width="130" height="170" rx="14" fill="#DDD6C4" stroke="#8B9B96" stroke-width="3"/><ellipse cx="386" cy="205" rx="26" ry="14" fill="#fff" fill-opacity="0.25" transform="rotate(-20 386 205)"/><text x="409" y="362" font-size="20" font-weight="700" fill="#243238" text-anchor="middle">Eggshell</text><rect x="486" y="160" width="130" height="170" rx="14" fill="#D3CBB5" stroke="#8B9B96" stroke-width="3"/><ellipse cx="528" cy="205" rx="26" ry="14" fill="#fff" fill-opacity="0.45" transform="rotate(-20 528 205)"/><text x="551" y="362" font-size="20" font-weight="700" fill="#243238" text-anchor="middle">Pearl / satin</text><rect x="628" y="160" width="130" height="170" rx="14" fill="#C9BFA4" stroke="#8B9B96" stroke-width="3"/><ellipse cx="670" cy="205" rx="26" ry="14" fill="#fff" fill-opacity="0.65" transform="rotate(-20 670 205)"/><text x="693" y="362" font-size="20" font-weight="700" fill="#243238" text-anchor="middle">Semi-gloss</text><rect x="770" y="160" width="130" height="170" rx="14" fill="#BFB394" stroke="#8B9B96" stroke-width="3"/><ellipse cx="812" cy="205" rx="26" ry="14" fill="#fff" fill-opacity="0.9" transform="rotate(-20 812 205)"/><text x="835" y="362" font-size="20" font-weight="700" fill="#243238" text-anchor="middle">High gloss</text><line x1="70" y1="424" x2="890" y2="424" stroke="#D97745" stroke-width="8" stroke-linecap="round"/><path d="M862 402L892 424L862 446" fill="none" stroke="#D97745" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><text x="60" y="482" font-size="22" font-weight="700" fill="#243238">More forgiving of flaws</text><text x="900" y="482" font-size="22" font-weight="700" fill="#243238" text-anchor="end">More durable, easier to clean</text><text x="480" y="522" font-size="18" fill="#5B6B66" text-anchor="middle">Names and levels vary by brand. Check the label.</text></svg>