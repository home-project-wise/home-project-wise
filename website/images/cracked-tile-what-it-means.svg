<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d"><title id="t">What a cracked floor tile may mean</title><desc id="d">Three cases: one tile with an impact mark means replace it; a crack across several tiles means find the cause first; hollow neighbors mean check the bond first.</desc><rect width="960" height="540" rx="16" fill="#f7f4ee"/><text x="40" y="50" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="26" font-weight="bold" fill="#20312f" text-anchor="start">What the damage may be telling you</text><rect x="40" y="100" width="500" height="96" rx="10" fill="#ffffff" stroke="#b9b2a5"/><circle cx="70" cy="148" r="16" fill="#1f6f6b"/><text x="70" y="154" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text><text x="98" y="142" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="19" font-weight="bold" fill="#20312f" text-anchor="start">One tile with a clear impact mark</text><text x="98" y="172" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="16" font-weight="normal" fill="#4b5b58" text-anchor="start">Neighbors sound solid</text><path d="M550 148 h24 l-8 -7 m8 7 l-8 7" stroke="#1f6f6b" stroke-width="3" fill="none"/><rect x="586" y="100" width="334" height="96" rx="10" fill="#e8f1ef" stroke="#a9c9c4"/><text x="606" y="156" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="19" font-weight="bold" fill="#1f6f6b" text-anchor="start">Replace the tile</text><rect x="40" y="220" width="500" height="96" rx="10" fill="#ffffff" stroke="#b9b2a5"/><circle cx="70" cy="268" r="16" fill="#1f6f6b"/><text x="70" y="274" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text><text x="98" y="262" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="19" font-weight="bold" fill="#20312f" text-anchor="start">A crack that runs across several tiles</text><text x="98" y="292" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="16" font-weight="normal" fill="#4b5b58" text-anchor="start">Floor movement is likely</text><path d="M550 268 h24 l-8 -7 m8 7 l-8 7" stroke="#1f6f6b" stroke-width="3" fill="none"/><rect x="586" y="220" width="334" height="96" rx="10" fill="#e8f1ef" stroke="#a9c9c4"/><text x="606" y="276" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="19" font-weight="bold" fill="#1f6f6b" text-anchor="start">Find the cause first</text><rect x="40" y="340" width="500" height="96" rx="10" fill="#ffffff" stroke="#b9b2a5"/><circle cx="70" cy="388" r="16" fill="#1f6f6b"/><text x="70" y="394" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text><text x="98" y="382" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="19" font-weight="bold" fill="#20312f" text-anchor="start">Neighbors sound hollow or loose</text><text x="98" y="412" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="16" font-weight="normal" fill="#4b5b58" text-anchor="start">Bond may have failed (our reading)</text><path d="M550 388 h24 l-8 -7 m8 7 l-8 7" stroke="#1f6f6b" stroke-width="3" fill="none"/><rect x="586" y="340" width="334" height="96" rx="10" fill="#e8f1ef" stroke="#a9c9c4"/><text x="606" y="396" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="19" font-weight="bold" fill="#1f6f6b" text-anchor="start">Check them before you set a tile</text><text x="480" y="486" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#c0392b" text-anchor="middle">Cracks in a shower or tub area: stop. This guide does not cover wet-area repairs.</text><text x="480" y="512" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="normal" fill="#4b5b58" text-anchor="middle">Source: This Old House (multiple damaged tiles mean a bigger repair). The hollow-sound reading is ours.</text></svg>