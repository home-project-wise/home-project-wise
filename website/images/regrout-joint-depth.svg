<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d"><title id="t">How deep to remove old grout</title><desc id="d">Cross-section of two tiles with a joint between them showing that two thirds of the tile thickness should be left open for new grout, with an example for a three-eighths inch tile.</desc><rect width="960" height="540" rx="16" fill="#f7f4ee"/><text x="40" y="50" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="26" font-weight="bold" fill="#20312f" text-anchor="start">Remove old grout to the right depth</text><rect x="120" y="140" width="240" height="180" fill="#e9e4da" stroke="#8a8272" stroke-width="3"/><rect x="480" y="140" width="240" height="180" fill="#e9e4da" stroke="#8a8272" stroke-width="3"/><rect x="360" y="260" width="120" height="60" fill="#bfb49f" stroke="#8a8272"/><rect x="360" y="140" width="120" height="120" fill="#cfe3e0" stroke="#1f6f6b" stroke-width="2" stroke-dasharray="6 4"/><rect x="120" y="320" width="600" height="40" fill="#cfc3b0" stroke="#8a8272" stroke-width="2"/><path d="M740 140 v180 m0 -180 l-6 10 h12z m0 180 l-6 -10 h12z" fill="none" stroke="#20312f" stroke-width="2"/><text x="770" y="236" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="16" font-weight="bold" fill="#20312f" text-anchor="start">Tile</text><text x="770" y="258" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="16" font-weight="bold" fill="#20312f" text-anchor="start">thickness</text><path d="M340 140 v120 m0 -120 l-6 10 h12z m0 120 l-6 -10 h12z" fill="none" stroke="#1f6f6b" stroke-width="3"/><text x="240" y="208" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="16" font-weight="bold" fill="#1f6f6b" text-anchor="middle">grout</text><text x="240" y="228" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="16" font-weight="bold" fill="#1f6f6b" text-anchor="middle">depth</text><text x="420" y="200" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" font-weight="bold" fill="#1f6f6b" text-anchor="middle">New grout</text><text x="420" y="290" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="15" font-weight="bold" fill="#4b5b58" text-anchor="middle">Old mortar</text><text x="480" y="410" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="22" font-weight="bold" fill="#1f6f6b" text-anchor="middle">Leave 2/3 of the tile’s depth open for grout.</text><text x="480" y="444" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="normal" fill="#20312f" text-anchor="middle">Example (illustrative): a 3/8 in tile needs about 1/4 in of grout depth.</text><text x="480" y="476" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" font-weight="normal" fill="#20312f" text-anchor="middle">Clear adhesive or mortar above that line so the joint is clean and dry.</text><text x="480" y="512" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="normal" fill="#4b5b58" text-anchor="middle">Source: Mapei Ultracolor Plus FA technical data sheet (June 2019).</text></svg>