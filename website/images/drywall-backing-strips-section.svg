<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d"><title id="t">Side view of a patch fixed to backing strips</title><desc id="d">Cross-section: two backing strips sit half behind the old drywall and half in the opening, with screws fixing the old board and the patch to them.</desc><rect width="960" height="540" rx="16" fill="#f7f4ee"/><text x="40" y="50" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="24" font-weight="bold" fill="#20312f" text-anchor="start">Method 1, side view: patch screwed to backing strips</text><text x="480" y="96" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="16" font-weight="normal" fill="#4b5b58" text-anchor="middle">Room side</text><text x="480" y="500" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="16" font-weight="normal" fill="#4b5b58" text-anchor="middle">Inside the wall</text><rect x="60" y="170" width="240" height="40" fill="#e9e4da" stroke="#8a8272" stroke-width="2"/><rect x="660" y="170" width="240" height="40" fill="#e9e4da" stroke="#8a8272" stroke-width="2"/><rect x="304" y="170" width="352" height="40" fill="#f4f1ea" stroke="#1f6f6b" stroke-width="3"/><rect x="240" y="210" width="120" height="46" fill="#d9a86c" stroke="#9c7440" stroke-width="2"/><rect x="600" y="210" width="120" height="46" fill="#d9a86c" stroke="#9c7440" stroke-width="2"/><line x1="270" y1="162" x2="270" y2="244" stroke="#20312f" stroke-width="3"/><rect x="264" y="158" width="12" height="6" fill="#20312f"/><line x1="330" y1="162" x2="330" y2="244" stroke="#20312f" stroke-width="3"/><rect x="324" y="158" width="12" height="6" fill="#20312f"/><line x1="630" y1="162" x2="630" y2="244" stroke="#20312f" stroke-width="3"/><rect x="624" y="158" width="12" height="6" fill="#20312f"/><line x1="690" y1="162" x2="690" y2="244" stroke="#20312f" stroke-width="3"/><rect x="684" y="158" width="12" height="6" fill="#20312f"/><text x="180" y="150" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#20312f" text-anchor="middle">Old drywall</text><text x="480" y="150" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#1f6f6b" text-anchor="middle">Patch, same thickness</text><text x="780" y="150" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#20312f" text-anchor="middle">Old drywall</text><line x1="300" y1="256" x2="300" y2="306" stroke="#20312f"/><text x="300" y="330" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" font-weight="normal" fill="#20312f" text-anchor="middle">Strip: about half behind the old board,</text><text x="300" y="352" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" font-weight="normal" fill="#20312f" text-anchor="middle">half showing in the opening</text><line x1="660" y1="256" x2="660" y2="306" stroke="#20312f"/><text x="660" y="330" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" font-weight="normal" fill="#20312f" text-anchor="middle">Screws about 1 in from the edge,</text><text x="660" y="352" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" font-weight="normal" fill="#20312f" text-anchor="middle">heads just below the surface</text><text x="480" y="420" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" font-weight="bold" fill="#c0392b" text-anchor="middle">Strips here support the left and right edges only.</text><text x="480" y="444" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="16" font-weight="normal" fill="#4b5b58" text-anchor="middle">Keep top and bottom seams taped thin, or add strips there if the patch flexes.</text></svg>