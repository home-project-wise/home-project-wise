<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d"><title id="t">Setting a replacement tile with full coverage</title><desc id="d">Three panels: combing mortar in one direction, pressing and sliding the tile across the ridges, and lifting a tile to check the mortar coverage on its back.</desc><rect width="960" height="540" rx="16" fill="#f7f4ee"/><text x="40" y="50" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="26" font-weight="bold" fill="#20312f" text-anchor="start">Set the tile with full mortar coverage</text><rect x="40" y="90" width="280" height="260" rx="12" fill="#ffffff" stroke="#b9b2a5"/><circle cx="70" cy="120" r="16" fill="#1f6f6b"/><text x="70" y="126" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text><text x="96" y="127" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="19" font-weight="bold" fill="#20312f" text-anchor="start">Comb in one direction</text><text x="180" y="330" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="15" font-weight="normal" fill="#4b5b58" text-anchor="middle">Key the mortar in with the flat side first</text><rect x="340" y="90" width="280" height="260" rx="12" fill="#ffffff" stroke="#b9b2a5"/><circle cx="370" cy="120" r="16" fill="#1f6f6b"/><text x="370" y="126" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text><text x="396" y="127" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="19" font-weight="bold" fill="#20312f" text-anchor="start">Press, then slide</text><text x="480" y="330" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="15" font-weight="normal" fill="#4b5b58" text-anchor="middle">Back and forth across the ridges</text><rect x="640" y="90" width="280" height="260" rx="12" fill="#ffffff" stroke="#b9b2a5"/><circle cx="670" cy="120" r="16" fill="#1f6f6b"/><text x="670" y="126" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text><text x="696" y="127" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="19" font-weight="bold" fill="#20312f" text-anchor="start">Lift one tile</text><text x="780" y="330" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="15" font-weight="normal" fill="#4b5b58" text-anchor="middle">Check the back for coverage</text><rect x="60" y="250" width="240" height="20" fill="#bfb49f"/><polygon points="70,250 82,214 94,250" fill="#d9d2c4" stroke="#8a8272"/><polygon points="94,250 106,214 118,250" fill="#d9d2c4" stroke="#8a8272"/><polygon points="118,250 130,214 142,250" fill="#d9d2c4" stroke="#8a8272"/><polygon points="142,250 154,214 166,250" fill="#d9d2c4" stroke="#8a8272"/><polygon points="166,250 178,214 190,250" fill="#d9d2c4" stroke="#8a8272"/><polygon points="190,250 202,214 214,250" fill="#d9d2c4" stroke="#8a8272"/><polygon points="214,250 226,214 238,250" fill="#d9d2c4" stroke="#8a8272"/><polygon points="238,250 250,214 262,250" fill="#d9d2c4" stroke="#8a8272"/><polygon points="262,250 274,214 286,250" fill="#d9d2c4" stroke="#8a8272"/><rect x="360" y="190" width="200" height="26" fill="#e9e4da" stroke="#8a8272"/><rect x="340" y="216" width="240" height="14" fill="#d9d2c4"/><rect x="340" y="230" width="240" height="30" fill="#bfb49f"/><path d="M370 178 h180 m-180 0 l12 -8 m-12 8 l12 8 m168 -8 l-12 -8 m12 8 l-12 8" stroke="#1f6f6b" stroke-width="3" fill="none"/><rect x="660" y="150" width="200" height="130" fill="#d9d2c4" stroke="#8a8272" stroke-width="2"/><rect x="666" y="156" width="20" height="118" fill="#bfb49f" opacity=".9"/><rect x="694" y="156" width="20" height="118" fill="#bfb49f" opacity=".9"/><rect x="722" y="156" width="20" height="118" fill="#bfb49f" opacity=".9"/><rect x="750" y="156" width="20" height="118" fill="#bfb49f" opacity=".9"/><rect x="778" y="156" width="20" height="118" fill="#bfb49f" opacity=".9"/><rect x="806" y="156" width="20" height="118" fill="#bfb49f" opacity=".9"/><rect x="834" y="156" width="20" height="118" fill="#bfb49f" opacity=".9"/><rect x="740" y="220" width="30" height="18" fill="#f7f4ee"/><text x="480" y="392" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#1f6f6b" text-anchor="middle">Dry areas: more than 80% of the tile back in contact. Wet areas and exteriors: more than 95%.</text><text x="480" y="424" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" font-weight="normal" fill="#20312f" text-anchor="middle">Larger tiles and deep back patterns may need a bigger notch or back-buttering.</text><text x="480" y="456" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" font-weight="normal" fill="#c0392b" text-anchor="middle">A fast-setting product allows grouting in 3 hours; another says 16 to 24. Read your bag.</text><text x="480" y="508" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="normal" fill="#4b5b58" text-anchor="middle">Sources: Mapei Ceramic Tile Mortar data sheet (2018); Custom Building Products SpeedSet TDS-123 (2024).</text></svg>