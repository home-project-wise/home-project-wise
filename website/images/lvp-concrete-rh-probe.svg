<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d"><title id="t">In-situ relative humidity probe in a concrete slab</title><desc id="d">Cross-section of a concrete slab with a drilled hole, sleeve and probe, and a panel showing one 88 percent reading passing a 90 percent limit and failing an 85 percent limit.</desc><rect width="960" height="540" rx="16" fill="#f7f4ee"/><text x="40" y="50" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="26" font-weight="bold" fill="#20312f" text-anchor="start">In-situ RH test in a concrete slab (the idea)</text><rect x="120" y="200" width="460" height="200" fill="#cfcac0" stroke="#8a8272" stroke-width="2"/><rect x="120" y="400" width="460" height="46" fill="#b9a98a" opacity=".7"/><text x="350" y="430" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="16" font-weight="normal" fill="#4b5b58" text-anchor="middle">Ground or vapor film</text><rect x="340" y="250" width="20" height="150" fill="#3a3a3a"/><rect x="326" y="198" width="48" height="60" rx="6" fill="#6b8fa3"/><line x1="350" y1="258" x2="350" y2="392" stroke="#c0392b" stroke-width="4"/><circle cx="350" cy="392" r="7" fill="#c0392b"/><text x="350" y="180" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#20312f" text-anchor="middle">Probe reading: 88% RH (example)</text><line x1="200" y1="300" x2="326" y2="262" stroke="#20312f"/><text x="120" y="330" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" font-weight="bold" fill="#20312f" text-anchor="start">Sleeve</text><line x1="470" y1="330" x2="362" y2="330" stroke="#20312f"/><text x="476" y="336" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" font-weight="bold" fill="#20312f" text-anchor="start">Drilled hole</text><line x1="470" y1="390" x2="358" y2="392" stroke="#20312f"/><text x="476" y="396" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" font-weight="bold" fill="#20312f" text-anchor="start">Probe</text><rect x="620" y="150" width="300" height="250" rx="12" fill="#ffffff" stroke="#b9a98a"/><text x="640" y="186" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="20" font-weight="bold" fill="#20312f" text-anchor="start">Same slab, two limits</text><text x="640" y="222" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="normal" fill="#20312f" text-anchor="start">Lowe’s document: 85% max</text><text x="640" y="250" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#c0392b" text-anchor="start">Result 88%: fails</text><text x="640" y="300" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="normal" fill="#20312f" text-anchor="start">VevoXL document: 90% max</text><text x="640" y="328" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#1f6f6b" text-anchor="start">Result 88%: passes</text><text x="640" y="372" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" font-weight="normal" fill="#4b5b58" text-anchor="start">Your plank’s limit decides.</text><text x="480" y="486" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="16" font-weight="normal" fill="#4b5b58" text-anchor="middle">Illustration only. Hole depth and wait times come from the test standard and the probe maker.</text></svg>