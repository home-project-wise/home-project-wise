<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d"><title id="t">Choosing replacement drawer slides</title><desc id="d">Six properties to match when choosing replacement drawer slides: length, extension, load rating, side space, disconnect type and mounting holes.</desc><rect width="960" height="540" rx="16" fill="#f7f4ee"/><text x="40" y="50" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="26" font-weight="bold" fill="#20312f" text-anchor="start">Six things to match when you choose slides</text><rect x="40" y="90" width="420" height="90" rx="10" fill="#ffffff" stroke="#b9b2a5"/><circle cx="74" cy="135" r="16" fill="#1f6f6b"/><text x="74" y="141" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text><text x="104" y="130" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="20" font-weight="bold" fill="#20312f" text-anchor="start">Length</text><text x="104" y="158" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="16" font-weight="normal" fill="#4b5b58" text-anchor="start">Use the longest the opening allows</text><rect x="480" y="90" width="420" height="90" rx="10" fill="#ffffff" stroke="#b9b2a5"/><circle cx="514" cy="135" r="16" fill="#1f6f6b"/><text x="514" y="141" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text><text x="544" y="130" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="20" font-weight="bold" fill="#20312f" text-anchor="start">Extension</text><text x="544" y="158" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="16" font-weight="normal" fill="#4b5b58" text-anchor="start">3/4, full or over-travel</text><rect x="40" y="200" width="420" height="90" rx="10" fill="#ffffff" stroke="#b9b2a5"/><circle cx="74" cy="245" r="16" fill="#1f6f6b"/><text x="74" y="251" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text><text x="104" y="240" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="20" font-weight="bold" fill="#20312f" text-anchor="start">Load rating</text><text x="104" y="268" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="16" font-weight="normal" fill="#4b5b58" text-anchor="start">Per pair; drops past 450 mm</text><rect x="480" y="200" width="420" height="90" rx="10" fill="#ffffff" stroke="#b9b2a5"/><circle cx="514" cy="245" r="16" fill="#1f6f6b"/><text x="514" y="251" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text><text x="544" y="240" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="20" font-weight="bold" fill="#20312f" text-anchor="start">Side space</text><text x="544" y="268" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="16" font-weight="normal" fill="#4b5b58" text-anchor="start">Exactly as the sheet states</text><rect x="40" y="310" width="420" height="90" rx="10" fill="#ffffff" stroke="#b9b2a5"/><circle cx="74" cy="355" r="16" fill="#1f6f6b"/><text x="74" y="361" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text><text x="104" y="350" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="20" font-weight="bold" fill="#20312f" text-anchor="start">Disconnect</text><text x="104" y="378" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="16" font-weight="normal" fill="#4b5b58" text-anchor="start">Lever or push latch</text><rect x="480" y="310" width="420" height="90" rx="10" fill="#ffffff" stroke="#b9b2a5"/><circle cx="514" cy="355" r="16" fill="#1f6f6b"/><text x="514" y="361" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text><text x="544" y="350" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="20" font-weight="bold" fill="#20312f" text-anchor="start">Mounting holes</text><text x="544" y="378" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="16" font-weight="normal" fill="#4b5b58" text-anchor="start">Use only the dimensioned ones</text><text x="480" y="456" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#1f6f6b" text-anchor="middle">Replace both slides of the pair so wear and alignment match.</text><text x="480" y="484" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" font-weight="bold" fill="#c0392b" text-anchor="middle">Our precaution: do not trust length alone.</text><text x="480" y="512" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="normal" fill="#4b5b58" text-anchor="middle">Source: Accuride help center, “How to select a ball bearing drawer slide” (2026).</text></svg>