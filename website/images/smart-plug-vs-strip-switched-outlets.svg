<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Diagram of a smart power strip with six individually switched outlets and three always-on USB ports" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif"><rect width="960" height="540" fill="#F7F5F0"/><text x="480" y="42" font-size="30" font-weight="700" fill="#243238" text-anchor="middle">What a smart strip can switch</text>
<rect x="60" y="200" width="840" height="150" rx="16" fill="#E4ECE8" stroke="#243238" stroke-width="4"/>
<rect x="100" y="230" width="75" height="75" rx="10" fill="#fff" stroke="#243238" stroke-width="3"/><circle cx="125" cy="258" r="6" fill="#243238"/><circle cx="150" cy="258" r="6" fill="#243238"/><circle cx="137" cy="282" r="6" fill="#243238"/><rect x="112" y="315" width="50" height="10" rx="5" fill="#6F8F82"/><rect x="195" y="230" width="75" height="75" rx="10" fill="#fff" stroke="#243238" stroke-width="3"/><circle cx="220" cy="258" r="6" fill="#243238"/><circle cx="245" cy="258" r="6" fill="#243238"/><circle cx="232" cy="282" r="6" fill="#243238"/><rect x="207" y="315" width="50" height="10" rx="5" fill="#6F8F82"/><rect x="290" y="230" width="75" height="75" rx="10" fill="#fff" stroke="#243238" stroke-width="3"/><circle cx="315" cy="258" r="6" fill="#243238"/><circle cx="340" cy="258" r="6" fill="#243238"/><circle cx="327" cy="282" r="6" fill="#243238"/><rect x="302" y="315" width="50" height="10" rx="5" fill="#6F8F82"/><rect x="385" y="230" width="75" height="75" rx="10" fill="#fff" stroke="#243238" stroke-width="3"/><circle cx="410" cy="258" r="6" fill="#243238"/><circle cx="435" cy="258" r="6" fill="#243238"/><circle cx="422" cy="282" r="6" fill="#243238"/><rect x="397" y="315" width="50" height="10" rx="5" fill="#6F8F82"/><rect x="480" y="230" width="75" height="75" rx="10" fill="#fff" stroke="#243238" stroke-width="3"/><circle cx="505" cy="258" r="6" fill="#243238"/><circle cx="530" cy="258" r="6" fill="#243238"/><circle cx="517" cy="282" r="6" fill="#243238"/><rect x="492" y="315" width="50" height="10" rx="5" fill="#6F8F82"/><rect x="575" y="230" width="75" height="75" rx="10" fill="#fff" stroke="#243238" stroke-width="3"/><circle cx="600" cy="258" r="6" fill="#243238"/><circle cx="625" cy="258" r="6" fill="#243238"/><circle cx="612" cy="282" r="6" fill="#243238"/><rect x="587" y="315" width="50" height="10" rx="5" fill="#6F8F82"/><rect x="700" y="248" width="45" height="38" rx="6" fill="#fff" stroke="#B5482F" stroke-width="3"/><rect x="760" y="248" width="45" height="38" rx="6" fill="#fff" stroke="#B5482F" stroke-width="3"/><rect x="820" y="248" width="45" height="38" rx="6" fill="#fff" stroke="#B5482F" stroke-width="3"/>
<text x="337" y="180" font-size="22" font-weight="700" fill="#6F8F82" text-anchor="middle">6 outlets, each switched on its own</text>
<text x="780" y="180" font-size="22" font-weight="700" fill="#B5482F" text-anchor="middle">3 USB ports</text>
<text x="780" y="385" font-size="19" font-weight="700" fill="#B5482F" text-anchor="middle">always on, not switched</text>
<text x="337" y="385" font-size="19" font-weight="700" fill="#6F8F82" text-anchor="middle">green bar = its own switch</text>
<text x="480" y="470" font-size="19" font-weight="500" fill="#5b6b70" text-anchor="middle">Layout of a strip like the Kasa HS300. Other models differ.</text>
</svg>
