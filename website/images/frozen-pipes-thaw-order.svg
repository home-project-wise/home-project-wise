<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Diagram showing how to thaw a frozen pipe by warming from the tap end back toward the frozen section while the tap stays open" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif"><rect width="960" height="540" fill="#F7F5F0"/><text x="480" y="44" font-size="28" font-weight="700" fill="#243238" text-anchor="middle">Frozen but not leaking: thaw from the tap end</text><rect x="60" y="215" width="70" height="90" rx="8" fill="#243238"/><text x="95" y="330" font-size="17" font-weight="600" fill="#243238" text-anchor="middle">Tap (open)</text><rect x="130" y="243" width="700" height="34" fill="#cfe0e6" stroke="#9fb7c0" stroke-width="3"/><rect x="560" y="243" width="150" height="34" fill="#9fc3d3" stroke="#6f9db0" stroke-width="3"/><text x="635" y="300" font-size="17" font-weight="600" fill="#243238" text-anchor="middle">Frozen section</text><rect x="830" y="200" width="40" height="120" rx="6" fill="#ECE8DD" stroke="#B9B4A6" stroke-width="3"/><text x="850" y="345" font-size="16" font-weight="600" fill="#5b6b70" text-anchor="middle">Wall</text><rect x="140" y="205" width="110" height="26" rx="13" fill="#E0A43A"/><text x="195" y="224" font-size="15" font-weight="700" fill="#243238" text-anchor="middle">warm towel</text><line x1="260" y1="218" x2="528" y2="218" stroke="#E0A43A" stroke-width="5" stroke-linecap="round"/><polygon points="540,218 524,208 524,228" fill="#E0A43A"/><text x="400" y="198" font-size="16" font-weight="600" fill="#243238" text-anchor="middle">1. start here, work back along the pipe</text><circle cx="80" cy="389" r="12" fill="#6F8F82"/><text x="80" y="395" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="104" y="395" font-size="18" font-weight="600" fill="#243238" text-anchor="start">Open the tap so thawed water can run</text><circle cx="80" cy="419" r="12" fill="#6F8F82"/><text x="80" y="425" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="104" y="425" font-size="18" font-weight="600" fill="#243238" text-anchor="start">Warm towel or hot water bottle at the tap end</text><circle cx="80" cy="449" r="12" fill="#6F8F82"/><text x="80" y="455" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="104" y="455" font-size="18" font-weight="600" fill="#243238" text-anchor="start">Move toward the frozen section, keep the tap open</text><circle cx="80" cy="479" r="12" fill="#6F8F82"/><text x="80" y="485" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="104" y="485" font-size="18" font-weight="600" fill="#243238" text-anchor="start">Keep warming until the flow is full again</text><rect x="590" y="385" width="320" height="64" rx="12" fill="#fff" stroke="#B5482F" stroke-width="3"/><text x="750" y="414" font-size="19" font-weight="700" fill="#B5482F" text-anchor="middle">No flame, no blowtorch,</text><text x="750" y="438" font-size="19" font-weight="700" fill="#B5482F" text-anchor="middle">no propane or charcoal heater</text></svg>