<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Four-step order for a water leak: people safe, stop the water, check the electrics, call help, with a gas smell overriding everything" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif"><rect width="960" height="540" fill="#F7F5F0"/><text x="480" y="40" font-size="30" font-weight="700" fill="#243238" text-anchor="middle">The order that matters</text><rect x="60" y="70" width="840" height="64" rx="12" fill="#fbeae5" stroke="#B5482F" stroke-width="3"/><text x="480" y="110" font-size="24" font-weight="700" fill="#B5482F" text-anchor="middle">Smell gas? Leave now and call from outside. Gas comes first.</text><rect x="60" y="200" width="190" height="210" rx="14" fill="#fff" stroke="#243238" stroke-width="2.5"/><circle cx="155" cy="245" r="24" fill="#6F8F82"/><text x="155" y="253" font-size="24" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="155" y="305" font-size="22" font-weight="700" fill="#243238" text-anchor="middle">People safe</text><text x="155" y="340" font-size="15" font-weight="500" fill="#5b6b70" text-anchor="middle">Keep everyone away from hazards</text><line x1="252" y1="305" x2="261" y2="305" stroke="#243238" stroke-width="5" stroke-linecap="round"/><polygon points="273,305 257,295 257,315" fill="#243238"/><rect x="275" y="200" width="190" height="210" rx="14" fill="#fff" stroke="#243238" stroke-width="2.5"/><circle cx="370" cy="245" r="24" fill="#6F8F82"/><text x="370" y="253" font-size="24" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="370" y="305" font-size="22" font-weight="700" fill="#243238" text-anchor="middle">Stop the water</text><text x="370" y="340" font-size="15" font-weight="500" fill="#5b6b70" text-anchor="middle">Main valve (US) or stop tap (UK)</text><line x1="467" y1="305" x2="476" y2="305" stroke="#243238" stroke-width="5" stroke-linecap="round"/><polygon points="488,305 472,295 472,315" fill="#243238"/><rect x="490" y="200" width="190" height="210" rx="14" fill="#fff" stroke="#243238" stroke-width="2.5"/><circle cx="585" cy="245" r="24" fill="#6F8F82"/><text x="585" y="253" font-size="24" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="585" y="305" font-size="22" font-weight="700" fill="#243238" text-anchor="middle">Check electrics</text><text x="585" y="340" font-size="15" font-weight="500" fill="#5b6b70" text-anchor="middle">Only from a dry position</text><line x1="682" y1="305" x2="691" y2="305" stroke="#243238" stroke-width="5" stroke-linecap="round"/><polygon points="703,305 687,295 687,315" fill="#243238"/><rect x="705" y="200" width="190" height="210" rx="14" fill="#fff" stroke="#243238" stroke-width="2.5"/><circle cx="800" cy="245" r="24" fill="#6F8F82"/><text x="800" y="253" font-size="24" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="800" y="305" font-size="22" font-weight="700" fill="#243238" text-anchor="middle">Call help</text><text x="800" y="340" font-size="15" font-weight="500" fill="#5b6b70" text-anchor="middle">Plumber, utility, electrician</text><text x="480" y="470" font-size="20" font-weight="500" fill="#5b6b70" text-anchor="middle">Then look for the source, limit the damage and photograph everything.</text></svg>