<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Two duct runs compared: a sagging, bare duct that slopes back toward the fan collects water, while a sealed, insulated duct that slopes down toward the outside lets water drain away" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif"><rect width="960" height="540" fill="#F7F5F0"/><text x="480" y="52" font-size="32" font-weight="700" fill="#243238" text-anchor="middle">Check the duct run</text><text x="250" y="104" font-size="24" font-weight="700" fill="#B4541F" text-anchor="middle">Wrong</text><text x="710" y="104" font-size="24" font-weight="700" fill="#4E7466" text-anchor="middle">Right</text><line x1="480" y1="120" x2="480" y2="500" stroke="#D8D2C4" stroke-width="3"/><rect x="40" y="150" width="60" height="70" rx="8" fill="#fff" stroke="#9A9486" stroke-width="3"/><text x="70" y="192" font-size="20" font-weight="700" fill="#243238" text-anchor="middle">Fan</text><path d="M100 185 C170 185 190 215 250 250 S350 262 440 205" fill="none" stroke="#9A9486" stroke-width="22" stroke-linecap="round"/><path d="M100 185 C170 185 190 215 250 250 S350 262 440 205" fill="none" stroke="#fff" stroke-width="16" stroke-linecap="round"/><ellipse cx="300" cy="268" rx="40" ry="6" fill="#2F6F8F"/><text x="290" y="308" font-size="20" font-weight="700" fill="#2F6F8F" text-anchor="middle">Water pools in the sag</text><text x="250" y="352" font-size="20" fill="#243238" text-anchor="middle">Bare duct, loose joint,</text><text x="250" y="380" font-size="20" fill="#243238" text-anchor="middle">low spot, rises to the outlet</text><rect x="500" y="170" width="60" height="70" rx="8" fill="#fff" stroke="#9A9486" stroke-width="3"/><text x="530" y="212" font-size="20" font-weight="700" fill="#243238" text-anchor="middle">Fan</text><polygon points="560,196 900,236 900,276 560,236" fill="#E4C98A" stroke="#B9974A" stroke-width="3"/><polygon points="560,206 900,246 900,266 560,226" fill="#fff" stroke="#9A9486" stroke-width="2"/><rect x="900" y="226" width="14" height="60" fill="#D8D2C4"/><path d="M640 300 L840 322" fill="none" stroke="#2F6F8F" stroke-width="4" stroke-dasharray="10 8"/><path d="M822 310 l22 12 l-24 8" fill="none" stroke="#2F6F8F" stroke-width="4"/><text x="720" y="352" font-size="20" font-weight="700" fill="#4E7466" text-anchor="middle">Water drains out</text><text x="720" y="400" font-size="20" fill="#243238" text-anchor="middle">Taped or mastic-sealed joints,</text><text x="720" y="428" font-size="20" fill="#243238" text-anchor="middle">insulation wrap, falls to the outside</text><text x="870" y="188" font-size="18" font-weight="600" fill="#8A6A20" text-anchor="middle">Insulation</text></svg>