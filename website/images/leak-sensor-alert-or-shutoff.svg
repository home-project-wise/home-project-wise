<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Comparison of a leak sensor that sends an alert and an automatic shut-off valve that closes the water supply when a leak is detected" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif"><rect width="960" height="540" fill="#F7F5F0"/><text x="480" y="50" font-size="32" font-weight="700" fill="#243238" text-anchor="middle">An alert tells you; a valve acts</text><rect x="40" y="90" width="430" height="400" rx="14" fill="#fff" stroke="#D8D2C4" stroke-width="3"/><rect x="490" y="90" width="430" height="400" rx="14" fill="#fff" stroke="#D8D2C4" stroke-width="3"/><text x="255" y="135" font-size="26" font-weight="700" fill="#D97745" text-anchor="middle">Leak sensor with alert</text><circle cx="80" cy="185" r="16" fill="#D97745"/><text x="80" y="191.3" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="110" y="192" font-size="20" font-weight="500" fill="#243238" text-anchor="start">Sits on the floor, senses water</text><circle cx="80" cy="240" r="16" fill="#6F8F82"/><text x="80" y="246.3" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="110" y="247" font-size="20" font-weight="500" fill="#243238" text-anchor="start">Sounds an alarm or messages you</text><circle cx="80" cy="295" r="16" fill="#D97745"/><text x="80" y="301.3" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="110" y="302" font-size="20" font-weight="500" fill="#243238" text-anchor="start">You turn the water off</text><circle cx="80" cy="350" r="16" fill="#6F8F82"/><text x="80" y="356.3" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="110" y="357" font-size="20" font-weight="500" fill="#243238" text-anchor="start">Lower cost, no plumbing work</text><circle cx="80" cy="405" r="16" fill="#D97745"/><text x="80" y="411.3" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="110" y="412" font-size="20" font-weight="500" fill="#243238" text-anchor="start">Needs someone to react</text><text x="705" y="135" font-size="26" font-weight="700" fill="#6F8F82" text-anchor="middle">Automatic shut-off valve</text><circle cx="530" cy="185" r="16" fill="#6F8F82"/><text x="530" y="191.3" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="560" y="192" font-size="20" font-weight="500" fill="#243238" text-anchor="start">Fits on the main or an appliance line</text><circle cx="530" cy="240" r="16" fill="#D97745"/><text x="530" y="246.3" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="560" y="247" font-size="20" font-weight="500" fill="#243238" text-anchor="start">Closes the water on a detected leak</text><circle cx="530" cy="295" r="16" fill="#6F8F82"/><text x="530" y="301.3" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="560" y="302" font-size="20" font-weight="500" fill="#243238" text-anchor="start">Limits damage while you are away</text><circle cx="530" cy="350" r="16" fill="#D97745"/><text x="530" y="356.3" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="560" y="357" font-size="20" font-weight="500" fill="#243238" text-anchor="start">Higher cost, often a plumber job</text><circle cx="530" cy="405" r="16" fill="#6F8F82"/><text x="530" y="411.3" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="560" y="412" font-size="20" font-weight="500" fill="#243238" text-anchor="start">Check how it acts with no Wi-Fi</text></svg>