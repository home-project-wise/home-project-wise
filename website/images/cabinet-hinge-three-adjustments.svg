<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d"><title id="t">Side, depth and height adjustments on a concealed hinge</title><desc id="d">Three panels: side adjustment with the front cam screw, depth adjustment with the rear cam screw, and height adjustment with the mounting plate cam screw, with one hinge’s ranges.</desc><rect width="960" height="540" rx="16" fill="#f7f4ee"/><text x="40" y="50" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="26" font-weight="bold" fill="#20312f" text-anchor="start">The three adjustments, with one hinge’s limits</text><rect x="40" y="90" width="280" height="310" rx="12" fill="#ffffff" stroke="#b9b2a5"/><circle cx="70" cy="120" r="16" fill="#1f6f6b"/><text x="70" y="126" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text><text x="96" y="127" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="20" font-weight="bold" fill="#20312f" text-anchor="start">Side</text><text x="180" y="360" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" font-weight="bold" fill="#20312f" text-anchor="middle">Front cam screw</text><text x="180" y="384" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="16" font-weight="normal" fill="#4b5b58" text-anchor="middle">Range ±2 mm (3/32 in)</text><rect x="340" y="90" width="280" height="310" rx="12" fill="#ffffff" stroke="#b9b2a5"/><circle cx="370" cy="120" r="16" fill="#1f6f6b"/><text x="370" y="126" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text><text x="396" y="127" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="20" font-weight="bold" fill="#20312f" text-anchor="start">Depth</text><text x="480" y="360" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" font-weight="bold" fill="#20312f" text-anchor="middle">Rear cam screw</text><text x="480" y="384" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="16" font-weight="normal" fill="#4b5b58" text-anchor="middle">Range +3 mm, −2 mm</text><rect x="640" y="90" width="280" height="310" rx="12" fill="#ffffff" stroke="#b9b2a5"/><circle cx="670" cy="120" r="16" fill="#1f6f6b"/><text x="670" y="126" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text><text x="696" y="127" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="20" font-weight="bold" fill="#20312f" text-anchor="start">Height</text><text x="780" y="360" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" font-weight="bold" fill="#20312f" text-anchor="middle">Cam screw on the mounting plate</text><text x="780" y="384" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="16" font-weight="normal" fill="#4b5b58" text-anchor="middle">Range ±2 mm</text><rect x="70" y="170" width="220" height="150" fill="#ece3d2" stroke="#8a8272" stroke-width="2"/><rect x="100" y="190" width="160" height="110" fill="#f9f6ef" stroke="#8a8272" stroke-width="2"/><path d="M110 245 h140 m-140 0 l12 -8 m-12 8 l12 8 m128 -8 l-12 -8 m12 8 l-12 8" stroke="#1f6f6b" stroke-width="3" fill="none"/><rect x="370" y="170" width="30" height="150" fill="#ece3d2" stroke="#8a8272" stroke-width="2"/><rect x="420" y="200" width="22" height="90" fill="#f9f6ef" stroke="#8a8272" stroke-width="2"/><path d="M410 250 h-20 m20 0 l-8 -6 m8 6 l-8 6 M452 250 h36 m-36 0 l8 -6 m-8 6 l8 6" stroke="#1f6f6b" stroke-width="3" fill="none"/><text x="520" y="256" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="15" font-weight="normal" fill="#4b5b58" text-anchor="start">in / out</text><rect x="670" y="170" width="220" height="150" fill="#ece3d2" stroke="#8a8272" stroke-width="2"/><rect x="700" y="190" width="160" height="110" fill="#f9f6ef" stroke="#8a8272" stroke-width="2"/><path d="M780 200 v90 m0 -90 l-8 12 m8 -12 l8 12 m-8 78 l-8 -12 m8 12 l8 -12" stroke="#1f6f6b" stroke-width="3" fill="none"/><text x="480" y="440" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" font-weight="bold" fill="#1f6f6b" text-anchor="middle">Turn a quarter turn, watch which way the door moves, then continue or reverse. (Our method.)</text><text x="480" y="468" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="normal" fill="#4b5b58" text-anchor="middle">Ranges are for Blum CLIP top BLUMOTION 110°. Other hinges differ: Blum’s catalog lists COMPACT 33 at ±9/64 in height and 1/8 in side only.</text><text x="480" y="496" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="15" font-weight="bold" fill="#c0392b" text-anchor="middle">Illustrative only. Use the exact hinge manual.</text><text x="480" y="520" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="normal" fill="#4b5b58" text-anchor="middle">Sources: Blum CLIP top kit instructions (2025); Blum COMPACT hinge catalog excerpt (2019).</text></svg>