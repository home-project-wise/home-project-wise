<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="t d"><title id="t">Crawl-space drainage checks</title><desc id="d">Three practical checks: extend downspouts away from the foundation, slope soil away from the house, and repair plumbing leaks.</desc><rect width="960" height="420" rx="24" fill="#f4f7f4"/><text x="48" y="56" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#243c32">Find the water source first</text><g font-family="Arial,sans-serif" fill="#243c32"><rect x="38" y="92" width="278" height="270" rx="18" fill="#fff" stroke="#c8d5cc" stroke-width="2"/><path d="M80 175 L175 115 L270 175" fill="#dfe8e1" stroke="#536c5c" stroke-width="6" stroke-linejoin="round"/><path d="M102 175 V220 H248 V175" fill="#e8eee9" stroke="#536c5c" stroke-width="5"/><path d="M250 165 V225 Q250 240 268 240 H290" fill="none" stroke="#4e8798" stroke-width="8"/><path d="M280 228 L296 240 L280 252" fill="none" stroke="#4e8798" stroke-width="6"/><text x="58" y="285" font-size="21" font-weight="700">1. Downspouts</text><text x="58" y="316" font-size="17">Discharge away from</text><text x="58" y="340" font-size="17">the foundation.</text><rect x="341" y="92" width="278" height="270" rx="18" fill="#fff" stroke="#c8d5cc" stroke-width="2"/><path d="M365 220 Q450 190 595 225" stroke="#b49a6c" stroke-width="18" fill="none"/><path d="M385 245 L575 245" stroke="#536c5c" stroke-width="5"/><path d="M520 265 L575 245 L520 225" fill="none" stroke="#4e8798" stroke-width="7"/><text x="362" y="285" font-size="21" font-weight="700">2. Soil slope</text><text x="362" y="316" font-size="17">Grade surface water</text><text x="362" y="340" font-size="17">away from the house.</text><rect x="644" y="92" width="278" height="270" rx="18" fill="#fff" stroke="#c8d5cc" stroke-width="2"/><path d="M700 145 H865 V235 H700 Z" fill="#e8eee9" stroke="#536c5c" stroke-width="5"/><path d="M735 165 V212 M765 165 V212 M795 165 V212 M825 165 V212" stroke="#9aada0" stroke-width="6"/><path d="M775 230 C760 245 790 252 775 268 C760 284 790 290 775 304" fill="none" stroke="#4e8798" stroke-width="7"/><text x="665" y="285" font-size="21" font-weight="700">3. Plumbing</text><text x="665" y="316" font-size="17">Repair drips and</text><text x="665" y="340" font-size="17">active leaks promptly.</text></g></svg>