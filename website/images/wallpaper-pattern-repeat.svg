<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" rx="24" fill="#f5f2eb"/><text x="600" y="65" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#263b35">A full pattern repeat adds to the cut length</text><rect x="210" y="135" width="260" height="430" rx="8" fill="#e9e2d2" stroke="#718a79" stroke-width="5"/><g stroke="#718a79" fill="none" stroke-width="5"><path d="M340 145C270 180 270 230 340 265C410 230 410 180 340 145ZM340 265C270 300 270 350 340 385C410 350 410 300 340 265ZM340 385C270 420 270 470 340 505C410 470 410 420 340 385Z"/></g><path d="M500 145V565" stroke="#bd7c50" stroke-width="5" stroke-dasharray="12 10"/><text x="560" y="190" font-family="Arial,sans-serif" font-size="25" fill="#263b35">Wall height</text><text x="560" y="228" font-family="Arial,sans-serif" font-size="23" fill="#536d5e">8.0 ft</text><text x="560" y="290" font-family="Arial,sans-serif" font-size="25" fill="#263b35">+ trim allowance</text><text x="560" y="328" font-family="Arial,sans-serif" font-size="23" fill="#536d5e">0.5 ft</text><text x="560" y="390" font-family="Arial,sans-serif" font-size="25" fill="#263b35">+ one 20-inch repeat</text><text x="560" y="428" font-family="Arial,sans-serif" font-size="23" fill="#536d5e">1.667 ft</text><path d="M850 150V540" stroke="#bd7c50" stroke-width="6"/><path d="M830 150h40M830 540h40" stroke="#bd7c50" stroke-width="6"/><text x="900" y="265" font-family="Arial,sans-serif" font-size="26" fill="#263b35">Matched drop</text><text x="900" y="315" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#263b35">10.167 ft</text><text x="600" y="620" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#536d5e">8 + 0.5 + 1.667 = 10.167 ft · follow the selected manufacturer's instructions</text></svg>