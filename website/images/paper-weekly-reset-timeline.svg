<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Five minute weekly paper reset timeline with three steps: empty the tray, act, then file or shred"><rect width="960" height="540" fill="#F7F5F0"/><text x="480" y="55" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#243238" text-anchor="middle">The five-minute weekly paper reset</text><line x1="100" y1="250" x2="860" y2="250" stroke="#243238" stroke-width="4"/><circle cx="160" cy="250" r="22" fill="#D97745" stroke="#243238" stroke-width="3"/><text x="160" y="258" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="160" y="180" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#243238" text-anchor="middle">Minutes 0 to 1</text><text x="160" y="320" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="400" fill="#243238" text-anchor="middle">Empty the tray onto the </text><text x="160" y="350" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="400" fill="#243238" text-anchor="middle">table</text><circle cx="480" cy="250" r="22" fill="#D97745" stroke="#243238" stroke-width="3"/><text x="480" y="258" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="480" y="180" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#243238" text-anchor="middle">Minutes 1 to 3</text><text x="480" y="320" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="400" fill="#243238" text-anchor="middle">Pay, answer or book what</text><text x="480" y="350" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="400" fill="#243238" text-anchor="middle">is due</text><circle cx="800" cy="250" r="22" fill="#D97745" stroke="#243238" stroke-width="3"/><text x="800" y="258" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="800" y="180" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#243238" text-anchor="middle">Minutes 3 to 5</text><text x="800" y="320" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="400" fill="#243238" text-anchor="middle">File, shred, recycle the</text><text x="800" y="350" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="400" fill="#243238" text-anchor="middle">rest</text><text x="480" y="470" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#243238" text-anchor="middle">Pick the same day each week. A fixed day makes it a habit.</text></svg>