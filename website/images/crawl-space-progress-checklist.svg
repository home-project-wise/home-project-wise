<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="t d"><title id="t">Crawl-space humidity progress checklist</title><desc id="d">Checklist to review after repairs: no standing water, dry ground cover, stable humidity readings, and no new musty odor.</desc><rect width="960" height="420" rx="24" fill="#f4f7f4"/><text x="48" y="55" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#243c32">Check these signs of progress</text><g font-family="Arial,sans-serif" fill="#243c32"><rect x="70" y="95" width="820" height="62" rx="14" fill="#fff" stroke="#c8d5cc" stroke-width="2"/><circle cx="108" cy="126" r="17" fill="#dcebe0" stroke="#47775a" stroke-width="3"/><path d="M99 126 L106 133 L119 117" fill="none" stroke="#47775a" stroke-width="4"/><text x="145" y="134" font-size="21">No standing water or active leaks</text><rect x="70" y="172" width="820" height="62" rx="14" fill="#fff" stroke="#c8d5cc" stroke-width="2"/><circle cx="108" cy="203" r="17" fill="#dcebe0" stroke="#47775a" stroke-width="3"/><path d="M99 203 L106 210 L119 194" fill="none" stroke="#47775a" stroke-width="4"/><text x="145" y="211" font-size="21">Ground vapor barrier stays intact and dry on top</text><rect x="70" y="249" width="820" height="62" rx="14" fill="#fff" stroke="#c8d5cc" stroke-width="2"/><circle cx="108" cy="280" r="17" fill="#dcebe0" stroke="#47775a" stroke-width="3"/><path d="M99 280 L106 287 L119 271" fill="none" stroke="#47775a" stroke-width="4"/><text x="145" y="288" font-size="21">Humidity readings are consistently improving</text><text x="75" y="357" font-size="18">Recheck after rain and across several days; one dry afternoon is not proof.</text></g></svg>