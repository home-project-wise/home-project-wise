<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d"><title id="t">Removing a cracked tile with a chisel</title><desc id="d">Three panels: chisel at 90 degrees on the deepest crack, chisel at 45 degrees working from the center out, and a wider chisel clearing the old mortar from the bed.</desc><rect width="960" height="540" rx="16" fill="#f7f4ee"/><text x="40" y="50" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="26" font-weight="bold" fill="#20312f" text-anchor="start">Remove the grout and the tile, step by step</text><rect x="40" y="90" width="280" height="330" rx="12" fill="#ffffff" stroke="#b9b2a5"/><circle cx="70" cy="120" r="16" fill="#1f6f6b"/><text x="70" y="126" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text><text x="96" y="127" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="19" font-weight="bold" fill="#20312f" text-anchor="start">Chisel at 90°</text><rect x="60" y="280" width="60" height="26" fill="#e9e4da" stroke="#8a8272"/><rect x="240" y="280" width="60" height="26" fill="#e9e4da" stroke="#8a8272"/><rect x="60" y="306" width="240" height="14" fill="#cfc3b0" stroke="#8a8272"/><rect x="60" y="320" width="240" height="40" fill="#bfb49f" stroke="#8a8272"/><text x="180" y="396" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="15" font-weight="normal" fill="#4b5b58" text-anchor="middle">On the deepest crack, tap until th</text><text x="180" y="414" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="15" font-weight="normal" fill="#4b5b58" text-anchor="middle">e glaze breaks</text><rect x="340" y="90" width="280" height="330" rx="12" fill="#ffffff" stroke="#b9b2a5"/><circle cx="370" cy="120" r="16" fill="#1f6f6b"/><text x="370" y="126" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text><text x="396" y="127" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="19" font-weight="bold" fill="#20312f" text-anchor="start">Switch to 45°</text><rect x="360" y="280" width="60" height="26" fill="#e9e4da" stroke="#8a8272"/><rect x="540" y="280" width="60" height="26" fill="#e9e4da" stroke="#8a8272"/><rect x="360" y="306" width="240" height="14" fill="#cfc3b0" stroke="#8a8272"/><rect x="360" y="320" width="240" height="40" fill="#bfb49f" stroke="#8a8272"/><text x="480" y="396" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="15" font-weight="normal" fill="#4b5b58" text-anchor="middle">Work from the center out toward th</text><text x="480" y="414" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="15" font-weight="normal" fill="#4b5b58" text-anchor="middle">e edges</text><rect x="640" y="90" width="280" height="330" rx="12" fill="#ffffff" stroke="#b9b2a5"/><circle cx="670" cy="120" r="16" fill="#1f6f6b"/><text x="670" y="126" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text><text x="696" y="127" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="19" font-weight="bold" fill="#20312f" text-anchor="start">Clear the bed</text><rect x="660" y="280" width="60" height="26" fill="#e9e4da" stroke="#8a8272"/><rect x="840" y="280" width="60" height="26" fill="#e9e4da" stroke="#8a8272"/><rect x="660" y="306" width="240" height="14" fill="#cfc3b0" stroke="#8a8272"/><rect x="660" y="320" width="240" height="40" fill="#bfb49f" stroke="#8a8272"/><text x="780" y="396" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="15" font-weight="normal" fill="#4b5b58" text-anchor="middle">A wider chisel removes all old mor</text><text x="780" y="414" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="15" font-weight="normal" fill="#4b5b58" text-anchor="middle">tar</text><rect x="80" y="280" width="120" height="26" fill="#ddd2c0" stroke="#8a8272"/><path d="M130 280 l10 12 l-14 8 l12 6" stroke="#c0392b" stroke-width="3" fill="none"/><line x1="140" y1="170" x2="140" y2="278" stroke="#20312f" stroke-width="10"/><rect x="124" y="150" width="32" height="20" rx="4" fill="#20312f"/><rect x="380" y="280" width="120" height="26" fill="#ddd2c0" stroke="#8a8272"/><line x1="470" y1="170" x2="430" y2="278" stroke="#20312f" stroke-width="10"/><rect x="458" y="150" width="32" height="20" rx="4" fill="#20312f" transform="rotate(14 474 160)"/><path d="M400 262 l-30 0 m30 0 l-8 -6 m8 6 l-8 6" stroke="#1f6f6b" stroke-width="3" fill="none"/><rect x="680" y="280" width="120" height="26" fill="none"/><line x1="700" y1="276" x2="790" y2="276" stroke="#20312f" stroke-width="14"/><rect x="790" y="262" width="24" height="28" rx="4" fill="#20312f"/><text x="480" y="466" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#1f6f6b" text-anchor="middle">Grout saw or utility knife first. Light pressure, so neighbors are not scratched.</text><text x="480" y="508" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="normal" fill="#4b5b58" text-anchor="middle">Source: This Old House, “How To Replace a Cracked Floor Tile” (updated 27 May 2026).</text></svg>