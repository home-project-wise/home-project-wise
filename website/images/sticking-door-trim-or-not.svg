<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d"><title id="t">When trimming a door is allowed</title><desc id="d">Four checks: trimming is allowed on hollow or solid core molded and flush doors, not recommended on other types, stop if more than a quarter inch is needed, and check the label on fire-rated doors.</desc><rect width="960" height="540" rx="16" fill="#f7f4ee"/><text x="40" y="50" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="26" font-weight="bold" fill="#20312f" text-anchor="start">Trim only if the door allows it</text><rect x="40" y="90" width="480" height="70" rx="10" fill="#ffffff" stroke="#b9b2a5"/><circle cx="70" cy="125" r="16" fill="#1f6f6b"/><text x="70" y="131" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text><text x="98" y="132" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" font-weight="bold" fill="#20312f" text-anchor="start">Hollow or solid-core molded or flush door?</text><path d="M530 125 h24 l-8 -7 m8 7 l-8 7" stroke="#1f6f6b" stroke-width="3" fill="none"/><rect x="566" y="90" width="354" height="70" rx="10" fill="#e8f1ef" stroke="#a9c9c4"/><text x="582" y="132" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" font-weight="bold" fill="#1f6f6b" text-anchor="start">Yes: trimming is allowed</text><rect x="40" y="182" width="480" height="70" rx="10" fill="#ffffff" stroke="#b9b2a5"/><circle cx="70" cy="217" r="16" fill="#1f6f6b"/><text x="70" y="223" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text><text x="98" y="224" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" font-weight="bold" fill="#20312f" text-anchor="start">Any other type (stile and rail, custom)?</text><path d="M530 217 h24 l-8 -7 m8 7 l-8 7" stroke="#c0392b" stroke-width="3" fill="none"/><rect x="566" y="182" width="354" height="70" rx="10" fill="#fbeeea" stroke="#e3b8ae"/><text x="582" y="224" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" font-weight="bold" fill="#c0392b" text-anchor="start">Not recommended</text><rect x="40" y="274" width="480" height="70" rx="10" fill="#ffffff" stroke="#b9b2a5"/><circle cx="70" cy="309" r="16" fill="#1f6f6b"/><text x="70" y="315" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text><text x="98" y="316" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" font-weight="bold" fill="#20312f" text-anchor="start">Need more than 1/4 in off one side?</text><path d="M530 309 h24 l-8 -7 m8 7 l-8 7" stroke="#c0392b" stroke-width="3" fill="none"/><rect x="566" y="274" width="354" height="70" rx="10" fill="#fbeeea" stroke="#e3b8ae"/><text x="582" y="316" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" font-weight="bold" fill="#c0392b" text-anchor="start">Stop. Check the frame or call a pro</text><rect x="40" y="366" width="480" height="70" rx="10" fill="#ffffff" stroke="#b9b2a5"/><circle cx="70" cy="401" r="16" fill="#1f6f6b"/><text x="70" y="407" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text><text x="98" y="408" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" font-weight="bold" fill="#20312f" text-anchor="start">Fire-rated door?</text><path d="M530 401 h24 l-8 -7 m8 7 l-8 7" stroke="#c0392b" stroke-width="3" fill="none"/><rect x="566" y="366" width="354" height="70" rx="10" fill="#fbeeea" stroke="#e3b8ae"/><text x="582" y="408" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" font-weight="bold" fill="#c0392b" text-anchor="start">Check the label first. Do not trim</text><text x="480" y="486" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#1f6f6b" text-anchor="middle">Trim at most 1/4 in per side, an equal amount from opposite sides.</text><text x="480" y="512" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="normal" fill="#4b5b58" text-anchor="middle">Sources: JELD-WEN JII110; one maker’s warranty note on fire-rated doors (search excerpt).</text></svg>