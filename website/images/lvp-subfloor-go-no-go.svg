<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d"><title id="t">Go or no-go checks before installing LVP</title><desc id="d">Six pass-or-fail checks for subfloor preparation, each with the action to take if it fails.</desc><rect width="960" height="540" rx="16" fill="#f7f4ee"/><text x="40" y="50" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="26" font-weight="bold" fill="#20312f" text-anchor="start">Go or no-go before you open the planks</text><rect x="40" y="80" width="500" height="52" rx="10" fill="#ffffff" stroke="#b9b2a5"/><circle cx="68" cy="106" r="16" fill="#1f6f6b"/><text x="68" y="112" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text><text x="96" y="112" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" font-weight="bold" fill="#20312f" text-anchor="start">Is the substrate approved for your plank?</text><path d="M548 106 h20 l-8 -6 m8 6 l-8 6" stroke="#c0392b" stroke-width="2" fill="none"/><rect x="576" y="80" width="344" height="52" rx="10" fill="#fbeeea" stroke="#e3b8ae"/><text x="592" y="112" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="16" font-weight="normal" fill="#20312f" text-anchor="start">No: ask the maker before you start</text><rect x="40" y="146" width="500" height="52" rx="10" fill="#ffffff" stroke="#b9b2a5"/><circle cx="68" cy="172" r="16" fill="#1f6f6b"/><text x="68" y="178" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text><text x="96" y="178" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" font-weight="bold" fill="#20312f" text-anchor="start">Could old flooring or adhesive hold asbestos?</text><path d="M548 172 h20 l-8 -6 m8 6 l-8 6" stroke="#c0392b" stroke-width="2" fill="none"/><rect x="576" y="146" width="344" height="52" rx="10" fill="#fbeeea" stroke="#e3b8ae"/><text x="592" y="178" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="16" font-weight="normal" fill="#20312f" text-anchor="start">Yes: stop and have it tested</text><rect x="40" y="212" width="500" height="52" rx="10" fill="#ffffff" stroke="#b9b2a5"/><circle cx="68" cy="238" r="16" fill="#1f6f6b"/><text x="68" y="244" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text><text x="96" y="244" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" font-weight="bold" fill="#20312f" text-anchor="start">Is it sound, dry and free of movement?</text><path d="M548 238 h20 l-8 -6 m8 6 l-8 6" stroke="#c0392b" stroke-width="2" fill="none"/><rect x="576" y="212" width="344" height="52" rx="10" fill="#fbeeea" stroke="#e3b8ae"/><text x="592" y="244" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="16" font-weight="normal" fill="#20312f" text-anchor="start">No: repair the cause first</text><rect x="40" y="278" width="500" height="52" rx="10" fill="#ffffff" stroke="#b9b2a5"/><circle cx="68" cy="304" r="16" fill="#1f6f6b"/><text x="68" y="310" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text><text x="96" y="310" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" font-weight="bold" fill="#20312f" text-anchor="start">Is it flat to your maker’s limit?</text><path d="M548 304 h20 l-8 -6 m8 6 l-8 6" stroke="#c0392b" stroke-width="2" fill="none"/><rect x="576" y="278" width="344" height="52" rx="10" fill="#fbeeea" stroke="#e3b8ae"/><text x="592" y="310" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="16" font-weight="normal" fill="#20312f" text-anchor="start">No: grind high spots, fill low ones</text><rect x="40" y="344" width="500" height="52" rx="10" fill="#ffffff" stroke="#b9b2a5"/><circle cx="68" cy="370" r="16" fill="#1f6f6b"/><text x="68" y="376" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text><text x="96" y="376" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" font-weight="bold" fill="#20312f" text-anchor="start">Does the concrete pass your maker’s tests?</text><path d="M548 370 h20 l-8 -6 m8 6 l-8 6" stroke="#c0392b" stroke-width="2" fill="none"/><rect x="576" y="344" width="344" height="52" rx="10" fill="#fbeeea" stroke="#e3b8ae"/><text x="592" y="376" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="16" font-weight="normal" fill="#20312f" text-anchor="start">No: find the moisture source first</text><rect x="40" y="410" width="500" height="52" rx="10" fill="#ffffff" stroke="#b9b2a5"/><circle cx="68" cy="436" r="16" fill="#1f6f6b"/><text x="68" y="442" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text><text x="96" y="442" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" font-weight="bold" fill="#20312f" text-anchor="start">Are underlayment, film and heat rules clear?</text><path d="M548 436 h20 l-8 -6 m8 6 l-8 6" stroke="#c0392b" stroke-width="2" fill="none"/><rect x="576" y="410" width="344" height="52" rx="10" fill="#fbeeea" stroke="#e3b8ae"/><text x="592" y="442" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="16" font-weight="normal" fill="#20312f" text-anchor="start">Unsure: ask the maker in writing</text><text x="480" y="500" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#1f6f6b" text-anchor="middle">All six pass? Then open the planks and install.</text></svg>