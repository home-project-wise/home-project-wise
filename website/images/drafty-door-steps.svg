<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc">
<title id="title">Three steps to stop a drafty door</title>
<desc id="desc">A three-step guide: find the leak with a paper test, choose weatherstripping or a door threshold, then install and test the seal.</desc>
<rect width="1400" height="800" fill="#FFFFFF"/>
<rect x="2" y="2" width="1396" height="796" rx="18" fill="none" stroke="#E5E7EB" stroke-width="3"/>
<g font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">
<text x="700" y="76" font-size="36" font-weight="700" fill="#111827">Three steps to stop a drafty door</text>
<rect x="60" y="140" width="400" height="540" rx="18" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="2"/>
<rect x="500" y="140" width="400" height="540" rx="18" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="2"/>
<rect x="940" y="140" width="400" height="540" rx="18" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="2"/>
<circle cx="112" cy="194" r="28" fill="#DBEAFE"/><text x="112" y="204" font-size="26" font-weight="700" fill="#1D4ED8">1</text>
<circle cx="552" cy="194" r="28" fill="#DBEAFE"/><text x="552" y="204" font-size="26" font-weight="700" fill="#1D4ED8">2</text>
<circle cx="992" cy="194" r="28" fill="#DBEAFE"/><text x="992" y="204" font-size="26" font-weight="700" fill="#1D4ED8">3</text>
<text x="260" y="258" font-size="27" font-weight="700" fill="#111827">Find the leak</text>
<text x="700" y="258" font-size="27" font-weight="700" fill="#111827">Choose the seal</text>
<text x="1140" y="258" font-size="27" font-weight="700" fill="#111827">Install and test</text>
<g transform="translate(260 385)">
<rect x="-84" y="-82" width="168" height="164" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="3"/>
<path d="M-55 -48 L45 -48 L45 52 L-55 52Z" fill="#FEF3C7" stroke="#D1D5DB" stroke-width="2"/>
<path d="M-28 -28 L25 30 M-10 -36 L35 10" stroke="#D1D5DB" stroke-width="3"/>
<path d="M-125 0 H-92 M-115 -18 L-92 -8 M-115 18 L-92 8" stroke="#60A5FA" stroke-width="4" stroke-linecap="round"/>
</g>
<g transform="translate(700 385)">
<rect x="-90" y="-88" width="72" height="160" rx="10" fill="#D1D5DB" stroke="#6B7280" stroke-width="3"/>
<path d="M-75 -64 H-33 M-75 -48 H-33 M-75 -32 H-33" stroke="#9CA3AF" stroke-width="3"/>
<rect x="14" y="-72" width="70" height="144" rx="8" fill="#DBEAFE" stroke="#60A5FA" stroke-width="3"/>
<path d="M29 -54 H69 M29 -36 H69 M29 -18 H69 M29 0 H69 M29 18 H69 M29 36 H69 M29 54 H69" stroke="#93C5FD" stroke-width="3"/>
</g>
<g transform="translate(1140 385)">
<rect x="-82" y="-90" width="164" height="176" rx="5" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="3"/>
<rect x="-58" y="-66" width="116" height="130" rx="3" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="3"/>
<circle cx="35" cy="0" r="5" fill="#9CA3AF"/>
<path d="M-110 95 H110" stroke="#6B7280" stroke-width="8" stroke-linecap="round"/>
<path d="M-96 78 L-80 95 L-96 112 M96 78 L80 95 L96 112" fill="none" stroke="#16A34A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<text x="260" y="520" font-size="20" fill="#374151">Hold a strip of paper</text>
<text x="260" y="554" font-size="20" fill="#374151">near the door edges.</text>
<text x="260" y="588" font-size="18" fill="#6B7280">Movement reveals a draft.</text>
<text x="700" y="520" font-size="20" fill="#374151">Use weatherstripping</text>
<text x="700" y="554" font-size="20" fill="#374151">or a door threshold.</text>
<text x="700" y="588" font-size="18" fill="#6B7280">Match the gap and door type.</text>
<text x="1140" y="520" font-size="20" fill="#374151">Fit the seal evenly,</text>
<text x="1140" y="554" font-size="20" fill="#374151">then repeat the paper test.</text>
<text x="1140" y="588" font-size="18" fill="#6B7280">Door should close smoothly.</text>
<path d="M462 386 H492 M481 375 L493 386 L481 397 M902 386 H932 M921 375 L933 386 L921 397" fill="none" stroke="#6B7280" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="700" y="732" font-size="20" fill="#374151">Seal the gap without blocking the door’s latch or drainage.</text>
</g>
</svg>
