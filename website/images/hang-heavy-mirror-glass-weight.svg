<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Diagram of the glass weight rule: area multiplied by thickness in millimetres multiplied by 2.5 kilograms gives the weight of the mirror glass before the frame" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif">
<rect width="960" height="540" fill="#F7F5F0"/>
<text x="480" y="42" font-size="30" font-weight="700" fill="#243238" text-anchor="middle">Estimate the weight of the glass</text>
<rect x="30" y="150" width="190" height="130" rx="14" fill="#fff" stroke="#243238" stroke-width="3"/>
<text x="125" y="205" font-size="26" font-weight="700" fill="#243238" text-anchor="middle">Area</text>
<text x="125" y="238" font-size="17" font-weight="500" fill="#5b6b70" text-anchor="middle">width × height, m²</text>
<text x="250" y="224" font-size="40" font-weight="700" fill="#6F8F82" text-anchor="middle">×</text>
<rect x="280" y="150" width="190" height="130" rx="14" fill="#fff" stroke="#243238" stroke-width="3"/>
<text x="375" y="205" font-size="26" font-weight="700" fill="#243238" text-anchor="middle">Thickness</text>
<text x="375" y="238" font-size="17" font-weight="500" fill="#5b6b70" text-anchor="middle">in millimetres</text>
<text x="500" y="224" font-size="40" font-weight="700" fill="#6F8F82" text-anchor="middle">×</text>
<rect x="530" y="150" width="190" height="130" rx="14" fill="#E4ECE8" stroke="#243238" stroke-width="3"/>
<text x="625" y="205" font-size="26" font-weight="700" fill="#243238" text-anchor="middle">2.5 kg</text>
<text x="625" y="238" font-size="17" font-weight="500" fill="#5b6b70" text-anchor="middle">per m² per mm</text>
<text x="750" y="224" font-size="40" font-weight="700" fill="#6F8F82" text-anchor="middle">=</text>
<rect x="780" y="150" width="150" height="130" rx="14" fill="#fff" stroke="#B5482F" stroke-width="3"/>
<text x="855" y="205" font-size="26" font-weight="700" fill="#B5482F" text-anchor="middle">Glass</text>
<text x="855" y="238" font-size="17" font-weight="500" fill="#5b6b70" text-anchor="middle">weight, kg</text>
<text x="480" y="350" font-size="22" font-weight="700" fill="#243238" text-anchor="middle">Example: 0.54 m² × 6 mm × 2.5 = 8.1 kg</text>
<text x="480" y="392" font-size="19" font-weight="700" fill="#B5482F" text-anchor="middle">The frame and backing add more. Weigh the finished mirror.</text>
</svg>
