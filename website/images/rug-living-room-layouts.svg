<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Three living room rug layouts compared: floating, front legs on and all legs on" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif"><rect width="960" height="540" fill="#F7F5F0"/><rect x="40" y="50" width="280" height="340" rx="14" fill="#EFEBE2" stroke="#D8D2C4" stroke-width="3"/><rect x="100" y="180" width="150" height="110" rx="8" fill="#DCE6E0" stroke="#6F8F82" stroke-width="3"/><rect x="75" y="90" width="200" height="60" rx="12" fill="#243238"/><rect x="83" y="98" width="184" height="36" rx="8" fill="#3B4C53"/><rect x="135" y="200" width="80" height="40" rx="8" fill="#D97745"/><text x="180" y="425" font-size="24" font-weight="700" fill="#B5482F" text-anchor="middle">Floating</text><text x="180.0" y="454.0" font-size="18" fill="#243238" text-anchor="middle">Rug is only under the</text><text x="180.0" y="478.3" font-size="18" fill="#243238" text-anchor="middle">table. Furniture looks</text><text x="180.0" y="502.6" font-size="18" fill="#243238" text-anchor="middle">adrift.</text><rect x="340" y="50" width="280" height="340" rx="14" fill="#EFEBE2" stroke="#D8D2C4" stroke-width="3"/><rect x="355" y="120" width="240" height="190" rx="8" fill="#DCE6E0" stroke="#6F8F82" stroke-width="3"/><rect x="375" y="90" width="200" height="60" rx="12" fill="#243238"/><rect x="383" y="98" width="184" height="36" rx="8" fill="#3B4C53"/><rect x="435" y="200" width="80" height="40" rx="8" fill="#D97745"/><text x="480" y="425" font-size="24" font-weight="700" fill="#243238" text-anchor="middle">Front legs on</text><text x="480.0" y="454.0" font-size="18" fill="#243238" text-anchor="middle">Front legs on the rug.</text><text x="480.0" y="478.3" font-size="18" fill="#243238" text-anchor="middle">Works in most rooms.</text><rect x="640" y="50" width="280" height="340" rx="14" fill="#EFEBE2" stroke="#D8D2C4" stroke-width="3"/><rect x="650" y="70" width="250" height="250" rx="8" fill="#DCE6E0" stroke="#6F8F82" stroke-width="3"/><rect x="675" y="90" width="200" height="60" rx="12" fill="#243238"/><rect x="683" y="98" width="184" height="36" rx="8" fill="#3B4C53"/><rect x="735" y="200" width="80" height="40" rx="8" fill="#D97745"/><text x="780" y="425" font-size="24" font-weight="700" fill="#243238" text-anchor="middle">All legs on</text><text x="780.0" y="454.0" font-size="18" fill="#243238" text-anchor="middle">Everything sits on the rug.</text><text x="780.0" y="478.3" font-size="18" fill="#243238" text-anchor="middle">Best in bigger rooms.</text></svg>