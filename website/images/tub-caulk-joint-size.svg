<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d"><title id="t">Caulk joint size limits</title><desc id="d">Cross-section of a joint between two surfaces showing backer rod under a sealant bead, with the limits for bead thickness, width-to-depth ratio and backer rod.</desc><rect width="960" height="540" rx="16" fill="#f7f4ee"/><text x="40" y="50" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="26" font-weight="bold" fill="#20312f" text-anchor="start">Size the joint before you caulk</text><rect x="120" y="150" width="200" height="200" fill="#ece3d2" stroke="#8a8272" stroke-width="2"/><rect x="420" y="150" width="200" height="200" fill="#ece3d2" stroke="#8a8272" stroke-width="2"/><rect x="320" y="150" width="100" height="40" fill="#cfe3e0" stroke="#1f6f6b" stroke-width="2"/><circle cx="370" cy="230" r="30" fill="#bfb49f" stroke="#8a8272"/><rect x="320" y="190" width="100" height="160" fill="#f7f4ee" stroke="none"/><text x="370" y="258" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="15" font-weight="bold" fill="#4b5b58" text-anchor="middle">Backer rod</text><text x="370" y="172" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="bold" fill="#1f6f6b" text-anchor="middle">sealant</text><rect x="660" y="100" width="270" height="58" rx="10" fill="#ffffff" stroke="#b9b2a5"/><circle cx="688" cy="129" r="16" fill="#1f6f6b"/><text x="688" y="135" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text><text x="714" y="126" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="16" font-weight="bold" fill="#20312f" text-anchor="start">Bead thickness</text><text x="714" y="146" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="normal" fill="#4b5b58" text-anchor="start">Between 1/8 in and 1/2 in</text><rect x="660" y="172" width="270" height="58" rx="10" fill="#ffffff" stroke="#b9b2a5"/><circle cx="688" cy="201" r="16" fill="#1f6f6b"/><text x="688" y="207" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text><text x="714" y="198" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="16" font-weight="bold" fill="#20312f" text-anchor="start">Width to depth</text><text x="714" y="218" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="normal" fill="#4b5b58" text-anchor="start">2 to 1</text><rect x="660" y="244" width="270" height="58" rx="10" fill="#ffffff" stroke="#b9b2a5"/><circle cx="688" cy="273" r="16" fill="#1f6f6b"/><text x="688" y="279" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text><text x="714" y="270" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="16" font-weight="bold" fill="#20312f" text-anchor="start">Backer rod</text><text x="714" y="290" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="normal" fill="#4b5b58" text-anchor="start">Gaps larger than 3/8 in × 3/8 in</text><rect x="660" y="316" width="270" height="58" rx="10" fill="#ffffff" stroke="#b9b2a5"/><circle cx="688" cy="345" r="16" fill="#1f6f6b"/><text x="688" y="351" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text><text x="714" y="342" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="16" font-weight="bold" fill="#20312f" text-anchor="start">Tape</text><text x="714" y="362" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="normal" fill="#4b5b58" text-anchor="start">Pull it right after tooling</text><text x="480" y="430" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" font-weight="bold" fill="#1f6f6b" text-anchor="middle">Worked example: a 1/2 in wide joint wants about 1/4 in of sealant depth, so use backer rod.</text><text x="480" y="460" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="16" font-weight="normal" fill="#20312f" text-anchor="middle">A 3/8 in × 3/8 in gap is the largest GE allows without backer rod.</text><text x="480" y="512" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="normal" fill="#4b5b58" text-anchor="middle">Source: GE Supreme Silicone Kitchen &amp; Bath data sheet (Aug 2025). Your sealant may differ.</text></svg>