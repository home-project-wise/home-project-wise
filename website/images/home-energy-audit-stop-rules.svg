<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d"><title id="t">Five stop rules for a DIY home energy audit</title><desc id="d">Do not touch vermiculite or suspect insulation. Do not enter an unsafe or unequipped attic. Do not remove outlet covers or open equipment. Use no flame, candles or incense near appliances. Never block flues, vents or combustion air. For electrical, gas, hidden moisture or structural worries, write it down and call a professional.</desc><rect width="960" height="540" fill="#F7F5F0"/><text x="480" y="44" font-size="30" fill="#243238" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Five stop rules for a DIY energy audit</text><rect x="40" y="66" width="880" height="68" rx="10" fill="#BFD0C8" stroke="#243238" stroke-width="2"/><circle cx="88" cy="100" r="24" fill="#243238"/><text x="88" y="109" font-size="26" fill="#F7F5F0" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">1</text><text x="130" y="109" font-size="28" fill="#243238" font-weight="normal" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Do not touch vermiculite or suspect insulation</text><rect x="40" y="142" width="880" height="68" rx="10" fill="#F7F5F0" stroke="#243238" stroke-width="2"/><circle cx="88" cy="176" r="24" fill="#243238"/><text x="88" y="185" font-size="26" fill="#F7F5F0" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">2</text><text x="130" y="185" font-size="28" fill="#243238" font-weight="normal" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Do not enter an unsafe or unequipped attic</text><rect x="40" y="218" width="880" height="68" rx="10" fill="#BFD0C8" stroke="#243238" stroke-width="2"/><circle cx="88" cy="252" r="24" fill="#243238"/><text x="88" y="261" font-size="26" fill="#F7F5F0" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">3</text><text x="130" y="261" font-size="28" fill="#243238" font-weight="normal" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Do not remove outlet covers or open equipment</text><rect x="40" y="294" width="880" height="68" rx="10" fill="#F7F5F0" stroke="#243238" stroke-width="2"/><circle cx="88" cy="328" r="24" fill="#243238"/><text x="88" y="337" font-size="26" fill="#F7F5F0" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">4</text><text x="130" y="337" font-size="28" fill="#243238" font-weight="normal" text-anchor="start" font-family="Arial, Helvetica, sans-serif">No flame, candles or incense near appliances</text><rect x="40" y="370" width="880" height="68" rx="10" fill="#BFD0C8" stroke="#243238" stroke-width="2"/><circle cx="88" cy="404" r="24" fill="#243238"/><text x="88" y="413" font-size="26" fill="#F7F5F0" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">5</text><text x="130" y="413" font-size="28" fill="#243238" font-weight="normal" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Never block flues, vents or combustion air</text><rect x="40" y="450" width="880" height="72" rx="10" fill="#243238"/><text x="480" y="481" font-size="26" fill="#F7F5F0" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Electrical, gas, hidden moisture or structural worry:</text><text x="480" y="511" font-size="26" fill="#F7F5F0" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">write it down and call a professional</text></svg>