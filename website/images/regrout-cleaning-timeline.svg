<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d"><title id="t">Grout cleaning timeline</title><desc id="d">Timeline for one fast-setting grout at 73 degrees Fahrenheit: spread, first wash after 15 to 30 minutes, buff haze after 30 to 60 minutes, and remix without water if it stiffens at about one hour.</desc><rect width="960" height="540" rx="16" fill="#f7f4ee"/><text x="40" y="50" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="26" font-weight="bold" fill="#20312f" text-anchor="start">Clean at the right time (73°F, one fast-setting grout)</text><line x1="80" y1="210" x2="880" y2="210" stroke="#20312f" stroke-width="4"/><circle cx="120" cy="210" r="14" fill="#1f6f6b"/><text x="120" y="170" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="20" font-weight="bold" fill="#1f6f6b" text-anchor="middle">0 min</text><text x="120" y="250" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#20312f" text-anchor="middle">Spread</text><text x="120" y="278" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="normal" fill="#4b5b58" text-anchor="middle">Rubber float, diagonal to th</text><text x="120" y="296" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="normal" fill="#4b5b58" text-anchor="middle">e joints, no voids</text><circle cx="360" cy="210" r="14" fill="#1f6f6b"/><text x="360" y="170" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="20" font-weight="bold" fill="#1f6f6b" text-anchor="middle">15–30 min</text><text x="360" y="250" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#20312f" text-anchor="middle">First wash</text><text x="360" y="278" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="normal" fill="#4b5b58" text-anchor="middle">Damp sponge, diagonally, two</text><text x="360" y="296" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="normal" fill="#4b5b58" text-anchor="middle">buckets, very little pressu</text><text x="360" y="314" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="normal" fill="#4b5b58" text-anchor="middle">re</text><circle cx="600" cy="210" r="14" fill="#1f6f6b"/><text x="600" y="170" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="20" font-weight="bold" fill="#1f6f6b" text-anchor="middle">30–60 min</text><text x="600" y="250" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#20312f" text-anchor="middle">Buff the haze</text><text x="600" y="278" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="normal" fill="#4b5b58" text-anchor="middle">Dry cotton cloth or cheesecl</text><text x="600" y="296" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="normal" fill="#4b5b58" text-anchor="middle">oth</text><circle cx="840" cy="210" r="14" fill="#1f6f6b"/><text x="840" y="170" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="20" font-weight="bold" fill="#1f6f6b" text-anchor="middle">~1 hour</text><text x="840" y="250" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#20312f" text-anchor="middle">If it stiffens</text><text x="840" y="278" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="normal" fill="#4b5b58" text-anchor="middle">Remix. Do not add water.</text><text x="480" y="392" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" font-weight="bold" fill="#c0392b" text-anchor="middle">Do not flood the joints or clean with excess water: it can leave soft, powdery grout.</text><text x="480" y="424" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" font-weight="normal" fill="#20312f" text-anchor="middle">Cleaning time depends on temperature, humidity and tile absorption.</text><text x="480" y="512" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="normal" fill="#4b5b58" text-anchor="middle">Source: Mapei Ultracolor Plus FA technical data sheet (June 2019). Your grout’s label may differ.</text></svg>