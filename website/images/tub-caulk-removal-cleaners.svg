<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d"><title id="t">Choosing a cleaner to remove old sealant residue</title><desc id="d">Four cases: mineral spirits for ceramic tile, marble, laminate and fiberglass; rubbing alcohol for hard plastic or painted surfaces; a razor in a holder for glass; test hidden spots first.</desc><rect width="960" height="540" rx="16" fill="#f7f4ee"/><text x="40" y="50" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="26" font-weight="bold" fill="#20312f" text-anchor="start">Which cleaner removes the residue</text><rect x="40" y="90" width="440" height="70" rx="10" fill="#ffffff" stroke="#b9b2a5"/><circle cx="70" cy="125" r="16" fill="#1f6f6b"/><text x="70" y="131" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text><text x="98" y="132" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="16" font-weight="bold" fill="#20312f" text-anchor="start">Ceramic tile, marble, laminate, fiberglass</text><path d="M490 125 h24 l-8 -7 m8 7 l-8 7" stroke="#1f6f6b" stroke-width="3" fill="none"/><rect x="526" y="90" width="394" height="70" rx="10" fill="#e8f1ef" stroke="#a9c9c4"/><text x="542" y="132" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" font-weight="bold" fill="#1f6f6b" text-anchor="start">Mineral spirits and a non-abrasive pad</text><rect x="40" y="182" width="440" height="70" rx="10" fill="#ffffff" stroke="#b9b2a5"/><circle cx="70" cy="217" r="16" fill="#1f6f6b"/><text x="70" y="223" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text><text x="98" y="224" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="16" font-weight="bold" fill="#20312f" text-anchor="start">Hard plastic or painted surface</text><path d="M490 217 h24 l-8 -7 m8 7 l-8 7" stroke="#1f6f6b" stroke-width="3" fill="none"/><rect x="526" y="182" width="394" height="70" rx="10" fill="#e8f1ef" stroke="#a9c9c4"/><text x="542" y="224" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" font-weight="bold" fill="#1f6f6b" text-anchor="start">Rubbing alcohol and a soft cloth</text><rect x="40" y="274" width="440" height="70" rx="10" fill="#ffffff" stroke="#b9b2a5"/><circle cx="70" cy="309" r="16" fill="#1f6f6b"/><text x="70" y="315" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text><text x="98" y="316" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="16" font-weight="bold" fill="#20312f" text-anchor="start">Glass</text><path d="M490 309 h24 l-8 -7 m8 7 l-8 7" stroke="#1f6f6b" stroke-width="3" fill="none"/><rect x="526" y="274" width="394" height="70" rx="10" fill="#e8f1ef" stroke="#a9c9c4"/><text x="542" y="316" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" font-weight="bold" fill="#1f6f6b" text-anchor="start">Razor blade in a holder, then mineral spirits</text><rect x="40" y="366" width="440" height="70" rx="10" fill="#ffffff" stroke="#b9b2a5"/><circle cx="70" cy="401" r="16" fill="#1f6f6b"/><text x="70" y="407" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text><text x="98" y="408" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="16" font-weight="bold" fill="#20312f" text-anchor="start">Any surface you are unsure about</text><path d="M490 401 h24 l-8 -7 m8 7 l-8 7" stroke="#1f6f6b" stroke-width="3" fill="none"/><rect x="526" y="366" width="394" height="70" rx="10" fill="#e8f1ef" stroke="#a9c9c4"/><text x="542" y="408" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" font-weight="bold" fill="#1f6f6b" text-anchor="start">Test a hidden spot first</text><text x="480" y="486" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" font-weight="bold" fill="#c0392b" text-anchor="middle">First cut and peel out as much old bead as you can. No solvent dissolves cured silicone.</text><text x="480" y="512" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="normal" fill="#4b5b58" text-anchor="middle">Source: GE Supreme Silicone Kitchen &amp; Bath data sheet (Aug 2025). Solvents are flammable: ventilate.</text></svg>