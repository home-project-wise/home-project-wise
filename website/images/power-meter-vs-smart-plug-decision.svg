<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Decision chart showing which device fits which job: a quick check without an app points to a plug-in power meter, history or remote switching points to a smart plug" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif">
<rect width="960" height="540" fill="#F7F5F0"/>
<text x="480" y="42" font-size="30" font-weight="700" fill="#243238" text-anchor="middle">Which device fits which job?</text>
<rect x="340" y="80" width="280" height="70" rx="12" fill="#fff" stroke="#243238" stroke-width="3"/>
<text x="480" y="124" font-size="24" font-weight="700" fill="#243238" text-anchor="middle">What do you need?</text>
<line x1="420" y1="150" x2="240" y2="228" stroke="#243238" stroke-width="4" stroke-linecap="round"/>
<line x1="540" y1="150" x2="720" y2="228" stroke="#243238" stroke-width="4" stroke-linecap="round"/>
<rect x="60" y="230" width="360" height="90" rx="12" fill="#fff" stroke="#243238" stroke-width="3"/>
<text x="240" y="268" font-size="21" font-weight="700" fill="#243238" text-anchor="middle">A quick check,</text>
<text x="240" y="298" font-size="21" font-weight="700" fill="#243238" text-anchor="middle">no app</text>
<rect x="540" y="230" width="360" height="90" rx="12" fill="#fff" stroke="#243238" stroke-width="3"/>
<text x="720" y="268" font-size="21" font-weight="700" fill="#243238" text-anchor="middle">History, schedules</text>
<text x="720" y="298" font-size="21" font-weight="700" fill="#243238" text-anchor="middle">or remote switching</text>

<line x1="240" y1="322" x2="240" y2="376" stroke="#243238" stroke-width="5" stroke-linecap="round"/><polygon points="240,392 231,376 249,376" fill="#243238"/>
<line x1="720" y1="322" x2="720" y2="376" stroke="#243238" stroke-width="5" stroke-linecap="round"/><polygon points="720,392 711,376 729,376" fill="#243238"/>
<rect x="60" y="396" width="360" height="90" rx="12" fill="#E4ECE8" stroke="#6F8F82" stroke-width="4"/>
<text x="240" y="450" font-size="24" font-weight="700" fill="#243238" text-anchor="middle">Plug-in power meter</text>
<rect x="500" y="396" width="440" height="90" rx="12" fill="#E4ECE8" stroke="#6F8F82" stroke-width="4"/>
<text x="720" y="440" font-size="22" font-weight="700" fill="#243238" text-anchor="middle">Smart plug with</text>
<text x="720" y="468" font-size="22" font-weight="700" fill="#243238" text-anchor="middle">energy monitoring</text>
</svg>
