<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Diagram comparing a good bathroom fan duct, short and smooth and ending at an outside cap, with a poor duct that is long, kinked and ends in the attic" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif"><rect width="960" height="540" fill="#F7F5F0"/><text x="480" y="52" font-size="32" font-weight="700" fill="#243238" text-anchor="middle">Check the duct, not just the fan</text><rect x="40" y="90" width="420" height="400" rx="14" fill="#fff" stroke="#D8D2C4" stroke-width="3"/><rect x="40" y="90" width="420" height="52" rx="14" fill="#6F8F82"/><text x="250" y="126" font-size="26" font-weight="700" fill="#fff" text-anchor="middle">Good duct</text><rect x="500" y="90" width="420" height="400" rx="14" fill="#fff" stroke="#D8D2C4" stroke-width="3"/><rect x="500" y="90" width="420" height="52" rx="14" fill="#D97745"/><text x="710" y="126" font-size="26" font-weight="700" fill="#fff" text-anchor="middle">Poor duct</text><rect x="70" y="190" width="120" height="50" rx="8" fill="#E4ECE8" stroke="#243238" stroke-width="3"/><text x="130" y="222" font-size="20" font-weight="700" fill="#243238" text-anchor="middle">Fan</text><line x1="190" y1="215" x2="360" y2="215" stroke="#243238" stroke-width="16"/><rect x="360" y="185" width="30" height="60" fill="#243238"/><text x="375" y="275" font-size="20" font-weight="700" fill="#243238" text-anchor="middle">Outside cap</text><text x="70" y="330" font-size="22" font-weight="500" fill="#243238" text-anchor="start">✓ Short and smooth</text><text x="70" y="364" font-size="22" font-weight="500" fill="#243238" text-anchor="start">✓ Ends outdoors</text><text x="70" y="398" font-size="22" font-weight="500" fill="#243238" text-anchor="start">✓ Same size as the outlet</text><text x="70" y="432" font-size="22" font-weight="500" fill="#243238" text-anchor="start">✓ Joints sealed</text><rect x="530" y="190" width="120" height="50" rx="8" fill="#E4ECE8" stroke="#243238" stroke-width="3"/><text x="590" y="222" font-size="20" font-weight="700" fill="#243238" text-anchor="middle">Fan</text><polyline points="650,215 700,215 720,170 760,260 800,170 840,215 870,215" fill="none" stroke="#243238" stroke-width="12" stroke-linejoin="round"/><text x="790" y="300" font-size="20" font-weight="700" fill="#D97745" text-anchor="middle">Attic</text><text x="530" y="330" font-size="22" font-weight="500" fill="#243238" text-anchor="start">✕ Long and kinked</text><text x="530" y="364" font-size="22" font-weight="500" fill="#243238" text-anchor="start">✕ Ends in the attic</text><text x="530" y="398" font-size="22" font-weight="500" fill="#243238" text-anchor="start">✕ Narrower than the outlet</text><text x="530" y="432" font-size="22" font-weight="500" fill="#243238" text-anchor="start">✕ Gaps at the joints</text></svg>