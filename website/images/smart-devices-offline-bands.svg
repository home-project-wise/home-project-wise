<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d"><title id="t">Give each band its own name</title><desc id="d">Left: one Wi-Fi name for both bands, so a phone may join the 5 GHz band and setup of a 2.4 GHz-only plug can fail. Right: two names, Home-2.4 and Home-5, so the plug is set up on the 2.4 GHz name.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#243238"/></marker></defs><rect width="960" height="540" fill="#F7F5F0"/><text x="480" y="62" font-size="32" fill="#243238" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Give each band its own name</text><rect x="40" y="100" width="420" height="400" rx="12" fill="#FFFFFF" stroke="#D97745" stroke-width="3"/><text x="250" y="142" font-size="22" fill="#B04F1F" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">One name for both bands</text><rect x="70" y="180" width="160" height="64" rx="12" fill="#FFFFFF" stroke="#243238" stroke-width="2"/><text x="150" y="220" font-size="20" fill="#243238" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Home-WiFi</text><rect x="290" y="170" width="140" height="56" rx="12" fill="#FFFFFF" stroke="#243238" stroke-width="2"/><text x="360" y="205" font-size="19" fill="#243238" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Phone</text><line x1="230" y1="205" x2="288" y2="198" stroke="#243238" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><line x1="325" y1="230" x2="285" y2="326" stroke="#D97745" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 8" marker-end="url(#ar)"/><text x="385" y="290" font-size="16" fill="#B04F1F" font-weight="normal" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">may join 5 GHz</text><rect x="160" y="330" width="200" height="64" rx="12" fill="#FFFFFF" stroke="#D97745" stroke-width="3"/><text x="260" y="370" font-size="17" fill="#243238" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">2.4 GHz-only plug</text><line x1="247" y1="417" x2="273" y2="443" stroke="#D97745" stroke-width="6" stroke-linecap="round"/><line x1="247" y1="443" x2="273" y2="417" stroke="#D97745" stroke-width="6" stroke-linecap="round"/><text x="250" y="468" font-size="16" fill="#B04F1F" font-weight="normal" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Setup or reconnect can fail</text><rect x="500" y="100" width="420" height="400" rx="12" fill="#FFFFFF" stroke="#6F8F82" stroke-width="3"/><text x="710" y="142" font-size="22" fill="#4F6F62" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Two names (example)</text><rect x="530" y="180" width="160" height="56" rx="12" fill="#FFFFFF" stroke="#243238" stroke-width="2"/><text x="610" y="215" font-size="20" fill="#243238" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Home-2.4</text><rect x="730" y="180" width="160" height="56" rx="12" fill="#FFFFFF" stroke="#243238" stroke-width="2"/><text x="810" y="215" font-size="20" fill="#243238" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Home-5</text><line x1="610" y1="236" x2="610" y2="328" stroke="#6F8F82" stroke-width="4" stroke-linecap="round" marker-end="url(#ar)"/><rect x="510" y="330" width="200" height="64" rx="12" fill="#FFFFFF" stroke="#6F8F82" stroke-width="3"/><text x="610" y="370" font-size="17" fill="#243238" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">2.4 GHz-only plug</text><path d="M597 432 L607 443 L625 420" fill="none" stroke="#4F6F62" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><line x1="810" y1="236" x2="810" y2="328" stroke="#243238" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><rect x="730" y="330" width="160" height="64" rx="12" fill="#FFFFFF" stroke="#243238" stroke-width="2"/><text x="810" y="370" font-size="19" fill="#243238" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Phones, TV</text><text x="710" y="468" font-size="16" fill="#4F6F62" font-weight="normal" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Set up devices on the 2.4 GHz name</text></svg>