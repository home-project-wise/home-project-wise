<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Decision flow for a missing C-wire: check the wires for a spare, then use the maker's power adapter, and call a professional when the system is unusual" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif"><rect width="960" height="540" fill="#F7F5F0"/><text x="480" y="52" font-size="32" font-weight="700" fill="#243238" text-anchor="middle">Missing C-wire: try these in order</text><rect x="40" y="90" width="880" height="92" rx="14" fill="#fff" stroke="#D8D2C4" stroke-width="3"/><circle cx="100" cy="136" r="30" fill="#D97745"/><text x="100" y="148" font-size="32" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="150" y="130" font-size="26" font-weight="700" fill="#243238" text-anchor="start">Run the maker's checker</text><text x="150" y="162" font-size="22" font-weight="500" fill="#243238" text-anchor="start">Do you need a C-wire at all?</text><rect x="40" y="198" width="880" height="92" rx="14" fill="#fff" stroke="#D8D2C4" stroke-width="3"/><circle cx="100" cy="244" r="30" fill="#6F8F82"/><text x="100" y="256" font-size="32" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="150" y="238" font-size="26" font-weight="700" fill="#243238" text-anchor="start">Spare wire in the cable?</text><text x="150" y="270" font-size="22" font-weight="500" fill="#243238" text-anchor="start">Connect it to C at both ends</text><rect x="40" y="306" width="880" height="92" rx="14" fill="#fff" stroke="#D8D2C4" stroke-width="3"/><circle cx="100" cy="352" r="30" fill="#D97745"/><text x="100" y="364" font-size="32" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="150" y="346" font-size="26" font-weight="700" fill="#243238" text-anchor="start">No spare wire?</text><text x="150" y="378" font-size="22" font-weight="500" fill="#243238" text-anchor="start">Use the maker's power adapter</text><rect x="40" y="414" width="880" height="92" rx="14" fill="#fff" stroke="#D8D2C4" stroke-width="3"/><circle cx="100" cy="460" r="30" fill="#6F8F82"/><text x="100" y="472" font-size="32" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="150" y="454" font-size="26" font-weight="700" fill="#243238" text-anchor="start">No C terminal, high voltage or unsure?</text><text x="150" y="486" font-size="22" font-weight="500" fill="#243238" text-anchor="start">Call a professional</text></svg>