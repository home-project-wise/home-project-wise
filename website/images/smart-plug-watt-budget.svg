<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Bar chart comparing typical device wattage with a 1800 watt smart plug limit and the 80 percent safety margin at 1440 watts" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif"><rect width="960" height="540" fill="#F7F5F0"/><text x="480" y="46" font-size="28" font-weight="700" fill="#243238" text-anchor="middle">How much of a 1800 W plug does each device use?</text><text x="210" y="130" font-size="22" font-weight="600" fill="#243238" text-anchor="end">LED lamp</text><rect x="230" y="100" width="670" height="40" rx="8" fill="#ECE8DD"/><rect x="230" y="100" width="6" height="40" rx="8" fill="#6F8F82"/><text x="246" y="128" font-size="20" font-weight="700" fill="#243238" text-anchor="start">10 W</text><text x="210" y="192" font-size="22" font-weight="600" fill="#243238" text-anchor="end">Wi-Fi router</text><rect x="230" y="162" width="670" height="40" rx="8" fill="#ECE8DD"/><rect x="230" y="162" width="6" height="40" rx="8" fill="#6F8F82"/><text x="246" y="190" font-size="20" font-weight="700" fill="#243238" text-anchor="start">12 W</text><text x="210" y="254" font-size="22" font-weight="600" fill="#243238" text-anchor="end">TV</text><rect x="230" y="224" width="670" height="40" rx="8" fill="#ECE8DD"/><rect x="230" y="224" width="40.2" height="40" rx="8" fill="#6F8F82"/><text x="280.2" y="252" font-size="20" font-weight="700" fill="#243238" text-anchor="start">120 W</text><text x="210" y="316" font-size="22" font-weight="600" fill="#243238" text-anchor="end">Window AC</text><rect x="230" y="286" width="670" height="40" rx="8" fill="#ECE8DD"/><rect x="230" y="286" width="335.0" height="40" rx="8" fill="#E0A43A"/><text x="575.0" y="314" font-size="20" font-weight="700" fill="#243238" text-anchor="start">1000 W</text><text x="210" y="378" font-size="22" font-weight="600" fill="#243238" text-anchor="end">Space heater</text><rect x="230" y="348" width="670" height="40" rx="8" fill="#ECE8DD"/><rect x="230" y="348" width="502.50000000000006" height="40" rx="8" fill="#B5482F"/><text x="720.5" y="376" font-size="20" font-weight="700" fill="#fff" text-anchor="end">1500 W</text><text x="210" y="440" font-size="22" font-weight="600" fill="#243238" text-anchor="end">Kettle</text><rect x="230" y="410" width="670" height="40" rx="8" fill="#ECE8DD"/><rect x="230" y="410" width="603.0" height="40" rx="8" fill="#B5482F"/><text x="821.0" y="438" font-size="20" font-weight="700" fill="#fff" text-anchor="end">1800 W</text><line x1="712.4000000000001" y1="86" x2="712.4000000000001" y2="480" stroke="#D97745" stroke-width="4" stroke-dasharray="10 8"/><text x="712.4000000000001" y="508" font-size="22" font-weight="700" fill="#D97745" text-anchor="middle">80% = 1440 W</text><line x1="900" y1="86" x2="900" y2="480" stroke="#243238" stroke-width="3"/><text x="894" y="70" font-size="20" font-weight="700" fill="#243238" text-anchor="end">Plug limit 1800 W</text></svg>