<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Flow chart: if the meter still moves after the main shutoff is closed, the leak is outside between the meter and the house; if it stops, the leak is inside" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif">
<rect width="960" height="540" fill="#F7F5F0"/>
<text x="480" y="40" font-size="30" font-weight="700" fill="#243238" text-anchor="middle">Inside or outside?</text>
<rect x="290" y="70" width="380" height="80" rx="12" fill="#fff" stroke="#243238" stroke-width="3"/>
<text x="480" y="104" font-size="22" font-weight="700" fill="#243238" text-anchor="middle">Meter is moving with</text>
<text x="480" y="132" font-size="22" font-weight="700" fill="#243238" text-anchor="middle">all water off</text>
<line x1="480" y1="152" x2="480" y2="196" stroke="#243238" stroke-width="5" stroke-linecap="round"/><polygon points="480,214 471,196 489,196" fill="#243238"/>
<rect x="290" y="216" width="380" height="80" rx="12" fill="#E4ECE8" stroke="#6F8F82" stroke-width="4"/>
<text x="480" y="250" font-size="22" font-weight="700" fill="#243238" text-anchor="middle">Close the main shutoff.</text>
<text x="480" y="278" font-size="22" font-weight="700" fill="#243238" text-anchor="middle">Is it still moving?</text>
<line x1="400" y1="298" x2="240" y2="360" stroke="#243238" stroke-width="4" stroke-linecap="round"/>
<line x1="560" y1="298" x2="720" y2="360" stroke="#243238" stroke-width="4" stroke-linecap="round"/>
<text x="290" y="338" font-size="20" font-weight="700" fill="#B5482F" text-anchor="end">Yes</text>
<text x="670" y="338" font-size="20" font-weight="700" fill="#6F8F82">No</text>
<rect x="50" y="362" width="380" height="120" rx="12" fill="#fbeae5" stroke="#B5482F" stroke-width="4"/>
<text x="240" y="402" font-size="22" font-weight="700" fill="#243238" text-anchor="middle">Leak outside</text>
<text x="240" y="432" font-size="18" font-weight="500" fill="#5b6b70" text-anchor="middle">on the pipe between the</text>
<text x="240" y="456" font-size="18" font-weight="500" fill="#5b6b70" text-anchor="middle">meter and the house</text>
<rect x="530" y="362" width="380" height="120" rx="12" fill="#E4ECE8" stroke="#6F8F82" stroke-width="4"/>
<text x="720" y="402" font-size="22" font-weight="700" fill="#243238" text-anchor="middle">Leak inside</text>
<text x="720" y="432" font-size="18" font-weight="500" fill="#5b6b70" text-anchor="middle">toilets, taps, appliances,</text>
<text x="720" y="456" font-size="18" font-weight="500" fill="#5b6b70" text-anchor="middle">hoses, pipes in the house</text>
</svg>
