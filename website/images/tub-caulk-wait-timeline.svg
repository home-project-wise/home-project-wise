<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d"><title id="t">Wait before water: a sealant timeline</title><desc id="d">Timeline for one silicone sealant: tool within 5 to 10 minutes, skin over in 30 minutes, water-ready in 30 minutes only under conditions or otherwise 8 hours, and full cure in 24 hours.</desc><rect width="960" height="540" rx="16" fill="#f7f4ee"/><text x="40" y="50" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="26" font-weight="bold" fill="#20312f" text-anchor="start">Wait before the water: one sealant’s timeline</text><line x1="80" y1="210" x2="880" y2="210" stroke="#20312f" stroke-width="4"/><circle cx="120" cy="210" r="14" fill="#1f6f6b"/><text x="120" y="170" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="20" font-weight="bold" fill="#1f6f6b" text-anchor="middle">0 min</text><text x="120" y="250" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#20312f" text-anchor="middle">Tool it</text><text x="120" y="278" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="normal" fill="#4b5b58" text-anchor="middle">Within 5 to 10 minutes. Pull m</text><text x="120" y="296" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="normal" fill="#4b5b58" text-anchor="middle">asking tape right after.</text><circle cx="360" cy="210" r="14" fill="#1f6f6b"/><text x="360" y="170" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="20" font-weight="bold" fill="#1f6f6b" text-anchor="middle">30 min</text><text x="360" y="250" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#20312f" text-anchor="middle">Skins over</text><text x="360" y="278" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="normal" fill="#4b5b58" text-anchor="middle">Water-ready only if bead ≤3/16</text><text x="360" y="296" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="normal" fill="#4b5b58" text-anchor="middle">in, ≥65°F and ≥50% humidity.</text><circle cx="600" cy="210" r="14" fill="#1f6f6b"/><text x="600" y="170" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="20" font-weight="bold" fill="#1f6f6b" text-anchor="middle">8 hours</text><text x="600" y="250" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#20312f" text-anchor="middle">Otherwise</text><text x="600" y="278" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="normal" fill="#4b5b58" text-anchor="middle">No water for 8 hours if those </text><text x="600" y="296" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="normal" fill="#4b5b58" text-anchor="middle">conditions are not met.</text><circle cx="840" cy="210" r="14" fill="#1f6f6b"/><text x="840" y="170" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="20" font-weight="bold" fill="#1f6f6b" text-anchor="middle">24 hours</text><text x="840" y="250" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#20312f" text-anchor="middle">Full cure</text><text x="840" y="278" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="normal" fill="#4b5b58" text-anchor="middle">Do not touch or clean it befor</text><text x="840" y="296" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="normal" fill="#4b5b58" text-anchor="middle">e then.</text><text x="480" y="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#c0392b" text-anchor="middle">Other makers differ: one data sheet says 12 hours before water, another 24 hours.</text><text x="480" y="430" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" font-weight="normal" fill="#20312f" text-anchor="middle">Read your own label. This timeline is GE’s, for one product.</text><text x="480" y="512" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="normal" fill="#4b5b58" text-anchor="middle">Sources: GE Supreme data sheet (full); DAP and TEC data sheets (search excerpts).</text></svg>