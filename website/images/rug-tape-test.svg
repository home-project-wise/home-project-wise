<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Four steps for the painter tape test: tape the outline, place furniture, walk it, live with it" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif"><rect width="960" height="540" fill="#F7F5F0"/><rect x="40" y="40" width="520" height="460" rx="18" fill="#EFEBE2" stroke="#D8D2C4" stroke-width="3"/><rect x="110" y="150" width="380" height="290" fill="none" stroke="#D97745" stroke-width="7" stroke-dasharray="26 14"/><rect x="150" y="90" width="300" height="70" rx="12" fill="#243238"/><rect x="158" y="98" width="284" height="46" rx="8" fill="#3B4C53"/><rect x="245" y="260" width="110" height="60" rx="8" fill="#D97745"/><text x="300" y="472" font-size="20" font-weight="700" fill="#D97745" text-anchor="middle">Tape outline = your rug</text><circle cx="620" cy="110" r="24" fill="#D97745"/><text x="620" y="118" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="665" y="108.0" font-size="20" fill="#243238" text-anchor="start">Tape the outline of the</text><text x="665" y="135.0" font-size="20" fill="#243238" text-anchor="start">rug you are considering.</text><circle cx="620" cy="210" r="24" fill="#D97745"/><text x="620" y="218" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="665" y="208.0" font-size="20" fill="#243238" text-anchor="start">Put the furniture where</text><text x="665" y="235.0" font-size="20" fill="#243238" text-anchor="start">it will really sit.</text><circle cx="620" cy="310" r="24" fill="#D97745"/><text x="620" y="318" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="665" y="308.0" font-size="20" fill="#243238" text-anchor="start">Walk it, open the doors,</text><text x="665" y="335.0" font-size="20" fill="#243238" text-anchor="start">pull out the chairs.</text><circle cx="620" cy="410" r="24" fill="#D97745"/><text x="620" y="418" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="665" y="408.0" font-size="20" fill="#243238" text-anchor="start">Live with it for a day or</text><text x="665" y="435.0" font-size="20" fill="#243238" text-anchor="start">two, then adjust.</text></svg>