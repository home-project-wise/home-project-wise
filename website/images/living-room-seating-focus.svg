<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Floor plan showing the main seating facing one clear focal point with an open walkway from the door"><rect width="960" height="540" fill="#F7F5F0"/><text x="480" y="48" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700" fill="#243238" text-anchor="middle">Give the main seating one clear job</text><rect x="60" y="80" width="840" height="420" rx="14" fill="#fff" stroke="#243238" stroke-width="2"/><rect x="300" y="92" width="360" height="46" rx="14" fill="#E4ECE8" stroke="#243238" stroke-width="2"/><text x="480" y="123" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#243238" text-anchor="middle">Window or main feature</text><rect x="330" y="300" width="300" height="90" rx="14" fill="#D97745" stroke="#a8481d" stroke-width="2"/><text x="480" y="352" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" fill="#fff" text-anchor="middle">Main seating</text><rect x="400" y="200" width="160" height="60" rx="14" fill="#E4ECE8" stroke="#243238" stroke-width="2"/><text x="480" y="238" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="400" fill="#243238" text-anchor="middle">Coffee table</text><path d="M480 292 L480 150" stroke="#243238" stroke-width="3" stroke-dasharray="8 6" fill="none"/><polygon points="480,142 470,160 490,160" fill="#243238"/><rect x="690" y="300" width="150" height="80" rx="14" fill="#fff" stroke="#243238" stroke-width="2"/><text x="765" y="348" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="400" fill="#243238" text-anchor="middle">Side chair</text><rect x="60" y="430" width="90" height="70" rx="14" fill="#243238" stroke="#243238" stroke-width="2"/><text x="105" y="472" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">Door</text><path d="M110 425 C110 330 110 250 220 220" stroke="#D97745" stroke-width="5" stroke-dasharray="4 8" fill="none"/><text x="100" y="190" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#243238" text-anchor="start">Keep the door</text><text x="100" y="216" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#243238" text-anchor="start">path open</text><text x="790" y="170" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#243238" text-anchor="middle">One job:</text><text x="790" y="198" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="400" fill="#243238" text-anchor="middle">conversation, TV</text><text x="790" y="224" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="400" fill="#243238" text-anchor="middle">or reading</text></svg>