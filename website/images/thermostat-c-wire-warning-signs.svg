<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Troubleshooting chart of warning signs after install, such as a draining battery, Wi-Fi dropouts or a power error, matched with the first thing to check" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif"><rect width="960" height="540" fill="#F7F5F0"/><text x="480" y="52" font-size="32" font-weight="700" fill="#243238" text-anchor="middle">Warning sign, then first check</text><text x="250" y="100" font-size="21" font-weight="700" fill="#6F8F82" text-anchor="middle">WARNING SIGN</text><text x="700" y="100" font-size="21" font-weight="700" fill="#D97745" text-anchor="middle">FIRST CHECK</text><rect x="40" y="120" width="880" height="112" rx="14" fill="#fff" stroke="#D8D2C4" stroke-width="3"/><text x="250" y="170" font-size="26" font-weight="700" fill="#243238" text-anchor="middle">Battery drains fast</text><text x="250" y="204" font-size="22" font-weight="500" fill="#243238" text-anchor="middle">or Wi-Fi keeps dropping</text><path d="M470 176 h40 m-14 -14 l14 14 l-14 14" fill="none" stroke="#D97745" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="710" y="155" font-size="21" font-weight="500" fill="#243238" text-anchor="middle">Is the C-wire seated at</text><text x="710" y="183" font-size="21" font-weight="500" fill="#243238" text-anchor="middle">both ends: the thermostat</text><text x="710" y="211" font-size="21" font-weight="500" fill="#243238" text-anchor="middle">and the control board?</text><rect x="40" y="248" width="880" height="112" rx="14" fill="#fff" stroke="#D8D2C4" stroke-width="3"/><text x="250" y="298" font-size="26" font-weight="700" fill="#243238" text-anchor="middle">Power error or</text><text x="250" y="332" font-size="22" font-weight="500" fill="#243238" text-anchor="middle">low power message</text><path d="M470 304 h40 m-14 -14 l14 14 l-14 14" fill="none" stroke="#D97745" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="710" y="297" font-size="21" font-weight="500" fill="#243238" text-anchor="middle">Add a C-wire or the</text><text x="710" y="325" font-size="21" font-weight="500" fill="#243238" text-anchor="middle">maker's power adapter</text><rect x="40" y="376" width="880" height="112" rx="14" fill="#fff" stroke="#D8D2C4" stroke-width="3"/><text x="250" y="426" font-size="26" font-weight="700" fill="#243238" text-anchor="middle">System acts oddly</text><text x="250" y="460" font-size="22" font-weight="500" fill="#243238" text-anchor="middle">after connecting C</text><path d="M470 432 h40 m-14 -14 l14 14 l-14 14" fill="none" stroke="#D97745" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="710" y="411" font-size="21" font-weight="500" fill="#243238" text-anchor="middle">Power off, reseat the</text><text x="710" y="439" font-size="21" font-weight="500" fill="#243238" text-anchor="middle">wire, then call a pro if</text><text x="710" y="467" font-size="21" font-weight="500" fill="#243238" text-anchor="middle">it persists</text></svg>