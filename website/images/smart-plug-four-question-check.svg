<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Flowchart of four questions to decide whether a device can use a smart plug: heat, motor, power loss and watts" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif"><rect width="960" height="540" fill="#F7F5F0"/><text x="480" y="46" font-size="28" font-weight="700" fill="#243238" text-anchor="middle">The 4-question check before you plug in</text><rect x="40" y="80" width="560" height="76" rx="14" fill="#fff" stroke="#243238" stroke-width="3"/><circle cx="80" cy="118" r="22" fill="#243238"/><text x="80" y="126" font-size="24" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="116" y="114" font-size="21" font-weight="700" fill="#243238" text-anchor="start">Does it make heat?</text><text x="116" y="138" font-size="17" font-weight="500" fill="#5B6A70" text-anchor="start">heater, kettle, iron, toaster</text><rect x="620" y="98" width="130" height="40" rx="20" fill="#B5482F"/><text x="685" y="125" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">YES: stop</text><line x1="320" y1="156" x2="320" y2="180" stroke="#243238" stroke-width="4"/><text x="334" y="174" font-size="18" font-weight="600" fill="#243238" text-anchor="start">no</text><rect x="40" y="180" width="560" height="76" rx="14" fill="#fff" stroke="#243238" stroke-width="3"/><circle cx="80" cy="218" r="22" fill="#243238"/><text x="80" y="226" font-size="24" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="116" y="214" font-size="21" font-weight="700" fill="#243238" text-anchor="start">Does it have a motor or compressor?</text><text x="116" y="238" font-size="17" font-weight="500" fill="#5B6A70" text-anchor="start">fridge, freezer, AC, pump</text><rect x="620" y="198" width="130" height="40" rx="20" fill="#B5482F"/><text x="685" y="225" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">YES: stop</text><line x1="320" y1="256" x2="320" y2="280" stroke="#243238" stroke-width="4"/><text x="334" y="274" font-size="18" font-weight="600" fill="#243238" text-anchor="start">no</text><rect x="40" y="280" width="560" height="76" rx="14" fill="#fff" stroke="#243238" stroke-width="3"/><circle cx="80" cy="318" r="22" fill="#243238"/><text x="80" y="326" font-size="24" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="116" y="314" font-size="21" font-weight="700" fill="#243238" text-anchor="start">Would losing power cause harm?</text><text x="116" y="338" font-size="17" font-weight="500" fill="#5B6A70" text-anchor="start">medical device, freezer, alarm</text><rect x="620" y="298" width="130" height="40" rx="20" fill="#B5482F"/><text x="685" y="325" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">YES: stop</text><line x1="320" y1="356" x2="320" y2="380" stroke="#243238" stroke-width="4"/><text x="334" y="374" font-size="18" font-weight="600" fill="#243238" text-anchor="start">no</text><rect x="40" y="380" width="560" height="76" rx="14" fill="#fff" stroke="#243238" stroke-width="3"/><circle cx="80" cy="418" r="22" fill="#243238"/><text x="80" y="426" font-size="24" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="116" y="414" font-size="21" font-weight="700" fill="#243238" text-anchor="start">Is it under 80% of the plug limit?</text><text x="116" y="438" font-size="17" font-weight="500" fill="#5B6A70" text-anchor="start">compare watts with watts</text><rect x="620" y="398" width="130" height="40" rx="20" fill="#B5482F"/><text x="685" y="425" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">NO: stop</text><rect x="780" y="80" width="150" height="376" rx="16" fill="#EEF4F1" stroke="#6F8F82" stroke-width="3"/><text x="855" y="230" font-size="22" font-weight="700" fill="#6F8F82" text-anchor="middle">All four</text><text x="855" y="262" font-size="22" font-weight="700" fill="#6F8F82" text-anchor="middle">clear?</text><text x="855" y="320" font-size="24" font-weight="800" fill="#6F8F82" text-anchor="middle">OK to use</text><text x="855" y="350" font-size="19" font-weight="600" fill="#6F8F82" text-anchor="middle">a smart plug</text><path d="M600 418 H700 M700 418" fill="none" stroke="#6F8F82" stroke-width="4"/></svg>