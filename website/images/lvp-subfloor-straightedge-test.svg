<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d"><title id="t">Straightedge test on a subfloor</title><desc id="d">A straightedge across a subfloor with a low spot, showing a one-quarter inch worst gap against a three-sixteenths inch example limit.</desc><rect width="960" height="540" rx="16" fill="#f7f4ee"/><text x="40" y="50" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="26" font-weight="bold" fill="#20312f" text-anchor="start">Straightedge test: measure the worst gap</text><text x="40" y="92" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="normal" fill="#4b5b58" text-anchor="start">Check lengthwise, crosswise and diagonally. Mark high and low spots.</text><path d="M60 320 L380 320 Q480 372 580 320 L900 320 L900 450 L60 450 Z" fill="#d9cfc0" stroke="#8a8272" stroke-width="2"/><rect x="60" y="310" width="840" height="10" fill="#4b5b58"/><text x="480" y="292" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#20312f" text-anchor="middle">Straightedge</text><line x1="480" y1="320" x2="480" y2="346" stroke="#c0392b" stroke-width="3"/><path d="M480 320 l-6 10 h12z M480 346 l-6 -10 h12z" fill="#c0392b"/><line x1="480" y1="346" x2="480" y2="388" stroke="#c0392b" stroke-dasharray="4 4"/><text x="480" y="412" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="19" font-weight="bold" fill="#c0392b" text-anchor="middle">Worst gap: 1/4 in (illustrative)</text><text x="480" y="482" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="normal" fill="#20312f" text-anchor="middle">Example limit: 3/16 in = 3/16. Measured: 1/4 in = 4/16.</text><text x="480" y="508" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" fill="#1f6f6b" text-anchor="middle">It is 1/16 in over the limit, so fill that low spot.</text></svg>