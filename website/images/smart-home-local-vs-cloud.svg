<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d"><title id="t">Why some devices keep working</title><desc id="d">Cloud route: phone, router, internet, maker cloud, bulb. It breaks when the internet drops. Local route: phone, router or hub, bulb. It stays inside the home network.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#243238"/></marker></defs><rect width="960" height="540" fill="#F7F5F0"/><text x="40" y="52" font-size="32" fill="#243238" font-weight="bold" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Why some devices keep working</text><text x="40" y="98" font-size="21" fill="#B04F1F" font-weight="bold" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Cloud route</text><rect x="40" y="112" width="130" height="64" rx="12" fill="#FFFFFF" stroke="#243238" stroke-width="2"/><text x="105" y="151" font-size="19" fill="#243238" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Phone</text><rect x="215" y="112" width="130" height="64" rx="12" fill="#FFFFFF" stroke="#243238" stroke-width="2"/><text x="280" y="151" font-size="19" fill="#243238" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Router</text><rect x="390" y="112" width="130" height="64" rx="12" fill="#FFFFFF" stroke="#243238" stroke-width="2"/><text x="455" y="151" font-size="19" fill="#243238" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Internet</text><rect x="565" y="112" width="160" height="64" rx="12" fill="#FFFFFF" stroke="#243238" stroke-width="2"/><text x="645" y="151" font-size="19" fill="#243238" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Maker's cloud</text><rect x="770" y="112" width="150" height="64" rx="12" fill="#FFFFFF" stroke="#243238" stroke-width="2"/><text x="845" y="151" font-size="19" fill="#243238" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Bulb</text><line x1="170" y1="144" x2="213" y2="144" stroke="#243238" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><line x1="345" y1="144" x2="388" y2="144" stroke="#243238" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><line x1="520" y1="144" x2="563" y2="144" stroke="#243238" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><line x1="725" y1="144" x2="768" y2="144" stroke="#243238" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><line x1="354" y1="131" x2="380" y2="157" stroke="#D97745" stroke-width="6" stroke-linecap="round"/><line x1="354" y1="157" x2="380" y2="131" stroke="#D97745" stroke-width="6" stroke-linecap="round"/><text x="40" y="236" font-size="18" fill="#243238" font-weight="normal" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Breaks when the internet drops: app, voice and cloud routines stop.</text><text x="40" y="300" font-size="21" fill="#4F6F62" font-weight="bold" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Local route</text><rect x="40" y="314" width="130" height="64" rx="12" fill="#FFFFFF" stroke="#6F8F82" stroke-width="3"/><text x="105" y="353" font-size="19" fill="#243238" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Phone</text><rect x="215" y="314" width="190" height="64" rx="12" fill="#FFFFFF" stroke="#6F8F82" stroke-width="3"/><text x="310" y="353" font-size="19" fill="#243238" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Router or hub</text><rect x="445" y="314" width="150" height="64" rx="12" fill="#FFFFFF" stroke="#6F8F82" stroke-width="3"/><text x="520" y="353" font-size="19" fill="#243238" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Bulb</text><line x1="170" y1="346" x2="213" y2="346" stroke="#6F8F82" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><line x1="405" y1="346" x2="443" y2="346" stroke="#6F8F82" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><text x="40" y="420" font-size="18" fill="#243238" font-weight="normal" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Keeps working: commands never leave your home network</text><text x="40" y="446" font-size="18" fill="#243238" font-weight="normal" text-anchor="start" font-family="Arial, Helvetica, sans-serif">(for example Matter devices paired to a local controller).</text><text x="40" y="500" font-size="17" fill="#4A5B61" font-weight="normal" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Whether a device is local depends on the device and how you set it up. Test it.</text></svg>