name: Always-on visual QA
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: visual-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  chromium-visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild generated guide, tool and search pages
        run: python scripts/rebuild_site_indexes.py
      - name: Install Chromium and Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run visual, responsive and link QA
        run: python scripts/visual_qa.py
      - name: Run Motion Sensor Coverage responsive and handoff QA
        run: python scripts/qa_motion_sensor_coverage.py
      - name: Run hand-computed fixtures for the inline-script tools
        run: python scripts/qa_inline_tool_fixtures.py
      - name: Run warnings-only calculator sanity checks
        run: python scripts/qa_calculator_sanity.py
      - name: Run Smart Plug load-check calculation fixtures
        run: node scripts/test_smart_plug_load_check.js
      - name: Run Smart Plug multi-device Chromium QA
        run: python scripts/qa_smart_plug_load_check.py
      - name: Run Smart Plug energy-cost calculation fixtures
        run: node scripts/test_smart_plug_energy_cost.js
      - name: Run Smart Plug energy-cost Chromium QA
        run: python scripts/qa_smart_plug_energy_cost.py
      - name: Run picture hanging planner responsive QA
        run: python scripts/qa_picture_hanging_planner.py
      - name: Run bulb brightness check responsive QA
        run: python scripts/qa_bulb_brightness_check.py
      - name: Run concrete slab volume responsive QA
        run: python scripts/qa_concrete_slab.py
      - name: Run drywall and plaster quantity responsive QA
        run: python scripts/qa_drywall_plaster.py
      - name: Run fence quantity responsive QA
        run: python scripts/qa_fence_quantity.py
      - name: Run insulation quantity responsive QA
        run: python scripts/qa_insulation_quantity.py
      - name: Run tile material-cost responsive QA
        run: python scripts/qa_tile_cost.py
      - name: Run Project List preset responsive QA
        run: python scripts/qa_project_list_presets.py
      - name: Upload screenshots and report even when checks fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homeprojectwise-visual-qa-${{ github.run_id }}-${{ github.run_attempt }}
          path: visual-qa-results/
          if-no-files-found: warn
          retention-days: 14
