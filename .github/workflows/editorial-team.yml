name: Editorial Team Orchestrator
on:
  schedule:
    - cron: '30 3 * * *'
    - cron: '30 15 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: main-automation
  cancel-in-progress: false
jobs:
  editorial-team:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate coordinated drafts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
          EDITORIAL_BUFFER: "2"
          ALLOW_GENERATION_DURING_FREEZE: "0"
        run: python automation/editorial_orchestrator.py
      - name: Commit only real editorial changes
        run: |
          git config user.name 'HomeProjectWise Editorial Team'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for p in content/staging data/editorial_state.json data/editorial_team.jsonl; do
            if [ -e "$p" ]; then git add -A -- "$p"; fi
          done
          git diff --cached --quiet || git commit -m 'editorial: update coordinated content staging'
          git diff --cached --quiet || git push
