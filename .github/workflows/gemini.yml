name: Gemini CLI

on:
  issue_comment:
    types: [created]

jobs:
  gemini:
    if: >-
      contains(github.event.comment.body, '@gemini') &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: true

      - name: Run Gemini CLI
        uses: google-github-actions/run-gemini-cli@v0
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          prompt: |-
            You are assisting with the HomeProjectWise repository.
            Read the user's request in this GitHub issue or pull request comment below,
            inspect the repository as needed, and perform only the requested task.
            Do not modify unrelated files. If changes are made, summarize them clearly.
            Comment:
            ${{ github.event.comment.body }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_CLI_TRUST_WORKSPACE: "true"
