name: build-site-audit

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: build-site-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependency
        run: pip install beautifulsoup4

      - name: Build audit page
        run: python tools/build_site_audit.py

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add website/site-audit.html
          if git diff --cached --quiet; then
            echo Nothing to commit
          else
            git commit -m 'chore: build private site audit page'
            git pull --rebase origin ${GITHUB_REF_NAME}
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Deploy
        env:
          GH_TOKEN: ${{ github.token }
        run: gh workflow run pages.yml --ref ${GITHUB_REF_NAME
