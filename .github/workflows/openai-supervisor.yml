name: OpenAI Site Supervisor
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: supervisor
  cancel-in-progress: true
jobs:
  supervise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect recent work and UI artifacts
        run: python automation/openai_supervisor.py
      - name: Print supervision report only
        run: cat data/openai_supervisor.json
