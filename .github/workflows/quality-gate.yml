name: Editorial Quality Gate
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate site structure and quality-gate script
        run: |
          python -m py_compile scripts/quality_gate.py scripts/queue_audit.py scripts/content_similarity.py
          python scripts/quality_gate.py
          python scripts/content_similarity.py
          node scripts/test_room_to_ready.js
          node scripts/test_soil_mulch.js\n          node scripts/test_tile.js
          node scripts/test_currency.js
          node scripts/test_home_calculator.js
          node scripts/test_project_list.js
          node scripts/test_energy_reference.js
          node scripts/test_flooring_reference.js
          node scripts/test_paint_reference.js
