name: Editorial Quality Gate
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate site structure and quality-gate script
        run: |
          python -m py_compile scripts/quality_gate.py scripts/queue_audit.py scripts/content_similarity.py
          python scripts/quality_gate.py
          python scripts/content_similarity.py
          node scripts/test_room_to_ready.js
          node scripts/test_soil_mulch.js
          node scripts/test_tile.js
          node scripts/test_tile_cost.js
          node scripts/test_currency.js
          node scripts/test_home_calculator.js
          node scripts/test_project_list.js
          node scripts/test_project_list_presets.js
          node scripts/test_energy_reference.js
          node scripts/test_flooring_reference.js
          node scripts/test_reference_prices.js
          node scripts/test_paint_reference.js
          node scripts/test_region.js
          node scripts/test_shared_room.js
          node scripts/test_project_estimator_engine.js
          node scripts/test_budget_planner.js
          node scripts/test_bathroom_fan_calculator.js
          node scripts/test_wallpaper_beginner.js
          node scripts/test_wallpaper_calculator_engine.js
          node scripts/test_wallpaper_project_estimator_integration.js
          node scripts/test_wallpaper_reference.js
          node scripts/test_picture_hanging_planner.js
          node scripts/test_bulb_brightness_check.js
          node scripts/test_concrete_slab.js
          node scripts/test_drywall_plaster.js
          node scripts/test_fence_quantity.js
          node scripts/test_decking_quantity.js
          node scripts/test_insulation_quantity.js
          node scripts/test_pavers_quantity.js
          node scripts/test_tools_registry.js
