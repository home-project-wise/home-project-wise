name: Editorial Quality Gate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate site structure and quality-gate script
        run: |
          python -m py_compile scripts/quality_gate.py
          python scripts/quality_gate.py
