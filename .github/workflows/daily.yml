name: Daily Editorial Publisher
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'content/queue/**'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: editorial-publish-main
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.staged.outputs.published }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - name: Guard Publisher-generated queue deletion commits
        id: queue_guard
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          if git diff-tree --no-commit-id --name-status -r HEAD | awk '$1 ~ /^(A|M|R|C)/ && $2 ~ /^content\/queue\// {found=1} END {exit(found ? 0 : 1)}'; then echo 'skip=false' >> "$GITHUB_OUTPUT"; else echo 'skip=true' >> "$GITHUB_OUTPUT"; echo 'Publisher queue deletion commit detected; no second publication.'; fi
      - name: Audit queue before staging
        if: steps.queue_guard.outputs.skip != 'true'
        run: python scripts/queue_audit.py
      - name: Stage due articles according to publish_at
        if: steps.queue_guard.outputs.skip != 'true'
        run: python automation/publish.py
      - name: Discover staged article paths
        id: staged
        if: steps.queue_guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/pending_publications.json')
          if p.exists():
              for item in json.loads(p.read_text(encoding='utf-8')): print('website/articles/' + item['slug'] + '.html')
          PY
          )
          if [ "${#files[@]}" -eq 0 ]; then echo 'published=false' >> "$GITHUB_OUTPUT"; exit 0; fi
          echo 'published=true' >> "$GITHUB_OUTPUT"; printf '%s\n' "${files[@]}" | tee /tmp/staged_articles.txt
      - name: Quality Gate for staged articles
        if: steps.queue_guard.outputs.skip != 'true' && steps.staged.outputs.published == 'true'
        run: xargs -r python scripts/quality_gate.py < /tmp/staged_articles.txt
      - name: Content Similarity Gate
        if: steps.queue_guard.outputs.skip != 'true' && steps.staged.outputs.published == 'true'
        run: xargs -r python scripts/content_similarity.py < /tmp/staged_articles.txt
      - name: Finalize only after all gates pass
        if: steps.queue_guard.outputs.skip != 'true' && steps.staged.outputs.published == 'true'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from datetime import datetime,timezone
          from pathlib import Path
          root=Path('.'); queue=root/'content/queue'; articles=root/'website/articles'; pending=root/'data/pending_publications.json'; now=datetime.now(timezone.utc); items=json.loads(pending.read_text(encoding='utf-8')); report=[]
          for item in items:
              slug=item['slug']; removed=False
              for path in queue.glob('*.json'):
                  try: data=json.loads(path.read_text(encoding='utf-8'))
                  except Exception: continue
                  if data.get('slug')==slug and (articles/f'{slug}.html').exists(): path.unlink(); removed=True; break
              if not removed: raise SystemExit(f'Could not finalize queue item safely: {slug}')
              scheduled=datetime.fromisoformat(item['scheduled_time'].replace('Z','+00:00')); report.append({**item,'status':'published','actual_publish_time':now.isoformat(),'delay_seconds':max(0,int((now-scheduled).total_seconds()))})
          (root/'data/publish_report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8'); pending.unlink(); print(json.dumps(report,indent=2))
          remaining=[]
          for path in queue.glob('*.json'):
              try:
                  if datetime.fromisoformat(json.loads(path.read_text(encoding='utf-8'))['publish_at'].replace('Z','+00:00'))<=now: remaining.append(path.name)
              except Exception: pass
          if remaining: raise SystemExit('FAIL: due queue items remain after publication: '+', '.join(remaining))
          PY
      - name: Commit publication, image registry and report
        if: steps.queue_guard.outputs.skip != 'true' && steps.staged.outputs.published == 'true'
        run: |
          git config user.name 'HomeProjectWise Editorial Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/queue website data/used_images.json data/publish_report.json
          git diff --cached --quiet && { echo 'FAIL: staged publication produced no commit changes.'; exit 1; }
          git commit -m 'publish: scheduled editorial article'
          git push
  deploy:
    needs: publish
    if: needs.publish.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 1}
      - name: Rebuild guides, sitemap, RSS and homepage index
        run: python scripts/rebuild_site_indexes.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: ./website}
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published URLs are live
        if: needs.publish.outputs.published == 'true'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from urllib.request import Request,urlopen
          for item in json.load(open('data/publish_report.json',encoding='utf-8')):
              with urlopen(Request(item['url'],headers={'User-Agent':'HomeProjectWise-Deploy-Check/1.0'}),timeout=20) as r:
                  if r.status>=400: raise SystemExit(f'URL check failed: {item["url"]} HTTP {r.status}')
              print('LIVE:',item['url'])
          PY
      - name: Validate IndexNow key and submit new URLs
        if: needs.publish.outputs.published == 'true'
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          set -euo pipefail
          test -n "$INDEXNOW_KEY"
          live_key=$(curl --fail --silent --show-error "https://home-project-wise.github.io/home-project-wise/${INDEXNOW_KEY}.txt" | tr -d '\r\n')
          test "$live_key" = "$INDEXNOW_KEY"
          python - <<'PY'
          import json,os
          from urllib.request import Request,urlopen
          urls=[x['url'] for x in json.load(open('data/publish_report.json',encoding='utf-8'))]; key=os.environ['INDEXNOW_KEY']; body={'host':'home-project-wise.github.io','key':key,'keyLocation':f'https://home-project-wise.github.io/home-project-wise/{key}.txt','urlList':urls}; req=Request('https://api.indexnow.org/indexnow',data=json.dumps(body).encode(),headers={'Content-Type':'application/json; charset=utf-8'},method='POST')
          with urlopen(req,timeout=30) as r: print(f'IndexNow: HTTP {r.status}; URLs={len(urls)}')
          PY
