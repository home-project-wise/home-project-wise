name: Editorial Image Curator
on:
  schedule:
    - cron: '15 4 * * *'
    - cron: '15 16 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: main-automation
  cancel-in-progress: false
jobs:
  curate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve unused relevant images
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: python automation/image_curator.py
      - name: Commit only if queue actually changed
        run: |
          git config user.name 'HomeProjectWise Image Curator'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for p in content/staging content/queue data/used_images.json; do
            if [ -e "$p" ]; then git add -A -- "$p"; fi
          done
          git diff --cached --quiet || git commit -m 'editorial: curate approved article images'
          git diff --cached --quiet || git push
