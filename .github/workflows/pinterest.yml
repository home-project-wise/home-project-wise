name: Pinterest Auto Publisher

on:
  push:
    branches: [main]
    paths:
      - "content/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-pin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Refresh Pinterest OAuth token
        env:
          PINTEREST_CLIENT_ID: ${{ secrets.PINTEREST_CLIENT_ID }}
          PINTEREST_CLIENT_SECRET: ${{ secrets.PINTEREST_CLIENT_SECRET }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import base64, json, os
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError

          required = ("PINTEREST_CLIENT_ID", "PINTEREST_CLIENT_SECRET", "PINTEREST_REFRESH_TOKEN")
          missing = [k for k in required if not os.environ.get(k)]
          if missing:
              raise SystemExit("Missing Pinterest OAuth secret(s): " + ", ".join(missing))

          basic = base64.b64encode((os.environ["PINTEREST_CLIENT_ID"] + ":" + os.environ["PINTEREST_CLIENT_SECRET"]).encode()).decode()
          req = Request(
              "https://api.pinterest.com/v5/oauth/token",
              data=urlencode({"grant_type": "refresh_token", "refresh_token": os.environ["PINTEREST_REFRESH_TOKEN"]}).encode(),
              headers={"Authorization": "Basic " + basic, "Content-Type": "application/x-www-form-urlencoded", "Accept": "application/json"},
              method="POST",
          )
          try:
              with urlopen(req, timeout=30) as response:
                  payload = json.loads(response.read().decode())
          except HTTPError as exc:
              print(exc.read().decode(errors="replace"))
              raise SystemExit("Pinterest OAuth refresh failed.")

          token = payload.get("access_token")
          if not token:
              print(json.dumps(payload, indent=2))
              raise SystemExit("Pinterest did not return an access token.")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write("PINTEREST_ACCESS_TOKEN<<EOF\n" + token + "\nEOF\n")
          print("Pinterest access token refreshed successfully.")
          PY

      - name: Publish newest post to Pinterest
        env:
          PINTEREST_ACCESS_TOKEN: ${{ env.PINTEREST_ACCESS_TOKEN }}
        run: python scripts/pinterest_auto_post.py
