name: Editorial Repair Audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'website/articles/**'
      - 'scripts/repair_editorial_quality.py'
      - 'scripts/repair_editorial_quality_v2.py'
      - 'scripts/quality_gate.py'
      - '.github/workflows/editorial-repair.yml'
permissions:
  contents: write
concurrency:
  group: editorial-repair
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run existing-library audit
        run: python scripts/repair_editorial_quality_v2.py
      - name: Store repair queue
        run: |
          git config user.name 'HomeProjectWise Editorial Team'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/editorial_repair_queue.json
          git diff --cached --quiet && exit 0
          git commit -m 'audit: refresh full existing-library repair queue'
          git push
