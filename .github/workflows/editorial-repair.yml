name: Editorial Repair Audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'website/articles/**'
      - 'scripts/repair_editorial_quality.py'
      - 'scripts/repair_editorial_quality_v2.py'
      - 'scripts/quality_gate.py'
      - 'scripts/close_group1.py'
      - 'scripts/fix_group1_figures.py'
      - 'scripts/finalize_group1.py'
      - '.github/workflows/editorial-repair.yml'
permissions:
  contents: write
concurrency:
  group: editorial-repair
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Close group 1 editorial depth
        run: |
          python scripts/close_group1.py
          python scripts/finalize_group1.py
      - name: Run actual Quality Gate with diagnostics
        id: gate
        continue-on-error: true
        run: |
          set +e
          python scripts/quality_gate.py \
            website/articles/better-evening-home-lighting-without-overcomplicating-it.html \
            website/articles/kitchen-counter-zone-that-stays-clear.html \
            website/articles/quiet-entryway-storage.html \
            website/articles/simple-home-reset-that-prevents-weekend-chaos.html 2>&1 | tee data/group1_gate_debug.txt
          rc=${PIPESTATUS[0]}
          echo "QUALITY_GATE_EXIT=$rc" >> data/group1_gate_debug.txt
          exit $rc
      - name: Commit diagnostics
        if: always()
        run: |
          git config user.name 'HomeProjectWise Editorial Team'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/group1_gate_debug.txt
          git diff --cached --quiet && exit 0
          git commit -m 'debug: capture current group 1 gate output'
          git push
      - name: Stop after diagnostic run
        run: exit 1
