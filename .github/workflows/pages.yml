name: Manual HomeProjectWise Pages Deployment
# Production verification trigger after Group 1 contextual image repair
# Group 1 production deployment verification marker.
# Force production rebuild: 2026-10-04 live Pages verification.
on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'scripts/rebuild_site_indexes.py'
      - 'scripts/verify_live_images.py'
      - 'automation/publish.py'
      - '.github/workflows/pages.yml'
      - 'website/article-overrides.css'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild guide library, sitemap, RSS and homepage
        run: python scripts/rebuild_site_indexes.py
      - name: Apply article presentation layer
        run: cat website/article-overrides.css >> website/style.css
      - uses: actions/configure-pages@v5
      - name: Remove stale Pages artifacts from this run
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              { owner: context.repo.owner, repo: context.repo.repo, run_id: context.runId, per_page: 100 }
            );
            for (const artifact of artifacts.filter(a => a.name === 'github-pages')) {
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id
              });
              core.info(`Deleted stale artifact ${artifact.id}`);
            }
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: ./website
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed homepage and all article images
        env:
          DEPLOY_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --silent --show-error --location --retry 10 --retry-delay 3 --retry-all-errors "$DEPLOY_URL"
          python scripts/verify_live_images.py "$DEPLOY_URL"
          echo "HomeProjectWise Pages deployment and image verification passed."

# Obsolete image workflow removed; clean deployment trigger.
