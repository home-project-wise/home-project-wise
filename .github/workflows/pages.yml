name: Manual HomeProjectWise Pages Deployment
on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'scripts/rebuild_site_indexes.py'
      - '.github/workflows/pages.yml'
      - 'website/article-overrides.css'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild guide library, sitemap, RSS and homepage
        run: python scripts/rebuild_site_indexes.py
      - name: Apply article presentation layer
        run: cat website/article-overrides.css >> website/style.css
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./website
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed homepage
        env:
          DEPLOY_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --silent --show-error --location --retry 10 --retry-delay 3 --retry-all-errors "$DEPLOY_URL"
          echo "HomeProjectWise Pages deployment verified."
