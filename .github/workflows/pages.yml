name: Manual HomeProjectWise Pages Deployment
on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'scripts/rebuild_site_indexes.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild guide library, sitemap, RSS and homepage
        run: python scripts/rebuild_site_indexes.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./website
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
