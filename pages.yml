# GitHub Pages deployment; Pages is enabled manually in repository settings.
name: Deploy HomeProjectWise Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./website
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published site
        env:
          DEPLOY_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          echo "Checking: $DEPLOY_URL"
          curl --fail --silent --show-error --location --retry 10 --retry-delay 3 --retry-all-errors "$DEPLOY_URL"
          echo "Pages site returned HTTP success."
